<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelola Tugas Akhir - Sistem OBE</title>
    
    <!-- PANGGIL FONT INTER & IKON -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS RELATIF SESUAI FOLDER LOKAL -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../../../css/admin_si.css">
    <link rel="stylesheet" href="../../../css/index_mobile.css">
    
    <script src="../../../js/api_config.js"></script>
    <script src="../../../js/template.js"></script>
    
    <style>
        /* =========================================
           🛡️ MANTRA ANTI-BOCOR & ANTI-MEROSOT
           ========================================= */
        *, *::before, *::after { box-sizing: border-box !important; }
        html, body { max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0;}
        body, input, select, button, textarea { font-family: 'Inter', sans-serif !important; }

        /* MEMBUNUH PADDING BAWAAN CSS GLOBAL */
        .fixed-header { padding-top: 15px !important; }
        .main-content { padding-top: 0 !important; }

        /* KONTROL TABEL DESKTOP */
        .table-action-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;}
        .table-controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .search-box { position: relative; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .search-box input { padding: 10px 15px 10px 35px; border-radius: 8px; border: 2px solid #cbd5e1; outline: none; width: 250px; font-weight: 500; transition: 0.2s; font-size: 0.9rem;}
        .search-box input:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(30,58,138, 0.1); background: white;}
        .select-entries { padding: 10px; border-radius: 8px; border: 2px solid #cbd5e1; font-weight: 600; color: #334155; outline: none; cursor: pointer; font-size: 0.9rem; background: #f8fafc;}
        .select-entries:focus { border-color: var(--primary-blue); background: white; }

        .btn-primary-dynamic { background: var(--primary-blue); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; justify-content: center;}
        .btn-primary-dynamic:hover:not(:disabled) { filter: brightness(0.85); transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-dark { background: #1e293b; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; justify-content: center;}
        .btn-dark:hover { background: #0f172a; transform: translateY(-2px); }

        .table-container { background: white; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow-x: auto; margin-bottom: 20px; width: 100%; }
        .tabel-ta { width: 100%; min-width: 900px; border-collapse: collapse; text-align: left; }
        .tabel-ta th { background: #1e293b; color: white; padding: 15px 20px; text-align: left; border-bottom: 2px solid #0f172a; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; position: sticky; top: 0; z-index: 5;}
        .tabel-ta td { padding: 15px 20px; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; vertical-align: middle; }
        .tabel-ta tbody tr:hover td { background-color: #f8fafc; }
        
        .badge-skripsi { background: #e0f2fe; color: #0369a1; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 800; display: inline-block; border: 1px solid #bae6fd; white-space: nowrap;}
        .badge-publikasi { background: #fef2f2; color: #991b1b; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 800; display: inline-block; border: 1px solid #fecaca; white-space: nowrap;}

        .btn-edit, .btn-delete { padding: 8px 12px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin: 0 3px; border: 1px solid transparent;}
        .btn-edit { background: #fffbeb; color: #d97706; border-color: #fcd34d; }
        .btn-edit:hover { background: #fef3c7; color: #b45309; }
        .btn-delete { background: #fef2f2; color: #ef4444; border-color: #fca5a5; }
        .btn-delete:hover { background: #fee2e2; color: #b91c1c; }

        /* --- MODAL POP-UP STYLES --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 9999; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 32px; border-radius: 12px; width: 500px; max-width: 90%; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); max-height: 90vh; overflow-y: auto;}
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; color: var(--text-dark); }
        .form-control { width: 100%; padding: 12px 16px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; transition: 0.2s; background: #f8fafc; color: #334155; font-weight: 500;}
        .form-control:focus { border-color: var(--primary-blue); background: white; box-shadow: 0 0 0 3px rgba(30,58,138, 0.1);}
        .form-control[readonly] { background: #f1f5f9; cursor: not-allowed; color: #64748b;}

        /* =========================================
           📱 CSS KHUSUS HP (SULAP TABEL JADI KARTU)
           ========================================= */
        @media screen and (max-width: 768px) {
            html, body { overflow-x: hidden !important; width: 100% !important; max-width: 100% !important; margin: 0; padding: 0;}
            .main-content { overflow-x: hidden !important; width: 100% !important; padding-top: 15px !important;}
            
            .header-master { margin: 15px 0 10px 0 !important; flex-direction: column !important; align-items: flex-start !important; gap: 15px; padding-bottom: 0 !important; border-bottom: none !important;}
            .section-master { padding: 0 15px 40px 15px !important; width: 100% !important; box-sizing: border-box !important;}
            
            .table-action-header { flex-direction: column !important; align-items: stretch !important; gap: 15px;}
            .table-controls { flex-direction: column !important; align-items: stretch !important; width: 100%;}
            .search-box { width: 100%; }
            .search-box input { width: 100%; }
            .select-entries { width: 100%; }
            .table-action-header > div:last-child { display: flex; flex-direction: column; gap: 10px; width: 100%;}
            .btn-primary-dynamic, .btn-dark { width: 100% !important; justify-content: center !important;}

            /* SULAP TABEL MENJADI KARTU */
            .table-container { border: none !important; box-shadow: none !important; background: transparent !important; padding: 0 !important; overflow-x: hidden !important; margin: 0;}
            .table-container table, .table-container thead, .table-container tbody, .table-container th, .table-container td, .table-container tr { display: block !important; width: 100% !important; min-width: 0 !important; box-sizing: border-box !important;}
            
            .table-container thead { display: none !important;}
            
            .table-container tr { background: white !important; border: 1px solid #cbd5e1 !important; border-radius: 12px !important; margin-bottom: 20px !important; padding: 15px !important; box-shadow: 0 4px 6px rgba(0,0,0,0.05) !important; overflow: hidden !important;}
            
            .table-container td { display: flex !important; flex-direction: column !important; align-items: stretch !important; text-align: left !important; padding: 10px 0 !important; border: none !important; border-bottom: 1px dashed #e2e8f0 !important; }
            .table-container td:last-child { border-bottom: none !important; padding-bottom: 0 !important; flex-direction: row !important; gap: 10px; margin-top: 10px;}
            
            .table-container td::before { font-weight: 800; color: #64748b; font-size: 0.8rem; margin-bottom: 6px; text-transform: uppercase;}
            
            /* Mapping Label untuk Kartu Data Tugas Akhir */
            .tabel-ta td:nth-child(1) { display: none !important;} /* Sembunyikan Nomor */
            .tabel-ta td:nth-child(2)::before { content: "NIM MAHASISWA"; color: var(--primary-blue);}
            .tabel-ta td:nth-child(3)::before { content: "NAMA MAHASISWA"; }
            .tabel-ta td:nth-child(4)::before { content: "JENIS TUGAS AKHIR"; }
            .tabel-ta td:nth-child(5)::before { content: "JUDUL TUGAS AKHIR"; }
            .tabel-ta td:nth-child(6)::before { display: none; }
            
            /* Penyesuaian Visual Konten HP */
            .tabel-ta td:nth-child(2) { font-size: 1.2rem !important; font-weight: 900 !important; color: #0f172a !important; border-bottom: 3px solid var(--primary-blue) !important; padding-bottom: 15px !important; margin-bottom: 5px !important;}
            .tabel-ta td:nth-child(3) { font-size: 1.05rem !important; font-weight: 700 !important; color: #1e293b !important;}
            .tabel-ta td:nth-child(4) span { align-self: flex-start; }
            .tabel-ta td:nth-child(5) { font-size: 0.95rem !important; line-height: 1.5; font-style: italic; white-space: pre-wrap !important; word-break: break-word !important;}
            .tabel-ta td:nth-child(6) { border-top: 1px dashed #e2e8f0; padding-top: 15px !important; }
            .tabel-ta td:nth-child(6) .btn-edit, .tabel-ta td:nth-child(6) .btn-delete { flex: 1; justify-content: center; padding: 12px; font-size: 1rem;}
            
            #pagination-ta { flex-direction: column; width: 100%; gap: 10px;}
            #pagination-ta > div:last-child { width: 100%; display: flex; gap: 10px; }
            #pagination-ta button { flex: 1; text-align: center; justify-content: center;}

            /* Modal Mobile */
            .modal-box { width: 100% !important; height: 100% !important; max-height: 100vh !important; border-radius: 0 !important; padding: 20px !important;}
            .modal-box > div:last-child { flex-direction: column !important; }
            .modal-box > div:last-child button { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR KHUSUS MOBILE -->
    <nav class="navbar-mobile">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <img src="/gambar/LogoUnaki.png" alt="Logo Universitas AKI" style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;" onclick="window.location.href='/index.html'">
        </div>
        <div class="profile-btn-mobile" onclick="toggleSidebar()"><img id="mobileNavbarAvatar" src="" alt="Profil Kaprodi"></div>
    </nav>

    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div id="navbar-container"></div>

        <div class="fixed-header">
            <div class="header-container header-master" style="margin: 0 0 15px 0; border-bottom: none; padding-bottom: 0;">
                <div class="header-title-area">
                    <div class="header-subtitle">KELOLA MAHASISWA</div>
                    <h1 class="header-title">DATA <span>TUGAS AKHIR</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge" style="margin-top: 10px; display: inline-block; width: fit-content;">PRODI</div>
            </div>
            <div style="border-bottom: 1px solid var(--border-color); margin: 0 0 20px 0;" class="header-master"></div>
        </div>

        <div class="scrollable-content section-master" style="padding-top: 0; padding-bottom: 40px;">
            
            <div class="table-action-header">
                <div class="table-controls">
                    <select id="showEntries" class="select-entries">
                        <option value="10">10 Entri per halaman</option>
                        <option value="25">25 Entri per halaman</option>
                        <option value="50">50 Entri per halaman</option>
                    </select>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchBox" placeholder="Cari Nama atau NIM...">
                    </div>

                <div style="display: flex; gap: 10px;">
                    <button class="btn-dark" onclick="loadData()"><i class="fas fa-sync-alt"></i> Refresh</button>
                    <button class="btn-primary-dynamic" onclick="bukaModalTA()"><i class="fas fa-plus"></i> Tambah Data</button>
                </div>
            </div>
            
            <div class="table-container">
                <table class="tabel-ta">
                    <thead>
                        <tr>
                            <th width="5%" style="text-align: center;">NO</th>
                            <th width="15%">NIM</th>
                            <th width="25%">NAMA MAHASISWA</th>

                            <th width="30%">JUDUL TUGAS AKHIR</th>

                    </thead>
                    <tbody id="bodyTugasAkhir">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 40px; color: #64748b;">
                                <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary-blue); margin-bottom: 10px; display: block;"></i>
                                Menghubungkan ke database Tugas Akhir...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div id="pagination-ta" style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 0.9rem; font-weight: 600; color: #64748b;">
                <div>Loading entries...</div>
            </div>

        </div>
    </div>

    <!-- MODAL POP UP -->
    <div id="modalTA" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitleTA" style="margin-top: 0; margin-bottom: 20px; color: #1e293b; font-size: 1.4rem; font-weight: 800; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px;">Form Tugas Akhir</h3>
            
            <div class="form-group">
                <label>NIM Mahasiswa</label>
                <input type="text" id="inputNimTA" class="form-control" placeholder="Masukkan NIM Valid" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label>Nama Mahasiswa</label>
                <input type="text" id="inputNamaTA" class="form-control" placeholder="Otomatis ditarik dari tabel (Read Only)" readonly>
                <small style="color: #ea580c; font-size: 0.8rem; font-weight: 600; margin-top: 5px; display: block;">*Nama otomatis disesuaikan dari database berdasarkan NIM.</small>
            </div>

            <div class="form-group">
                <label>Jenis Tugas Akhir</label>
                <select id="inputJenisTA" class="form-control" style="cursor: pointer;">
                    <option value="Skripsi">Skripsi</option>
                    <option value="Publikasi">Publikasi (Jurnal)</option>
                </select>
            </div>
            
            <div class="form-group" style="margin-bottom: 30px;">
                <label>Judul Tugas Akhir</label>
                <textarea id="inputJudulTA" class="form-control" rows="4" placeholder="Ketikkan judul lengkap project TA di sini..."></textarea>
            </div>
            
            <div style="display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid #e2e8f0; padding-top: 20px;">
                <button onclick="tutupModalTA()" class="btn-dark" style="background: #f1f5f9; color: #475569;">Batal</button>
                <button onclick="simpanTA()" class="btn-primary-dynamic" id="btnSimpanTA"><i class="fas fa-save"></i> Simpan Data</button>
            </div>
        </div>
    </div>

<script>
    // --- SETUP TEMA & WARNA DINAMIS BERDASARKAN PRODI ---
    const PRODI = localStorage.getItem("prodi_aktif") || "si"; 
    
    document.addEventListener("DOMContentLoaded", () => {
        if(PRODI === "ti") {
            document.documentElement.style.setProperty('--primary-blue', '#8b0000'); 
            document.getElementById('prodiBadge').innerText = "TEKNIK INFORMATIKA";
        } else {
            document.documentElement.style.setProperty('--primary-blue', '#1e3a8a'); 
            document.getElementById('prodiBadge').innerText = "SISTEM INFORMASI";
        }

        const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
        const avatarMobile = document.getElementById("mobileNavbarAvatar");
        if(avatarMobile) {
            const avatarColor = PRODI === "si" ? "1e3a8a" : "8b0000";
            avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=${avatarColor}&color=fff&bold=true`;
        }
    });

    // --- FUNGSI SIDEBAR MOBILE ---
    function toggleSidebar() {
        document.getElementById('sidebar-container').classList.toggle('active');
        document.getElementById('mobileOverlay').classList.toggle('active');
    }

    // ==========================================================
    // 🔮 SIHIR ANTI-MACET DROPDOWN (GLOBAL EVENT DELEGATION)
    // ==========================================================
    document.addEventListener('click', function(e) {
        const dropdownBtn = e.target.closest('.dropdown-btn') || e.target.closest('[data-toggle="dropdown"]');
        if (dropdownBtn) {
            e.preventDefault(); 
            const dropdownContent = dropdownBtn.nextElementSibling;
            const icon = dropdownBtn.querySelector('.fa-chevron-down') || dropdownBtn.querySelector('i:last-child');
            
            if (dropdownContent && (dropdownContent.classList.contains('dropdown-container') || dropdownContent.tagName === 'DIV' || dropdownContent.tagName === 'UL')) {
                const isHidden = window.getComputedStyle(dropdownContent).display === 'none';
                
                if (isHidden) {
                    dropdownContent.style.display = 'block';
                    dropdownBtn.classList.add('active');
                    if (icon) icon.style.transform = 'rotate(180deg)';
                } else {
                    dropdownContent.style.display = 'none';
                    dropdownBtn.classList.remove('active');
                    if (icon) icon.style.transform = 'rotate(0deg)';
                }
            }
        }
    });

    function setMenuAktif() {
        const navDashboard = document.getElementById('nav-home');
        let navTA = document.querySelector('[data-path="/master_data/master_tugas_akhir_si.html"]') || document.querySelector('[data-path="/master_data/master_tugas_akhir.html"]');
        
        if (navDashboard) navDashboard.classList.remove('active');
        if (navTA) navTA.classList.add('active');

        const menuMaster = document.getElementById('menu-master') || (navTA ? navTA.closest('.dropdown-container') : null);
        
        if (menuMaster) {
            menuMaster.style.display = 'block';
            const parentBtn = menuMaster.previousElementSibling;
            if(parentBtn && parentBtn.classList.contains('dropdown-btn')) {
                parentBtn.classList.add('active');
                const icon = parentBtn.querySelector('.fa-chevron-down') || parentBtn.querySelector('i:last-child');
                if(icon) icon.style.transform = 'rotate(180deg)';
            }
        }
    }

    // --- PENGATURAN API ---
    const N8N_URL = typeof API_BASE !== 'undefined' ? API_BASE : 'https://URL-N8N-ANDA.com/webhook';
    const API_GET_TA  = `${N8N_URL}/get-metadata?prodi=${PRODI}`; 
    const API_POST_TA = `${N8N_URL}/post-data-ta`;

    // --- AMANKAN AKSES HALAMAN ---
    const userLogin = localStorage.getItem("user_login");
    const userRole = localStorage.getItem("user_role");

    if (!userLogin) window.location.replace('/login/login.html');
    if (userRole === 'dosen') window.location.replace(PRODI === 'si' ? "/dosen/input_nilai_si.html" : "/dosen/input_nilai.html");

    // ==========================================
    // 3. LOGIKA MENARIK DATA & PAGINASI
    // ==========================================
    let allDataTA = []; 
    let currentPage = 1;
    let rowsPerPage = 10;
    let searchQuery = "";

    async function loadData() {
        const tbody = document.getElementById("bodyTugasAkhir");
        tbody.innerHTML = `<tr><td colspan='6' style='text-align:center; padding: 40px;'><i class='fas fa-spinner fa-spin fa-2x' style='color: var(--primary-blue); margin-bottom: 10px; display: block;'></i>Menarik data terbaru...</td></tr>`;

        try {
            const res = await fetch(API_GET_TA);
            const fullData = await res.json();
            
            // Handle array of objects format returned by N8N
            let rawData = Array.isArray(fullData) ? fullData : (fullData.data || []);
            rawData = rawData.map(i => i.json ? i.json : i);

            allDataTA = rawData.filter(i => i.tipe === 'tugas_akhir');
            currentPage = 1;
            renderTablePaginated(); 
            
        } catch (error) {
            console.error("Gagal menarik data:", error);
            tbody.innerHTML = `<tr><td colspan='6' style='text-align:center; color:#ef4444; padding: 30px; font-weight: bold;'><i class="fas fa-exclamation-triangle"></i> Gagal memuat data. Periksa koneksi N8N.</td></tr>`;
        }
    }

    function renderTablePaginated() {
        const tbody = document.getElementById("bodyTugasAkhir");
        tbody.innerHTML = ""; 

        const filteredData = allDataTA.filter(item => {
            const searchStr = `${item.judul} ${item.label} ${item.kode} ${item.jenis}`.toLowerCase();
            return searchStr.includes(searchQuery);
        });

        if(filteredData.length === 0) {
            tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; padding: 30px; font-weight: 600; color: #64748b;'>Data tugas akhir tidak ditemukan.</td></tr>";
            document.getElementById('pagination-ta').innerHTML = `<div>Showing 0 entries</div>`;
            return;
        }

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const dataToShow = filteredData.slice(startIndex, endIndex);

        dataToShow.forEach((item, index) => {
            const nim = item.kode || '-';
            const parts = item.label ? item.label.split('||') : ['-', 'Skripsi', '-'];
            const nama = parts[0] || '-';
            const jenisTA = parts[1] || 'Skripsi';
            const judulTA = parts[2] || '-';

            const badgeClass = jenisTA === "Skripsi" ? "badge-skripsi" : "badge-publikasi";
            const safeJudul = judulTA.replace(/'/g, "\\'").replace(/"/g, "&quot;");
            const safeNama = nama.replace(/'/g, "\\'");

            tbody.innerHTML += `
            <tr>
                <td style="text-align: center; font-weight: 700; color: #64748b;">${startIndex + index + 1}</td>
                <td><strong style="color: var(--primary-blue);">${nim}</strong></td>
                <td style="font-weight: 700; color: #1e293b;">${nama}</td>
                <td style="text-align: center;"><span class="${badgeClass}">${jenisTA}</span></td>
                <td style="font-size: 0.95rem; color: #475569; line-height: 1.5; font-style: italic;">"${judulTA}"</td>
                <td style="text-align: center; white-space: nowrap;">
                    <button class="btn-edit" onclick="bukaModalTA('${nim}', '${safeNama}', '${jenisTA}', '${safeJudul}')" title="Edit"><i class="fas fa-edit"></i></button>
                    <button class="btn-delete" onclick="konfirmasiHapusTA('${nim}', '${safeNama}')" title="Hapus"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`;
        });

        renderPaginationUI(filteredData.length, startIndex, endIndex);
    }

    function renderPaginationUI(totalFilteredData, startIndex, endIndex) {
        const totalPages = Math.ceil(totalFilteredData / rowsPerPage);
        const actualEndIndex = Math.min(endIndex, totalFilteredData);
        const paginationContainer = document.getElementById('pagination-ta');
        
        if (totalPages <= 1 && allDataTA.length <= rowsPerPage) {
            paginationContainer.innerHTML = '';
            return;
        }

        let html = `<div>Showing ${startIndex + 1} to ${actualEndIndex} of ${totalFilteredData} entries</div>`;
        html += `<div style="display: flex; gap: 5px;">`;
        
        const prevDisabled = currentPage === 1;
        html += `<button style="background: ${prevDisabled ? '#f1f5f9' : 'var(--primary-blue)'}; color: ${prevDisabled ? '#94a3b8' : 'white'}; padding: 8px 12px; border:none; border-radius:8px; cursor:${prevDisabled ? 'not-allowed' : 'pointer'}; font-weight:bold; transition: 0.2s;" ${prevDisabled ? 'disabled' : `onclick="changePage(-1)"`}><i class="fas fa-chevron-left"></i> Prev</button>`;
        
        const nextDisabled = currentPage === totalPages || totalPages === 0;
        html += `<button style="background: ${nextDisabled ? '#f1f5f9' : 'var(--primary-blue)'}; color: ${nextDisabled ? '#94a3b8' : 'white'}; padding: 8px 12px; border:none; border-radius:8px; cursor:${nextDisabled ? 'not-allowed' : 'pointer'}; font-weight:bold; transition: 0.2s;" ${nextDisabled ? 'disabled' : `onclick="changePage(1)"`}>Next <i class="fas fa-chevron-right"></i></button>`;
        
        html += `</div>`;
        paginationContainer.innerHTML = html;
    }

    function changePage(direction) { currentPage += direction; renderTablePaginated(); }

    // ==========================================
    // 4. FUNGSI MODAL POP-UP & KIRIM DATA KE N8N
    // ==========================================
    function bukaModalTA(nim = '', nama = '', jenis = 'Skripsi', judul = '') {
        const inputNim = document.getElementById('inputNimTA');
        const title = document.getElementById('modalTitleTA');

        if(nim) {
            title.innerHTML = `<i class="fas fa-edit" style="color: var(--primary-blue); margin-right: 8px;"></i> Ubah Data Tugas Akhir`;
            inputNim.value = nim;
            inputNim.readOnly = true;
        } else {
            title.innerHTML = `<i class="fas fa-plus-circle" style="color: var(--primary-blue); margin-right: 8px;"></i> Tambah Project TA Baru`;
            inputNim.value = "";
            inputNim.readOnly = false;
        }
        
        document.getElementById('inputNamaTA').value = nama;
        document.getElementById('inputJenisTA').value = jenis;
        document.getElementById('inputJudulTA').value = judul;
        
        document.getElementById('modalTA').style.display = "flex";
    }

    function tutupModalTA() { document.getElementById('modalTA').style.display = "none"; }

    async function simpanTA() {
        const nim = document.getElementById('inputNimTA').value.trim();
        const jenis = document.getElementById('inputJenisTA').value;
        const judul = document.getElementById('inputJudulTA').value.trim();

        if(!nim || !judul) { alert("⚠️ Harap isi NIM dan Judul Tugas Akhir!"); return; }

        const isEdit = document.getElementById('inputNimTA').readOnly;
        const actionType = isEdit ? "UBAH" : "TAMBAH";

        const btnSimpan = document.getElementById("btnSimpanTA");
        const originalText = btnSimpan.innerHTML;
        btnSimpan.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i> Menyimpan...';
        btnSimpan.disabled = true;

        try {
            const response = await fetch(API_POST_TA, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    aksi: actionType, 
                    nim: nim, 
                    jenis_ta: jenis, 
                    judul_ta: judul, 
                    prodi: PRODI 
                })
            });

            if(response.ok) {
                alert(`✅ Data Project Tugas Akhir berhasil di${actionType.toLowerCase()}!`);
                tutupModalTA(); loadData();
            } else { alert("❌ Gagal menyimpan data ke server n8n."); }
        } catch(e) { console.error(e); alert("❌ Terjadi kesalahan jaringan.");
        } finally { btnSimpan.innerHTML = originalText; btnSimpan.disabled = false; }
    }

    async function konfirmasiHapusTA(nim, nama) {
        if(confirm(`⚠️ Peringatan!\n\nAnda akan MENGHAPUS data Tugas Akhir mahasiswa:\nNIM: ${nim}\nNama: ${nama}\n\nLanjutkan?`)) {
            try {
                const response = await fetch(API_POST_TA, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ aksi: "HAPUS", nim: nim, prodi: PRODI })
                });

                if(response.ok) { alert("✅ Data Tugas Akhir berhasil dihapus!"); loadData(); } 
                else { alert("❌ Gagal menghapus data di server n8n."); }
            } catch(e) { alert("❌ Terjadi kesalahan jaringan."); }
        }
    }

    // ==========================================
    // 5. INIT & EVENT LISTENER
    // ==========================================
    window.onload = () => { 
        loadData(); 
        const selectBox = document.getElementById('showEntries');
        if(selectBox) { selectBox.onchange = (e) => { rowsPerPage = parseInt(e.target.value); currentPage = 1; renderTablePaginated(); } }

        const searchBox = document.getElementById('searchBox');
        if(searchBox) { searchBox.oninput = (e) => { searchQuery = e.target.value.toLowerCase(); currentPage = 1; renderTablePaginated(); } }

        setTimeout(() => {
            const sidebar = document.getElementById('sidebar-container');
            if (sidebar && !sidebar.innerHTML.includes('sidebar-profile')) {
                fetch(`/kaprodi/kaprodi_${PRODI}/sidebar.html`)
                    .then(res => res.text())
                    .then(html => {
                        sidebar.innerHTML = html;
                        if(typeof initSmartSidebar === 'function') initSmartSidebar();
                        setMenuAktif();
                    })
                    .catch(e => console.log('Gagal memuat sidebar otomatis'));
            } else {
                setMenuAktif();
            }
        }, 400);
    };
</script>
