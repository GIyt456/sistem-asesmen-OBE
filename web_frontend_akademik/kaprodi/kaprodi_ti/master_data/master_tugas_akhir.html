<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Tugas Akhir TI - Sistem OBE</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <script src="../../../js/template.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABEL WARNA KHUSUS TI --- */
        :root { 
            /* Background sidebar dihapus agar mengikuti theme-ti dari style.css global */
            --primary-red: #8b0000; 
            --primary-red-dark: #5c0000; 
            --bg-main: #ffffff; 
            --text-dark: #111827;
            --border-light: #e5e7eb;
            --border-dark: #161923;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark);
            animation: transitionIn 0.3s ease-in-out; 
        }
        
        @keyframes transitionIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- GAYA KONTEN UTAMA --- */
        .main-content { flex: 1; overflow-y: auto; padding: 40px 60px; }

        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; border-bottom: 1px solid #e5e7eb; padding-bottom: 20px; }
        .header-subtitle { color: #9ca3af; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px;}
        .header-title span { color: var(--primary-red); }
        
        /* --- UPDATE GAYA BADGE & TOMBOL KHUSUS TI --- */
        .badge-prodi { 
            background: var(--primary-red); 
            color: white; 
            padding: 10px 20px; 
            border-radius: 30px; 
            font-size: 0.9rem; 
            font-weight: 600; 
            box-shadow: 0 4px 6px rgba(139, 0, 0, 0.2); 
        }

        .btn-dark { background: var(--border-dark); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .btn-dark:hover { background: #000000; transform: translateY(-2px); }
        
        .btn-primary-ti { 
            background: linear-gradient(to right, var(--primary-red), var(--primary-red-dark)); 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 0.95rem; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            transition: 0.2s; 
            box-shadow: 0 4px 6px rgba(139, 0, 0, 0.2);
        }
        .btn-primary-ti:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 12px rgba(139, 0, 0, 0.3);
        }

        /* --- GAYA TABEL --- */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; border: 1.5px solid #e5e7eb; border-radius: 8px; overflow: hidden; background: white; }
        th { background: #f3f4f6; color: var(--text-dark); padding: 14px 16px; text-align: left; border-bottom: 2px solid #e5e7eb; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; }
        td { padding: 14px 16px; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; vertical-align: middle;}
        tbody tr:hover { background-color: #f9fafb; }
        
        .badge-skripsi { background: #fee2e2; color: #991b1b; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; display: inline-block;}
        .badge-publikasi { background: #dcfce7; color: #15803d; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; display: inline-block;}
        
        .btn-action { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: white; transition: 0.2s; background: var(--primary-red); }
        .btn-action:hover { background: var(--primary-red-dark); }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        
        <div class="header-container">
            <div class="header-title-area">
                <div class="header-subtitle">KELOLA MAHASISWA</div>
                <h1 class="header-title">DATA <span>TUGAS AKHIR</span></h1>
            </div>
            <div class="badge-prodi"><i class="fas fa-graduation-cap"></i> Teknik Informatika</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h3 style="margin: 0; font-size: 1.4rem; font-weight: 800;">Daftar Tugas Akhir (TI)</h3>
                <p style="margin: 4px 0 0 0; color: #9ca3af; font-size: 0.95rem; font-weight: 500;">Kelola data mahasiswa Teknik Informatika yang sedang menempuh Tugas Akhir / Skripsi.</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-primary-ti" onclick="alert('Fitur tambah judul TA segera hadir!')"><i class="fas fa-plus"></i> Tambah Data TA</button>
                <button class="btn-dark" onclick="loadData()"><i class="fas fa-sync-alt"></i> Refresh Data</button>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <div style="display: flex; align-items: center; gap: 8px; color: #4b5563; font-size: 0.9rem;">
                Show 
                <select id="showEntries" style="padding: 6px 10px; border: 1.5px solid #d1d5db; border-radius: 6px; outline: none; cursor: pointer;">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="25">25</option>
                </select> entries
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <label style="font-size: 0.9rem; font-weight: 600; color: #4b5563;">Search:</label>
                <input type="text" id="searchBox" placeholder="Cari Nama atau NIM..." style="padding: 8px 12px; border: 1.5px solid #d1d5db; border-radius: 6px; outline: none; font-size: 0.9rem;">
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th width="5%" style="text-align: center;">No</th>
                    <th width="12%">NIM</th>
                    <th width="22%">Nama Mahasiswa</th>
                    <th width="12%" style="text-align: center;">Jenis TA</th> 
                    <th width="39%">Judul Tugas Akhir</th>
                    <th width="10%" style="text-align: center;">Aksi</th>
                </tr>
            </thead>
            <tbody id="bodyTugasAkhir">
                </tbody>
        </table>

        <div id="pagination-ta" style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 0.85rem; color: #6b7280;">
            <div>Loading entries...</div>
        </div>
    </div>

<script>
    // 1. PENGATURAN API N8N (Filter khusus TI)
    const PRODI = 'ti'; 
    const BASE_N8N_URL = 'https://district-spend-penguin-charter.trycloudflare.com';
    const API_URL = `${BASE_N8N_URL}/webhook/get-metadata?prodi=${PRODI}`; 

    // 2. SISTEM KEAMANAN
    const userLogin = localStorage.getItem("user_login");
    const userRole = localStorage.getItem("user_role");
    const userProdi = localStorage.getItem("prodi_aktif");

    if (!userLogin) window.location.replace('/login/login.html');
    if (userRole !== 'head_admin') {
        if (userRole === 'dosen') window.location.replace(userProdi === 'si' ? "input_nilai_si.html" : "../../dosen/input_nilai.html");
        else if (userRole === 'admin' && userProdi === 'si') window.location.replace("../kaprodi_si/admin_config_si.html");
    }

    // ==========================================
    // 3. LOGIKA DATA, PAGINASI, & PENCARIAN
    // ==========================================
    let allDataTA = []; 
    let currentPage = 1;
    let rowsPerPage = 10;
    let searchQuery = "";

    async function loadData() {
        const tbody = document.getElementById("bodyTugasAkhir");
        tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; padding: 20px;'><i class='fas fa-spinner fa-spin'></i> Sedang memuat data...</td></tr>";

        // Simulasi penarikan data (Dummy Data) karena endpoint get-metadata belum fully config untuk TA
        setTimeout(() => {
            allDataTA = [
                {
                    nim: "223220042",
                    namaMhs: "GEORGIUS KRISNA RIZKIE WIDYATAMA",
                    jenis: "Skripsi",
                    judul: "DESAIN INTERFACE SISTEM ASESMEN CAPAIAN PEMBELAJARAN LULUSAN (CPL) PROGRAM STUDI SISTEM INFORMASI DENGAN PLATFORM OTOMATISASI N8N"
                },
                {
                    nim: "223220044",
                    namaMhs: "FERNANDA YOGI PRASETYA",
                    jenis: "Publikasi",
                    judul: "ANALISIS SENTIMEN PERMAINAN WORLD OF AIRPORT MENGGUNAKAN ALGORITMA SUPPORT VECTOR MACHINE"
                }
            ];
            
            currentPage = 1;
            renderTablePaginated(); 
        }, 500);
    }

    function renderTablePaginated() {
        const tbody = document.getElementById("bodyTugasAkhir");
        tbody.innerHTML = ""; 

        const filteredData = allDataTA.filter(item => {
            const searchStr = `${item.judul} ${item.namaMhs} ${item.nim} ${item.jenis}`.toLowerCase();
            return searchStr.includes(searchQuery);
        });

        if(filteredData.length === 0) {
            tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; padding: 20px;'>Data tugas akhir tidak ditemukan.</td></tr>";
            document.getElementById('pagination-ta').innerHTML = `<div>Showing 0 entries</div>`;
            return;
        }

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const dataToShow = filteredData.slice(startIndex, endIndex);

        // Cetak Baris Tabel
        dataToShow.forEach((item, index) => {
            const badgeClass = item.jenis === "Skripsi" ? "badge-skripsi" : "badge-publikasi";

            tbody.innerHTML += `
            <tr style="border-bottom: 1px solid #e5e7eb;">
                <td style="text-align: center; font-weight: 600;">${startIndex + index + 1}</td>
                <td><strong>${item.nim}</strong></td>
                <td style="font-weight: 600; color: #111827;">${item.namaMhs}</td>
                <td style="text-align: center;"><span class="${badgeClass}">${item.jenis}</span></td>
                <td style="font-size: 0.85rem; color: #4b5563; line-height: 1.5; font-style: italic;">"${item.judul}"</td>
                <td style="text-align: center;">
                    <button class="btn-action" onclick="alert('Fitur edit data TA disiapkan')"><i class="fas fa-edit"></i> Edit</button>
                </td>
            </tr>`;
        });

        renderPaginationUI(filteredData.length, startIndex, endIndex);
    }

    function renderPaginationUI(totalFilteredData, startIndex, endIndex) {
        const totalPages = Math.ceil(totalFilteredData / rowsPerPage);
        const actualEndIndex = Math.min(endIndex, totalFilteredData);
        const paginationContainer = document.getElementById('pagination-ta');
        
        let html = `<div>Showing ${startIndex + 1} to ${actualEndIndex} of ${totalFilteredData} entries</div>`;
        html += `<div style="display: flex; gap: 5px;">`;
        
        const prevDisabled = currentPage === 1;
        html += `<button class="btn" style="background: ${prevDisabled ? '#e5e7eb' : 'var(--border-dark)'}; color: ${prevDisabled ? '#9ca3af' : 'white'}; padding: 8px 12px; border:none; border-radius:8px; cursor:${prevDisabled ? 'not-allowed' : 'pointer'};" ${prevDisabled ? 'disabled' : `onclick="changePage(-1)"`}><i class="fas fa-chevron-left"></i> Prev</button>`;
        
        const nextDisabled = currentPage === totalPages || totalPages === 0;
        html += `<button class="btn" style="background: ${nextDisabled ? '#e5e7eb' : 'var(--border-dark)'}; color: ${nextDisabled ? '#9ca3af' : 'white'}; padding: 8px 12px; border:none; border-radius:8px; cursor:${nextDisabled ? 'not-allowed' : 'pointer'};" ${nextDisabled ? 'disabled' : `onclick="changePage(1)"`}>Next <i class="fas fa-chevron-right"></i></button>`;
        
        html += `</div>`;
        paginationContainer.innerHTML = html;
    }

    function changePage(direction) {
        currentPage += direction;
        renderTablePaginated();
    }

    // ==========================================
    // 4. JALANKAN SAAT WEB PERTAMA KALI DIBUKA
    // ==========================================
    window.onload = () => { 
        loadData(); 
        
        const selectBox = document.getElementById('showEntries');
        if(selectBox) {
            selectBox.onchange = (e) => {
                rowsPerPage = parseInt(e.target.value);
                currentPage = 1; 
                renderTablePaginated();
            }
        }

        const searchBox = document.getElementById('searchBox');
        if(searchBox) {
            searchBox.oninput = (e) => {
                searchQuery = e.target.value.toLowerCase();
                currentPage = 1; 
                renderTablePaginated();
            }
        }

        // Jeda agar template.js selesai menyusun sidebar sebelum kita ubah menu aktifnya
        setTimeout(() => {
            const navDashboard = document.getElementById('nav-home');
            const navTA = document.querySelector('[data-path="/master_data/master_tugas_akhir.html"]'); 
            const menuMaster = document.getElementById('menu-master');
            const chevronMaster = document.getElementById('chevron-master');

            if(navDashboard) navDashboard.classList.remove('active');
            if(navTA) navTA.classList.add('active'); 
            
            if(menuMaster && chevronMaster) {
                menuMaster.style.display = 'flex';
                chevronMaster.style.transform = 'rotate(180deg)';
            }
        }, 300);
    };
</script>
</body>
</html>
