<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Tugas Akhir - Sistem OBE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABEL WARNA --- */
        :root { 
            --sidebar-bg: #161923; 
            --sidebar-text: #7b8395;
            --sidebar-hover: #262936;
            --sidebar-active-text: #ffffff;
            --primary-red: #8b0000; 
            --bg-main: #ffffff; 
            --text-dark: #111827;
            --border-light: #e5e7eb;
            --border-dark: #161923;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark);
            animation: transitionIn 0.3s ease-in-out; 
        }
        
        @keyframes transitionIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- GAYA SIDEBAR --- */
        .sidebar { width: 280px; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; padding: 24px 16px; min-height: 100vh; }
        .sidebar-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; padding: 0 10px; }
        .sidebar-profile img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .sidebar-profile-info { display: flex; flex-direction: column; }
        .sidebar-profile-info .name { color: white; font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
        .sidebar-profile-info .role { color: var(--sidebar-text); font-size: 9px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
        .sidebar-divider { height: 1px; background-color: rgba(255, 255, 255, 0.08); margin: 5px 10px 10px 10px; }
        .nav-menu { flex: 1; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
        .nav-menu::-webkit-scrollbar { display: none; }
        .menu-category { font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; color: var(--sidebar-text); text-transform: uppercase; margin: 10px 0 10px 10px; }
        .nav-item { padding: 12px 16px; margin-bottom: 4px; cursor: pointer; display: flex; align-items: center; gap: 16px; transition: all 0.2s; border-radius: 8px; font-weight: 500; font-size: 0.80rem; }
        .nav-item:hover, .nav-item.active { background: var(--sidebar-hover); color: var(--sidebar-active-text); }
        .nav-item i { font-size: 1.1rem; width: 20px; text-align: center; }
        .nav-bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; }
        .nav-item.logout { color: #f87171; }
        .nav-item.logout:hover { background: rgba(248, 113, 113, 0.1); }

        /* --- GAYA KONTEN UTAMA --- */
        .main-content { flex: 1; overflow-y: auto; padding: 40px 60px; }

        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; border-bottom: 1px solid #e5e7eb; padding-bottom: 20px; }
        .header-subtitle { color: #9ca3af; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px;}
        .header-title span { color: var(--primary-red); }
        .badge-prodi { background: var(--primary-red); color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; }

        /* --- TOMBOL --- */
        .btn-dark { background: var(--border-dark); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .btn-dark:hover { background: #000000; transform: translateY(-2px); }

        /* --- GAYA TABEL --- */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; border: 1.5px solid #e5e7eb; border-radius: 8px; overflow: hidden; background: white; }
        th { background: #f3f4f6; color: var(--text-dark); padding: 14px 16px; text-align: left; border-bottom: 2px solid #e5e7eb; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; }
        td { padding: 14px 16px; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; }
        tbody tr:hover { background-color: #f9fafb; }
        
        .badge-skripsi { background: #e0e7ff; color: #4338ca; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .badge-publikasi { background: #dcfce7; color: #15803d; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
    </style>
</head>
<body>

    <!-- Wadah Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Konten Utama -->
    <div class="main-content">
        
        <div class="header-container">
            <div class="header-title-area">
                <div class="header-subtitle">KELOLA KURIKULUM</div>
                <h1 class="header-title">DATA <span>TUGAS AKHIR</span></h1>
            </div>
            <div class="badge-prodi">Teknik Informatika</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h3 style="margin: 0; font-size: 1.4rem; font-weight: 800;">Daftar Tugas Akhir Mahasiswa</h3>
                <p style="margin: 4px 0 0 0; color: #9ca3af; font-size: 0.95rem; font-weight: 500;">Kelola data jalur kelulusan mahasiswa (Skripsi / Publikasi).</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-dark" style="background: #6b21a8;" onclick="alert('Fitur Import sedang disiapkan!')"><i class="fas fa-download"></i> Import Dari Pusat</button>
                <button class="btn-dark" onclick="loadData()"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <div style="display: flex; align-items: center; gap: 8px; color: #4b5563; font-size: 0.9rem;">
                Show 
                <select id="showEntries" style="padding: 6px 10px; border: 1.5px solid #d1d5db; border-radius: 6px; outline: none; cursor: pointer;">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="25">25</option>
                </select> entries
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <label style="font-size: 0.9rem; font-weight: 600; color: #4b5563;">Search:</label>
                <input type="text" id="searchBox" placeholder="Cari Nama atau NIM..." style="padding: 8px 12px; border: 1.5px solid #d1d5db; border-radius: 6px; outline: none; font-size: 0.9rem;">
            </div>
        </div>

        <!-- Tabel Data -->
        <table>
            <thead>
                <tr>
                    <th width="5%" style="text-align: center;">No</th>
                    <th width="15%">NIM</th>
                    <th width="25%">Nama Mahasiswa</th>
                    <th width="15%">Jenis TA</th> 
                    <th width="30%">Judul</th>
                    <th width="10%" style="text-align: center;">Aksi</th>
                </tr>
            </thead>
            <tbody id="bodyTugasAkhir">
                <!-- Data akan di-render oleh Javascript -->
            </tbody>
        </table>

        <div id="pagination-ta" style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 0.85rem; color: #6b7280;">
            <div>Loading entries...</div>
        </div>
    </div>

<script>
    // 1. PENGATURAN API MANUAL (KEMBALI SEPERTI AWAL)
    const PRODI = 'ti'; 
    const API_BASE = "https://willing-robot-ministry-reported.trycloudflare.com/webhook"; 
    const API_URL = `${API_BASE}/get-metadata?prodi=${PRODI}`; 

    // 2. SISTEM KEAMANAN
    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace('/login/login.html');

    // 3. LOAD SIDEBAR
    async function loadSidebar() {
        try {
            const response = await fetch('/kaprodi/kaprodi_ti/components/sidebar.html');
            const html = await response.text();
            
            document.getElementById('sidebar-container').outerHTML = html;
            document.getElementById("adminName").innerText = userLogin;

            setTimeout(() => {
                const navDashboard = document.getElementById('nav-dashboard');
                const navTugasAkhir = document.getElementById('nav-tugas-akhir'); 
                const menuMaster = document.getElementById('menu-master');
                const chevronMaster = document.getElementById('chevron-master');

                if(navDashboard) navDashboard.classList.remove('active');
                if(navTugasAkhir) navTugasAkhir.classList.add('active'); 
                
                if(menuMaster && chevronMaster) {
                    menuMaster.style.display = 'flex';
                    chevronMaster.style.transform = 'rotate(180deg)';
                }
            }, 100);
        } catch (error) { console.error('Gagal memuat sidebar:', error); }
    }

    function toggleDropdown(menuId, chevronId) {
        const menu = document.getElementById(menuId);
        const chevron = document.getElementById(chevronId);
        if (menu.style.display === 'none' || menu.style.display === '') {
            menu.style.display = 'flex'; chevron.style.transform = 'rotate(180deg)'; 
        } else {
            menu.style.display = 'none'; chevron.style.transform = 'rotate(0deg)';   
        }
    }

    function logout() { localStorage.clear(); window.location.replace("/login/login.html"); }

    // ==========================================
    // 4. LOGIKA DATA TUGAS AKHIR
    // ==========================================
    
    let allDataTA = []; 
    let currentPage = 1;
    let rowsPerPage = 10;
    let searchQuery = "";

    async function loadData() {
        const tbody = document.getElementById("bodyTugasAkhir");
        tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; padding: 20px;'><i class='fas fa-spinner fa-spin'></i> Sedang memuat data...</td></tr>";

        // Simulasi penarikan data dari n8n (Dummy Data)
        setTimeout(() => {
            allDataTA = [
                {
                    nim: "223220042",
                    namaMhs: "GEORGIUS KRISNA RIZKIE WIDYATAMA",
                    jenis: "Skripsi",
                    judul: "DESAIN INTERFACE SISTEM ASESMEN CAPAIAN PEMBELAJARAN LULUSAN (CPL) PROGRAM STUDI SISTEM INFORMASI DENGAN PLATFORM OTOMATISASI N8N"
                },
                {
                    nim: "223220044",
                    namaMhs: "FERNANDA YOGI PRASETYA",
                    jenis: "Publikasi",
                    judul: "ANALISIS SENTIMEN PERMAINAN WORLD OF AIRPORT MENGGUNAKAN ALGORITMA SUPPORT VECTOR MACHINE"
                }
            ];
            
            currentPage = 1;
            renderTablePaginated(); 
        }, 500);
    }

    function renderTablePaginated() {
        const tbody = document.getElementById("bodyTugasAkhir");
        tbody.innerHTML = ""; 

        const filteredData = allDataTA.filter(item => {
            const searchStr = `${item.judul} ${item.namaMhs} ${item.nim} ${item.jenis}`.toLowerCase();
            return searchStr.includes(searchQuery);
        });

        if(filteredData.length === 0) {
            tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; padding: 20px;'>Data tugas akhir tidak ditemukan.</td></tr>";
            document.getElementById('pagination-ta').innerHTML = `<div>Showing 0 entries</div>`;
            return;
        }

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const dataToShow = filteredData.slice(startIndex, endIndex);

        // Cetak Baris Tabel Sesuai Format Baru
        dataToShow.forEach((item, index) => {
            const badgeClass = item.jenis === "Skripsi" ? "badge-skripsi" : "badge-publikasi";

            tbody.innerHTML += `
            <tr style="border-bottom: 1px solid #e5e7eb;">
                <td style="text-align: center; font-weight: 600;">${startIndex + index + 1}</td>
                <td>${item.nim}</td>
                <td style="font-weight: 600; color: #111827;">${item.namaMhs}</td>
                <td><span class="${badgeClass}">${item.jenis}</span></td>
                <td style="font-size: 0.85rem; color: #4b5563; line-height: 1.4;">${item.judul}</td>
                <td style="text-align: center;">
                    <button class="btn-dark" style="padding: 8px 12px;" onclick="alert('Membuka edit data TA untuk ${item.namaMhs}')"><i class="fas fa-edit"></i></button>
                </td>
            </tr>`;
        });

        renderPaginationUI(filteredData.length, startIndex, endIndex);
    }

    function renderPaginationUI(totalFilteredData, startIndex, endIndex) {
        const totalPages = Math.ceil(totalFilteredData / rowsPerPage);
        const actualEndIndex = Math.min(endIndex, totalFilteredData);
        const paginationContainer = document.getElementById('pagination-ta');
        
        let html = `<div>Showing ${startIndex + 1} to ${actualEndIndex} of ${totalFilteredData} entries</div>`;
        html += `<div style="display: flex; gap: 5px;">`;
        
        const prevDisabled = currentPage === 1;
        html += `<button class="btn" style="background: ${prevDisabled ? '#e5e7eb' : 'var(--border-dark)'}; color: ${prevDisabled ? '#9ca3af' : 'white'}; padding: 8px 12px; border:none; border-radius:8px; cursor:${prevDisabled ? 'not-allowed' : 'pointer'};" ${prevDisabled ? 'disabled' : `onclick="changePage(-1)"`}><i class="fas fa-chevron-left"></i> Prev</button>`;
        
        const nextDisabled = currentPage === totalPages || totalPages === 0;
        html += `<button class="btn" style="background: ${nextDisabled ? '#e5e7eb' : 'var(--border-dark)'}; color: ${nextDisabled ? '#9ca3af' : 'white'}; padding: 8px 12px; border:none; border-radius:8px; cursor:${nextDisabled ? 'not-allowed' : 'pointer'};" ${nextDisabled ? 'disabled' : `onclick="changePage(1)"`}>Next <i class="fas fa-chevron-right"></i></button>`;
        
        html += `</div>`;
        paginationContainer.innerHTML = html;
    }

    function changePage(direction) {
        currentPage += direction;
        renderTablePaginated();
    }

    // Eksekusi Saat Halaman Dimuat
    window.onload = () => { 
        loadSidebar(); 
        loadData(); 
        
        const selectBox = document.getElementById('showEntries');
        if(selectBox) {
            selectBox.onchange = (e) => {
                rowsPerPage = parseInt(e.target.value);
                currentPage = 1; 
                renderTablePaginated();
            }
        }

        const searchBox = document.getElementById('searchBox');
        if(searchBox) {
            searchBox.oninput = (e) => {
                searchQuery = e.target.value.toLowerCase();
                currentPage = 1; 
                renderTablePaginated();
            }
        }
    };
</script>
</body>
</html>
