<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola CPL - Sistem OBE</title>
    <!-- Pastikan path CSS dan JS ini sesuai dengan foldermu -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Script untuk Export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="../../../js/api_config.js"></script>    
    <link rel="stylesheet" href="cpl.css">
    <link rel="stylesheet" href="../../../css/global_ti.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div id="navbar-container"></div>
    
    <div class="main-content">
        <!-- SATUKAN SEMUA KE DALAM CONTENT-WRAPPER -->
        <div class="content-wrapper"> 
            
            <div class="header-container">
                <div class="header-left">
                    <div class="header-title-area">
                        <div class="header-subtitle">KELOLA KURIKULUM</div>
                        <h1 class="header-title">CAPAIAN <span id="titleSpan">PEMBELAJARAN (CPL)</span></h1>
                    </div>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <!-- TEMPLATE: Filter Section -->
            <div class="filter-section">
                <label for="filterKurikulum">Tampilkan Data Kurikulum:</label>
                <select id="filterKurikulum" onchange="loadData()" class="filter-select">
                    <option value="">Memuat data...</option>
                </select>
            </div>

            <!-- TEMPLATE: Section Header -->
            <div class="section-header">
                <div class="section-title-area">
                    <h3 class="section-title">Daftar CPL</h3>
                    <p class="section-subtitle">Rumusan Capaian Pembelajaran Lulusan</p>
                </div>
                
                <div class="action-buttons">
                    <button class="btn-action btn-download" onclick="exportKeExcel()">
                        <i class="fas fa-file-download"></i> <span class="btn-text">Download</span>
                    </button>
                    
                    <input type="file" id="fileExcel" accept=".xlsx, .xls" style="display: none;" onchange="uploadExcel()">
                    <button class="btn-action btn-upload" onclick="document.getElementById('fileExcel').click()">
                        <i class="fas fa-file-upload"></i> <span class="btn-text">Impor</span>
                    </button>
                </div>
            </div>
            
            <!-- Area Tabel CPL -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th width="15%">Kode CPL</th>
                            <th>Deskripsi CPL</th>
                            <th width="15%" style="text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="3" style="text-align: center; padding: 40px;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <div id="pagination-container"></div>
            
        </div> 
    </div> 

<!-- Memanggil Template Sidebar -->
<script src="../../../js/template.js"></script>

<script>
    const PRODI = localStorage.getItem("prodi_aktif") || "ti"; 
    const API_UPDATE = `${API_BASE}/admin-update-master`;
    const API_UPLOAD = `${API_BASE}/upload-master-cpl`;
    const userLogin = localStorage.getItem("user_login");

    if (!userLogin) window.location.replace("/login/login.html");

    const pAktif = localStorage.getItem("prodi_aktif") || "ti";
    const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
    const warnaProdi = pAktif === 'si' ? '#1e3a8a' : '#8b0000'; 
    const warnaAvatar = pAktif === 'si' ? '1e3a8a' : '8b0000';
    
    document.getElementById("titleSpan").style.color = warnaProdi;
    const badge = document.getElementById("prodiBadge");
    badge.style.backgroundColor = warnaProdi;
    badge.innerText = pAktif === 'si' ? "SISTEM INFORMASI" : "TEKNIK INFORMATIKA";

    const avatarMobile = document.getElementById("mobileNavbarAvatar");
    if(avatarMobile) {
        avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=${warnaAvatar}&color=fff&bold=true`;
    }

    let allData = [];
    let state = { page: 1, itemsPerPage: 10 };

    async function loadDropdownKurikulum() {
        try {
            const response = await fetch(`${API_BASE}/get-kurikulum-tersedia`);
            const data = await response.json();
            
            const selectKurikulum = document.getElementById('filterKurikulum');
            selectKurikulum.innerHTML = ''; 
            
            data.forEach(item => {
                // PROTEKSI: Jangan biarkan kurikulum null/kosong masuk ke dropdown
                if (item && item.kurikulum) {
                    let opt = document.createElement('option');
                    opt.value = item.kurikulum; 
                    opt.text = "Kurikulum 20" + item.kurikulum; 
                    selectKurikulum.appendChild(opt);
                }
            });

            await loadData(); 

        } catch (error) {
            console.error("Gagal memuat list kurikulum:", error);
            document.getElementById('filterKurikulum').innerHTML = '<option value="">Gagal memuat kurikulum</option>';
        }
    }
    
    async function loadData() { 
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding:40px;'><i class='fas fa-spinner fa-spin'></i> Memuat data...</td></tr>";

        const selectKurikulum = document.getElementById('filterKurikulum');
        let kurikulumTerpilih = selectKurikulum ? selectKurikulum.value : "";
        
        let API_URL_DINAMIS = `${API_BASE}/get-master-cpl?prodi=${PRODI}`;
        if (kurikulumTerpilih !== "") {
            API_URL_DINAMIS += `&kurikulum=${kurikulumTerpilih}`;
        }

        try {
            const res = await fetch(API_URL_DINAMIS); 
            allData = await res.json(); 
            
            if (!allData || allData.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding:40px; color:#64748b;'>Belum ada data CPL untuk kurikulum ini.</td></tr>";
                document.getElementById('pagination-container').innerHTML = '';
                return;
            }

            state.page = 1;
            renderTablePaginated();
        } catch(e) { 
            tbody.innerHTML = "<tr><td colspan='3' style='color:red; text-align:center; padding:40px;'>belum ada data</td></tr>";
        }
    }

    function renderTablePaginated() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        
        const start = (state.page - 1) * state.itemsPerPage;
        const end = start + state.itemsPerPage;
        const paginatedItems = allData.slice(start, end);
        
        paginatedItems.forEach(cpl => {
            const deskripsi = cpl.deskripsi || cpl.deskripsi_cpl || ""; 
            
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 800; color: ${warnaProdi};">${cpl.kode_cpl}</td>
                <td>
                    <textarea id="in-${cpl.kode_cpl}" rows="3" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; font-size: 0.95rem; resize: vertical;">${deskripsi}</textarea>
                </td>
                <td style="text-align:center;">
                    <div style="display: flex; gap: 8px; justify-content: center;">
                        <button class="btn-action btn-dark" style="padding: 8px 12px;" onclick="simpanEdit('cpl', '${cpl.kode_cpl}')" title="Simpan Perubahan">
                            <i class="fas fa-save"></i> Simpan
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });

        renderPaginationControls();
    }

    function renderPaginationControls() {
        const container = document.getElementById('pagination-container');
        container.innerHTML = "";
        
        const totalPages = Math.ceil(allData.length / state.itemsPerPage);
        if (totalPages <= 1) return;

        const btnPrev = document.createElement('button');
        btnPrev.innerHTML = '<i class="fas fa-chevron-left"></i> Prev';
        btnPrev.disabled = state.page === 1;
        btnPrev.onclick = () => { if (state.page > 1) { state.page--; renderTablePaginated(); } };
        container.appendChild(btnPrev);

        const info = document.createElement('span');
        info.innerHTML = `Halaman <strong>${state.page}</strong> dari <strong>${totalPages}</strong>`;
        info.style.fontSize = "0.95rem";
        info.style.color = "#4b5563";
        container.appendChild(info);

        const btnNext = document.createElement('button');
        btnNext.innerHTML = 'Next <i class="fas fa-chevron-right"></i>';
        btnNext.disabled = state.page === totalPages;
        btnNext.onclick = () => { if (state.page < totalPages) { state.page++; renderTablePaginated(); } };
        container.appendChild(btnNext);
    }

    async function simpanEdit(tipe, kode) { 
        const value = document.getElementById(`in-${kode}`).value; 
        const btn = event.currentTarget;
        const oldHtml = btn.innerHTML;
        
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;

        try {
            const res = await fetch(API_UPDATE, { 
                method: "POST", 
                headers: {"Content-Type":"application/json"}, 
                body: JSON.stringify({ tipe: tipe, kode: kode, value: value, prodi: PRODI }) 
            }); 
            if(res.ok) alert("✅ Deskripsi CPL berhasil diperbarui!");
            else alert("❌ Gagal menyimpan data ke server.");
        } catch (e) { alert("Terjadi kesalahan jaringan."); } 
        finally { btn.innerHTML = oldHtml; btn.disabled = false; }
    }

    async function exportKeExcel() {
        const btn = document.querySelector('.btn-download');
        const oriText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyiapkan...';
        btn.disabled = true;

        let kurikulumTerpilih = document.getElementById('filterKurikulum').value;

        try {
            if (!allData || allData.length === 0) return alert("Tidak ada data untuk diekspor.");

            const dataUntukExcel = allData.map(cpl => ({ 
                'kode_cpl': cpl.kode_cpl, 
                'deskripsi': cpl.deskripsi || cpl.deskripsi_cpl || "", 
                'prodi': PRODI 
            }));
            
            const worksheet = XLSX.utils.json_to_sheet(dataUntukExcel);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Master_CPL");
            XLSX.writeFile(workbook, `Master_CPL_${PRODI}_Kurikulum_${kurikulumTerpilih}.xlsx`);
        } catch (e) { alert("Gagal mengekspor data."); } 
        finally { btn.innerHTML = oriText; btn.disabled = false; }
    }

    async function uploadExcel() {
        const fileInput = document.getElementById('fileExcel');
        const file = fileInput.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('data', file); 
        formData.append('prodi', PRODI);

        const btnUpload = document.querySelector('.btn-upload');
        const oriText = btnUpload.innerHTML;
        btnUpload.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengimpor...';
        btnUpload.disabled = true;

        try {
            const res = await fetch(API_UPLOAD, { method: 'POST', body: formData });
            if (res.ok) { alert("✅ Data Excel CPL berhasil diimpor!"); await loadDropdownKurikulum(); } 
            else { alert("❌ Gagal memproses file Excel."); }
        } catch (e) { alert("❌ Terjadi kesalahan koneksi."); } 
        finally { btnUpload.innerHTML = oriText; btnUpload.disabled = false; fileInput.value = ''; }
    }

    // 1. Fungsi Buka/Tutup dari Navbar (Garis Tiga)
    function toggleMobileSidebar() {
        const sidebar = document.getElementById('sidebar-container');
        if (sidebar) sidebar.classList.toggle('active');
    }

    // 2. Fungsi Buka/Tutup dari dalam Sidebar (Tombol Silang Merah)
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar-container');
        if (sidebar) sidebar.classList.toggle('active');
    }

    // 3. SENSOR PENUTUP (Deteksi klik di layar gelap)
    document.addEventListener('click', function(event) {
        const sidebar = document.getElementById("sidebar-container");
        
        // Deteksi tombol hamburger bawaan dari template.js agar tidak terjadi bentrok saat dibuka
        const hamburgerBtn = document.querySelector('.hamburger-btn') || document.querySelector('.mobile-menu-btn'); 
        
        // Jika sidebar saat ini sedang dalam keadaan terbuka (memiliki class active)...
        if (sidebar && sidebar.classList.contains("active")) {
            
            // ...dan jarimu menekan area yang BUKAN bagian dari sidebar, 
            // serta BUKAN bagian dari tombol hamburger...
            if (!sidebar.contains(event.target) && (!hamburgerBtn || !hamburgerBtn.contains(event.target))) {
                
                // ...maka paksa sidebar untuk membuang class 'active' agar tertutup!
                sidebar.classList.remove("active"); 
            }
        }
    });
        
    window.onload = async () => {
        await loadDropdownKurikulum(); 
    };
</script>
</body>
</html>
