<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola CPL - Sistem OBE</title>
    <!-- Pastikan path CSS dan JS ini sesuai dengan foldermu -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Script untuk Export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="../../../js/api_config.js"></script>    
    <link rel="stylesheet" href="cpl.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <div id="navbar-container"></div>
    <div class="main-content">
        <div class="fixed-header">
            <div class="header-container">
                <div class="header-title-area">
                    <div class="header-subtitle">KELOLA KURIKULUM</div>
                    <!-- Warna span judul disetel dinamis oleh JS di bawah -->
                    <h1 class="header-title">CAPAIAN <span id="titleSpan">PEMBELAJARAN (CPL)</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h3 style="margin: 0; font-size: 1.4rem; font-weight: 800;">Daftar CPL</h3>
                    <p style="margin: 4px 0 0 0; color: #64748b; font-size: 0.95rem; font-weight: 500;">Rumusan Capaian Pembelajaran Lulusan</p>
                </div>
                
                <div class="action-buttons">
                    <button class="btn-action btn-download" onclick="exportKeExcel()">
                        <i class="fas fa-file-download"></i> Download Excel
                    </button>
                    
                    <input type="file" id="fileExcel" accept=".xlsx, .xls" style="display: none;" onchange="uploadExcel()">
                    <button class="btn-action btn-upload" onclick="document.getElementById('fileExcel').click()">
                        <i class="fas fa-file-upload"></i> Impor Excel
                    </button>
                </div>
            </div>
        </div>
        
        <div class="scrollable-content">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th width="15%">Kode CPL</th>
                            <th>Deskripsi CPL</th>
                            <th width="15%" style="text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="3" style="text-align: center; padding: 40px;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <div id="pagination-container"></div>
        </div>
    </div>

<!-- Memanggil Template Sidebar -->
<script src="../../../js/template.js"></script>

<script>
    // --- 1. VARIABEL API & SESI ---
    const PRODI = localStorage.getItem("prodi_aktif") || "ti"; 
    
    const API_CPL = `${API_BASE}/get-master-cpl?prodi=${PRODI}`;
    const API_UPDATE = `${API_BASE}/admin-update-master`;
    const API_UPLOAD = `${API_BASE}/upload-master-cpl`;

    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace("/login/login.html");

    // --- SETUP TAMPILAN DINAMIS (WARNA & NAMA PRODI) ---
    const pAktif = localStorage.getItem("prodi_aktif") || "ti";
    const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
    const warnaProdi = pAktif === 'si' ? '#1e3a8a' : '#8b0000'; // Biru SI, Merah TI
    const warnaAvatar = pAktif === 'si' ? '1e3a8a' : '8b0000';
    
    // Ubah warna text judul dan background badge
    document.getElementById("titleSpan").style.color = warnaProdi;
    const badge = document.getElementById("prodiBadge");
    badge.style.backgroundColor = warnaProdi;
    badge.innerText = pAktif === 'si' ? "SISTEM INFORMASI" : "TEKNIK INFORMATIKA";

    // Setup Avatar Mobile
    const avatarMobile = document.getElementById("mobileNavbarAvatar");
    if(avatarMobile) {
        avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=${warnaAvatar}&color=fff&bold=true`;
    }

    // --- 2. FUNGSI AMBIL DATA TABEL ---
    let allData = [];
    let state = { page: 1, itemsPerPage: 10 };

    async function loadData() { 
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding:40px;'><i class='fas fa-spinner fa-spin'></i> Memuat data...</td></tr>";

        try {
            const res = await fetch(API_CPL); 
            allData = await res.json(); 
            
            if (!allData || allData.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding:40px; color:#64748b;'>Belum ada data CPL. Silakan impor via Excel.</td></tr>";
                document.getElementById('pagination-container').innerHTML = '';
                return;
            }

            state.page = 1;
            renderTablePaginated();
        } catch(e) { 
            tbody.innerHTML = "<tr><td colspan='3' style='color:red; text-align:center; padding:40px;'>Gagal menarik data. Pastikan n8n menyala.</td></tr>";
        }
    }

    // --- 3. RENDER TABEL & PAGINATION ---
    function renderTablePaginated() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        
        const start = (state.page - 1) * state.itemsPerPage;
        const end = start + state.itemsPerPage;
        const paginatedItems = allData.slice(start, end);
        
        paginatedItems.forEach(cpl => {
            const deskripsi = cpl.deskripsi || cpl.deskripsi_cpl || ""; 
            
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 800; color: ${warnaProdi};">${cpl.kode_cpl}</td>
                <td>
                    <textarea id="in-${cpl.kode_cpl}" rows="3" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; font-size: 0.95rem; resize: vertical;">${deskripsi}</textarea>
                </td>
                <td style="text-align:center;">
                    <div style="display: flex; gap: 8px; justify-content: center;">
                        <button class="btn-action btn-dark" style="padding: 8px 12px;" onclick="simpanEdit('cpl', '${cpl.kode_cpl}')" title="Simpan Perubahan">
                            <i class="fas fa-save"></i> Simpan
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });

        renderPaginationControls();
    }

    function renderPaginationControls() {
        const container = document.getElementById('pagination-container');
        container.innerHTML = "";
        
        const totalPages = Math.ceil(allData.length / state.itemsPerPage);
        if (totalPages <= 1) return;

        const btnPrev = document.createElement('button');
        btnPrev.innerHTML = '<i class="fas fa-chevron-left"></i> Prev';
        btnPrev.disabled = state.page === 1;
        btnPrev.onclick = () => { if (state.page > 1) { state.page--; renderTablePaginated(); } };
        container.appendChild(btnPrev);

        const info = document.createElement('span');
        info.innerHTML = `Halaman <strong>${state.page}</strong> dari <strong>${totalPages}</strong>`;
        info.style.fontSize = "0.95rem";
        info.style.color = "#4b5563";
        container.appendChild(info);

        const btnNext = document.createElement('button');
        btnNext.innerHTML = 'Next <i class="fas fa-chevron-right"></i>';
        btnNext.disabled = state.page === totalPages;
        btnNext.onclick = () => { if (state.page < totalPages) { state.page++; renderTablePaginated(); } };
        container.appendChild(btnNext);
    }

    // --- 4. FUNGSI SIMPAN & EXCEL ---
    async function simpanEdit(tipe, kode) { 
        const value = document.getElementById(`in-${kode}`).value; 
        const btn = event.currentTarget;
        const oldHtml = btn.innerHTML;
        
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;

        try {
            const res = await fetch(API_UPDATE, { 
                method: "POST", 
                headers: {"Content-Type":"application/json"}, 
                body: JSON.stringify({ tipe: tipe, kode: kode, value: value, prodi: PRODI }) 
            }); 
            if(res.ok) alert("✅ Deskripsi CPL berhasil diperbarui!");
            else alert("❌ Gagal menyimpan data ke server.");
        } catch (e) { alert("Terjadi kesalahan jaringan."); } 
        finally { btn.innerHTML = oldHtml; btn.disabled = false; }
    }

    async function exportKeExcel() {
        const btn = document.querySelector('.btn-download');
        const oriText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyiapkan...';
        btn.disabled = true;

        try {
            if (!allData || allData.length === 0) return alert("Tidak ada data untuk diekspor.");

            const dataUntukExcel = allData.map(cpl => ({ 
                'kode_cpl': cpl.kode_cpl, 
                'deskripsi': cpl.deskripsi || cpl.deskripsi_cpl || "", 
                'prodi': PRODI 
            }));
            
            const worksheet = XLSX.utils.json_to_sheet(dataUntukExcel);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Master_CPL");
            XLSX.writeFile(workbook, `Master_CPL_${PRODI}.xlsx`);
        } catch (e) { alert("Gagal mengekspor data."); } 
        finally { btn.innerHTML = oriText; btn.disabled = false; }
    }

    async function uploadExcel() {
        const fileInput = document.getElementById('fileExcel');
        const file = fileInput.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('data', file); 
        formData.append('prodi', PRODI);

        const btnUpload = document.querySelector('.btn-upload');
        const oriText = btnUpload.innerHTML;
        btnUpload.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengimpor...';
        btnUpload.disabled = true;

        try {
            const res = await fetch(API_UPLOAD, { method: 'POST', body: formData });
            if (res.ok) { alert("✅ Data Excel CPL berhasil diimpor!"); await loadData(); } 
            else { alert("❌ Gagal memproses file Excel."); }
        } catch (e) { alert("❌ Terjadi kesalahan koneksi."); } 
        finally { btnUpload.innerHTML = oriText; btnUpload.disabled = false; fileInput.value = ''; }
    }

    // Fungsi untuk memunculkan dan menyembunyikan sidebar di mobile
        function toggleMobileSidebar() {
            const sidebar = document.getElementById("sidebar-container");
            if (sidebar) {
                // Tambahkan atau hapus class 'show-mobile' yang ada di CSS tadi
                sidebar.classList.toggle("show-mobile");
            }
        }

        // Opsional: Klik di sembarang tempat (luar sidebar) untuk menutupnya
        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById("sidebar-container");
            const toggleBtn = document.getElementById("btnToggleSidebar");
            
            // Jika sidebar sedang terbuka, dan user mengklik di luar sidebar & bukan di tombol garis tiga
            if (sidebar && sidebar.classList.contains("show-mobile")) {
                if (!sidebar.contains(event.target) && !toggleBtn.contains(event.target)) {
                    sidebar.classList.remove("show-mobile");
                }
            }
        });
        
    window.onload = () => {
        setTimeout(loadData, 400); 
    };
</script>
</body>
</html>
