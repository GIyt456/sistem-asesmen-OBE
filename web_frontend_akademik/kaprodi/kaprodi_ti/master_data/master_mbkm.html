<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data MBKM - Panel Kaprodi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../../../js/template.js"></script>

    <style>
        :root {
            --primary-red: #8b0000;
            --text-dark: #1f2937;
            --bg-light: #f9fafb;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Pembungkus Konten Utama */
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            color: var(--primary-red);
            font-weight: 800;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            background: #fdfdfd;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4b5563;
        }

        input,
        select,
        textarea {
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-red);
            box-shadow: 0 0 0 3px rgba(139, 0, 0, 0.1);
        }

        /* CUSTOM DROPDOWN MAHASISWA */
        .dropdown-wrapper {
            position: relative;
        }

        .search-container {
            display: flex;
            align-items: center;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding-right: 40px;
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: #6b7280;
            transition: transform 0.2s;
        }

        .dropdown-wrapper.active .toggle-btn {
            transform: rotate(180deg);
        }

        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            margin-top: 4px;
        }

        .dropdown-list.show {
            display: block;
        }

        .dropdown-item {
            padding: 10px 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.1s;
            border-bottom: 1px solid #f3f4f6;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: #f3f4f6;
            color: var(--primary-red);
            font-weight: 600;
        }

        .no-result {
            padding: 10px 12px;
            color: #9ca3af;
            font-style: italic;
            text-align: center;
            font-size: 0.9rem;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            grid-column: span 2;
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-red);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: #6b0000;
        }

        .btn-secondary {
            background: white;
            color: #4b5563;
            border: 1px solid #d1d5db;
        }

        .btn-secondary:hover {
            background: #f9fafb;
        }

        /* TABLE STYLES */
        .table-responsive {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background: #f3f4f6;
            color: #374151;
            font-weight: 700;
            padding: 12px 16px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            color: #4b5563;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #f9fafb;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-table {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        .btn-edit {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
        }

        .btn-edit:hover {
            background: #dbeafe;
        }

        .btn-delete {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .btn-delete:hover {
            background: #fee2e2;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
        }

        .badge-aktif {
            background: #dcfce7;
            color: #15803d;
        }

        .badge-selesai {
            background: #e0f2fe;
            color: #0369a1;
        }
    </style>
</head>

<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="container">
            <h2><i class="fas fa-university"></i> Master Data Manajemen MBKM</h2>

            <form id="formMBKM" onsubmit="simpanMBKM(event)">
                <input type="hidden" id="id_mbkm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Cari Mahasiswa (NIM / Nama)</label>
                        <div class="dropdown-wrapper" id="dropdownWrapper">
                            <div class="search-container">
                                <input type="text" id="searchMahasiswa" placeholder="Ketik NIM atau Nama..."
                                    autocomplete="off">
                                <i class="fas fa-chevron-down toggle-btn" id="toggleBtn"></i>
                            </div>
                            <div class="dropdown-list" id="dropdownList">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Nama Mahasiswa Terpilih</label>
                        <input type="text" id="inputNama" placeholder="Otomatis terisi..." readonly
                            style="background: #f3f4f6; font-weight: bold; color: #374151;">
                    </div>

                    <div class="form-group">
                        <label>Jenis Program MBKM</label>
                        <select id="jenis_mbkm" required>
                            <option value="">-- Pilih Program --</option>
                            <option value="Magang Bersertifikat">Magang Bersertifikat</option>
                            <option value="Studi Independen Bersertifikat">Studi Independen Bersertifikat</option>
                            <option value="Kampus Mengajar">Kampus Mengajar</option>
                            <option value="Pertukaran Mahasiswa Merdeka">Pertukaran Mahasiswa Merdeka</option>
                            <option value="Wirausaha Merdeka">Wirausaha Merdeka</option>
                            <option value="KKN Tematik">KKN Tematik</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Nama Mitra / Instansi Pelaksana</label>
                        <input type="text" id="mitra" placeholder="Contoh: PT. Telkom Indonesia" required>
                    </div>

                    <div class="form-group">
                        <label>Nomor SK MBKM / Surat Tugas</label>
                        <input type="text" id="sk_mbkm" placeholder="Contoh: 120/SK/FTI/UNAKI/2026" required>
                    </div>

                    <div class="form-group">
                        <label>Status Keaktifan Program</label>
                        <select id="status" required>
                            <option value="Aktif">Aktif Berjalan</option>
                            <option value="Selesai">Selesai Program</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Tanggal Mulai Kegiatan</label>
                        <input type="date" id="tanggal_mulai" required>
                    </div>

                    <div class="form-group">
                        <label>Tanggal Selesai Kegiatan</label>
                        <input type="date" id="tanggal_selesai" required>
                    </div>

                    <div class="btn-container">
                        <button type="button" class="btn-secondary" onclick="resetForm()"><i class="fas fa-undo"></i>
                            Batal</button>
                        <button type="submit" class="btn-primary" id="btnSimpan"><i class="fas fa-save"></i> Simpan Data
                            MBKM</button>
                    </div>
                </div>
            </form>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 5%; text-align: center;">No</th>
                            <th style="width: 12%;">NIM</th>
                            <th style="width: 20%;">Nama Mahasiswa</th>
                            <th style="width: 18%;">Jenis MBKM</th>
                            <th style="width: 20%;">Mitra / Instansi</th>
                            <th style="width: 10%; text-align: center;">Status</th>
                            <th style="width: 15%; text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="bodyTabelMBKM">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 30px;"><i
                                    class="fas fa-spinner fa-spin"></i> Menghubungkan ke database server...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://playing-heath-pointed-instance.trycloudflare.com/webhook";
        const API_GET_MHS = `${BASE_URL}/get-master-mahasiswa`;
        const API_GET_MBKM = `${BASE_URL}/get-mbkm`;
        const API_SIMPAN_MBKM = `${BASE_URL}/simpan-mbkm`;
        const API_HAPUS_MBKM = `${BASE_URL}/hapus-mbkm`;

        let dataMahasiswa = [];
        let selectedNim = "";

        const dropdownWrapper = document.getElementById("dropdownWrapper");
        const searchInput = document.getElementById("searchMahasiswa");
        const dropdownList = document.getElementById("dropdownList");
        const toggleBtn = document.getElementById("toggleBtn");
        const inputNama = document.getElementById("inputNama");

        // 1. Tarik Master Mahasiswa untuk Dropdown
        async function loadMahasiswa() {
            try {
                const prodi = localStorage.getItem("prodi_aktif") || "ti";
                const res = await fetch(`${API_GET_MHS}?prodi=${prodi}`);
                if (!res.ok) throw new Error();
                const json = await res.json();
                dataMahasiswa = Array.isArray(json) ? json : (json.data || []);
                renderDropdown(dataMahasiswa);
            } catch (e) {
                console.error("Gagal memuat master mahasiswa.");
            }
        }

        // Render Item Dropdown
        function renderDropdown(array) {
            dropdownList.innerHTML = "";
            if (array.length === 0) {
                dropdownList.innerHTML = `<div class="no-result">Mahasiswa tidak ditemukan</div>`;
                return;
            }
            array.forEach(m => {
                const div = document.createElement("div");
                div.className = "dropdown-item";
                div.innerText = `${m.nim} - ${m.nama_mahasiswa.toUpperCase()}`;
                div.onclick = () => {
                    selectedNim = m.nim;
                    searchInput.value = m.nim;
                    inputNama.value = m.nama_mahasiswa.toUpperCase();
                    tutupDropdown();
                };
                dropdownList.appendChild(div);
            });
        }

        // 2. Tarik List Data MBKM yang sudah Terdaftar
        async function loadDataMBKM() {
            const tbody = document.getElementById("bodyTabelMBKM");
            try {
                const prodi = localStorage.getItem("prodi_aktif") || "ti";
                const res = await fetch(`${API_GET_MBKM}?prodi=${prodi}`);
                if (!res.ok) throw new Error();
                const json = await res.json();
                const dataMBKM = Array.isArray(json) ? json : (json.data || []);

                tbody.innerHTML = "";
                if (dataMBKM.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:20px;">Belum ada mahasiswa yang mengambil program MBKM.</td></tr>`;
                    return;
                }

                dataMBKM.forEach((item, index) => {
                    const badgeClass = item.status === "Aktif" ? "badge-aktif" : "badge-selesai";
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td style="text-align: center; font-weight: bold;">${index + 1}</td>
                        <td><strong>${item.nim}</strong></td>
                        <td>${item.nama_mahasiswa.toUpperCase()}</td>
                        <td>${item.jenis_mbkm}</td>
                        <td>${item.mitra}</td>
                        <td style="text-align: center;"><span class="badge ${badgeClass}">${item.status}</span></td>
                        <td>
                            <div class="actions" style="justify-content: center;">
                                <button class="btn-table btn-edit" onclick="editMBKM(${item.id_mbkm}, '${item.nim}', '${item.nama_mahasiswa}', '${item.jenis_mbkm}', '${item.mitra}', '${item.sk_mbkm}', '${item.tanggal_mulai}', '${item.tanggal_selesai}', '${item.status}')"><i class="fas fa-edit"></i></button>
                                <button class="btn-table btn-delete" onclick="hapusMBKM(${item.id_mbkm})"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:20px; color:red;">Gagal memuat rekam jejak MBKM. Pastikan n8n aktif.</td></tr>`;
            }
        }

        // 3. Simpan / Update Data ke Server N8N
        async function simpanMBKM(e) {
            e.preventDefault();
            if (!selectedNim) {
                alert("Silakan pilih mahasiswa dari sistem dropdown terlebih dahulu!");
                return;
            }

            const id_mbkm = document.getElementById("id_mbkm").value;
            const payload = {
                id_mbkm: id_mbkm ? parseInt(id_mbkm) : null,
                nim: selectedNim,
                jenis_mbkm: document.getElementById("jenis_mbkm").value,
                mitra: document.getElementById("mitra").value,
                sk_mbkm: document.getElementById("sk_mbkm").value,
                status: document.getElementById("status").value,
                tanggal_mulai: document.getElementById("tanggal_mulai").value,
                tanggal_selesai: document.getElementById("tanggal_selesai").value,
                prodi: localStorage.getItem("prodi_aktif") || "ti"
            };

            try {
                const btn = document.getElementById("btnSimpan");
                btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Memproses...`;
                btn.disabled = true;

                const res = await fetch(API_SIMPAN_MBKM, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert("✅ Sukses menyimpan data registrasi MBKM!");
                    resetForm();
                    loadDataMBKM();
                } else {
                    alert("❌ Gagal memproses data.");
                }
            } catch (err) {
                alert("⚠️ Masalah koneksi jaringan ke server n8n.");
            } finally {
                const btn = document.getElementById("btnSimpan");
                btn.innerHTML = `<i class="fas fa-save"></i> Simpan Data MBKM`;
                btn.disabled = false;
            }
        }

        // 4. Set Nilai Form untuk Mode Edit
        function editMBKM(id, nim, nama, jenis, mitra, sk, tglMulai, tglSelesai, status) {
            document.getElementById("id_mbkm").value = id;
            selectedNim = nim;
            searchInput.value = nim;
            inputNama.value = nama.toUpperCase();
            document.getElementById("jenis_mbkm").value = jenis;
            document.getElementById("mitra").value = mitra;
            document.getElementById("sk_mbkm").value = sk;
            document.getElementById("status").value = status;
            document.getElementById("tanggal_mulai").value = tglMulai;
            document.getElementById("tanggal_selesai").value = tglSelesai;
            searchInput.disabled = true;
            toggleBtn.style.pointerEvents = "none";
            document.getElementById("btnSimpan").innerHTML = `<i class="fas fa-edit"></i> Update Data MBKM`;
        }

        // 5. Hapus Data
        async function hapusMBKM(id) {
            if (!confirm("Apakah Anda yakin ingin menghapus data rekam MBKM mahasiswa ini?")) return;
            try {
                const res = await fetch(`${API_HAPUS_MBKM}?id=${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert("✅ Sukses menghapus berkas MBKM!");
                    loadDataMBKM();
                } else {
                    alert("❌ Gagal menghapus.");
                }
            } catch (e) {
                alert("⚠️ Gangguan jaringan.");
            }
        }

        // Reset Tampilan Form
        function resetForm() {
            document.getElementById("id_mbkm").value = "";
            selectedNim = "";
            searchInput.value = "";
            inputNama.value = "";
            document.getElementById("jenis_mbkm").value = "";
            document.getElementById("mitra").value = "";
            document.getElementById("sk_mbkm").value = "";
            document.getElementById("status").value = "Aktif";
            document.getElementById("tanggal_mulai").value = "";
            document.getElementById("tanggal_selesai").value = "";
            searchInput.disabled = false;
            toggleBtn.style.pointerEvents = "auto";
            document.getElementById("btnSimpan").innerHTML = `<i class="fas fa-save"></i> Simpan Data MBKM`;
        }

        // Manajemen Trigger Dropdown UI
        function bukaDropdown() {
            dropdownList.classList.add("show");
            dropdownWrapper.classList.add("active");
            renderDropdown(dataMahasiswa);
        }

        function tutupDropdown() {
            dropdownList.classList.remove("show");
            dropdownWrapper.classList.remove("active");
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            if (searchInput.disabled) return;
            if (dropdownList.classList.contains("show")) {
                tutupDropdown();
            } else {
                bukaDropdown();
                searchInput.focus();
            }
        }

        searchInput.addEventListener("click", toggleDropdown);
        toggleBtn.addEventListener("click", toggleDropdown);

        searchInput.addEventListener("input", function (e) {
            dropdownList.classList.add("show");
            dropdownWrapper.classList.add("active");
            const val = e.target.value.toLowerCase();
            const filtered = dataMahasiswa.filter(m =>
                m.nim.includes(val) || m.nama_mahasiswa.toLowerCase().includes(val)
            );
            renderDropdown(filtered);
            if (!val) inputNama.value = "";
        });

        document.addEventListener("click", function (event) {
            if (!dropdownWrapper.contains(event.target)) tutupDropdown();
        });

        // KENDALI PENYUNTIKAN MENU AKTIF (INTEGRASI TEMPLATE.JS)
        window.onload = () => {
            loadMahasiswa();
            loadDataMBKM();

            setTimeout(() => {
                const navDashboard = document.getElementById('nav-home');
                const navMbkm = document.querySelector('[data-path="/master_data/master_mbkm.html"]');
                const menuMaster = document.getElementById('menu-master');
                const chevronMaster = document.getElementById('chevron-master');

                if (navDashboard) navDashboard.classList.remove('active');
                if (navMbkm) navMbkm.classList.add('active');

                if (menuMaster && chevronMaster) {
                    menuMaster.style.display = 'flex';
                    chevronMaster.style.transform = 'rotate(180deg)';
                }
            }, 300);
        };
    </script>
</body>

</html>
