<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Tahun Kurikulum TI - Sistem OBE</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <script src="../../../js/template.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABEL WARNA KHUSUS TI --- */
        :root { 
            --primary-red: #8b0000; 
            --primary-red-dark: #5c0000; 
            --bg-main: #ffffff; 
            --text-dark: #111827;
            --border-light: #e5e7eb;
            --border-dark: #161923;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark);
            animation: transitionIn 0.3s ease-in-out; 
        }
        
        @keyframes transitionIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- GAYA KONTEN UTAMA --- */
        .main-content { flex: 1; overflow-y: auto; padding: 40px 60px; background-color: var(--bg-main); }
        
        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; border-bottom: 1px solid #e5e7eb; padding-bottom: 20px; }
        .header-title-area { display: flex; flex-direction: column; }
        .header-subtitle { color: #9ca3af; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px; }
        .header-title span { color: var(--primary-red); }
        
        .badge-prodi { 
            background: var(--primary-red); 
            color: white; 
            padding: 10px 20px; 
            border-radius: 30px; 
            font-size: 0.9rem; 
            font-weight: 600; 
            box-shadow: 0 4px 6px rgba(139, 0, 0, 0.2);
        }

        /* --- TOMBOL --- */
        .btn-dark { background: var(--border-dark); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-dark:hover { background: #000000; transform: translateY(-2px); }
        
        .btn-primary-ti { 
            background: linear-gradient(to right, var(--primary-red), var(--primary-red-dark)); 
            color: white; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 0.85rem; 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            transition: 0.2s; 
            box-shadow: 0 4px 6px rgba(139, 0, 0, 0.2);
        }
        .btn-primary-ti:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 12px rgba(139, 0, 0, 0.3);
        }

        /* --- GAYA TABEL --- */
        .table-card { background: white; border-radius: 12px; overflow: hidden; border: 1.5px solid #e5e7eb; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; color: var(--text-dark); padding: 16px 20px; text-align: left; border-bottom: 2px solid #e5e7eb; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; }
        td { padding: 16px 20px; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; vertical-align: middle; }
        tbody tr:hover { background-color: #f9fafb; }
        
        .form-control { width: 100%; padding: 10px 14px; border: 1.5px solid #d1d5db; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        .form-control:focus { border-color: var(--primary-red); box-shadow: 0 0 0 3px rgba(139,0,0,0.1); }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="header-container">
            <div class="header-title-area">
                <div class="header-subtitle">MASTER DATA</div>
                <h1 class="header-title">TAHUN <span>KURIKULUM</span></h1>
            </div>
            <div class="badge-prodi"><i class="fas fa-calendar-alt"></i> Teknik Informatika</div>
        </div>

        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div>
                    <h3 style="margin: 0; font-size: 1.4rem; font-weight: 800;">Daftar Tahun Kurikulum</h3>
                    <p style="margin: 4px 0 0 0; color: #9ca3af; font-size: 0.95rem; font-weight: 500;">Kelola data master acuan tahun kurikulum untuk prodi TI.</p>
                </div>
                <button class="btn-dark" onclick="loadData()"><i class="fas fa-sync-alt"></i> Refresh Data</button>
            </div>
            
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th width="15%">Kode Pengaturan</th>
                            <th width="65%">Deskripsi / Label Nilai</th>
                            <th width="20%" style="text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="bodyTahun">
                        <tr>
                            <td colspan="3" style="text-align: center; padding: 40px; color: #64748b;">
                                <i class="fas fa-spinner fa-spin"></i> Menarik data dari n8n...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div id="pagination-tahun" style="display: flex; justify-content: center; align-items: center; margin-top: 24px; gap: 15px;"></div>
        </div>
    </div>

<script>
    // 1. PENGATURAN API N8N (Gunakan URL tunnel terakhir Anda yang aktif)
    const PRODI = 'ti'; 
    const API_BASE = "https://district-spend-penguin-charter.trycloudflare.com/webhook"; 
    const API_URL = `${API_BASE}/get-metadata?prodi=${PRODI}`;
    const API_UPDATE = `${API_BASE}/admin-update-master`;
    
    // 2. SISTEM KEAMANAN & SATPAM AKUN
    const userLogin = localStorage.getItem("user_login");
    const userRole = localStorage.getItem("user_role");
    const userProdi = localStorage.getItem("prodi_aktif");

    if (!userLogin) window.location.replace('/login/login.html');
    if (userRole !== 'head_admin') {
        if (userRole === 'dosen') window.location.replace(userProdi === 'si' ? "input_nilai_si.html" : "../../dosen/input_nilai.html");
        else if (userRole === 'admin' && userProdi === 'si') window.location.replace("../kaprodi_si/admin_config_si.html");
    }

    // 3. LOGIKA DATA TAHUN (TABEL & PAGINASI)
    let allDataTahun = [];
    let currentPage = 1;
    const rowsPerPage = 5; 

    async function loadData() { 
        const tbody = document.getElementById("bodyTahun");
        tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding: 40px;'><i class='fas fa-spinner fa-spin'></i> Memuat data tahun...</td></tr>";

        try {
            const res = await fetch(API_URL); 
            const data = await res.json();
            
            allDataTahun = data.filter(i => i.tipe === 'tahun');
            currentPage = 1; 
            
            renderTablePaginated();
        } catch(e) { 
            console.error("Gagal menarik data dari n8n:", e); 
            tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding: 40px; color: red;'>❌ Gagal terhubung ke database. Pastikan n8n aktif.</td></tr>";
        }
    }

    function renderTablePaginated() {
        const tbody = document.getElementById("bodyTahun");
        tbody.innerHTML = "";

        if (allDataTahun.length === 0) {
            tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding: 40px;'>Data pengaturan tahun belum tersedia.</td></tr>";
            document.getElementById('pagination-tahun').innerHTML = '';
            return;
        }

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const dataHalamanIni = allDataTahun.slice(startIndex, endIndex);

        dataHalamanIni.forEach(item => {
            tbody.innerHTML += `
            <tr>
                <td style="font-weight: 700; color: #111827;">${item.kode}</td>
                <td>
                    <input type="text" id="in-${item.kode}" value="${item.label || ''}" class="form-control">
                </td>
                <td style="text-align:center;">
                    <button class="btn-primary-ti" style="padding: 10px 14px;" onclick="simpanEdit('${item.kode}')">
                        <i class="fas fa-save"></i> Simpan
                    </button>
                </td>
            </tr>`;
        });

        renderPaginationUI();
    }

    function renderPaginationUI() {
        const container = document.getElementById('pagination-tahun');
        container.innerHTML = "";
        
        const totalPages = Math.ceil(allDataTahun.length / rowsPerPage);
        if (totalPages <= 1) return; 

        const btnPrev = document.createElement('button');
        btnPrev.className = 'btn-dark';
        btnPrev.innerHTML = '<i class="fas fa-chevron-left"></i> Prev';
        btnPrev.disabled = currentPage === 1;
        if(currentPage === 1) btnPrev.style.opacity = '0.5';
        btnPrev.onclick = () => { if (currentPage > 1) { currentPage--; renderTablePaginated(); } };
        container.appendChild(btnPrev);

        const info = document.createElement('span');
        info.innerHTML = `Halaman <strong style="color: var(--primary-red);">${currentPage}</strong> dari <strong>${totalPages}</strong>`;
        info.style.fontSize = "0.95rem";
        info.style.color = "#4b5563";
        container.appendChild(info);

        const btnNext = document.createElement('button');
        btnNext.className = 'btn-dark';
        btnNext.innerHTML = 'Next <i class="fas fa-chevron-right"></i>';
        btnNext.disabled = currentPage === totalPages;
        if(currentPage === totalPages) btnNext.style.opacity = '0.5';
        btnNext.onclick = () => { if (currentPage < totalPages) { currentPage++; renderTablePaginated(); } };
        container.appendChild(btnNext);
    }

    // 4. FUNGSI SIMPAN PERUBAHAN
    async function simpanEdit(kode) { 
        const valueInput = document.getElementById(`in-${kode}`).value; 
        
        if(!valueInput.trim()) {
            return alert("⚠️ Nilai tidak boleh kosong!");
        }

        try {
            const res = await fetch(API_UPDATE, { 
                method: "POST", 
                headers: {"Content-Type":"application/json"}, 
                body: JSON.stringify({ tipe: 'tahun', kode: kode, value: valueInput, prodi: PRODI }) 
            }); 
            if(res.ok) {
                alert(`✅ Pengaturan [${kode}] berhasil diperbarui!`);
            } else {
                alert("❌ Gagal menyimpan data ke server.");
            }
        } catch (e) {
            alert("❌ Terjadi kesalahan jaringan.");
        }
    }

    // 5. JALANKAN SAAT WEB PERTAMA KALI DIBUKA
    window.onload = () => { 
        loadData(); 

        // Beri jeda untuk template.js menyusun sidebar, lalu sorot menu yang aktif
        setTimeout(() => {
            const navDashboard = document.getElementById('nav-home');
            const navTahun = document.querySelector('[data-path="/master_data/master_tahun.html"]');
            const menuMaster = document.getElementById('menu-master');
            const chevronMaster = document.getElementById('chevron-master');

            if(navDashboard) navDashboard.classList.remove('active');
            if(navTahun) navTahun.classList.add('active'); 
            
            if(menuMaster && chevronMaster) {
                menuMaster.style.display = 'flex';
                chevronMaster.style.transform = 'rotate(180deg)';
            }
        }, 300);
    };
</script>
</body>
</html>
