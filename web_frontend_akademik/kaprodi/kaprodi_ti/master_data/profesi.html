<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Profesi - Sistem OBE</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="../../../js/api_config.js"></script>
    
    <!-- Panggil CSS -->
    <link rel="stylesheet" href="profesi.css">
    <link rel="stylesheet" href="../../../css/global_ti.css"> 
</head>
<body>
    <div id="sidebar-container"></div>
    <div id="navbar-container"></div>
    
    <div class="main-content">
        <div class="content-wrapper">

            <div class="header-container">
                <div class="header-left">
                    <div class="header-title-area">
                        <div class="header-subtitle">KELOLA KURIKULUM</div>
                        <h1 class="header-title">DAFTAR <span id="titleSpan">PROFESI</span></h1>
                    </div>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <!-- TEMPLATE: Filter Section -->
            <div class="filter-section">
                <label for="filterKurikulum">Tampilkan Data Kurikulum:</label>
                <select id="filterKurikulum" onchange="loadDataProfesi()" class="filter-select">
                    <option value="">Memuat data...</option>
                </select>
            </div>

            <!-- TEMPLATE: Section Header -->
            <div class="section-header">
                <div class="section-title-area">
                    <h3 class="section-title">Peluang Karir</h3>
                    <p class="section-subtitle">Daftar pekerjaan kompetensi lulusan Program Studi.</p>
                </div>
            </div>

            <!-- Area Tabel Profesi -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 80px; text-align: center;">NO</th>
                            <th>JENIS PROFESI / PEKERJAAN</th>
                            <th>PROFIL LULUSAN TERKAIT</th>
                            <th style="width: 150px; text-align: center;">OPSI</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="4" style="text-align: center; padding: 40px;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL POP UP EDIT PROFESI (Struktur Distandarkan) -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">Edit Profesi</div>
            
            <input type="hidden" id="editKode">
            <input type="hidden" id="editDeskripsi"> 
            
            <div class="form-group">
                <label>Nama Profil Lulusan</label>
                <input type="text" id="editNamaProfil" disabled>
            </div>
            
            <div class="form-group">
                <label>Daftar Profesi (Pisahkan dengan koma)</label>
                <textarea id="editProfesi" rows="4" style="resize: vertical;" placeholder="Contoh: IT Auditor, IT Governance, Analyst"></textarea>
            </div>
            
            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 25px;">
                <button onclick="closeModal()" style="padding: 12px 20px; border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; cursor: pointer; font-weight: 600; color: #475569;">Batal</button>
                <button id="btnSimpanProfesi" onclick="updateProfesi()" style="padding: 12px 20px; background: var(--primary-blue); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-save"></i> Simpan
                </button>
            </div>
        </div>
    </div>

<script src="../../../js/template.js"></script>

<script>
    // --- SETUP TEMA & WARNA DINAMIS BERDASARKAN PRODI ---
    const PRODI = localStorage.getItem("prodi_aktif") || "ti"; 
    
    document.addEventListener("DOMContentLoaded", () => {
        if(PRODI === "ti") {
            document.documentElement.style.setProperty('--primary-blue', '#8b0000'); 
            document.getElementById('prodiBadge').innerText = "TEKNIK INFORMATIKA";
        } else {
            document.getElementById('prodiBadge').innerText = "SISTEM INFORMASI";
        }

        const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
        const avatarMobile = document.getElementById("mobileNavbarAvatar");
        if(avatarMobile) {
            const avatarColor = PRODI === "si" ? "1e3a8a" : "8b0000";
            avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=${avatarColor}&color=fff&bold=true`;
        }
    });

    // --- FUNGSI LOAD KURIKULUM (Disesuaikan 100% dengan CPL/CPMK) ---
    async function loadDropdownKurikulum() {
        try {
            const response = await fetch(`${API_BASE}/get-kurikulum-tersedia`);
            const data = await response.json();
            
            const selectKurikulum = document.getElementById('filterKurikulum');
            selectKurikulum.innerHTML = ''; // KOSONGKAN TOTAL, buang "Semua Kurikulum"
            
            data.forEach(item => {
                if (item && item.kurikulum) {
                    let opt = document.createElement('option');
                    opt.value = item.kurikulum; 
                    opt.text = "Kurikulum 20" + item.kurikulum; 
                    selectKurikulum.appendChild(opt);
                }
            });

            // Setelah dropdown terisi, langsung muat data tabel
            await loadDataProfesi(); 
            
        } catch (error) {
            console.error("Gagal memuat list kurikulum:", error);
            document.getElementById('filterKurikulum').innerHTML = '<option value="">Gagal memuat kurikulum</option>';
        }
    }

    // --- LOGIKA DATA MASTER PROFESI ---
    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace("/login/login.html");

    window.onload = () => {
        setTimeout(loadDropdownKurikulum, 400); 
    };

    async function loadDataProfesi() {
        const tbody = document.getElementById('tableBody');
        const kurikulumTerpilih = document.getElementById('filterKurikulum').value;
        let URL_API = `${API_BASE}/get-master-pl?prodi=${PRODI}`;
        if (kurikulumTerpilih) URL_API += `&kurikulum=${kurikulumTerpilih}`;

        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px;"><i class="fas fa-spinner fa-spin"></i> Memuat data...</td></tr>';

        try {
            const res = await fetch(URL_API);
            const data = await res.json();
            tbody.innerHTML = '';
            let no = 1;

            const aman = (str) => {
                if (!str) return '';
                return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '');
            };

            let dataKosong = true;

            data.forEach(pl => {
                if (pl.profesi) {
                    const list = pl.profesi.split(',');
                    list.forEach(prof => {
                        if(prof.trim() !== "") {
                            dataKosong = false;
                            const tr = document.createElement('tr');
                            // DESAIN ISI TABEL DIRAPIKAN DISINI
                            tr.innerHTML = `
                                <td style="text-align: center; font-weight: 700; color: #64748b;">${no++}</td>
                                <td style="font-weight: 800; color: var(--primary-blue); font-size: 1.05rem;">${prof.trim()}</td>
                                <td style="color: #475569;">
                                    <span style="background: #f1f5f9; padding: 4px 8px; border-radius: 6px; font-weight: 800; color: var(--text-dark); margin-right: 6px; border: 1px solid #e2e8f0;">${pl.kode_pl}</span> 
                                    ${pl.nama_profil || '-'}
                                </td>
                                <td style="text-align: center;">
                                    <div style="display: flex; justify-content: center;">
                                        <button class="btn-action btn-dark" style="padding: 8px 12px;" onclick="openModal('${pl.kode_pl}', '${aman(pl.nama_profil)}', '${aman(pl.deskripsi)}', '${aman(pl.profesi)}')">
                                            <i class="fas fa-edit"></i> Edit
                                        </button>
                                    </div>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        }
                    });
                }
            });

            if (dataKosong) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px; color:#64748b;">Belum ada data profesi yang terhubung pada kurikulum ini.</td></tr>';
            }

        } catch (e) { 
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px; color:red;">Gagal memuat data dari server.</td></tr>'; 
        }
    }

    // --- FUNGSI MODAL ---
    function openModal(kode, nama, desk, prof) {
        document.getElementById('editKode').value = kode;
        document.getElementById('editNamaProfil').value = nama;
        document.getElementById('editDeskripsi').value = desk;
        document.getElementById('editProfesi').value = prof;
        
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() { 
        document.getElementById('editModal').style.display = 'none'; 
    }

    async function updateProfesi() {
        const payload = {
            kode_pl: document.getElementById('editKode').value,
            nama_profil: document.getElementById('editNamaProfil').value,
            deskripsi: document.getElementById('editDeskripsi').value,
            profesi: document.getElementById('editProfesi').value,
            prodi: PRODI
        };
        
        const btnSimpan = document.getElementById("btnSimpanProfesi");
        const textAwal = btnSimpan.innerHTML;
        btnSimpan.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
        btnSimpan.disabled = true;

        try {
            const res = await fetch(`${API_BASE}/update-master-pl`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) { 
                alert("✅ Data Profesi berhasil diperbarui!"); 
                closeModal(); 
                loadDataProfesi(); 
            } else {
                alert("❌ Server menolak menyimpan perubahan.");
            }
        } catch (e) { 
            alert("❌ Terjadi kesalahan jaringan."); 
        } finally {
            btnSimpan.innerHTML = textAwal;
            btnSimpan.disabled = false;
        }
    }

    // --- FUNGSI SIDEBAR ANTI-BOCOR ---
    function toggleMobileSidebar() {
        const sidebar = document.getElementById('sidebar-container');
        if (sidebar) sidebar.classList.toggle('active');
    }
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar-container');
        if (sidebar) sidebar.classList.toggle('active');
    }
    document.addEventListener('click', function(event) {
        const sidebar = document.getElementById("sidebar-container");
        const hamburgerBtn = document.querySelector('.hamburger-btn') || document.querySelector('.mobile-menu-btn'); 
        
        if (sidebar && sidebar.classList.contains("active")) {
            if (!sidebar.contains(event.target) && (!hamburgerBtn || !hamburgerBtn.contains(event.target))) {
                sidebar.classList.remove("active"); 
            }
        }
    });
</script>
</body>
</html>
