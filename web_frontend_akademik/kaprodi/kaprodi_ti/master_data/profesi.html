<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Profesi - Sistem OBE</title>
    
    <!-- MEMANGGIL FILE CSS EKSTERNAL -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin_si.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="/js/api_config.js"></script>
    <script src="/js/template.js"></script> 
</head>
<body>

    <!-- 1. NAVBAR KHUSUS MOBILE -->
    <nav class="navbar-mobile">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <img src="/gambar/LogoUnaki.png" alt="Logo Universitas AKI" 
                 style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;" 
                 onclick="window.location.href='/index.html'">
        </div>
        
        <div class="profile-btn-mobile" onclick="toggleSidebar()">
            <img id="mobileNavbarAvatar" src="" alt="Profil Kaprodi">
        </div>
    </nav>

    <!-- 2. OVERLAY GELAP UNTUK LATAR SIDEBAR DI HP -->
    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <!-- WADAH NAVBAR ASLI DARI TEMPLATE.JS -->
        <div id="navbar-container"></div>

        <div class="fixed-header">
            <div class="header-container" style="margin-bottom: 20px;">
                <div class="header-title-area">
                    <div class="header-subtitle">KELOLA KURIKULUM</div>
                    <h1 class="header-title">DAFTAR <span>PROFESI</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <div>
                <h3 style="margin: 0; font-size: 1.4rem; font-weight: 800;">Peluang Karir</h3>
                <p style="margin: 4px 0 0 0; color: #64748b; font-size: 0.95rem; font-weight: 500;">Daftar pekerjaan kompetensi lulusan Program Studi.</p>
            </div>
        </div>

        <div class="scrollable-content">
            <div class="table-container">
                <!-- SUNTIKKAN KELAS tabel-profesi DI SINI -->
                <table class="tabel-profesi">
                    <thead>
                        <tr>
                            <th style="width: 80px; text-align: center;">NO</th>
                            <th>JENIS PROFESI / PEKERJAAN</th>
                            <th>PROFIL LULUSAN TERKAIT</th>
                            <th style="width: 150px; text-align: center;">OPSI</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="4" style="text-align: center; padding: 40px;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL POP UP EDIT PROFESI -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <h2 style="margin-top: 0; margin-bottom: 25px; font-weight: 800; color: var(--text-dark); font-size: 1.4rem;">Edit Profesi</h2>
            <input type="hidden" id="editKode">
            <input type="hidden" id="editDeskripsi"> 
            
            <div class="form-group">
                <label>Nama Profil Lulusan</label>
                <input type="text" id="editNamaProfil" disabled class="form-control" style="background: #f8fafc; font-weight: 700; color: var(--primary-blue);">
            </div>
            
            <div class="form-group" style="margin-bottom: 30px;">
                <label>Daftar Profesi (Pisahkan dengan koma)</label>
                <textarea id="editProfesi" rows="5" class="form-control" style="resize: vertical;" placeholder="Contoh: IT Auditor, IT Governance, Analyst"></textarea>
            </div>
            
            <div style="display: flex; justify-content: flex-end; gap: 12px;">
                <button onclick="closeModal()" style="padding: 12px 20px; border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; cursor: pointer; font-weight: 600; color: #475569;">Batal</button>
                <button onclick="updateProfesi()" class="btn-primary-si" style="margin: 0;"><i class="fas fa-save"></i> Simpan Perubahan</button>
            </div>
        </div>
    </div>

<script>
    // --- SETUP TEMA & WARNA DINAMIS BERDASARKAN PRODI ---
    const PRODI = localStorage.getItem("prodi_aktif") || "ti"; 
    
    document.addEventListener("DOMContentLoaded", () => {
        if(PRODI === "ti") {
            document.documentElement.style.setProperty('--primary-blue', '#8b0000'); 
            document.getElementById('prodiBadge').innerText = "TEKNIK INFORMATIKA";
        } else {
            document.getElementById('prodiBadge').innerText = "SISTEM INFORMASI";
        }

        const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
        const avatarMobile = document.getElementById("mobileNavbarAvatar");
        if(avatarMobile) {
            const avatarColor = PRODI === "si" ? "1e3a8a" : "8b0000";
            avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=${avatarColor}&color=fff&bold=true`;
        }
    });

    // --- FUNGSI SIDEBAR MOBILE ---
    function toggleSidebar() {
        document.getElementById('sidebar-container').classList.toggle('active');
        document.getElementById('mobileOverlay').classList.toggle('active');
    }
    
    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
            const sidebar = document.getElementById('sidebar-container');
            if (sidebar && !sidebar.innerHTML.includes('sidebar-profile')) {
                fetch(`/kaprodi/kaprodi_${PRODI}/sidebar.html`)
                    .then(res => res.text())
                    .then(html => {
                        sidebar.innerHTML = html;
                        if(typeof initSmartSidebar === 'function') initSmartSidebar();
                    })
                    .catch(e => console.log('Gagal memuat sidebar darurat'));
            }
        }, 600); 
    });

    // --- LOGIKA DATA MASTER PROFESI ---
    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace("/login/login.html");

    window.onload = () => {
        setTimeout(loadDataProfesi, 400); 
    };

    async function loadDataProfesi() {
        const tbody = document.getElementById('tableBody');
        try {
            const res = await fetch(`${API_BASE}/get-master-pl?prodi=${PRODI}`);
            const data = await res.json();
            tbody.innerHTML = '';
            let no = 1;

            const aman = (str) => {
                if (!str) return '';
                return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '');
            };

            let dataKosong = true;

            data.forEach(pl => {
                if (pl.profesi) {
                    const list = pl.profesi.split(',');
                    list.forEach(prof => {
                        if(prof.trim() !== "") {
                            dataKosong = false;
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td style="text-align: center; font-weight: 600;">${no++}</td>
                                <td style="font-weight: 700; color: var(--primary-blue);">${prof.trim()}</td>
                                <td><span style="font-weight: 800;">${pl.kode_pl}</span> - ${pl.nama_profil || '-'}</td>
                                <td style="text-align: center;">
                                    <button class="btn-action btn-edit" style="background:#f1f5f9; color:var(--primary-blue); border:1px solid #cbd5e1; padding: 6px 12px; margin: 0 auto;" onclick="openModal('${pl.kode_pl}', '${aman(pl.nama_profil)}', '${aman(pl.deskripsi)}', '${aman(pl.profesi)}')">
                                        <i class="fas fa-edit"></i> Edit
                                    </button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        }
                    });
                }
            });

            if (dataKosong) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px; color:#64748b;">Belum ada data profesi yang terhubung.</td></tr>';
            }

        } catch (e) { 
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px; color:red;">Gagal memuat data dari server n8n.</td></tr>'; 
        }
    }

    function openModal(kode, nama, desk, prof) {
        document.getElementById('editKode').value = kode;
        document.getElementById('editNamaProfil').value = nama;
        document.getElementById('editDeskripsi').value = desk;
        document.getElementById('editProfesi').value = prof;
        
        document.getElementById('editModal').style.display = 'flex';
        setTimeout(() => document.getElementById('editModal').classList.add('show'), 10);
    }

    function closeModal() { 
        document.getElementById('editModal').classList.remove('show');
        setTimeout(() => document.getElementById('editModal').style.display = 'none', 200); 
    }

    async function updateProfesi() {
        const payload = {
            kode_pl: document.getElementById('editKode').value,
            nama_profil: document.getElementById('editNamaProfil').value,
            deskripsi: document.getElementById('editDeskripsi').value,
            profesi: document.getElementById('editProfesi').value,
            prodi: PRODI
        };
        
        const btnSimpan = document.querySelector("#editModal .btn-primary-si");
        const textAwal = btnSimpan.innerHTML;
        btnSimpan.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
        btnSimpan.disabled = true;

        try {
            const res = await fetch(`${API_BASE}/update-master-pl`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) { 
                alert("✅ Data Profesi berhasil diperbarui!"); 
                closeModal(); 
                loadDataProfesi(); 
            } else {
                alert("❌ Server menolak menyimpan perubahan.");
            }
        } catch (e) { 
            alert("❌ Terjadi kesalahan jaringan."); 
        } finally {
            btnSimpan.innerHTML = textAwal;
            btnSimpan.disabled = false;
        }
    }
</script>
</body>
</html>
