<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Rubrik - Sistem OBE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABEL WARNA --- */
        :root { 
            --sidebar-bg: #161923; 
            --sidebar-text: #7b8395;
            --sidebar-hover: #262936;
            --sidebar-active-text: #ffffff;
            --primary-red: #8b0000; 
            --bg-main: #ffffff; 
            --text-dark: #111827;
            --border-light: #e5e7eb;
            --border-dark: #161923;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark);
            animation: transitionIn 0.3s ease-in-out; 
        }
        
        @keyframes transitionIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- GAYA SIDEBAR --- */
        .sidebar { width: 280px; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; padding: 24px 16px; height: 100vh; }
        .sidebar-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; padding: 0 10px; }
        .sidebar-profile img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .sidebar-profile-info { display: flex; flex-direction: column; }
        .sidebar-profile-info .name { color: white; font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
        .sidebar-profile-info .role { color: var(--sidebar-text); font-size: 9px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
        .sidebar-divider { height: 1px; background-color: rgba(255, 255, 255, 0.08); margin: 5px 10px 10px 10px; }
        .nav-menu { flex: 1; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
        .nav-menu::-webkit-scrollbar { display: none; }
        .menu-category { font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; color: var(--sidebar-text); text-transform: uppercase; margin: 10px 0 10px 10px; }
        .nav-item { padding: 12px 16px; margin-bottom: 4px; cursor: pointer; display: flex; align-items: center; gap: 16px; transition: all 0.2s; border-radius: 8px; font-weight: 500; font-size: 0.80rem; }
        .nav-item:hover, .nav-item.active { background: var(--sidebar-hover); color: var(--sidebar-active-text); }
        .nav-item i { font-size: 1.1rem; width: 20px; text-align: center; }
        .nav-bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; }
        .nav-item.logout { color: #f87171; }
        .nav-item.logout:hover { background: rgba(248, 113, 113, 0.1); }
        #menu-master .nav-item { padding-left: 20px; font-size: 0.75rem; }

        /* --- GAYA KONTEN UTAMA --- */
        .main-content { flex: 1; overflow-y: auto; padding: 40px 60px; }

        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; border-bottom: 1px solid #e5e7eb; padding-bottom: 20px; }
        .header-subtitle { color: #9ca3af; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px;}
        .header-title span { color: var(--primary-red); }
        .badge-prodi { background: var(--primary-red); color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; }

        /* --- TOMBOL --- */
        .btn-dark { background: var(--border-dark); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-dark:hover { background: #000000; transform: translateY(-2px); }
        .btn-action { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: white; transition: 0.2s; background: #3b82f6; }
        .btn-action:hover { background: #2563eb; }

        /* --- GAYA TABEL --- */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; border: 1.5px solid #e5e7eb; border-radius: 8px; overflow: hidden; background: white; }
        th { background: #f3f4f6; color: var(--text-dark); padding: 14px 16px; text-align: left; border-bottom: 2px solid #e5e7eb; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; }
        td { padding: 14px 16px; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; color: #4b5563; }
        tbody tr:hover { background-color: #f9fafb; }
        
        .badge-status { padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; display: inline-block; }
        .status-aktif { background: #d1fae5; color: #065f46; }

        /* --- MODAL POP-UP STYLES --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center; animation: fadeIn 0.2s ease; }
        .modal-box { background: white; border-radius: 16px; width: 1100px; max-width: 95%; max-height: 90vh; display: flex; flex-direction: column; border: 2.5px solid var(--border-dark); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .modal-header { padding: 24px 32px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; background: #f9fafb; border-radius: 16px 16px 0 0; }
        .modal-body { padding: 32px; overflow-y: auto; flex: 1; }
        
        /* GAYA TABEL RUBRIK DALAM MODAL */
        .rubric-table th { background: #1f2937; color: white; text-align: center; font-size: 0.85rem; border: 1px solid #374151; padding: 12px; }
        .rubric-table td { border: 1px solid #d1d5db; vertical-align: top; font-size: 0.85rem; line-height: 1.5; padding: 12px; }
        .rubric-table td:first-child { font-weight: 700; color: #111827; }
        .rubric-table td:nth-child(2) { text-align: center; font-weight: 700; color: var(--primary-red); }
        .rubric-section-header { background: #f3f4f6; font-weight: 800; color: #111827; padding: 10px 16px; margin-top: 20px; border-left: 4px solid var(--primary-red); }
        
        /* LOADING ROW STYLES */
        .loading-row { text-align: center; padding: 40px; color: #6b7280; font-style: italic; font-weight: 600; }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        
        <div class="header-container">
            <div class="header-title-area">
                <div class="header-subtitle">KELOLA KURIKULUM</div>
                <h1 class="header-title">DATA MASTER <span>RUBRIK</span></h1>
            </div>
            <div class="badge-prodi">Teknik Informatika</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h3 style="margin: 0; font-size: 1.4rem; font-weight: 800;">Daftar Rubrik Penilaian</h3>
                <p style="margin: 4px 0 0 0; color: #9ca3af; font-size: 0.95rem; font-weight: 500;">Daftar parameter dan kriteria penilaian dari semua RPS aktif.</p>
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="btn-dark" onclick="loadMasterRubrik()"><i class="fas fa-sync-alt"></i> Refresh Data</button>
            </div>
        </div>

       <div class="table-card" style="background: white; border-radius: 12px; overflow: hidden; border: 1px solid #e5e7eb;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #f8fafc; border-bottom: 2px solid #e2e8f0; text-align: left;">
                        <th style="padding: 15px; color: #4b5563; font-size: 13px;">Urutan Tugas</th>
                        <th style="padding: 15px; color: #4b5563; font-size: 13px;">Judul Tugas</th>
                        <th style="padding: 15px; color: #4b5563; font-size: 13px; text-align: center;">Sub-CPMK</th>
                        <th style="padding: 15px; color: #4b5563; font-size: 13px;">Waktu Pengerjaan</th>
                        <th style="padding: 15px; color: #4b5563; font-size: 13px; text-align: center;">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelDataTugas">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 40px; color: #64748b;">
                            <i class="fas fa-spinner fa-spin"></i> Menarik data dari n8n...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    <div id="modalDetailRubrik" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <div>
                    <h3 id="modalRubrikJudul" style="margin: 0 0 4px 0; color: var(--text-dark); font-size: 1.4rem; font-weight: 800;">Detail Rubrik Penilaian</h3>
                    <p id="modalRubrikSubtitle" style="margin: 0; color: #6b7280; font-size: 0.9rem;">Mata Kuliah: -</p>
                </div>
                <button onclick="tutupModalDetailRubrik()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #6b7280;"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="modal-body" id="modalRubrikKonten">
                </div>
        </div>
    </div>

<script>
    // 1. SISTEM KEAMANAN & PENGATURAN API
    const userLogin = localStorage.getItem("user_login");
    // Jika perlu cek session login, aktifkan baris di bawah:
    // if (!userLogin) window.location.replace('/login/login.html');

    // MENGGUNAKAN WEBHOOK N8N UNTUK GET DATA MASTER RUBRIK
    // (JANGAN LUPA UBAH INI JIKA ANDA MENGGUNAKAN URL PRODUCTION BARU DI N8N)
    const API_GET_MASTER_RUBRIK = 'https://compact-ahead-recycling-rabbit.trycloudflare.com/webhook/get-master-rubrik';

    // 2. LOAD SIDEBAR
    async function loadSidebar() {
        try {
            const response = await fetch('/kaprodi/kaprodi_ti/components/sidebar.html');
            const html = await response.text();
            
            document.getElementById('sidebar-container').outerHTML = html;
            document.getElementById("adminName").innerText = userLogin || "Kaprodi TI";

            setTimeout(() => {
                const navDashboard = document.getElementById('nav-home');
                const navRubrik = document.getElementById('nav-rubrik');
                const menuMaster = document.getElementById('menu-master');
                const chevronMaster = document.getElementById('chevron-master');

                if(navDashboard) navDashboard.classList.remove('active');
                if(navRubrik) navRubrik.classList.add('active'); 
                
                if(menuMaster && chevronMaster) {
                    menuMaster.style.display = 'flex';
                    chevronMaster.style.transform = 'rotate(180deg)';
                }
            }, 100);
        } catch (error) { console.error('Gagal memuat sidebar:', error); }
    }

    // Fungsi Dropdown Sidebar
    function toggleDropdown(menuId, chevronId) {
        const menu = document.getElementById(menuId);
        const chevron = document.getElementById(chevronId);
        if (menu.style.display === 'none' || menu.style.display === '') {
            menu.style.display = 'flex'; chevron.style.transform = 'rotate(180deg)'; 
        } else {
            menu.style.display = 'none'; chevron.style.transform = 'rotate(0deg)';   
        }
    }

    function logout() { localStorage.clear(); window.location.replace("/login/login.html"); }

    // ==========================================
    // 3. FUNGSI MENARIK DATA DARI DATABASE (N8N)
    // ==========================================
   // CONTOH FUNGSI FETCH YANG SUDAH DIGABUNG BERSAMA LOGIKA GROUPING
       async function loadMasterRubrik() {
                const tableBody = document.getElementById('tabelDataTugas');

                // Alarm 1: Cek apakah ID HTML ada
                if (!tableBody) {
                    alert("🛑 ERROR HTML: Element <tbody id='tabelDataTugas'> tidak ditemukan!");
                    return;
                }

                try {
                    // ⚠️ GANTI DENGAN URL CLOUDFLARE TUNNEL ANDA HARI INI
                    const URL_API = 'https://compact-ahead-recycling-rabbit.trycloudflare.com/webhook/get-master-rubrik';
                    
                    const response = await fetch(URL_API);
                    
                    // Baca sebagai Teks dulu untuk mencegah crash JSON
                    const textData = await response.text();

                    // Alarm 2: Cek apakah Cloudflare mengirim pesan error (bukan data n8n)
                    if (!textData || textData.includes('<!DOCTYPE html>')) {
                        alert("🛑 ERROR KONEKSI: N8n mati atau URL Tunnel berubah! Cek terminal Cloudflare Anda.");
                        tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red; padding:20px;">Gagal terhubung ke Database. Periksa URL n8n!</td></tr>';
                        return;
                    }

                    // Jika aman, ubah jadi data asli
                    const data = JSON.parse(textData);

                    if (data.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">Belum ada rencana tugas.</td></tr>';
                        return;
                    }

                    // HAPUS LOADING SPINNER
                    tableBody.innerHTML = ''; 

                    // 🗂️ PROSES GROUPING BERDASARKAN KODE MATA KULIAH
                    const groupedData = {};
                    data.forEach(item => {
                        if (!groupedData[item.kode_mk]) {
                            groupedData[item.kode_mk] = {
                                nama_mk: item.nama_mk || 'Mata Kuliah Tidak Terdaftar',
                                tugasList: []
                            };
                        }
                        groupedData[item.kode_mk].tugasList.push(item);
                    });

                    // 📊 PROSES CETAK KE TABEL
                   // 📊 PROSES CETAK KE TABEL
                    Object.keys(groupedData).forEach(kodeMk => {
                        const matkul = groupedData[kodeMk];
                        
                        // ✨ PERUBAHAN: Header Mata Kuliah ditambah Tombol Cetak Semua Tugas ✨
                        tableBody.innerHTML += `
                            <tr style="background-color: #f1f5f9; font-weight: bold;">
                                <td colspan="4" style="padding: 12px 15px; color: #0f172a; border-bottom: 2px solid #e5e7eb; text-align: left;">
                                    <i class="fas fa-book" style="color: #8b0000; margin-right: 8px;"></i> 
                                    ${matkul.nama_mk} (${kodeMk}) — <span style="color: #64748b;">Total: ${matkul.tugasList.length} Tugas</span>
                                </td>
                                <td style="text-align: center; background-color: #f1f5f9; border-bottom: 2px solid #e5e7eb;">
                                    <button class="btn-print" style="background: #8b0000; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; display: inline-flex; align-items: center; gap: 5px;"
                                        onclick="window.open('/dosen/cetak_rps_matkul.html?kode_mk=${kodeMk}', '_blank')">
                                        <i class="fas fa-file-pdf"></i> Cetak Semua
                                    </button>
                                </td>
                            </tr>
                        `;

                        // List Tugas di bawahnya tetap sama seperti kemarin...
                        matkul.tugasList.forEach((tugas, index) => {
                            tableBody.innerHTML += `
                                <tr>
                                    <td style="padding-left: 30px; font-weight: 700; color: #4b5563;">
                                        <i class="fas fa-tasks" style="font-size: 11px; margin-right: 5px; color: #94a3b8;"></i> Tugas ${index + 1}
                                    </td>
                                    <td style="font-weight: 500;">${tugas.judul_tugas}</td>
                                    <td style="text-align:center;"><span style="background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 700;">${tugas.kode_cpmk}</span></td>
                                    <td>${tugas.waktu_pengerjaan || '-'}</td>
                                    <td style="text-align:center;">
                                        <button class="btn-action" style="padding: 6px 12px; font-size: 12px; background: #1e293b; color: white; border: none; border-radius: 6px; cursor: pointer;" 
                                            onclick="bukaModalDetailRubrik('${tugas.id_tugas}', '${tugas.judul_tugas}', '${tugas.kode_mk}', '${tugas.kode_cpmk}')">
                                            <i class="fas fa-eye"></i> Detail
                                        </button>
                                    </td>
                                </tr>
                            `;
                        });
                    });

                } catch (error) {
                    // Alarm 3: Tangkap error sistem lainnya
                    alert("🛑 ERROR JAVASCRIPT: " + error.message);
                    tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red; padding:20px;">Terjadi Kesalahan Sistem: ${error.message}</td></tr>`;
                }
            }

            // Panggil saat halaman pertama kali dibuka
            window.onload = function() {
                loadMasterRubrik();
            };

    // ==========================================
    // 4. FUNGSI MENAMPILKAN DETAIL RUBRIK 
    // ==========================================
    async function bukaModalDetailRubrik(idTugas, judulTugas, kodeMk, kodeCpmk) {
    // 1. Setup Header Modal & Tambahkan Tombol Cetak PDF
    document.getElementById('modalRubrikJudul').innerText = judulTugas;
    document.getElementById('modalRubrikSubtitle').innerText = `Mata Kuliah: ${kodeMk} | Sub-CPMK: ${kodeCpmk}`;
    
    // Perbarui header modal agar ada tombol Cetak PDF (Gunakan path absolut /dosen/)
    const headerModal = document.querySelector('.modal-header');
    headerModal.innerHTML = `
        <div>
            <h3 style="margin: 0 0 4px 0; color: var(--text-dark); font-size: 1.4rem; font-weight: 800;">${judulTugas}</h3>
            <p style="margin: 0; color: #6b7280; font-size: 0.9rem;">Mata Kuliah: ${kodeMk} | Sub-CPMK: ${kodeCpmk}</p>
        </div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <button class="btn-print" style="background: #8b0000; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px;" 
                onclick="window.open('/dosen/cetak_rps.html?id_tugas=${idTugas}', '_blank')">
                <i class="fas fa-file-pdf"></i> Cetak PDF
            </button>
            <button onclick="tutupModalDetailRubrik()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #6b7280;">
                <i class="fas fa-times"></i>
            </button>
        </div>
    `;

    const konten = document.getElementById('modalRubrikKonten');
    konten.innerHTML = `<div style="text-align:center; padding:20px;"><i class="fas fa-spinner fa-spin"></i> Mengambil matriks rubrik...</div>`;
    
    document.getElementById('modalDetailRubrik').style.display = "flex";

    try {
        const response = await fetch(`https://compact-ahead-recycling-rabbit.trycloudflare.com/webhook/get-detail-rubrik?id_tugas=${idTugas}`);
        const textData = await response.text(); 

        if (!textData || textData.trim() === '') {
            konten.innerHTML = `<p style="text-align:center; color:#ef4444; font-weight:bold;">Matriks kriteria untuk tugas ini belum masuk ke database.</p>`;
            return;
        }

        // GANTI NAMA VARIABEL DARI 'data' MENJADI 'rubrikData' AGAR TIDAK BENTROK
        const rubrikData = JSON.parse(textData);

        // Render tabel rubrik menggunakan rubrikData
        let htmlTabel = `
            <table style="width:100%; border-collapse: collapse; margin-top:10px;">
                <thead>
                    <tr style="background:#f3f4f6;">
                        <th style="border:1px solid #e5e7eb; padding:12px;">Kriteria</th>
                        <th style="border:1px solid #e5e7eb; padding:12px;">Bobot</th>
                        <th style="border:1px solid #e5e7eb; padding:12px;">Skala 1</th>
                        <th style="border:1px solid #e5e7eb; padding:12px;">Skala 2</th>
                        <th style="border:1px solid #e5e7eb; padding:12px;">Skala 3</th>
                        <th style="border:1px solid #e5e7eb; padding:12px;">Skala 4</th>
                    </tr>
                </thead>
                <tbody>
        `;

        rubrikData.forEach(item => {
            htmlTabel += `
                <tr>
                    <td style="border:1px solid #e5e7eb; padding:10px; font-weight:bold;">${item.kriteria}</td>
                    <td style="border:1px solid #e5e7eb; padding:10px; text-align:center;">${item.bobot_persen}%</td>
                    <td style="border:1px solid #e5e7eb; padding:10px;">${item.skala_1}</td>
                    <td style="border:1px solid #e5e7eb; padding:10px;">${item.skala_2}</td>
                    <td style="border:1px solid #e5e7eb; padding:10px;">${item.skala_3}</td>
                    <td style="border:1px solid #e5e7eb; padding:10px;">${item.skala_4}</td>
                </tr>
            `;
        });

        htmlTabel += `</tbody></table>`;
        konten.innerHTML = htmlTabel;

    } catch (error) {
        console.error("Gagal memuat:", error);
        konten.innerHTML = `<p style="text-align:center; color:red;">Gagal memuat detail rubrik. Periksa koneksi n8n.</p>`;
    }
}
    function tutupModalDetailRubrik() {
        document.getElementById('modalDetailRubrik').style.display = "none";
    }

    window.onload = () => {
        loadSidebar();
        loadMasterRubrik(); // Memanggil data otomatis saat halaman selesai di-load
    };
</script>
</body>
</html>
