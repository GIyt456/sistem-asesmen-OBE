<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Data Mengajar Dosen - Sistem OBE</title>
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin_si.css">
    <link rel="stylesheet" href="/css/index_mobile.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/js/api_config.js"></script>
    <script src="/js/template.js"></script>
    
    <style>
        /* =========================================
           🛡️ MANTRA ANTI-BOCOR & ANTI-MEROSOT
           ========================================= */
        *, *::before, *::after { box-sizing: border-box !important; }
        html, body { max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0;}
        body, input, select, button, textarea { font-family: 'Inter', sans-serif !important; }

        /* MEMBUNUH PADDING BAWAAN CSS GLOBAL */
        .fixed-header { padding-top: 15px !important; }
        .main-content { padding-top: 0 !important; }

        /* KONTROL TABEL DESKTOP */
        .table-action-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;}
        .table-controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .search-box { position: relative; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .search-box input { padding: 10px 15px 10px 35px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; width: 250px; font-weight: 500; transition: 0.2s;}
        .search-box input:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(30,58,138, 0.1); }
        .select-entries { padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: 600; color: #334155; outline: none; cursor: pointer;}

        .tabel-mengajar th { background: #1e293b !important; color: white !important; font-weight: 700; padding: 15px !important; position: sticky; top: 0; z-index: 5;}
        .tabel-mengajar td { padding: 15px !important; vertical-align: middle; border-bottom: 1px solid #e5e7eb;}
        .tabel-mengajar tbody tr:hover td { background-color: #f8fafc; }

        .btn-action-small { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s;}
        .btn-danger { background: #fee2e2; color: #dc2626; }
        .btn-danger:hover { background: #fca5a5; }

        /* =========================================
           📱 CSS KHUSUS HP (SULAP TABEL JADI KARTU)
           ========================================= */
        @media screen and (max-width: 768px) {
            html, body { overflow-x: hidden !important; width: 100% !important; max-width: 100% !important; margin: 0; padding: 0;}
            .main-content { overflow-x: hidden !important; width: 100% !important; padding-top: 15px !important;}
            
            .header-master { margin: 15px 0 10px 0 !important; flex-direction: column !important; align-items: flex-start !important; gap: 15px; padding-bottom: 0 !important; border-bottom: none !important;}
            .section-master { padding: 0 15px 40px 15px !important; width: 100% !important; box-sizing: border-box !important;}
            
            .table-action-header { flex-direction: column !important; align-items: stretch !important; gap: 15px;}
            .table-controls { flex-direction: column !important; align-items: stretch !important; width: 100%;}
            .search-box { width: 100%; }
            .search-box input { width: 100%; }
            .select-entries { width: 100%; }
            .btn-primary-si { width: 100% !important; justify-content: center !important;}

            /* SULAP TABEL MENJADI KARTU */
            .table-container { border: none !important; box-shadow: none !important; background: transparent !important; padding: 0 !important; overflow-x: hidden !important; margin: 0;}
            .table-container table, .table-container thead, .table-container tbody, .table-container th, .table-container td, .table-container tr { display: block !important; width: 100% !important; min-width: 0 !important; box-sizing: border-box !important;}
            
            .table-container thead { display: none !important;}
            
            .table-container tr { background: white !important; border: 1px solid #cbd5e1 !important; border-radius: 12px !important; margin-bottom: 20px !important; padding: 15px !important; box-shadow: 0 4px 6px rgba(0,0,0,0.05) !important; overflow: hidden !important;}
            
            .table-container td { display: flex !important; flex-direction: column !important; align-items: stretch !important; text-align: left !important; padding: 10px 0 !important; border: none !important; border-bottom: 1px dashed #e2e8f0 !important; }
            .table-container td:last-child { border-bottom: none !important; padding-bottom: 0 !important; flex-direction: row !important; gap: 10px; margin-top: 10px;}
            
            .table-container td::before { font-weight: 800; color: #64748b; font-size: 0.8rem; margin-bottom: 6px; text-transform: uppercase;}
            
            /* Mapping Label untuk Kartu Data Mengajar */
            .tabel-mengajar td:nth-child(1) { display: none !important;} /* Sembunyikan Nomor */
            .tabel-mengajar td:nth-child(2)::before { content: "TAHUN AJARAN"; }
            .tabel-mengajar td:nth-child(3)::before { content: "SEMESTER"; }
            .tabel-mengajar td:nth-child(4)::before { content: "MATA KULIAH"; color: var(--primary-blue);}
            .tabel-mengajar td:nth-child(5)::before { content: "DOSEN PENGAMPU"; }
            .tabel-mengajar td:nth-child(6)::before { content: "KELOMPOK KELAS"; }
            .tabel-mengajar td:nth-child(7)::before { display: none; }
            
            /* Penyesuaian Visual Konten HP */
            .tabel-mengajar td:nth-child(4) { font-size: 1.15rem !important; font-weight: 900 !important; border-bottom: 3px solid var(--primary-blue) !important; padding-bottom: 15px !important; margin-bottom: 5px !important;}
            .tabel-mengajar td:nth-child(5) { font-size: 1rem !important; font-weight: 700 !important; color: #1e293b !important;}
            .tabel-mengajar td:nth-child(6) span { font-size: 0.9rem !important; padding: 6px 12px !important; display: inline-block; width: fit-content;}
            .tabel-mengajar td:nth-child(7) .btn-action-small { flex: 1; justify-content: center; padding: 12px; font-size: 1rem;}
            
            #pagination-container { flex-direction: column; width: 100%; gap: 10px;}
            #pagination-container button, #pagination-container span { width: 100%; text-align: center; justify-content: center;}
        }
    </style>
</head>
<body>

    <nav class="navbar-mobile">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <img src="/gambar/LogoUnaki.png" alt="Logo Universitas AKI" style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;" onclick="window.location.href='/index.html'">
        </div>
        <div class="profile-btn-mobile" onclick="toggleSidebar()"><img id="mobileNavbarAvatar" src="" alt="Profil Kaprodi"></div>
    </nav>

    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div id="navbar-container"></div>

        <div class="fixed-header">
            <div class="header-container header-master" style="margin: 0 0 15px 0; border-bottom: none; padding-bottom: 0;">
                <div class="header-title-area">
                    <div class="header-subtitle">DATA AKADEMIK</div>
                    <h1 class="header-title">DATA <span>MENGAJAR DOSEN</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge" style="margin-top: 10px; display: inline-block; width: fit-content;">PRODI</div>
            </div>
            <div style="border-bottom: 1px solid var(--border-color); margin: 0 0 20px 0;" class="header-master"></div>
        </div>

        <div class="scrollable-content section-master" style="padding-top: 0; padding-bottom: 40px;">
            
            <div class="table-action-header">
                <div class="table-controls">
                    <select id="showEntries" class="select-entries">
                        <option value="10">10 Entri per halaman</option>
                        <option value="25">25 Entri per halaman</option>
                        <option value="50">50 Entri per halaman</option>
                    </select>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchBox" placeholder="Cari dosen, mata kuliah, kelompok...">
                    </div>
                </div>
                <button class="btn-primary-si" onclick="alert('Fungsi Tambah Jadwal diarahkan ke Form n8n')">
                    <i class="fas fa-plus" style="margin-right: 8px;"></i> Tambah Jadwal
                </button>
            </div>
            
            <div class="table-container">
                <table class="tabel-mengajar">
                    <thead>
                        <tr>
                            <th width="5%" style="text-align: center;">NO</th>
                            <th width="12%">TAHUN AJARAN</th>
                            <th width="10%">SEMESTER</th>
                            <th width="30%">MATA KULIAH</th>
                            <th width="23%">DOSEN PENGAMPU</th>
                            <th width="10%">KELOMPOK</th>
                            <th width="10%" style="text-align: center;">AKSI</th>
                        </tr>
                    </thead>
                    <tbody id="tableBodyMengajar">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 40px; color: #64748b;">
                                <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary-blue); margin-bottom: 10px; display: block;"></i>
                                Menghubungkan ke database Data Mengajar...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div id="pagination-container"></div>

        </div>
    </div>

<script>
    // --- SETUP TEMA & WARNA DINAMIS BERDASARKAN PRODI ---
    const PRODI = localStorage.getItem("prodi_aktif") || "si"; 
    
    document.addEventListener("DOMContentLoaded", () => {
        if(PRODI === "ti") {
            document.documentElement.style.setProperty('--primary-blue', '#8b0000'); 
            document.getElementById('prodiBadge').innerText = "TEKNIK INFORMATIKA";
        } else {
            document.documentElement.style.setProperty('--primary-blue', '#1e3a8a'); 
            document.getElementById('prodiBadge').innerText = "SISTEM INFORMASI";
        }

        const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
        const avatarMobile = document.getElementById("mobileNavbarAvatar");
        if(avatarMobile) {
            const avatarColor = PRODI === "si" ? "1e3a8a" : "8b0000";
            avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=${avatarColor}&color=fff&bold=true`;
        }
    });

    // --- FUNGSI SIDEBAR MOBILE ---
    function toggleSidebar() {
        document.getElementById('sidebar-container').classList.toggle('active');
        document.getElementById('mobileOverlay').classList.toggle('active');
    }
    
    // --- AMANKAN AKSES HALAMAN ---
    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace('/login/login.html');

    // --- VARIABEL & PENGATURAN API ---
    const API_URL = `${API_BASE}/get-metadata?prodi=${PRODI}`;
    let allDataMengajar = [];
    let currentPage = 1;
    let rowsPerPage = 10;
    let searchQuery = '';

    // --- TARIK DATA DARI N8N ---
    async function loadData() {
        const tbody = document.getElementById('tableBodyMengajar');
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 40px; color: #64748b;"><i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary-blue); margin-bottom: 10px; display: block;"></i>Menarik data terbaru...</td></tr>`;
        
        try {
            const response = await fetch(API_URL);
            const textData = await response.text();
            
            let parsed = JSON.parse(textData);
            let rawData = Array.isArray(parsed) ? parsed : (parsed.data || []);
            rawData = rawData.map(i => i.json ? i.json : i);
            
            // Saring hanya tipe = 'mengajar'
            allDataMengajar = rawData.filter(i => i.tipe === 'mengajar');
            
            renderTablePaginated();

        } catch (error) {
            console.error("Gagal memuat data Mengajar:", error);
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:30px; color: #ef4444; font-weight: bold;"><i class="fas fa-exclamation-triangle" style="margin-right: 5px;"></i> Gagal terhubung ke server n8n.</td></tr>`;
        }
    }

    // --- FUNGSI RENDER TABEL & PAGINATION ---
    function renderTablePaginated() {
        const tbody = document.getElementById("tableBodyMengajar");
        
        // 1. Filter Pencarian
        let filtered = allDataMengajar.filter(item => {
            const lbl = item.label || "";
            return lbl.toLowerCase().includes(searchQuery);
        });

        // 2. Kalkulasi Pagination
        const totalPages = Math.ceil(filtered.length / rowsPerPage);
        if (currentPage > totalPages) currentPage = totalPages || 1;
        const start = (currentPage - 1) * rowsPerPage;
        const currentData = filtered.slice(start, start + rowsPerPage);

        tbody.innerHTML = '';

        if (currentData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 30px; font-weight: 600; color: #64748b;">Tidak ada data yang ditemukan.</td></tr>';
            renderPaginationControls(0);
            return;
        }

        // 3. Cetak Baris
        currentData.forEach((item, index) => {
            // Pecah data berdasarkan delimiter "||" dari query SQL n8n terbaru
            const parts = item.label ? item.label.split('||') : [];
            const kodeMK = parts[0] ? parts[0].trim() : "-";
            const namaMK = parts[1] ? parts[1].trim() : "-";
            const tahun = parts[2] ? parts[2].trim() : "-";
            const semester = parts[3] ? parts[3].trim() : "-";
            const dosen = parts[4] ? parts[4].trim() : "-";
            const kelompok = parts[5] ? parts[5].trim() : "-";
            
            tbody.innerHTML += `
                <tr>
                    <td style="text-align: center; font-weight: 600;">${start + index + 1}</td>
                    <td style="font-weight: 600; color: #475569;">${tahun}</td>
                    <td style="font-weight: 600; color: #475569;">${semester}</td>
                    <td>
                        <div style="font-weight: 800; color: var(--primary-blue); margin-bottom: 4px;">${kodeMK}</div>
                        <div style="font-size: 0.85rem; color: #64748b; font-weight: 500;">${namaMK}</div>
                    </td>
                    <td style="font-weight: 700; color: #1e293b;">${dosen}</td>
                    <td>
                        <span style="background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 800; white-space: nowrap;">
                            ${kelompok}
                        </span>
                    </td>
                    <td style="text-align: center;">
                        <button class="btn-action-small btn-danger" onclick="alert('Fitur hapus diarahkan ke API n8n untuk MK: ${kodeMK}')">
                            <i class="fas fa-trash-alt"></i> Hapus
                        </button>
                    </td>
                </tr>
            `;
        });
        
        renderPaginationControls(totalPages);
    }

    function renderPaginationControls(totalPages) {
        const container = document.getElementById("pagination-container");
        container.innerHTML = '';
        if (totalPages <= 1 && allDataMengajar.length <= rowsPerPage) return;

        let btnPrev = `<button ${currentPage === 1 ? 'disabled' : ''} onclick="currentPage--; renderTablePaginated()"><i class="fas fa-chevron-left"></i></button>`;
        let btnNext = `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="currentPage++; renderTablePaginated()"><i class="fas fa-chevron-right"></i></button>`;
        let info = `<span style="padding: 8px 15px; background: #f1f5f9; border-radius: 6px; font-weight: 700; color: #475569;">Halaman ${currentPage} dari ${totalPages}</span>`;

        container.innerHTML = `${btnPrev} ${info} ${btnNext}`;
    }

    // --- EVENT LISTENER SAAT HALAMAN DIBUKA ---
    window.onload = function() {
        loadData();

        // Event Listener Pencarian & Entri
        const selectBox = document.getElementById('showEntries');
        if(selectBox) { selectBox.onchange = (e) => { rowsPerPage = parseInt(e.target.value); currentPage = 1; renderTablePaginated(); } }

        const searchBox = document.getElementById('searchBox');
        if(searchBox) { searchBox.oninput = (e) => { searchQuery = e.target.value.toLowerCase(); currentPage = 1; renderTablePaginated(); } }

        // Sidebar Active Indicator
        setTimeout(() => {
            const sidebar = document.getElementById('sidebar-container');
            if (sidebar && !sidebar.innerHTML.includes('sidebar-profile')) {
                fetch(`/kaprodi/kaprodi_${PRODI}/sidebar.html`)
                    .then(res => res.text())
                    .then(html => {
                        sidebar.innerHTML = html;
                        if(typeof initSmartSidebar === 'function') initSmartSidebar();
                        
                        setTimeout(() => {
                            const navDashboard = document.getElementById('nav-home');
                            let navMengajar = document.querySelector('[data-path="/master_data/master_mengajar_si.html"]'); 
                            if (!navMengajar) navMengajar = document.querySelector('[data-path="/master_data/master_mengajar.html"]');
                            const menuMaster = document.getElementById('menu-master');
                            const chevronMaster = document.getElementById('chevron-master');

                            if(navDashboard) navDashboard.classList.remove('active');
                            if(navMengajar) navMengajar.classList.add('active'); 
                            if(menuMaster && chevronMaster) { menuMaster.style.display = 'flex'; chevronMaster.style.transform = 'rotate(180deg)'; }
                        }, 100);
                    })
                    .catch(e => console.log('Gagal memuat sidebar darurat'));
            }
        }, 400); 
    };
</script>
</body>
</html>
