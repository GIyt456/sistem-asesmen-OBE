<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Mengajar - Sistem OBE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABEL WARNA --- */
        :root { 
            --sidebar-bg: #161923; 
            --sidebar-text: #7b8395;
            --sidebar-hover: #262936;
            --sidebar-active-text: #ffffff;
            --primary-red: #8b0000; 
            --bg-main: #ffffff; 
            --text-dark: #111827;
            --border-light: #e5e7eb;
            --border-dark: #161923;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark);
            animation: transitionIn 0.3s ease-in-out; 
        }
        
        @keyframes transitionIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- GAYA SIDEBAR --- */
        .sidebar { width: 280px; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; padding: 24px 16px; min-height: 100vh; }
        .sidebar-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; padding: 0 10px; }
        .sidebar-profile img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .sidebar-profile-info { display: flex; flex-direction: column; }
        .sidebar-profile-info .name { color: white; font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
        .sidebar-profile-info .role { color: var(--sidebar-text); font-size: 9px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
        .sidebar-divider { height: 1px; background-color: rgba(255, 255, 255, 0.08); margin: 5px 10px 10px 10px; }
        .nav-menu { flex: 1; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
        .nav-menu::-webkit-scrollbar { display: none; }
        .menu-category { font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; color: var(--sidebar-text); text-transform: uppercase; margin: 10px 0 10px 10px; }
        .nav-item { padding: 12px 16px; margin-bottom: 4px; cursor: pointer; display: flex; align-items: center; gap: 16px; transition: all 0.2s; border-radius: 8px; font-weight: 500; font-size: 0.80rem; }
        .nav-item:hover, .nav-item.active { background: var(--sidebar-hover); color: var(--sidebar-active-text); }
        .nav-item i { font-size: 1.1rem; width: 20px; text-align: center; }
        .nav-bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; }
        .nav-item.logout { color: #f87171; }
        .nav-item.logout:hover { background: rgba(248, 113, 113, 0.1); }
        #menu-master .nav-item { padding-left: 20px; font-size: 0.75rem; }

        /* --- GAYA KONTEN UTAMA --- */
        .main-content { flex: 1; overflow-y: auto; padding: 40px 60px; }

        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; border-bottom: 1px solid #e5e7eb; padding-bottom: 20px; }
        .header-subtitle { color: #9ca3af; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px;}
        .header-title span { color: var(--primary-red); }
        .badge-prodi { background: var(--primary-red); color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; }

        /* --- TOMBOL --- */
        .btn-dark { background: var(--border-dark); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .btn-dark:hover { background: #000000; transform: translateY(-2px); }
        .btn-primary-red { background: var(--primary-red); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .btn-primary-red:hover { background: #660000; transform: translateY(-2px); }

        /* --- GAYA TABEL --- */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; border: 1.5px solid #e5e7eb; border-radius: 8px; overflow: hidden; background: white; }
        th { background: #f3f4f6; color: var(--text-dark); padding: 14px 16px; text-align: left; border-bottom: 2px solid #e5e7eb; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; }
        td { padding: 14px 16px; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; }
        tbody tr:hover { background-color: #f9fafb; }
        
        .form-control { width: 100%; padding: 12px 16px; border: 1.5px solid #d1d5db; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        .form-control:focus { border-color: var(--border-dark); }
        
        .btn-action { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: white; transition: 0.2s; }
        .btn-delete { background: #ef4444; }
        .btn-delete:hover { background: #dc2626; }
    </style>
</head>
<body>

    <!-- Wadah Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Konten Utama -->
    <div class="main-content">
        
        <!-- Header -->
        <div class="header-container">
            <div class="header-title-area">
                <div class="header-subtitle">KELOLA KURIKULUM</div>
                <h1 class="header-title">DATA <span>MENGAJAR</span></h1>
            </div>
            <div class="badge-prodi">Teknik Informatika</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h3 style="margin: 0; font-size: 1.4rem; font-weight: 800;">Data Mengajar</h3>
                <p style="margin: 4px 0 0 0; color: #9ca3af; font-size: 0.95rem; font-weight: 500;">Kelola plotting dosen mengajar per mata kuliah dan kelas.</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-primary-red" onclick="alert('Fitur tambah disiapkan')">Tambah</button>
                <button class="btn-dark" onclick="alert('Fitur Import disiapkan')">Import dari pusat</button>
                <button class="btn-primary-red" onclick="alert('Fitur Upload disiapkan')">Upload Excel</button>
                <button class="btn-dark" onclick="loadData()"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <div style="display: flex; align-items: center; gap: 8px; color: #4b5563; font-size: 0.9rem;">
                Show 
                <select style="padding: 6px 10px; border: 1.5px solid #d1d5db; border-radius: 6px; outline: none; cursor: pointer;">
                    <option>5</option>
                    <option selected>10</option>
                    <option>25</option>
                </select> entries
            </div>
            
            <div style="display: flex; align-items: center; gap: 10px;">
                <label style="font-size: 0.9rem; font-weight: 600; color: #4b5563;">Search:</label>
                <input type="text" placeholder="Ketik pencarian..." style="padding: 8px 12px; border: 1.5px solid #d1d5db; border-radius: 6px; outline: none; font-size: 0.9rem;">
            </div>
        </div>

        <!-- Tabel Data Mengajar -->
        <table>
            <thead>
                <tr>
                    <th width="3%" style="text-align: center;">#</th>
                    <th width="18%">Mata Kuliah</th>
                    <th width="10%" style="text-align: center;">Tahun</th>
                    <th width="10%" style="text-align: center;">Kurikulum</th>
                    <th width="8%" style="text-align: center;">Semester</th>
                    <th width="10%" style="text-align: center;">Angkatan</th>
                    <th width="20%">Dosen Koordinator dan Anggota</th>
                    <th width="15%">Kelas</th>
                    <th width="6%" style="text-align: center;">Opsi</th>
                </tr>
            </thead>
            <tbody id="bodyMengajar">
                <!-- Data API masuk ke sini -->
            </tbody>
        </table>

        <div id="pagination-mengajar" style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 0.85rem; color: #6b7280;">
            <div>Loading entries...</div>
        </div>
    </div>

<script>
    // 1. PENGATURAN API N8N
    const PRODI = 'ti'; 
    const API_BASE = "https://willing-robot-ministry-reported.trycloudflare.com/webhook"; 
    const API_URL = `${API_BASE}/get-metadata?prodi=${PRODI}`; 

    // 2. SISTEM KEAMANAN & SATPAM AKUN
    const userLogin = localStorage.getItem("user_login");
    const userRole = localStorage.getItem("user_role");
    const userProdi = localStorage.getItem("prodi_aktif");

    if (!userLogin) window.location.replace('/login/login.html');
    if (userRole !== 'head_admin') {
        if (userRole === 'dosen') window.location.replace(userProdi === 'si' ? "input_nilai_si.html" : "../../dosen/input_nilai.html");
        else if (userRole === 'admin' && userProdi === 'si') window.location.replace("admin_config_si.html");
    }

    // 3. FUNGSI PEMANGGIL SIDEBAR OTOMATIS
    async function loadSidebar() {
        try {
            const response = await fetch('/kaprodi/kaprodi_ti/components/sidebar.html');
            const html = await response.text();
            
            document.getElementById('sidebar-container').outerHTML = html;
            document.getElementById("adminName").innerText = userLogin;
            document.getElementById("sidebarAvatar").src = `https://ui-avatars.com/api/?name=${userLogin}&background=8b0000&color=fff&bold=true`;

            setTimeout(() => {
                const navDashboard = document.getElementById('nav-dashboard');
                const navMengajar = document.getElementById('nav-mengajar');
                const menuMaster = document.getElementById('menu-master');
                const chevronMaster = document.getElementById('chevron-master');

                if(navDashboard) navDashboard.classList.remove('active');
                if(navMengajar) navMengajar.classList.add('active'); 
                
                if(menuMaster && chevronMaster) {
                    menuMaster.style.display = 'flex';
                    chevronMaster.style.transform = 'rotate(180deg)';
                }
            }, 100);

        } catch (error) { console.error('Gagal memuat sidebar:', error); }
    }

    function toggleDropdown(menuId, chevronId) {
        const menu = document.getElementById(menuId);
        const chevron = document.getElementById(chevronId);
        if (menu.style.display === 'none' || menu.style.display === '') {
            menu.style.display = 'flex'; chevron.style.transform = 'rotate(180deg)'; 
        } else {
            menu.style.display = 'none'; chevron.style.transform = 'rotate(0deg)';   
        }
    }

    function logout() { localStorage.clear(); window.location.replace("login.html"); }

    // ==========================================
    // 4. LOGIKA DATA, PAGINASI, & PENCARIAN
    // ==========================================
    
    let allDataMengajar = []; // Tempat menyimpan semua data dari n8n
    let currentPage = 1;
    let rowsPerPage = 10;
    let searchQuery = "";

    // Fungsi Tarik Data dari API
    async function loadData() {
        const tbody = document.getElementById("bodyMengajar");
        tbody.innerHTML = "<tr><td colspan='9' style='text-align:center; padding: 20px;'><i class='fas fa-spinner fa-spin'></i> Sedang memuat data dari database...</td></tr>";

        try {
            const res = await fetch(API_URL);
            const fullData = await res.json();
            
            // Simpan hanya yang bertipe mengajar ke variabel global
            allDataMengajar = fullData.filter(i => i.tipe === 'mengajar');
            currentPage = 1;
            
            renderTablePaginated(); // Panggil fungsi render tabel
            
        } catch (error) {
            console.error("Gagal menarik data:", error);
            tbody.innerHTML = "<tr><td colspan='9' style='text-align:center; color:red; padding: 20px;'>❌ Gagal memuat data dari server n8n. Pastikan webhook aktif.</td></tr>";
        }
    }

    // Fungsi Menggambar Tabel Sesuai Halaman & Pencarian
    function renderTablePaginated() {
        const tbody = document.getElementById("bodyMengajar");
        tbody.innerHTML = ""; 

        // Filter data berdasarkan input pencarian (mencari kode atau nama matkul)
        const filteredData = allDataMengajar.filter(item => {
            const labelContent = item.label ? item.label.toLowerCase() : "";
            return labelContent.includes(searchQuery);
        });

        if(filteredData.length === 0) {
            tbody.innerHTML = "<tr><td colspan='9' style='text-align:center; padding: 20px;'>Data tidak ditemukan.</td></tr>";
            document.getElementById('pagination-mengajar').innerHTML = `<div>Showing 0 entries</div>`;
            return;
        }

        // Logika Paginasi (Pemotongan Data)
        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const dataToShow = filteredData.slice(startIndex, endIndex);

        // Render Baris per Baris
        dataToShow.forEach((item, index) => {
            const noUrut = startIndex + index + 1;
            const parts = item.label ? item.label.split('||') : ['-','-','-','-','-','-'];
            const kodeMk = parts[0]; const namaMk = parts[1]; const tahun = parts[2];
            const semester = parts[3]; const namaDosen = parts[4]; const namaKelas = parts[5];

            tbody.innerHTML += `
            <tr>
                <td style="text-align: center; vertical-align: top; padding-top: 18px;">${noUrut}</td>
                <td style="vertical-align: top; padding-top: 18px;">
                    <span style="display:block; color:#6b7280; font-size:0.8rem; margin-bottom: 4px;">${kodeMk}</span>
                    <strong style="color: var(--text-dark); font-size: 0.9rem;">${namaMk}</strong>
                </td>
                <td style="vertical-align: top; padding-top: 18px;">
                    <select class="form-control" style="padding: 6px; font-size:0.85rem; width: 100%;"><option>${tahun}</option></select>
                </td>
                <td style="vertical-align: top; padding-top: 18px;">
                    <select class="form-control" style="padding: 6px; font-size:0.85rem; width: 100%;"><option>2025</option></select>
                </td>
                <td style="vertical-align: top; padding-top: 18px;">
                    <select class="form-control" style="padding: 6px; font-size:0.85rem; width: 100%;"><option>${semester}</option></select>
                </td>
                <td style="vertical-align: top; padding-top: 18px;">
                    <select class="form-control" style="padding: 6px; font-size:0.85rem; width: 100%;"><option>2025</option></select>
                </td>
                <td style="vertical-align: top; font-size: 0.85rem; color: #4338ca; padding-top: 18px; line-height: 1.6; font-weight: 600;">
                    ${namaDosen !== '-' ? namaDosen : '<a href="#" style="color: #2563eb; font-weight: 600; text-decoration: none;">Belum Dinamai</a>'}
                </td>
                <td style="vertical-align: top; font-size: 0.8rem; color: #6b7280; padding-top: 18px; line-height: 1.6;">${namaKelas}</td>
                <td style="text-align: center; vertical-align: top; padding-top: 18px;">
                    <button class="btn-action" style="background: var(--border-dark); color: white; width: 100%; justify-content: center; margin-bottom: 6px;">Detail</button>
                    <button class="btn-action btn-delete" style="width: 100%; justify-content: center;">Hapus</button>
                </td>
            </tr>`;
        });

        renderPaginationUI(filteredData.length, startIndex, endIndex);
    }

    // Fungsi Render UI Tombol Paginasi
    function renderPaginationUI(totalFilteredData, startIndex, endIndex) {
        const totalPages = Math.ceil(totalFilteredData / rowsPerPage);
        const actualEndIndex = Math.min(endIndex, totalFilteredData);
        const paginationContainer = document.getElementById('pagination-mengajar');
        
        let html = `<div>Showing ${startIndex + 1} to ${actualEndIndex} of ${totalFilteredData} entries</div>`;
        
        html += `<div style="display: flex; gap: 5px;">`;
        
        // Tombol Prev
        const prevDisabled = currentPage === 1;
        html += `<button class="btn" style="background: ${prevDisabled ? '#e5e7eb' : 'var(--text-dark)'}; color: ${prevDisabled ? '#9ca3af' : 'white'}; padding: 8px 12px;" ${prevDisabled ? 'disabled' : `onclick="changePage(-1)"`}><i class="fas fa-chevron-left"></i> Prev</button>`;
        
        // Tombol Next
        const nextDisabled = currentPage === totalPages || totalPages === 0;
        html += `<button class="btn" style="background: ${nextDisabled ? '#e5e7eb' : 'var(--text-dark)'}; color: ${nextDisabled ? '#9ca3af' : 'white'}; padding: 8px 12px;" ${nextDisabled ? 'disabled' : `onclick="changePage(1)"`}>Next <i class="fas fa-chevron-right"></i></button>`;
        
        html += `</div>`;
        paginationContainer.innerHTML = html;
    }

    // Fungsi Pindah Halaman
    function changePage(direction) {
        currentPage += direction;
        renderTablePaginated();
    }

    // ==========================================
    // 5. JALANKAN SAAT WEB PERTAMA KALI DIBUKA
    // ==========================================
    window.onload = () => { 
        loadSidebar(); 
        loadData(); 
        
        // Event Listener untuk Dropdown "Show Entries"
        const selectBox = document.querySelector('.control-area select');
        if(selectBox) {
            selectBox.onchange = (e) => {
                rowsPerPage = parseInt(e.target.value);
                currentPage = 1; // Reset ke halaman 1
                renderTablePaginated();
            }
        }

        // Event Listener untuk Kolom Pencarian
        const searchBox = document.querySelector('.search-box input');
        if(searchBox) {
            searchBox.oninput = (e) => {
                searchQuery = e.target.value.toLowerCase();
                currentPage = 1; // Reset ke halaman 1
                renderTablePaginated();
            }
        }
    };
</script>
</body>
</html>
