<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola CPMK - Sistem OBE</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="../../../js/api_config.js"></script>    
    <link rel="stylesheet" href="cpmk.css">
    
    <style>
        /* Gaya tombol Bulk Save agar presisi secara UI/UX di samping tombol Excel */
        .btn-save-bulk {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-save-bulk:hover:not(:disabled) { background: #059669; transform: translateY(-2px); }
        .btn-save-bulk:disabled { background: #9ca3af; cursor: not-allowed; }

        /* Kompatibilitas Responsive lingkaran bulat khusus HP buatan teman Anda */
        @media screen and (max-width: 768px) {
            .action-buttons .btn-save-bulk {
                width: 45px !important;
                height: 45px !important;
                border-radius: 50% !important;
                padding: 0 !important;
                display: flex !important;
                justify-content: center !important;
                align-items: center !important;
                flex: none !important;
                font-size: 0 !important;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1) !important;
            }
            .action-buttons .btn-save-bulk i {
                font-size: 1.1rem !important;
                margin: 0 !important;
                color: white !important;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar-mobile">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <img src="../../../gambar/LogoUnaki.png" alt="Logo Universitas AKI" 
                 style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;" 
                 onclick="window.location.href='../../../index.html'">
        </div>
        
        <div class="profile-btn-mobile" onclick="toggleSidebar()">
            <img id="mobileNavbarAvatar" src="https://ui-avatars.com/api/?name=K&background=8b0000&color=fff&bold=true" alt="Profil Kaprodi">
        </div>
    </nav>

    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="fixed-header">
            <div class="header-container">
                <div class="header-title-area">
                    <div class="header-subtitle">KELOLA KURIKULUM</div>
                    <h1 class="header-title">CAPAIAN PEMBELAJARAN <span id="titleSpan">MATA KULIAH (CPMK)</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h3 style="margin: 0; font-size: 1.4rem; font-weight: 800;">Daftar CPMK</h3>
                    <p style="margin: 4px 0 0 0; color: #64748b; font-size: 0.95rem; font-weight: 500;">Rumusan Capaian Pembelajaran Mata Kuliah</p>
                </div>
                
                <div class="action-buttons">
                    <button id="btnSimpanBulk" class="btn-save-bulk" onclick="simpanSemuaPerubahan()" title="Simpan Semua Perubahan">
                        <i class="fas fa-save"></i> Simpan Perubahan
                    </button>

                    <button class="btn-action btn-download" onclick="exportKeExcel()">
                        <i class="fas fa-file-download"></i> Download Excel
                    </button>
                    
                    <input type="file" id="fileExcel" accept=".xlsx, .xls" style="display: none;" onchange="uploadExcel()">
                    <button class="btn-action btn-upload" onclick="document.getElementById('fileExcel').click()">
                        <i class="fas fa-file-upload"></i> Impor Excel
                    </button>
                </div>
            </div>
        </div>
        
        <div class="scrollable-content">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th width="15%">Kode CPMK</th>
                            <th>Deskripsi CPMK</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="2" style="text-align: center; padding: 40px;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <div id="pagination-container"></div>
        </div>
    </div>

<script src="../../../js/template.js"></script> 

<script>
    // --- 1. VARIABEL API & SESI ---
    const PRODI = localStorage.getItem("prodi_aktif") || "ti"; 
    const API_CPMK = `${API_BASE}/get-master-cpmk?prodi=${PRODI}`;
    const API_UPDATE = `${API_BASE}/admin-update-master`;
    const API_UPLOAD = `${API_BASE}/upload-master-cpmk`;

    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace("/login/login.html");
    
    // --- SETUP TAMPILAN DINAMIS (WARNA & NAMA PRODI) ---
    const pAktif = localStorage.getItem("prodi_aktif") || "ti";
    const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
    const warnaProdi = pAktif === 'si' ? '#1e3a8a' : '#8b0000'; 
    const warnaAvatar = pAktif === 'si' ? '1e3a8a' : '8b0000';
    
    document.getElementById("titleSpan").style.color = warnaProdi;
    const badge = document.getElementById("prodiBadge");
    badge.style.backgroundColor = warnaProdi;
    badge.innerText = pAktif === 'si' ? "SISTEM INFORMASI" : "TEKNIK INFORMATIKA";

    const avatarMobile = document.getElementById("mobileNavbarAvatar");
    if(avatarMobile) {
        avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=${warnaAvatar}&color=fff&bold=true`;
    }

    // --- 2. FUNGSI AMBIL DATA TABEL ---
    let allData = [];
    let state = { page: 1, itemsPerPage: 10 };
    
    // Objek Dictionary untuk melacak baris mana saja yang dimodifikasi oleh pengguna
    let dataBerubah = {};

    async function loadData() { 
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "<tr><td colspan='2' style='text-align:center; padding:40px;'><i class='fas fa-spinner fa-spin'></i> Memuat data...</td></tr>";
        dataBerubah = {}; // Reset tracking memory data setiap load ulang halaman

        try {
            const res = await fetch(API_CPMK); 
            allData = await res.json(); 
            
            if (!allData || allData.length === 0) {
                tbody.innerHTML = "<tr><td colspan='2' style='text-align:center; padding:40px; color:#64748b;'>Belum ada data CPMK. Silakan impor via Excel.</td></tr>";
                document.getElementById('pagination-container').innerHTML = '';
                return;
            }

            state.page = 1;
            renderTablePaginated();
        } catch(e) { 
            tbody.innerHTML = "<tr><td colspan='2' style='color:red; text-align:center; padding:40px;'>Gagal menarik data. Pastikan n8n menyala.</td></tr>";
        }
    }

    // --- 3. MENCATAT KETIKAN KE MEMORI ---
    function catatPerubahan(kodeCpmk, nilaiBaru) {
        dataBerubah[kodeCpmk] = nilaiBaru;
        
        // Perbarui array utama allData agar saat pindah pagination teks ketikan tidak kembali ke setingan awal
        const index = allData.findIndex(item => item.kode_cpmk === kodeCpmk);
        if(index !== -1) {
            allData[index].deskripsi = nilaiBaru;
        }
    }

    // --- 4. FUNGSI RENDER TABEL & PAGINATION ---
    function renderTablePaginated() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        
        const start = (state.page - 1) * state.itemsPerPage;
        const end = start + state.itemsPerPage;
        const paginatedItems = allData.slice(start, end);
        
        paginatedItems.forEach(cpmk => {
            const deskripsi = cpmk.deskripsi || cpmk.deskripsi_cpmk || ""; 
            
            let tr = document.createElement('tr');
            // Menghilangkan kolom aksi individual lama, menambahkan event oninput/onchange
            tr.innerHTML = `
                <td style="font-weight: 800; color: ${warnaProdi}; vertical-align: middle;">${cpmk.kode_cpmk}</td>
                <td>
                    <textarea 
                        id="in-${cpmk.kode_cpmk}" 
                        rows="3" 
                        style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; font-size: 0.95rem; resize: vertical; outline: none;"
                        oninput="catatPerubahan('${cpmk.kode_cpmk}', this.value)"
                    >${deskripsi}</textarea>
                </td>
            `;
            tbody.appendChild(tr);
        });

        renderPaginationControls();
    }

    function renderPaginationControls() {
        const container = document.getElementById('pagination-container');
        container.innerHTML = "";
        
        const totalPages = Math.ceil(allData.length / state.itemsPerPage);
        if (totalPages <= 1) return;

        const btnPrev = document.createElement('button');
        btnPrev.innerHTML = '<i class="fas fa-chevron-left"></i> Prev';
        btnPrev.disabled = state.page === 1;
        btnPrev.onclick = () => { if (state.page > 1) { state.page--; renderTablePaginated(); } };
        container.appendChild(btnPrev);

        const info = document.createElement('span');
        info.innerHTML = `Halaman <strong>${state.page}</strong> dari <strong>${totalPages}</strong>`;
        info.style.fontSize = "0.95rem";
        info.style.color = "#4b5563";
        container.appendChild(info);

        const btnNext = document.createElement('button');
        btnNext.innerHTML = 'Next <i class="fas fa-chevron-right"></i>';
        btnNext.disabled = state.page === totalPages;
        btnNext.onclick = () => { if (state.page < totalPages) { state.page++; renderTablePaginated(); } };
        container.appendChild(btnNext);
    }

    // --- 5. LOGIKA SIMPAN MASSAL (BULK SAVE) ---
    async function simpanSemuaPerubahan() { 
        const keys = Object.keys(dataBerubah);
        
        if(keys.length === 0) {
            alert("Belum ada perubahan deskripsi CPMK yang dilakukan.");
            return;
        }

        const btn = document.getElementById('btnSimpanBulk');
        const oldHtml = btn.innerHTML;
        
        btn.innerHTML = pAktif === 'si' || window.innerWidth > 768 
            ? '<i class="fas fa-spinner fa-spin"></i> Menyimpan...' 
            : '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;

        try {
            // Melakukan looping HTTP POST request hanya untuk item data yang mengalami perubahan saja
            for(const kode of keys) {
                await fetch(API_UPDATE, { 
                    method: "POST", 
                    headers: {"Content-Type":"application/json"}, 
                    body: JSON.stringify({ 
                        tipe: 'cpmk', 
                        kode: kode, 
                        value: dataBerubah[kode], 
                        prodi: PRODI 
                    }) 
                }); 
            }
            alert(`✅ Berhasil memperbarui ${keys.length} deskripsi CPMK!`);
            dataBerubah = {}; // Kosongkan state tracking memori setelah sukses menyimpan
        } catch (e) { 
            alert("❌ Terjadi kesalahan jaringan saat melakukan update ke server."); 
        } finally { 
            btn.innerHTML = oldHtml; 
            btn.disabled = false; 
        }
    }

    // --- 6. FUNGSI EXPORT / IMPORT EXCEL ---
    async function exportKeExcel() {
        const btn = document.querySelector('.btn-download');
        const oriText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyiapkan...';
        btn.disabled = true;

        try {
            if (!allData || allData.length === 0) return alert("Tidak ada data untuk diekspor.");

            const dataUntukExcel = allData.map(cpmk => ({ 
                'kode_cpmk': cpmk.kode_cpmk, 
                'deskripsi': cpmk.deskripsi || cpmk.deskripsi_cpmk || "", 
                'prodi': PRODI 
            }));
            
            const worksheet = XLSX.utils.json_to_sheet(dataUntukExcel);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Master_CPMK");
            XLSX.writeFile(workbook, `Master_CPMK_${PRODI}.xlsx`);
        } catch (e) { alert("Gagal mengekspor data."); } 
        finally { btn.innerHTML = oriText; btn.disabled = false; }
    }

    async function uploadExcel() {
        const fileInput = document.getElementById('fileExcel');
        const file = fileInput.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('data', file); 
        formData.append('prodi', PRODI);

        const btnUpload = document.querySelector('.btn-upload');
        const oriText = btnUpload.innerHTML;
        btnUpload.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengimpor...';
        btnUpload.disabled = true;

        try {
            const res = await fetch(API_UPLOAD, { method: 'POST', body: formData });
            if (res.ok) { alert("✅ Data Excel CPMK berhasil diimpor!"); await loadData(); } 
            else { alert("❌ Gagal memproses file Excel."); }
        } catch (e) { alert("❌ Terjadi kesalahan koneksi."); } 
        finally { btnUpload.innerHTML = oriText; btnUpload.disabled = false; fileInput.value = ''; }
    }

    // --- 7. FUNGSI SIDEBAR MOBILE ---
    function toggleSidebar() {
        document.getElementById('sidebar-container').classList.toggle('active');
        document.getElementById('mobileOverlay').classList.toggle('active');
    }

    window.onload = () => {
        setTimeout(loadData, 400); 
    };
</script>
</body>
</html>
