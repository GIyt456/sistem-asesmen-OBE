<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola CPMK - Sistem OBE</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --sidebar-bg: #161923; --sidebar-text: #7b8395; --sidebar-hover: #262936; --sidebar-active-text: #ffffff;
            --primary-blue: #1e3a8a; --primary-red: #8b0000; --bg-main: #f9fafb; --text-dark: #111827; --border-color: #e5e7eb;
            --success-green: #10b981; --danger-red: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark); animation: transitionIn 0.3s ease-in-out; }
        @keyframes transitionIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); }}    
        
        .main-content { flex: 1; min-width: 0; overflow-y: auto; padding: 40px 50px; }
        
        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .header-title-area { display: flex; flex-direction: column; }
        .header-subtitle { color: #64748b; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); }
        .header-title span { color: var(--primary-blue); }
        .badge-prodi { background: var(--primary-blue); color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; }
        
        .table-container { background: white; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; min-width: 700px; border-collapse: collapse; text-align: left; }
        th { background: #f8fafc; padding: 15px 20px; font-size: 0.85rem; font-weight: 700; color: #475569; border-bottom: 2px solid var(--border-color); text-transform: uppercase; }
        td { padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; color: #1e293b; vertical-align: middle; }
        
        .action-buttons { display: flex; gap: 10px; align-items: center; }
        .btn-action { color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-dark { background: #1e293b; }
        .btn-dark:hover { background: #0f172a; transform: translateY(-2px); }
        .btn-download { background: #475569; }
        .btn-download:hover { background: #334155; transform: translateY(-2px); }
        .btn-upload { background: var(--success-green); }
        .btn-upload:hover { background: #059669; transform: translateY(-2px); }
        
        /* PAGINATION STYLING */
        #pagination-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; padding-bottom: 40px; }
        #pagination-container button { padding: 8px 16px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; cursor: pointer; font-weight: 600; color: #475569; transition: 0.2s; }
        #pagination-container button:hover:not(:disabled) { background: #f1f5f9; color: var(--text-dark); }
        #pagination-container button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="header-container">
            <div class="header-title-area">
                <div class="header-subtitle">KELOLA KURIKULUM</div>
                <h1 class="header-title">CAPAIAN PEMBELAJARAN <span>MATA KULIAH (CPMK)</span></h1>
            </div>
            <div class="badge-prodi" id="prodiBadge">PRODI</div>
        </div>

        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div>
                    <h3 style="margin: 0; font-size: 1.4rem; font-weight: 800;">Daftar CPMK</h3>
                    <p style="margin: 4px 0 0 0; color: #64748b; font-size: 0.95rem; font-weight: 500;">Rumusan Capaian Pembelajaran Mata Kuliah</p>
                </div>
                
                <div class="action-buttons">
                    <button class="btn-action btn-download" onclick="exportKeExcel()">
                        <i class="fas fa-file-download"></i> Download Excel
                    </button>
                    
                    <input type="file" id="fileExcel" accept=".xlsx, .xls" style="display: none;" onchange="uploadExcel()">
                    <button class="btn-action btn-upload" onclick="document.getElementById('fileExcel').click()">
                        <i class="fas fa-file-upload"></i> Impor Excel
                    </button>
                </div>
            </div>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th width="15%">Kode CPMK</th>
                            <th>Deskripsi CPMK</th>
                            <th width="15%" style="text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="3" style="text-align: center; padding: 40px;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <div id="pagination-container"></div>
        </div>
    </div>

<script src="/js/template.js"></script>

<script>
    const PRODI = localStorage.getItem("prodi_aktif") || "ti"; 
    
    const API_BASE = "https://recommend-promised-nasa-robinson.trycloudflare.com/webhook"; 
    const API_CPMK = `${API_BASE}/get-master-cpmk?prodi=${PRODI}`;
    const API_UPDATE = `${API_BASE}/admin-update-master`;
    const API_UPLOAD = `${API_BASE}/upload-master-cpmk`;

    const userLogin = localStorage.getItem("user_login");
        if (!userLogin) window.location.replace("/login/login.html");
    
    let allData = [];
    let state = { page: 1, itemsPerPage: 10 }; // 10 Data per halaman

    // --- FUNGSI AMBIL DATA ---
    async function loadData() { 
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding:40px;'><i class='fas fa-spinner fa-spin'></i> Memuat data...</td></tr>";

        try {
            const res = await fetch(API_CPMK); 
            allData = await res.json(); 
            
            if (!allData || allData.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding:40px; color:#64748b;'>Belum ada data CPMK. Silakan impor via Excel.</td></tr>";
                document.getElementById('pagination-container').innerHTML = '';
                return;
            }

            state.page = 1;
            renderTablePaginated();
        } catch(e) { 
            tbody.innerHTML = "<tr><td colspan='3' style='color:red; text-align:center; padding:40px;'>Gagal menarik data. Pastikan n8n menyala.</td></tr>";
        }
    }

    // --- FUNGSI RENDER TABEL & PAGINATION ---
    function renderTablePaginated() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        
        const start = (state.page - 1) * state.itemsPerPage;
        const end = start + state.itemsPerPage;
        const paginatedItems = allData.slice(start, end);
        
        paginatedItems.forEach(cpmk => {
            const deskripsi = cpmk.deskripsi || cpmk.deskripsi_cpmk || ""; // Menghindari error jika kolom kosong
            
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 800; color: var(--primary-blue);">${cpmk.kode_cpmk}</td>
                <td>
                    <textarea id="in-${cpmk.kode_cpmk}" rows="3" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; font-size: 0.95rem; resize: vertical;">${deskripsi}</textarea>
                </td>
                <td style="text-align:center;">
                    <div style="display: flex; gap: 8px; justify-content: center;">
                        <button class="btn-action btn-dark" style="padding: 8px 12px;" onclick="simpanEdit('cpmk', '${cpmk.kode_cpmk}')" title="Simpan Perubahan">
                            <i class="fas fa-save"></i> Simpan
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });

        renderPaginationControls();
    }

    function renderPaginationControls() {
        const container = document.getElementById('pagination-container');
        container.innerHTML = "";
        
        const totalPages = Math.ceil(allData.length / state.itemsPerPage);
        if (totalPages <= 1) return;

        const btnPrev = document.createElement('button');
        btnPrev.innerHTML = '<i class="fas fa-chevron-left"></i> Prev';
        btnPrev.disabled = state.page === 1;
        btnPrev.onclick = () => { if (state.page > 1) { state.page--; renderTablePaginated(); } };
        container.appendChild(btnPrev);

        const info = document.createElement('span');
        info.innerHTML = `Halaman <strong>${state.page}</strong> dari <strong>${totalPages}</strong>`;
        info.style.fontSize = "0.95rem";
        info.style.color = "#4b5563";
        container.appendChild(info);

        const btnNext = document.createElement('button');
        btnNext.innerHTML = 'Next <i class="fas fa-chevron-right"></i>';
        btnNext.disabled = state.page === totalPages;
        btnNext.onclick = () => { if (state.page < totalPages) { state.page++; renderTablePaginated(); } };
        container.appendChild(btnNext);
    }

    // --- FUNGSI SIMPAN EDIT ---
    async function simpanEdit(tipe, kode) { 
        const value = document.getElementById(`in-${kode}`).value; 
        const btn = event.currentTarget;
        const oldHtml = btn.innerHTML;
        
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;

        try {
            const res = await fetch(API_UPDATE, { 
                method: "POST", 
                headers: {"Content-Type":"application/json"}, 
                body: JSON.stringify({ tipe: tipe, kode: kode, value: value, prodi: PRODI }) 
            }); 
            if(res.ok) alert("✅ Deskripsi CPMK berhasil diperbarui!");
            else alert("❌ Gagal menyimpan data ke server.");
        } catch (e) { alert("Terjadi kesalahan jaringan."); } 
        finally { btn.innerHTML = oldHtml; btn.disabled = false; }
    }

    // --- FUNGSI EXPORT / IMPORT EXCEL ---
    async function exportKeExcel() {
        const btn = document.querySelector('.btn-download');
        const oriText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyiapkan...';
        btn.disabled = true;

        try {
            if (!allData || allData.length === 0) return alert("Tidak ada data untuk diekspor.");

            const dataUntukExcel = allData.map(cpmk => ({ 
                'kode_cpmk': cpmk.kode_cpmk, 
                'deskripsi': cpmk.deskripsi || cpmk.deskripsi_cpmk || "", 
                'prodi': PRODI 
            }));
            
            const worksheet = XLSX.utils.json_to_sheet(dataUntukExcel);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Master_CPMK");
            XLSX.writeFile(workbook, `Master_CPMK_${PRODI}.xlsx`);
        } catch (e) { alert("Gagal mengekspor data."); } 
        finally { btn.innerHTML = oriText; btn.disabled = false; }
    }

    async function uploadExcel() {
        const fileInput = document.getElementById('fileExcel');
        const file = fileInput.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('data', file); 
        formData.append('prodi', PRODI);

        const btnUpload = document.querySelector('.btn-upload');
        const oriText = btnUpload.innerHTML;
        btnUpload.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengimpor...';
        btnUpload.disabled = true;

        try {
            const res = await fetch(API_UPLOAD, { method: 'POST', body: formData });
            if (res.ok) { alert("✅ Data Excel CPMK berhasil diimpor!"); await loadData(); } 
            else { alert("❌ Gagal memproses file Excel."); }
        } catch (e) { alert("❌ Terjadi kesalahan koneksi."); } 
        finally { btnUpload.innerHTML = oriText; btnUpload.disabled = false; fileInput.value = ''; }
    }

    window.onload = () => {
            setTimeout(loadData, 400); // Langsung eksekusi analisis saat web dibuka
        };
</script>
</body>
</html>
