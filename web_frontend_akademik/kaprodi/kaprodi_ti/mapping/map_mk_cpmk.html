<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapping MK - CPL - CPMK - Sistem OBE</title>
    
    <!-- MEMANGGIL FILE CSS STANDAR -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="../../../js/api_config.js"></script>
    
    <!-- Panggil CSS -->
    <link rel="stylesheet" href="mk_cpmk.css">
    <link rel="stylesheet" href="../../../css/global_ti.css">
</head>
<body>

    <div id="sidebar-container"></div>
    <div id="navbar-container"></div>

    <div class="main-content">
        <!-- SATUKAN SEMUA KE DALAM CONTENT-WRAPPER -->
        <div class="content-wrapper">

            <!-- TEMPLATE: Header -->
            <div class="header-container">
                <div class="header-left">
                    <div class="header-title-area">
                        <div class="header-subtitle">PEMETAAN (MAPPING)</div>
                        <h1 class="header-title">MAPPING <span>MK - CPMK</span></h1>
                    </div>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <!-- TEMPLATE: Filter Section -->
            <div class="filter-section">
                <label for="filterKurikulum">Tampilkan Data Kurikulum:</label>
                <select id="filterKurikulum" onchange="initDropdownAndCheckboxes()" class="filter-select">
                    <option value="">Memuat data...</option>
                </select>
            </div>

            <!-- TEMPLATE: Section Header -->
            <div class="section-header">
                <div class="section-title-area">
                    <h3 class="section-title">Relasi Pemetaan</h3>
                    <p class="section-subtitle">Pilih Mata Kuliah, lalu centang CPMK relevan yang dipelajari.</p>
                </div>
            </div>

            <!-- PANEL MAPPING KONTEN -->
            <div class="mapping-panel">
                <!-- 1. PILIH MATA KULIAH -->
                <div class="form-group" style="position: relative;">
                    <label for="searchMk"><i class="fas fa-search dynamic-icon" style="margin-right: 8px;"></i> Cari & Pilih Mata Kuliah</label>
                    
                    <div style="display: flex; align-items: center; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px 15px; background: #fff;">
                        <input type="text" id="searchMk" placeholder="Ketik Kode atau Nama MK... (Misal: Pendi)" oninput="handleSearchInput()" autocomplete="off" style="border: none; outline: none; width: 100%; font-family: 'Inter', sans-serif; font-size: 0.95rem;">
                    </div>
                    
                    <!-- Kotak Rekomendasi yang akan muncul saat mengetik -->
                    <div id="mkSuggestions" style="display: none; position: absolute; width: 100%; background: white; border: 1px solid #cbd5e1; border-top: none; border-radius: 0 0 6px 6px; max-height: 250px; overflow-y: auto; z-index: 1000; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);">
                    </div>
                    
                    <!-- Input tersembunyi untuk menyimpan Kode MK saat item diklik -->
                    <input type="hidden" id="selectedKodeMk" value="">
                </div>

                <!-- Tambahan sedikit CSS untuk efek hover pada hasil pencarian -->
                <style>
                    .suggestion-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f1f5f9; color: #1e293b; font-size: 0.95rem; transition: background 0.2s; }
                    .suggestion-item:hover { background-color: #f8fafc; color: var(--primary-blue); font-weight: 600; }
                </style>

                <hr style="border: 0; border-top: 2px dashed #cbd5e1; margin: 40px 0;">

                <!-- 2. DAFTAR CHECKBOX CPMK -->
                <div class="form-group">
                    <label><i class="fas fa-tasks dynamic-icon" style="margin-right: 8px;"></i> Centang CPMK yang Relevan</label>
                    <p style="font-size: 0.9rem; color: #64748b; font-weight: 500; margin-bottom: 20px; line-height: 1.5;">Pilih mata kuliah di atas terlebih dahulu untuk melihat dan menghubungkan CPMK.</p>
                    
                    <div id="cpmkContainer" class="cpmk-grid">
                        <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #9ca3af; font-weight: 600; border: 2px dashed #e2e8f0; border-radius: 12px; background: white;">
                            <i class="fas fa-spinner fa-spin fa-2x" style="margin-bottom: 15px; color: var(--primary-blue);"></i><br>
                            Memuat daftar CPMK...
                        </div>
                    </div>
                </div>

                <!-- 3. TOMBOL SIMPAN -->
                <button id="btnSave" class="btn-save-mapping" onclick="saveMapping()" disabled>
                    <i class="fas fa-save" style="font-size: 1.2rem;"></i> Simpan Pemetaan
                </button>
            </div>

        </div>
    </div>

<script src="../../../js/template.js"></script>

<script>
    const PRODI = localStorage.getItem("prodi_aktif") || "ti";
    const API_SAVE_MAPPING = `${API_BASE}/admin-map-mk-cpmk`;
    let listCPMK = [];
    let listMataKuliah = [];

    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace("/login/login.html");

    // SET TEMA WARNA SESUAI PRODI
    document.addEventListener("DOMContentLoaded", () => {
        const dynamicIcons = document.querySelectorAll('.dynamic-icon');
        if(PRODI === "ti") {
            document.documentElement.style.setProperty('--primary-blue', '#8b0000'); 
            document.getElementById('prodiBadge').innerText = "TEKNIK INFORMATIKA";
            dynamicIcons.forEach(icon => icon.style.color = '#8b0000');
        } else {
            document.documentElement.style.setProperty('--primary-blue', '#1e3a8a'); 
            document.getElementById('prodiBadge').innerText = "SISTEM INFORMASI";
            dynamicIcons.forEach(icon => icon.style.color = '#1e3a8a');
        }
    });

    // --- FUNGSI LOAD KURIKULUM ---
    async function loadDropdownKurikulum() {
        try {
            const response = await fetch(`${API_BASE}/get-kurikulum-tersedia`);
            const data = await response.json();
            const selectKurikulum = document.getElementById('filterKurikulum');
            selectKurikulum.innerHTML = ''; 
            data.forEach(item => {
                if (item && item.kurikulum) {
                    let opt = document.createElement('option');
                    opt.value = item.kurikulum; 
                    opt.text = "Kurikulum 20" + item.kurikulum; 
                    selectKurikulum.appendChild(opt);
                }
            });
            await initDropdownAndCheckboxes(); 
        } catch (error) {
            document.getElementById('filterKurikulum').innerHTML = '<option value="">Gagal memuat kurikulum</option>';
        }
    }

    // --- 1. INISIASI DATA DARI API ---
    async function initDropdownAndCheckboxes() {
        // Reset Area Pencarian saat kurikulum diganti
        document.getElementById('searchMk').value = '';
        document.getElementById('selectedKodeMk').value = '';
        document.getElementById('mkSuggestions').style.display = 'none';

        const cpmkContainer = document.getElementById('cpmkContainer');
        const btnSave = document.getElementById('btnSave');
        
        if (btnSave) btnSave.disabled = true;

        const selectKurikulum = document.getElementById('filterKurikulum');
        let kurikulum = selectKurikulum ? selectKurikulum.value : "";
        
        const timeStamp = new Date().getTime();
        let URL_MK = `${API_BASE}/get-susunan-matkul?prodi=${PRODI}&_t=${timeStamp}`;
        let URL_CPMK = `${API_BASE}/get-master-cpmk?prodi=${PRODI}&_t=${timeStamp}`;

        if(kurikulum) {
            URL_MK += `&kurikulum=${kurikulum}`;
            URL_CPMK += `&kurikulum=${kurikulum}`;
        }

        try {
            const [resMk, resCpmk] = await Promise.all([
                fetch(URL_MK, { cache: "no-store" }), fetch(URL_CPMK, { cache: "no-store" })
            ]);

            listMataKuliah = await resMk.json(); // Simpan array MK ke variabel global
            listCPMK = await resCpmk.json();

            // Render daftar CPMK (Sama seperti sebelumnya)
            if (cpmkContainer) {
                cpmkContainer.innerHTML = '';
                if (listCPMK.length > 0) {
                    const groupedCPMK = {};
                    listCPMK.forEach(cpmk => {
                        const cpl = cpmk.kode_cpl_ref || "Belum Terkoneksi CPL"; 
                        if (!groupedCPMK[cpl]) groupedCPMK[cpl] = [];
                        groupedCPMK[cpl].push(cpmk);
                    });

                    const sortedCPLs = Object.keys(groupedCPMK).sort((a, b) => {
                        const angkaA = parseInt(a.replace(/\D/g, ''), 10) || 0;
                        const angkaB = parseInt(b.replace(/\D/g, ''), 10) || 0;
                        if (angkaA === angkaB) return a.localeCompare(b);
                        return angkaA - angkaB;
                    });

                    sortedCPLs.forEach(cpl => {
                        cpmkContainer.innerHTML += `
                            <div class="cpl-divider">
                                <div class="cpl-divider-title">
                                    <i class="fas fa-link dynamic-icon"></i> CPL Induk: ${cpl}
                                </div>
                                <div class="cpl-divider-count">
                                    ${groupedCPMK[cpl].length} CPMK Terkait
                                </div>
                            </div>
                        `;

                        groupedCPMK[cpl].forEach(cpmk => {
                            cpmkContainer.innerHTML += `
                                <label class="cpmk-card">
                                    <input type="checkbox" class="cpmk-checkbox" value="${cpmk.kode_cpmk}" disabled>
                                    <div class="cpmk-info">
                                        <div class="cpmk-code">${cpmk.kode_cpmk}</div>
                                        <div class="cpmk-desc">${cpmk.deskripsi || '-'}</div>
                                    </div>
                                </label>
                            `;
                        });
                    });
                    
                    const dynamicIcons = document.querySelectorAll('.dynamic-icon');
                    const color = PRODI === 'si' ? '#1e3a8a' : '#8b0000';
                    dynamicIcons.forEach(icon => icon.style.color = color);

                } else { 
                    cpmkContainer.innerHTML = '<div style="color: red; grid-column: 1 / -1; text-align:center; padding:20px; font-weight:bold;">Master Data CPMK Kosong.</div>'; 
                }
            }

        } catch (error) {
            if (cpmkContainer) cpmkContainer.innerHTML = '<div style="color: red; grid-column: 1 / -1; text-align:center; padding:20px; font-weight:bold;">Gagal menarik data Master dari Server.</div>';
        } 
    }

    // --- 2. LOGIKA AUTOCOMPLETE SEARCH ---
    function handleSearchInput() {
        const keyword = document.getElementById('searchMk').value.toLowerCase().trim();
        const suggestionsContainer = document.getElementById('mkSuggestions');
        
        // Jika teks pencarian dihapus/dikosongkan
        if (keyword === "") {
            suggestionsContainer.style.display = 'none';
            document.getElementById('selectedKodeMk').value = '';
            
            // Matikan checkbox dan tombol simpan
            document.querySelectorAll('.cpmk-checkbox').forEach(cb => { cb.checked = false; cb.disabled = true; });
            document.getElementById('btnSave').disabled = true;
            return;
        }

        // Lakukan filter dari listMataKuliah berdasarkan Kode ATAU Nama
        const filteredData = listMataKuliah.filter(mk => {
            const kode = (mk.kode_mk || "").toLowerCase();
            const nama = (mk.nama_mk || "").toLowerCase();
            return kode.includes(keyword) || nama.includes(keyword);
        });

        // Tampilkan hasilnya ke kotak rekomendasi
        if (filteredData.length > 0) {
            let html = '';
            filteredData.forEach(mk => {
                html += `<div class="suggestion-item" onclick="selectMatkul('${mk.kode_mk}', '${mk.nama_mk.replace(/'/g, "\\'")}')">
                            <strong>${mk.kode_mk}</strong> - ${mk.nama_mk}
                         </div>`;
            });
            suggestionsContainer.innerHTML = html;
            suggestionsContainer.style.display = 'block';
        } else {
            suggestionsContainer.innerHTML = '<div style="padding: 10px 15px; color: #94a3b8; font-style: italic;">Mata kuliah tidak ditemukan...</div>';
            suggestionsContainer.style.display = 'block';
        }
    }

    // Fungsi ketika user mengklik salah satu hasil dari rekomendasi pencarian
    function selectMatkul(kodeMk, namaMk) {
        // Tampilkan tulisan di kotak pencarian, simpan kodenya ke hidden input
        document.getElementById('searchMk').value = `${kodeMk} - ${namaMk}`;
        document.getElementById('selectedKodeMk').value = kodeMk;
        
        // Sembunyikan kotak rekomendasi
        document.getElementById('mkSuggestions').style.display = 'none';
        
        // Lanjutkan menarik relasi data dari database
        fetchExistingMapping();
    }

    // Sensor pintar: Menutup kotak rekomendasi jika user klik di sembarang tempat
    document.addEventListener('click', function(e) {
        const searchInput = document.getElementById('searchMk');
        const suggestions = document.getElementById('mkSuggestions');
        if (searchInput && suggestions) {
            if (e.target !== searchInput && !suggestions.contains(e.target)) {
                suggestions.style.display = 'none';
            }
        }
    });

    // --- 3. MENYIMPAN & MENAMPILKAN MAPPING ---
    async function fetchExistingMapping() {
        // Mengubah referensi dari dropdown lama ke input hidden baru
        const kodeMk = document.getElementById('selectedKodeMk').value;
        const btnSave = document.getElementById('btnSave');
        const checkboxes = document.querySelectorAll('.cpmk-checkbox');

        if (!kodeMk) return;

        checkboxes.forEach(cb => { cb.checked = false; cb.disabled = false; });
        if (btnSave) btnSave.disabled = true;
        btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memuat relasi...';

        const selectKurikulum = document.getElementById('filterKurikulum');
        let kurikulum = selectKurikulum ? selectKurikulum.value : "";
        let URL_MAPPING = `${API_BASE}/get-mapping-mk?prodi=${PRODI}&mk=${kodeMk}`;
        if(kurikulum) URL_MAPPING += `&kurikulum=${kurikulum}`;

        try {
            const res = await fetch(URL_MAPPING, { cache: "no-store" });
            const relations = await res.json();
            
            let listRelasi = [];
            if (Array.isArray(relations)) listRelasi = relations;
            else if (relations && typeof relations === 'object') listRelasi = [relations];

            checkboxes.forEach(cb => {
                const apakahCocok = listRelasi.some(rel => {
                    const dbKodeCpmk = rel.kode_cpmk || rel.KODE_CPMK || rel.kodeCpmk;
                    if (!dbKodeCpmk) return false;
                    return cb.value.trim().toLowerCase() === dbKodeCpmk.toString().trim().toLowerCase();
                });
                if (apakahCocok) cb.checked = true;
            });

        } catch (error) {
            alert("Gagal memuat pemetaan yang sudah ada untuk MK ini.");
        } finally {
            if (btnSave) {
                btnSave.disabled = false; 
                btnSave.innerHTML = '<i class="fas fa-save" style="font-size: 1.2rem;"></i> Simpan Pemetaan';
            }
        }
    }

    async function saveMapping() {
        // Mengubah referensi dari dropdown lama ke input hidden baru
        const kodeMk = document.getElementById('selectedKodeMk').value;
        const btnSave = document.getElementById('btnSave');
        const textAwal = btnSave.innerHTML;
        
        if (!kodeMk) { alert("Silakan pilih Mata Kuliah terlebih dahulu!"); return; }

        const checkedBoxes = Array.from(document.querySelectorAll('.cpmk-checkbox:checked')).map(cb => cb.value);

        btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
        btnSave.disabled = true;

        const selectKurikulum = document.getElementById('filterKurikulum');
        let kurikulumTerpilih = selectKurikulum ? selectKurikulum.value : "25";

        try {
            const payload = { 
                kode_mk: kodeMk, 
                prodi: PRODI, 
                cpmk_list: checkedBoxes,
                kurikulum: kurikulumTerpilih
            };
            
            const res = await fetch(API_SAVE_MAPPING, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert("✅ Relasi MK & CPMK berhasil disimpan!");
            } else {
                alert("❌ Gagal menyimpan data di server.");
            }
        } catch (error) { 
            alert("Terjadi kesalahan jaringan."); 
        } finally { 
            btnSave.innerHTML = textAwal; 
            btnSave.disabled = false; 
        }
    }

    // 1. Fungsi Buka/Tutup dari Navbar 
    function toggleMobileSidebar() {
        const sidebar = document.getElementById('sidebar-container');
        if (sidebar) sidebar.classList.toggle('active');
    }

    // 2. Fungsi Buka/Tutup dari dalam Sidebar 
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar-container');
        if (sidebar) sidebar.classList.toggle('active');
    }

    // 3. SENSOR PENUTUP (Deteksi klik di layar gelap)
    document.addEventListener('click', function(event) {
        const sidebar = document.getElementById("sidebar-container");
        const hamburgerBtn = document.querySelector('.hamburger-btn') || document.querySelector('.mobile-menu-btn'); 
        
        if (sidebar && sidebar.classList.contains("active")) {
            if (!sidebar.contains(event.target) && (!hamburgerBtn || !hamburgerBtn.contains(event.target))) {
                sidebar.classList.remove("active"); 
            }
        }
    });

    window.onload = async () => { await loadDropdownKurikulum(); };
</script>
</body>
</html>
