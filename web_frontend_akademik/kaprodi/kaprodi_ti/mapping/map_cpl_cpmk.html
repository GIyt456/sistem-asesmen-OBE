<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapping CPL - CPMK - Sistem OBE</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --sidebar-bg: #161923; --sidebar-text: #7b8395; --sidebar-hover: #262936; --sidebar-active-text: #ffffff;
            --primary-red: #8b0000; --bg-main: #ffffff; --text-dark: #111827; --border-dark: #161923;
        }

        #sidebar-container { width: 280px; min-width: 280px; height: 100vh; background: var(--sidebar-bg); flex-shrink: 0; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { display: flex; background: #f9fafb; height: 100vh; overflow: hidden; color: var(--text-dark); animation: transitionIn 0.3s ease-in-out; }
        @keyframes transitionIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .main-content { flex: 1; overflow-y: auto; padding: 40px 60px; }
        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; border-bottom: 1px solid #e5e7eb; padding-bottom: 20px; }
        .header-subtitle { color: #9ca3af; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px; }
        .header-title span { color: var(--primary-red); }

        .mapping-panel { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 10px; font-size: 1.05rem; }
        .select-custom { width: 100%; padding: 14px 16px; border-radius: 8px; border: 1px solid #d1d5db; font-size: 1rem; font-weight: 500; outline: none; background: #f9fafb; cursor: pointer; }
        .select-custom:focus { border-color: var(--primary-red); }

        .cpmk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 15px; }
        .cpmk-card { border: 1px solid #e5e7eb; padding: 15px; border-radius: 8px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer; transition: 0.2s; background: white; }
        .cpmk-card:hover { border-color: var(--primary-red); background: #fff5f5; }
        .cpmk-card input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; margin-top: 2px; accent-color: var(--primary-red); }
        .cpmk-info { display: flex; flex-direction: column; }
        .cpmk-code { font-weight: 700; font-size: 0.95rem; color: var(--text-dark); }
        .cpmk-desc { font-size: 0.8rem; color: #6b7280; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .btn-save { background: var(--primary-red); color: white; border: none; padding: 14px 24px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; width: 100%; justify-content: center; margin-top: 30px; }
        .btn-save:hover { background: #6b0000; transform: translateY(-2px); }
        .btn-save:disabled { background: #d1d5db; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="header-container">
            <div>
                <div class="header-subtitle">PEMETAAN (MAPPING)</div>
                <h1 class="header-title">MAPPING <span>CPL - CPMK</span></h1>
            </div>
        </div>

        <div class="mapping-panel">
            <!-- 1. Pilih CPL -->
            <div class="form-group">
                <label for="selectCpl"><i class="fas fa-graduation-cap" style="color: var(--primary-red); margin-right: 8px;"></i> Pilih CPL Tujuan</label>
                <select id="selectCpl" class="select-custom" onchange="checkExistingMapping()">
                    <option value="">-- Memuat daftar CPL... --</option>
                </select>
            </div>

            <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 30px 0;">

            <!-- 2. Pilih CPMK (Grouped) -->
            <div class="form-group">
                <label><i class="fas fa-list-check" style="color: var(--primary-red); margin-right: 8px;"></i> CPMK yang Mendukung CPL Ini</label>
                <div id="cpmkContainer" class="cpmk-grid">
                    <p style="grid-column: 1 / -1; color: #9ca3af; font-style: italic;">Memuat daftar CPMK...</p>
                </div>
            </div>

            <!-- 3. Tombol Simpan -->
            <button id="btnSave" class="btn-save" onclick="saveMapping()" disabled>
                <i class="fas fa-save"></i> Simpan Relasi
            </button>
        </div>
    </div>

<script src="/js/template.js"></script>

<script>
    // ========================================================================
    // 1. DEKLARASI API (HARUS DI PALING ATAS)
    // ========================================================================
    const PRODI = localStorage.getItem("prodi_aktif") || "ti";
    
    // 👇👇 GANTI DENGAN LINK CLOUDFLARE TERBARU KAMU 👇👇
    const API_BASE = "https://eco-monkey-gentleman-pipeline.trycloudflare.com/webhook"; 
    const API_CPL = `${API_BASE}/get-master-cpl?prodi=${PRODI}`;
    const API_CPMK = `${API_BASE}/get-master-cpmk?prodi=${PRODI}`;
    const API_METADATA = `${API_BASE}/get-metadata`;
    const API_UPDATE = `${API_BASE}/admin-update-master`;

    // Penyimpanan data sementara
    let listCPMK = [];

    // ========================================================================
    // 2. AWAL MULA SAAT WEB DIBUKA
    // ========================================================================
    const userLogin = localStorage.getItem("user_login");
        if (!userLogin) window.location.replace("/login/login.html");

    window.onload = () => {
        setTimeout(initData, 400); 
    };

    // ========================================================================
    // 3. TARIK MASTER CPL & CPMK (Tanpa error gaib lagi)
    // ========================================================================
    async function initData() {
        const selectCpl = document.getElementById('selectCpl');
        const cpmkContainer = document.getElementById('cpmkContainer');
        const loadingIndicator = document.getElementById('loadingIndicator');
        
        if(loadingIndicator) loadingIndicator.style.display = 'block';

        try {
            const [resCpl, resCpmk] = await Promise.all([
                fetch(API_CPL),
                fetch(API_CPMK)
            ]);

            const dataCpl = await resCpl.json();
            listCPMK = await resCpmk.json();

            // Isi Dropdown CPL
            if (selectCpl) {
                selectCpl.innerHTML = '<option value="" disabled selected>-- Pilih CPL --</option>';
                if (dataCpl.length > 0) {
                    dataCpl.forEach(cpl => {
                        selectCpl.innerHTML += `<option value="${cpl.kode_cpl}">${cpl.kode_cpl} - ${cpl.deskripsi || 'Tanpa Deskripsi'}</option>`;
                    });
                } else {
                    selectCpl.innerHTML = '<option value="">Data CPL Kosong (Cek N8N)</option>';
                }
            }

            // Gambar Kotak Checkbox CPMK
            if (cpmkContainer) {
                cpmkContainer.innerHTML = '';
                if (listCPMK.length > 0) {
                    listCPMK.forEach(cpmk => {
                        // Simpan info "parent" (CPL asalnya) di atribut data-parent
                        const parentInfo = cpmk.kode_cpl_ref || cpmk.parent || cpmk.kode_cpl || '';
                        
                        cpmkContainer.innerHTML += `
                            <label class="cpmk-card">
                                <input type="checkbox" class="cpmk-checkbox" value="${cpmk.kode_cpmk}" data-parent="${parentInfo}" disabled>
                                <div>
                                    <div style="font-weight: 700; color: #1e293b;">${cpmk.kode_cpmk}</div>
                                    <div style="font-size: 0.85rem; color: #64748b; margin-top: 4px; line-height: 1.4;">${cpmk.deskripsi || '-'}</div>
                                </div>
                            </label>
                        `;
                    });
                } else {
                    cpmkContainer.innerHTML = '<div style="color: red; grid-column: 1 / -1;">Master Data CPMK Kosong.</div>';
                }
            }

        } catch (error) {
            console.error("Error Fetching Data:", error);
            if(selectCpl) selectCpl.innerHTML = '<option value="">Gagal terhubung ke API</option>';
            if(cpmkContainer) cpmkContainer.innerHTML = '<div style="color: red; grid-column: 1 / -1;">Gagal menarik data Master dari N8N. Pastikan Link Benar!</div>';
        } finally {
            if(loadingIndicator) loadingIndicator.style.display = 'none';
        }
    }

    // ========================================================================
    // 4. CEK RELASI SAAT DROPDOWN CPL DIPILIH
    // ========================================================================
    function checkExistingMapping() {
        const cplId = document.getElementById('selectCpl').value;
        const btnSave = document.getElementById('btnSave');
        const checkboxes = document.querySelectorAll('.cpmk-checkbox');

        if (!cplId) return;

        // Reset & aktifkan checkbox
        checkboxes.forEach(cb => {
            cb.checked = false;
            cb.disabled = false; 
            
            // Jurus Kebal-Badai: Cek apakah CPMK ini punya CPL yang sedang dipilih
            const parentCpmk = cb.getAttribute('data-parent');
            if (parentCpmk && parentCpmk.trim().toLowerCase() === cplId.trim().toLowerCase()) {
                cb.checked = true;
            }
        });

        if (btnSave) btnSave.disabled = false;
    }

    // ========================================================================
    // 5. SIMPAN RELASI SATU PER SATU KE N8N
    // ========================================================================
    async function saveMapping() {
        const cplId = document.getElementById('selectCpl').value;
        const btnSave = document.getElementById('btnSave');
        const selectedCpmk = Array.from(document.querySelectorAll('.cpmk-checkbox:checked')).map(cb => cb.value);

        if (!cplId) {
            alert("Silakan pilih CPL terlebih dahulu!");
            return;
        }

        btnSave.disabled = true;
        btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

        try {
            // Karena ini 1-to-N (1 CPMK dimiliki oleh 1 CPL), kita update satu per satu seperti kodemu sebelumnya
            let fetchPromises = [];
            for (const cpmkId of selectedCpmk) {
                const req = fetch(API_UPDATE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        tipe: 'mapping', 
                        kode: cpmkId, 
                        value: cplId 
                    })
                });
                fetchPromises.push(req);
            }
            
            await Promise.all(fetchPromises);
            alert("✅ Pemetaan CPL - CPMK Berhasil Disimpan!");
            
            // Refresh layar agar parent terbarunya langsung terbaca
            initData(); 
            
        } catch (e) { 
            alert("Terjadi kesalahan jaringan."); 
        } finally { 
            btnSave.disabled = false; 
            btnSave.innerHTML = '<i class="fas fa-save"></i> Simpan Pemetaan';
        }
    }
</script>
</body>
</html>
