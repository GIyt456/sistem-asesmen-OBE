<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapping CPL - CPMK - Sistem OBE</title>
    
    <!-- MEMANGGIL FILE CSS STANDAR -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="../../../js/api_config.js"></script>
    
    <!-- Panggil CSS -->
    <link rel="stylesheet" href="cpl_cpmk.css">
    <link rel="stylesheet" href="../../../css/global_ti.css">
</head>
<body>

    <div id="sidebar-container"></div>
    <div id="navbar-container"></div>

    <div class="main-content">
        <!-- SATUKAN SEMUA KE DALAM CONTENT-WRAPPER -->
        <div class="content-wrapper">

            <!-- TEMPLATE: Header -->
            <div class="header-container">
                <div class="header-left">
                    <div class="header-title-area">
                        <div class="header-subtitle">PEMETAAN (MAPPING)</div>
                        <h1 class="header-title">MAPPING <span>CPL - CPMK</span></h1>
                    </div>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <!-- TEMPLATE: Filter Section (Dipindah ke atas agar konsisten) -->
            <div class="filter-section">
                <label for="filterKurikulum">Tampilkan Data Kurikulum:</label>
                <select id="filterKurikulum" onchange="initData()" class="filter-select">
                    <option value="">Memuat data...</option>
                </select>
            </div>

            <!-- TEMPLATE: Section Header -->
            <div class="section-header">
                <div class="section-title-area">
                    <h3 class="section-title">Relasi Pemetaan</h3>
                    <p class="section-subtitle">Pilih CPL tujuan, lalu centang CPMK pendukungnya.</p>
                </div>
            </div>

            <!-- PANEL MAPPING KONTEN (TIDAK DIUBAH LOGIKANYA) -->
            <div class="mapping-panel">
                <!-- 1. Pilih CPL -->
                <div class="form-group">
                    <label for="selectCpl">
                        <i class="fas fa-graduation-cap dynamic-icon" style="margin-right: 8px;"></i> Pilih CPL Tujuan
                    </label>
                    <select id="selectCpl" class="select-custom" onchange="checkExistingMapping()">
                        <option value="">-- Memuat daftar CPL... --</option>
                    </select>
                </div>

                <hr style="border: 0; border-top: 2px dashed #cbd5e1; margin: 40px 0;">

                <!-- 2. Pilih CPMK -->
                <div class="form-group">
                    <label>
                        <i class="fas fa-list-check dynamic-icon" style="margin-right: 8px;"></i> CPMK yang Mendukung CPL Ini
                    </label>
                    <p style="font-size: 0.9rem; color: #64748b; font-weight: 500; margin-bottom: 20px; line-height: 1.5;">Pilih CPL di atas terlebih dahulu, kemudian centang kotak-kotak CPMK di bawah ini untuk menghubungkannya.</p>
                    
                    <div id="cpmkContainer" class="cpmk-grid">
                        <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #9ca3af; font-weight: 600; border: 2px dashed #e2e8f0; border-radius: 12px;">
                            <i class="fas fa-spinner fa-spin fa-2x" style="margin-bottom: 15px; color: var(--primary-blue);"></i><br>
                            Memuat daftar CPMK...
                        </div>
                    </div>
                </div>

                <!-- 3. Tombol Simpan -->
                <button id="btnSave" class="btn-save-mapping" onclick="saveMapping()" disabled>
                    <i class="fas fa-save" style="font-size: 1.2rem;"></i> Simpan Relasi Pemetaan
                </button>
            </div>
            
        </div>
    </div>

<script src="../../../js/template.js"></script>

<script>
    const PRODI = localStorage.getItem("prodi_aktif") || "ti"; 
    const API_UPDATE = `${API_BASE}/admin-update-master`;
    let listCPMK = [];

    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace("/login/login.html");

    // SET TEMA WARNA SESUAI PRODI
    document.addEventListener("DOMContentLoaded", () => {
        const dynamicIcons = document.querySelectorAll('.dynamic-icon');
        if(PRODI === "ti") {
            document.documentElement.style.setProperty('--primary-blue', '#8b0000'); 
            document.getElementById('prodiBadge').innerText = "TEKNIK INFORMATIKA";
            dynamicIcons.forEach(icon => icon.style.color = '#8b0000');
        } else {
            document.getElementById('prodiBadge').innerText = "SISTEM INFORMASI";
            dynamicIcons.forEach(icon => icon.style.color = '#1e3a8a');
        }
    });

    // --- FUNGSI LOAD KURIKULUM (Standar Tanpa "Semua Kurikulum") ---
    async function loadDropdownKurikulum() {
        try {
            const response = await fetch(`${API_BASE}/get-kurikulum-tersedia`);
            const data = await response.json();
            const selectKurikulum = document.getElementById('filterKurikulum');
            selectKurikulum.innerHTML = ''; 
            
            data.forEach(item => {
                if (item && item.kurikulum) {
                    let opt = document.createElement('option');
                    opt.value = item.kurikulum; 
                    opt.text = "Kurikulum 20" + item.kurikulum; 
                    selectKurikulum.appendChild(opt);
                }
            });
            await initData(); 
        } catch (error) {
            console.error("Gagal memuat list kurikulum:", error);
            document.getElementById('filterKurikulum').innerHTML = '<option value="">Gagal memuat kurikulum</option>';
        }
    }

    // --- LOGIKA MAPPING API ---
    async function initData() {
        const selectCpl = document.getElementById('selectCpl');
        const cpmkContainer = document.getElementById('cpmkContainer');
        const btnSave = document.getElementById('btnSave');
        
        // Reset Tombol
        if(btnSave) btnSave.disabled = true;

        const selectKurikulum = document.getElementById('filterKurikulum');
        let kurikulum = selectKurikulum ? selectKurikulum.value : "";
        let URL_CPL = `${API_BASE}/get-master-cpl?prodi=${PRODI}`;
        let URL_CPMK = `${API_BASE}/get-master-cpmk?prodi=${PRODI}`;

        if(kurikulum) {
            URL_CPL += `&kurikulum=${kurikulum}`;
            URL_CPMK += `&kurikulum=${kurikulum}`;
        }

        try {
            const [resCpl, resCpmk] = await Promise.all([
                fetch(URL_CPL), fetch(URL_CPMK)
            ]);

            const dataCpl = await resCpl.json();
            listCPMK = await resCpmk.json();

            if (selectCpl) {
                selectCpl.innerHTML = '<option value="" disabled selected>-- Silakan Pilih CPL yang Tersedia --</option>';
                if (dataCpl.length > 0) {
                    dataCpl.forEach(cpl => {
                        const desc = cpl.deskripsi || '';
                        const shortDesc = desc.length > 60 ? desc.substring(0, 60) + '...' : desc;
                        selectCpl.innerHTML += `<option value="${cpl.kode_cpl}">${cpl.kode_cpl} - ${shortDesc}</option>`;
                    });
                } else {
                    selectCpl.innerHTML = '<option value="">Data CPL Kosong.</option>';
                }
            }

            if (cpmkContainer) {
                cpmkContainer.innerHTML = '';
                if (listCPMK.length > 0) {
                    listCPMK.forEach(cpmk => {
                        const parentInfo = cpmk.kode_cpl_ref || cpmk.parent || cpmk.kode_cpl || '';
                        cpmkContainer.innerHTML += `
                            <label class="cpmk-card">
                                <input type="checkbox" class="cpmk-checkbox" value="${cpmk.kode_cpmk}" data-parent="${parentInfo}" disabled>
                                <div class="cpmk-info">
                                    <div class="cpmk-code">${cpmk.kode_cpmk}</div>
                                    <div class="cpmk-desc" title="${cpmk.deskripsi_cpmk || cpmk.deskripsi || ''}">${cpmk.deskripsi_cpmk || cpmk.deskripsi || 'Tidak ada deskripsi.'}</div>
                                </div>
                            </label>
                        `;
                    });
                } else {
                    cpmkContainer.innerHTML = '<div style="color: red; grid-column: 1 / -1; padding: 20px; font-weight:bold; text-align:center;">Data CPMK Kosong.</div>';
                }
            }

        } catch (error) {
            if(selectCpl) selectCpl.innerHTML = '<option value=""> --- belum ada mapping --- </option>';
            if(cpmkContainer) cpmkContainer.innerHTML = '<div style="color: red; grid-column: 1 / -1; padding:20px; text-align:center;">Tidak ada mapping</div>';
        } 
    }

    function checkExistingMapping() {
        const cplId = document.getElementById('selectCpl').value;
        const btnSave = document.getElementById('btnSave');
        const checkboxes = document.querySelectorAll('.cpmk-checkbox');

        if (!cplId) return;

        checkboxes.forEach(cb => {
            cb.checked = false;
            cb.disabled = false; 
            const parentCpmk = cb.getAttribute('data-parent');
            if (parentCpmk && parentCpmk.trim().toLowerCase() === cplId.trim().toLowerCase()) {
                cb.checked = true;
            }
        });

        if (btnSave) btnSave.disabled = false;
    }

    async function saveMapping() {
        const cplId = document.getElementById('selectCpl').value;
        const btnSave = document.getElementById('btnSave');
        const selectedCpmk = Array.from(document.querySelectorAll('.cpmk-checkbox:checked')).map(cb => cb.value);

        if (!cplId) { alert("Silakan pilih CPL terlebih dahulu!"); return; }

        btnSave.disabled = true;
        btnSave.innerHTML = '<i class="fas fa-spinner fa-spin fa-lg" style="margin-right: 10px;"></i> Sedang Menyimpan Relasi...';

        const selectKurikulum = document.getElementById('filterKurikulum');
        let kurikulumTerpilih = selectKurikulum ? selectKurikulum.value : "25";

        try {
            let fetchPromises = [];
            for (const cpmkId of selectedCpmk) {
                const payload = { 
                    tipe: 'mapping', 
                    kode: cpmkId, 
                    value: cplId, 
                    prodi: PRODI,
                    kurikulum: kurikulumTerpilih 
                };
                
                const req = fetch(API_UPDATE, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                fetchPromises.push(req);
            }
            
            await Promise.all(fetchPromises);
            alert("✅ Pemetaan CPL - CPMK Berhasil Disimpan!");
            initData(); 
            
        } catch (e) { alert("❌ Terjadi kesalahan jaringan. Gagal menyimpan."); } 
        finally { 
            btnSave.disabled = false; 
            btnSave.innerHTML = '<i class="fas fa-save" style="font-size: 1.2rem;"></i> Simpan Relasi Pemetaan';
        }
    }

    // 1. Fungsi Buka/Tutup dari Navbar 
    function toggleMobileSidebar() {
        const sidebar = document.getElementById('sidebar-container');
        if (sidebar) sidebar.classList.toggle('active');
    }

    // 2. Fungsi Buka/Tutup dari dalam Sidebar 
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar-container');
        if (sidebar) sidebar.classList.toggle('active');
    }

    // 3. SENSOR PENUTUP (Deteksi klik di layar gelap)
    document.addEventListener('click', function(event) {
        const sidebar = document.getElementById("sidebar-container");
        const hamburgerBtn = document.querySelector('.hamburger-btn') || document.querySelector('.mobile-menu-btn'); 
        
        if (sidebar && sidebar.classList.contains("active")) {
            if (!sidebar.contains(event.target) && (!hamburgerBtn || !hamburgerBtn.contains(event.target))) {
                sidebar.classList.remove("active"); 
            }
        }
    });

    window.onload = async () => { await loadDropdownKurikulum(); };
</script>
</body>
</html>
