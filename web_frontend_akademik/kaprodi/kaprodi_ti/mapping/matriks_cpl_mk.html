<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriks CPL vs MK - Sistem OBE</title>
    
    <!-- MEMANGGIL FILE CSS STANDAR -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="../../../js/api_config.js"></script>
    
    <!-- Panggil CSS -->
    <link rel="stylesheet" href="cpl_mk.css">
    <link rel="stylesheet" href="../../../css/global_ti.css">
</head>
<body>

    <div id="sidebar-container"></div>
    <div id="navbar-container"></div>

    <div class="main-content">
        <!-- SATUKAN SEMUA KE DALAM CONTENT-WRAPPER -->
        <div class="content-wrapper">

            <!-- TEMPLATE: Header -->
            <div class="header-container">
                <div class="header-left">
                    <div class="header-title-area">
                        <div class="header-subtitle">MATRIKS KURIKULUM</div>
                        <h1 class="header-title">PEMETAAN <span>CPL - MK</span></h1>
                    </div>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <!-- TEMPLATE: Filter Section -->
            <div class="filter-section">
                <label for="filterKurikulum">Tampilkan Data Kurikulum:</label>
                <select id="filterKurikulum" onchange="loadDataMatriks()" class="filter-select">
                    <option value="">Memuat data...</option>
                </select>
            </div>

            <!-- TEMPLATE: Section Header -->
            <div class="section-header">
                <div class="section-title-area">
                    <h3 class="section-title">Relasi Matriks</h3>
                    <p class="section-subtitle">Tabel sebaran Capaian Pembelajaran Lulusan (CPL) pada setiap Mata Kuliah.</p>
                </div>
                <div class="action-buttons">
                    <!-- Tombol Simpan Matriks -->
                    <button id="btnSaveMatriks" class="btn-action btn-dark" onclick="simpanMatriks()">
                        <i class="fas fa-save"></i> <span class="btn-text">Simpan Matriks</span>
                    </button>
                </div>
            </div>

            <!-- Area Tabel Matriks (Logika CSS dibiarkan utuh) -->
            <div class="tabel-matriks-cpl-mk-wrapper" id="areaTabel">
                <p style="padding: 50px; text-align: center; color: #6b7280; font-weight: 600;">
                    <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 15px; color: var(--primary-blue);"></i><br>
                    Memuat Matriks Kurikulum dari Database...
                </p>
            </div>

        </div>
    </div>

<script src="../../../js/template.js"></script>

<script>
    const PRODI = localStorage.getItem("prodi_aktif") || "ti"; 
    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace("/login/login.html");
    
    // SET TEMA WARNA SESUAI PRODI
    document.addEventListener("DOMContentLoaded", () => {
        if(PRODI === "ti") {
            document.documentElement.style.setProperty('--primary-blue', '#8b0000'); 
            document.getElementById('prodiBadge').innerText = "TEKNIK INFORMATIKA";
        } else {
            document.documentElement.style.setProperty('--primary-blue', '#1e3a8a'); 
            document.getElementById('prodiBadge').innerText = "SISTEM INFORMASI";
        }
    });

    // --- FUNGSI LOAD KURIKULUM (Standar Tanpa "Semua Kurikulum") ---
    async function loadDropdownKurikulum() {
        try {
            const response = await fetch(`${API_BASE}/get-kurikulum-tersedia`);
            const data = await response.json();
            const selectKurikulum = document.getElementById('filterKurikulum');
            selectKurikulum.innerHTML = ''; 
            
            data.forEach(item => {
                if (item && item.kurikulum) {
                    let opt = document.createElement('option');
                    opt.value = item.kurikulum; 
                    opt.text = "Kurikulum 20" + item.kurikulum; 
                    selectKurikulum.appendChild(opt);
                }
            });
            await loadDataMatriks(); 
        } catch (error) {
            console.error("Gagal memuat list kurikulum:", error);
            document.getElementById('filterKurikulum').innerHTML = '<option value="">Gagal memuat kurikulum</option>';
        }
    }

    // --- LOGIKA TABEL MATRIKS ---
    async function loadDataMatriks() {
        const areaTabel = document.getElementById('areaTabel');
        areaTabel.innerHTML = `<p style="padding: 50px; text-align: center; color: #6b7280; font-weight: 600;"><i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 15px; color: var(--primary-blue);"></i><br>Memuat Matriks Kurikulum dari Database...</p>`;

        const selectKurikulum = document.getElementById('filterKurikulum');
        let kurikulum = selectKurikulum ? selectKurikulum.value : "";
        let URL_META = `${API_BASE}/get-metadata?prodi=${PRODI}`;
        let URL_MATRIKS = `${API_BASE}/get-matkul-cpl?prodi=${PRODI}`;

        if(kurikulum) {
            URL_META += `&kurikulum=${kurikulum}`;
            URL_MATRIKS += `&kurikulum=${kurikulum}`;
        }

        try {
            const [resMetadata, resMatriks] = await Promise.all([
                fetch(URL_META), fetch(URL_MATRIKS)
            ]);

            const dataMetadata = await resMetadata.json();
            let dataMatriks = [];
            try { dataMatriks = await resMatriks.json(); } catch (e) { dataMatriks = []; }

            const daftarCPL = dataMetadata.filter(item => item.tipe === 'cpl').sort((a, b) => a.kode.localeCompare(b.kode));

            if(daftarCPL.length === 0) {
                areaTabel.innerHTML = '<p style="padding: 40px; text-align: center; color: red; font-weight: bold;">Data Master CPL kosong. Silakan isi CPL terlebih dahulu.</p>';
                return;
            }

            renderTabel(daftarCPL, dataMatriks);

        } catch (error) {
            areaTabel.innerHTML = `<p style="padding: 40px; text-align: center; color: red; font-weight: bold;">❌ Gagal terhubung ke Server. Periksa koneksi.</p>`;
        }
    }

    function renderTabel(daftarCPL, dataMatriks) {
        const container = document.getElementById('areaTabel');
        
        let html = `
            <table class="tabel-matriks-cpl-mk">
                <thead>
                    <tr>
                        <th rowspan="2" class="sticky-col-1">Smt</th>
                        <th rowspan="2" class="sticky-col-2">Kode MK</th>
                        <th rowspan="2" style="min-width: 250px; text-align: left;">Nama Mata Kuliah</th>
                        <th rowspan="2" style="min-width: 60px;">SKS</th>
                        <th colspan="${daftarCPL.length}" style="letter-spacing: 1px;">CAPAIAN PEMBELAJARAN LULUSAN (CPL)</th>
                    </tr>
                    <tr>
        `;
        
        daftarCPL.forEach(cpl => {
            let labelSingkat = cpl.kode.replace('SI-CPL', '').replace('TI-CPL', '').replace('CPL', '');
            if(labelSingkat.startsWith('-') || labelSingkat.startsWith('0')) labelSingkat = labelSingkat.substring(1); 
            if(labelSingkat === '') labelSingkat = cpl.kode;
            html += `<th title="${cpl.label || cpl.nama || cpl.deskripsi || ''}">${labelSingkat}</th>`;
        });
        html += `</tr></thead><tbody id="bodyMatriksMk">`;

        if (dataMatriks.length === 0) {
            html += `<tr><td colspan="${4 + daftarCPL.length}" style="padding: 30px; text-align: center; color: #64748b;">Belum ada relasi Matriks untuk kurikulum ini.</td></tr>`;
        } else {
            dataMatriks.forEach(row => {
                const cplTerkait = row.cpl_terhubung ? row.cpl_terhubung.split(', ') : []; 
                html += `
                    <tr>
                        <td class="sticky-col-1">${row.semester || '-'}</td>
                        <td class="sticky-col-2">${row.kode_mk}</td>
                        <td style="text-align: left; font-weight: 600;">${row.nama_mk}</td>
                        <td>${row.sks}</td>
                `;
                
                // --- GANTI BAGIAN INI DI DALAM FUNGSI renderTabel ---
                daftarCPL.forEach(cpl => {
                    const isChecked = cplTerkait.includes(cpl.kode);
                    const chk = isChecked ? 'checked' : '';
                    
                    // 🔴 PERUBAHAN: Hanya mengambil kode CPL saja (Misal: TI-CPL01) tanpa deskripsi panjang
                    let safeLabel = cpl.kode; 
                    
                    html += `<td class="td-cpl" data-label="${safeLabel}" style="text-align: center;">
                                <input type="checkbox" class="chk-matrix-mk" data-mk="${row.kode_mk}" data-cpl="${cpl.kode}" ${chk} style="cursor: pointer; transform: scale(1.2);">
                             </td>`;
                });
                html += `</tr>`;
            });
        }
        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    async function simpanMatriks() {
        const btnSave = document.getElementById('btnSaveMatriks');
        const textAwal = btnSave.innerHTML; // Simpan teks HTML awal
        
        // Memakai struktur <span> agar konsisten dengan template mobile
        btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span class="btn-text">Menyimpan...</span>';
        btnSave.disabled = true;

        const checkedBoxes = document.querySelectorAll('.chk-matrix-mk:checked');
        const mappingData = [];
        
        checkedBoxes.forEach(cb => {
            mappingData.push({ kode_mk: cb.getAttribute('data-mk'), kode_cpl: cb.getAttribute('data-cpl') });
        });

        const selectKurikulum = document.getElementById('filterKurikulum');
        let kurikulumTerpilih = selectKurikulum ? selectKurikulum.value : "25";

        const payload = { 
            prodi: PRODI, 
            mapping: mappingData,
            kurikulum: kurikulumTerpilih
        };

        try {
            const response = await fetch(`${API_BASE}/admin-map-cpl-mk`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            });
            if (response.ok) alert("✅ Matriks Relasi CPL - MK berhasil disimpan!");
            else throw new Error("Respon server tidak ok");
        } catch (error) { alert("❌ Gagal menyimpan data ke server."); } 
        finally { 
            btnSave.innerHTML = textAwal; 
            btnSave.disabled = false; 
        }
    }

    // 1. Fungsi Buka/Tutup dari Navbar 
    function toggleMobileSidebar() {
        const sidebar = document.getElementById('sidebar-container');
        if (sidebar) sidebar.classList.toggle('active');
    }

    // 2. Fungsi Buka/Tutup dari dalam Sidebar 
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar-container');
        if (sidebar) sidebar.classList.toggle('active');
    }

    // 3. SENSOR PENUTUP (Deteksi klik di layar gelap)
    document.addEventListener('click', function(event) {
        const sidebar = document.getElementById("sidebar-container");
        const hamburgerBtn = document.querySelector('.hamburger-btn') || document.querySelector('.mobile-menu-btn'); 
        
        if (sidebar && sidebar.classList.contains("active")) {
            if (!sidebar.contains(event.target) && (!hamburgerBtn || !hamburgerBtn.contains(event.target))) {
                sidebar.classList.remove("active"); 
            }
        }
    });

    window.onload = async () => { await loadDropdownKurikulum(); };
</script>
</body>
</html>
