<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemetaan BK - MK - Sistem OBE</title>
    
    <!-- MEMANGGIL FILE CSS STANDAR -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="../../../js/api_config.js"></script>
    
    <!-- Panggil CSS Spesifik -->
    <link rel="stylesheet" href="pemetaan_bk_mk.css">
    <link rel="stylesheet" href="../../../css/global_ti.css">
</head>
<body>

    <div id="sidebar-container"></div>
    <div id="navbar-container"></div>

    <div class="main-content">
        <!-- SATUKAN SEMUA KE DALAM CONTENT-WRAPPER -->
        <div class="content-wrapper">

            <!-- TEMPLATE: Header -->
            <div class="header-container">
                <div class="header-left">
                    <div class="header-title-area">
                        <div class="header-subtitle">PEMETAAN (MAPPING)</div>
                        <h1 class="header-title">MATRIKS <span>BK - MK</span></h1>
                    </div>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <!-- TEMPLATE: Filter Section -->
            <div class="filter-section">
                <label for="filterKurikulum">Tampilkan Data Kurikulum:</label>
                <select id="filterKurikulum" onchange="loadData()" class="filter-select">
                    <option value="">Memuat data...</option>
                </select>
            </div>

            <!-- TEMPLATE: Section Header -->
            <div class="section-header">
                <div class="section-title-area">
                    <h3 class="section-title">Relasi Matriks</h3>
                    <p class="section-subtitle">Centang Mata Kuliah (MK) yang berelasi dengan Bahan Kajian (BK).</p>
                </div>
                <div class="action-buttons">
                    <button class="btn-action btn-dark" onclick="loadData()">
                        <i class="fas fa-sync-alt"></i> <span class="btn-text">Refresh</span>
                    </button>
                    <button id="btnSave" class="btn-action btn-add" onclick="simpanMapping()" disabled>
                        <i class="fas fa-save"></i> <span class="btn-text">Simpan Matriks</span>
                    </button>
                </div>
            </div>

            <!-- Area Tabel Matriks Asli -->
            <div class="table-responsive-wrapper">
                <table id="matriksTable">
                    <thead>
                        <tr id="headerRow">
                            <th style="min-width: 120px; white-space: nowrap; text-align: left; position: sticky; left: 0; background: #e2e8f0; z-index: 10;">MATA KULIAH (MK) \ BAHAN KAJIAN (BK)</th>
                        </tr>
                    </thead>
                    <tbody id="bodyMatriks">
                        <tr><td style="text-align: center; padding: 30px !important;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Tombol Simpan Cadangan di Bawah -->
            <button id="btnSaveBottom" class="btn-save-matriks" onclick="simpanMapping()" disabled style="margin-top: 25px;">
                <i class="fas fa-save"></i> Simpan Matriks BK - MK
            </button>

        </div>
    </div>

<script src="../../../js/template.js"></script>

<script>
    const PRODI = localStorage.getItem("prodi_aktif") || "si"; 
    
    document.addEventListener("DOMContentLoaded", () => {
        if(PRODI === "ti") {
            document.documentElement.style.setProperty('--primary-blue', '#8b0000'); 
            document.getElementById('prodiBadge').innerText = "TEKNIK INFORMATIKA";
        } else {
            document.getElementById('prodiBadge').innerText = "SISTEM INFORMASI";
        }
    });

    const API_SAVE_MAPPING = `${API_BASE}/admin-map-bk-mk`;
    const userLoginCheck = localStorage.getItem("user_login");
    if (!userLoginCheck) window.location.replace("/login/login.html");

    let listBK = [];
    let listMK = [];

    async function loadDropdownKurikulum() {
        try {
            const response = await fetch(`${API_BASE}/get-kurikulum-tersedia`);
            const data = await response.json();
            const selectKurikulum = document.getElementById('filterKurikulum');
            selectKurikulum.innerHTML = ''; 
            data.forEach(item => {
                let opt = document.createElement('option');
                opt.value = item.kurikulum; 
                opt.text = "Kurikulum 20" + item.kurikulum; 
                selectKurikulum.appendChild(opt);
            });
            await loadData(); 
        } catch (error) {
            console.error("Gagal memuat list kurikulum:", error);
            document.getElementById('filterKurikulum').innerHTML = '<option value="">Gagal memuat kurikulum</option>';
        }
    }

    async function loadData() {
        const btnSave = document.getElementById("btnSave");
        const btnSaveBottom = document.getElementById("btnSaveBottom");
        const tbody = document.getElementById("bodyMatriks");
        
        if(btnSave) btnSave.disabled = true;
        if(btnSaveBottom) btnSaveBottom.disabled = true;
        
        tbody.innerHTML = "<tr><td colspan='100%' style='text-align: center; padding: 30px !important;'><i class='fas fa-spinner fa-spin'></i> Memuat data matriks...</td></tr>";

        const selectKurikulum = document.getElementById('filterKurikulum');
        let kurikulum = selectKurikulum ? selectKurikulum.value : "";
        
        // 🔴 SUNTIKAN ANTI-CACHE
        const timeStamp = new Date().getTime();
        let URL_BK = `${API_BASE}/get-master-bk?prodi=${PRODI}&_t=${timeStamp}`;
        let URL_MK = `${API_BASE}/get-susunan-matkul?prodi=${PRODI}&_t=${timeStamp}`;
        let URL_RELASI = `${API_BASE}/get-mapping-bk-mk?prodi=${PRODI}&_t=${timeStamp}`;

        if(kurikulum) {
            URL_BK += `&kurikulum=${kurikulum}`;
            URL_MK += `&kurikulum=${kurikulum}`;
            URL_RELASI += `&kurikulum=${kurikulum}`;
        }

        try {
            const [resBk, resMk, resRelasi] = await Promise.all([
                fetch(URL_BK, { cache: "no-store" }), 
                fetch(URL_MK, { cache: "no-store" }), 
                fetch(URL_RELASI, { cache: "no-store" })
            ]);

            listBK = await resBk.json();
            listMK = await resMk.json();

            let relasiExisting = [];
            try {
                relasiExisting = await resRelasi.json();
                if (!Array.isArray(relasiExisting)) relasiExisting = [];
            } catch (e) { relasiExisting = []; }

            if (!listBK || listBK.length === 0 || !listMK || listMK.length === 0) {
                tbody.innerHTML = "<tr><td colspan='100%' style='padding: 30px !important; color: red; font-weight: bold;'>Data BK atau MK masih KOSONG untuk kurikulum ini!</td></tr>";
                return;
            }

            renderMatriks(relasiExisting);
            if(btnSave) btnSave.disabled = false;
            if(btnSaveBottom) btnSaveBottom.disabled = false;

        } catch (error) {
            console.error(error);
            tbody.innerHTML = "<tr><td colspan='100%' style='padding: 30px !important; color: red;'>Gagal terhubung ke API.</td></tr>";
        }
    }

    function renderMatriks(relasiExisting) {
        const headerRow = document.getElementById("headerRow");
        const tbody = document.getElementById("bodyMatriks");
        if(!headerRow || !tbody) return;

        headerRow.innerHTML = `<th style="min-width: 250px; white-space: nowrap; text-align: left; position: sticky; left: 0; background: #e2e8f0; z-index: 10;">MATA KULIAH (MK) \\ BAHAN KAJIAN (BK)</th>`;
        listBK.forEach(bk => { headerRow.innerHTML += `<th title="${bk.nama_bk || ''}">${bk.kode_bk}</th>`; });

        tbody.innerHTML = "";
        listMK.forEach(mk => {
            let tr = `<tr>
                <td style="position: sticky; left: 0; background: #f8fafc; z-index: 5; font-weight: 600; color: var(--text-dark);" title="Kode: ${mk.kode_mk}">
                    <div class="mk-kode-badge" style="color: #64748b; font-size: 0.75rem; margin-bottom: 4px; font-weight: 800;">${mk.kode_mk}</div>
                    ${mk.nama_mk || mk.nama_mata_kuliah || mk.kode_mk}
                </td>`;
            
            listBK.forEach(bk => {
                const isChecked = relasiExisting.some(r => r.kode_bk === bk.kode_bk && r.kode_mk === mk.kode_mk);
                const chk = isChecked ? 'checked' : '';
                const namaBKLengkap = bk.nama_bk || '';
                
                tr += `<td>
                           <label class="cell-wrapper">
                               <span class="bk-label-mobile">${bk.kode_bk} - ${namaBKLengkap}</span>
                               <input type="checkbox" class="chk-matrix" data-bk="${bk.kode_bk}" data-mk="${mk.kode_mk}" ${chk}>
                           </label>
                       </td>`;
            });
            tr += `</tr>`;
            tbody.innerHTML += tr;
        });
    }

    async function simpanMapping() {
        const btnSave = document.getElementById('btnSave');
        const btnSaveBottom = document.getElementById('btnSaveBottom');
        
        if(btnSave) { btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...'; btnSave.disabled = true; }
        if(btnSaveBottom) { btnSaveBottom.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...'; btnSaveBottom.disabled = true; }

        const selectKurikulum = document.getElementById('filterKurikulum');
        let kurikulumTerpilih = selectKurikulum ? selectKurikulum.value : "25"; 
        
        let fetchPromises = [];

        listBK.forEach(bk => {
            const checkedBoxes = document.querySelectorAll(`.chk-matrix[data-bk="${bk.kode_bk}"]:checked`);
            const mkList = Array.from(checkedBoxes).map(cb => cb.getAttribute('data-mk'));
            
            const payload = { 
                kode_bk: bk.kode_bk, 
                mk_list: mkList, 
                prodi: PRODI,
                kurikulum: kurikulumTerpilih
            };

            const request = fetch(API_SAVE_MAPPING, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            });
            fetchPromises.push(request);
        });

        try {
            await Promise.all(fetchPromises);
            alert("✅ Matriks Relasi BK - MK berhasil disimpan!");
            
            // 🔴 AUTO-RELOAD UNTUK MENCEGAH BUG DATA HILANG SETELAH REFRESH
            setTimeout(() => {
                loadData();
            }, 1000);
            
        } catch (error) { 
            alert("❌ Gagal menyimpan beberapa data ke server."); 
        } finally { 
            if(btnSave) { btnSave.innerHTML = '<i class="fas fa-save"></i> <span class="btn-text">Simpan Matriks</span>'; btnSave.disabled = false; }
            if(btnSaveBottom) { btnSaveBottom.innerHTML = '<i class="fas fa-save"></i> Simpan Matriks BK - MK'; btnSaveBottom.disabled = false; }
        }
    }

    // --- FUNGSI SIDEBAR ANTI-BOCOR ---
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar-container');
        if (sidebar) sidebar.classList.toggle('active');
    }
    
    document.addEventListener('click', function(event) {
        const sidebar = document.getElementById("sidebar-container");
        const hamburgerBtn = document.querySelector('.hamburger-btn') || document.querySelector('.mobile-menu-btn'); 
        
        if (sidebar && sidebar.classList.contains("active")) {
            if (!sidebar.contains(event.target) && (!hamburgerBtn || !hamburgerBtn.contains(event.target))) {
                sidebar.classList.remove("active"); 
            }
        }
    });

    window.onload = async () => { await loadDropdownKurikulum(); };
</script>
</body>
</html>
