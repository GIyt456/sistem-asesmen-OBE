<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemetaan CPL - Profil Lulusan - Sistem OBE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --sidebar-bg: #161923; --sidebar-text: #7b8395; --sidebar-hover: #262936; --sidebar-active-text: #ffffff;
            --primary-blue: #1e3a8a; --primary-red: #8b0000; --bg-main: #f9fafb; --text-dark: #111827; --border-color: #e5e7eb;
        }

        /* --- GAYA SIDEBAR --- */
        .sidebar { width: 280px; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; padding: 24px 16px; height: 100vh; flex-shrink: 0;}
        .sidebar-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; padding: 0 10px; }
        .sidebar-profile img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .sidebar-profile-info { display: flex; flex-direction: column; }
        .sidebar-profile-info .name { color: white; font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
        .sidebar-profile-info .role { color: var(--sidebar-text); font-size: 9px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
        .sidebar-divider { height: 1px; background-color: rgba(255, 255, 255, 0.08); margin: 5px 10px 10px 10px; }
        .nav-menu { flex: 1; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
        .nav-menu::-webkit-scrollbar { display: none; }
        .menu-category { font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; color: var(--sidebar-text); text-transform: uppercase; margin: 10px 0 10px 10px; }
        .nav-item { padding: 12px 16px; margin-bottom: 4px; cursor: pointer; display: flex; align-items: center; gap: 16px; transition: all 0.2s; border-radius: 8px; font-weight: 500; font-size: 0.80rem; }
        .nav-item:hover, .nav-item.active { background: var(--sidebar-hover); color: var(--sidebar-active-text); }
        .nav-item i { font-size: 1.1rem; width: 20px; text-align: center; }
        .nav-bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; }
        .nav-item.logout { color: #f87171; }
        .nav-item.logout:hover { background: rgba(248, 113, 113, 0.1); }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark); animation: transitionIn 0.3s ease-in-out; }
        @keyframes transitionIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .main-content { flex: 1; overflow-y: auto; padding: 40px 50px; }
        .header-container { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); }
        .header-title span { color: var(--primary-blue); }

        .btn-save { background: var(--primary-blue); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-save:hover { background: #172554; transform: translateY(-2px); }

        /* Matriks Styling */
        .matrix-container { background: white; border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: auto; max-height: 70vh; }
        table { border-collapse: collapse; width: max-content; min-width: 100%; text-align: center; }
        
        th { background: #1e293b; color: white; font-size: 0.85rem; font-weight: 700; padding: 18px 15px; position: sticky; top: 0; z-index: 10; border-right: 1px solid #334155; }
        th:first-child { left: 0; z-index: 20; background: #0f172a; min-width: 150px; text-align: left; padding-left: 25px; }
        
        td { padding: 15px; border: 1px solid var(--border-color); }
        td:first-child { position: sticky; left: 0; background: #f8fafc; font-weight: 800; color: var(--primary-blue); text-align: left; padding-left: 25px; z-index: 5; border-right: 2px solid var(--border-color); cursor: help; }
        
        .chk-matrix { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary-blue); }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="header-container">
            <div>
                <h1 class="header-title">Pemetaan <span>CPL - PL</span></h1>
                <p style="color: #64748b; margin-top: 5px;">Tautkan Capaian Pembelajaran (Kolom) dengan Profil Lulusan (Baris).</p>
            </div>
            <button id="btnSave" class="btn-save" onclick="saveMapping()">
                <i class="fas fa-save"></i> Simpan Pemetaan
            </button>
        </div>

        <div class="matrix-container">
            <table id="matrixTable">
                <thead id="matrixHead"><tr><th>Memuat...</th></tr></thead>
                <tbody id="matrixBody">
                    <tr><td style="padding: 30px;">Menarik data dari database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
    const API_BASE = "https://computing-epson-profits-script.trycloudflare.com/webhook";
    const PRODI = localStorage.getItem("prodi_aktif") || "ti";
    const API_METADATA = `${API_BASE}/get-metadata?prodi=${PRODI}`;
    const API_MASTER_PL = `${API_BASE}/get-master-pl`;
        const API_MAPPING_CPL_PL = `${API_BASE}/get-mapping-cpl-pl`;

    let listCPL = [];
    let listPL = [];

    window.onload = async () => {
        await loadSidebar();
        await initMatriks();
    };

    async function initMatriks() {
        try {
            const [resMeta, resPL, resMap] = await Promise.all([
            fetch(API_METADATA),
            fetch(API_MASTER_PL),
            fetch(API_MAPPING_CPL_PL)
            ]);

            // 1. Trik Anti-Kosong untuk Metadata (CPL)
            let textMeta = await resMeta.text();
            if (textMeta.startsWith('=')) textMeta = textMeta.substring(1);
            const rawMeta = textMeta ? JSON.parse(textMeta) : [];

            // 2. Trik Anti-Kosong untuk Master PL
            let textPL = await resPL.text();
            listPL = textPL ? JSON.parse(textPL) : [];

            // 3. Trik Anti-Kosong untuk Mapping Database yang masih kosong
            let textMap = await resMap.text();
            const existingMapping = textMap ? JSON.parse(textMap) : [];

            // Filter Meta hanya mengambil CPL
            listCPL = rawMeta.filter(m => m.tipe === 'cpl').sort((a, b) => a.kode.localeCompare(b.kode));

            renderTable();
            applyMapping(existingMapping);
        } catch (e) { 
            console.error("Detail Error:", e); 
            document.getElementById("matrixBody").innerHTML = '<tr><td colspan="10" style="color: red; padding: 20px; text-align: center; font-weight: bold;">Gagal memuat data. Cek Console (F12) untuk detail.</td></tr>';
        }
    }

    function renderTable() {
        const thead = document.getElementById("matrixHead");
        const tbody = document.getElementById("matrixBody");

        // Header
        let thHtml = `<tr><th>KODE PL</th>`;
        listCPL.forEach(cpl => {
            thHtml += `<th title="${cpl.label || cpl.nama}">${cpl.kode}</th>`;
        });
        thHtml += `</tr>`;
        thead.innerHTML = thHtml;

        // Body
        let tbHtml = '';
        listPL.forEach(pl => {
            let safeName = (pl.profil_lulusan || "Tanpa Nama").replace(/"/g, '&quot;');
            tbHtml += `<tr>
                <td title="${safeName}"><i class="fas fa-info-circle" style="opacity:0.3; margin-right:8px;"></i>${pl.kode_pl}</td>`;
            listCPL.forEach(cpl => {
                tbHtml += `<td><input type="checkbox" class="chk-matrix" id="${pl.kode_pl}_${cpl.kode}" data-pl="${pl.kode_pl}" data-cpl="${cpl.kode}"></td>`;
            });
            tbHtml += `</tr>`;
        });
        tbody.innerHTML = tbHtml;
    }

    function applyMapping(data) {
        if (!Array.isArray(data)) return;
        data.forEach(m => {
            const cb = document.getElementById(`${m.kode_pl}_${m.kode_cpl}`);
            if (cb) cb.checked = true;
        });
    }

    async function saveMapping() {
        const btn = document.getElementById('btnSave');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
        btn.disabled = true;

        let promises = [];
        listPL.forEach(pl => {
            const checked = document.querySelectorAll(`.chk-matrix[data-pl="${pl.kode_pl}"]:checked`);
            const cplList = Array.from(checked).map(c => c.getAttribute('data-cpl'));

            // Mengirim per PL agar n8n bisa melakukan Delete-then-Insert dengan aman
            promises.push(fetch(`${API_BASE}/admin-map-cpl-pl`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ kode_pl: pl.kode_pl, cpl_list: cplList, prodi: PRODI })
            }));
        });

        try {
            await Promise.all(promises);
            alert("✅ Pemetaan CPL - Profil Lulusan berhasil disimpan!");
        } catch (e) { alert("❌ Gagal menyimpan."); }
        finally { btn.innerHTML = '<i class="fas fa-save"></i> Simpan Pemetaan'; btn.disabled = false; }
    }

    async function loadSidebar() {
            try {
                const response = await fetch('/kaprodi/kaprodi_ti/components/sidebar.html');
                document.getElementById('sidebar-container').innerHTML = await response.text();
                document.getElementById("adminName").innerText = localStorage.getItem("user_login") || "Admin";
                document.getElementById('nav-mapping-mk').style.background = 'var(--sidebar-hover)';
            } catch (error) {}
        }

        function toggleDropdown(menuId, chevronId) {
            const menu = document.getElementById(menuId);
            const chevron = document.getElementById(chevronId);
            if (menu.style.display === 'none' || menu.style.display === '') {
                menu.style.display = 'flex'; chevron.style.transform = 'rotate(180deg)';
            } else {
                menu.style.display = 'none'; chevron.style.transform = 'rotate(0deg)';
            }
        }

        function logout() {
            if(confirm("Apakah Anda yakin ingin keluar?")) {
                localStorage.removeItem("user_login"); window.location.replace('/login/login.html');
            }
        }
</script>
</body>
</html>
