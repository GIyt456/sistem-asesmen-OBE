<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Bobot - Sistem OBE</title>
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin_si.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="/js/api_config.js"></script>
    <script src="/js/template.js"></script> 
    
    <style>
        /* MANTRA ANTI-BOCOR LAYAR GLOBAL */
        *, *::before, *::after { box-sizing: border-box !important; }
        html, body { max-width: 100vw; overflow-x: hidden; }

        /* =========================================
           ✨ BEAUTIFY MATRIKS & FORM DESKTOP
           ========================================= */
        .btn-save-bobot { background: var(--primary-blue); color: white; border: none; padding: 14px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; font-size: 0.95rem; white-space: nowrap;}
        .btn-save-bobot:hover { filter: brightness(0.85); transform: translateY(-2px); }
        .btn-save-bobot:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }

        .control-panel { background: white; padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 25px; display: flex; gap: 20px; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); flex-wrap: wrap; }
        .select-matkul { padding: 14px 20px; border: 2px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 1rem; flex: 1; cursor: pointer; background: #f8fafc; font-weight: 600; color: #334155; transition: 0.2s; min-width: 250px; }
        .select-matkul:focus { border-color: var(--primary-blue); background: white; box-shadow: 0 0 0 3px rgba(30,58,138, 0.1); }

        .table-bobot-wrapper { overflow-x: auto; background: white; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border: 1px solid var(--border-color); }
        .tabel-bobot { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 900px; } 
        
        .tabel-bobot th { background: #1e293b !important; color: white !important; font-weight: 700; padding: 18px 10px !important; border-bottom: 2px solid #0f172a !important; border-right: 1px solid #334155 !important; text-align: center; vertical-align: middle; font-size: 0.85rem; }
        .tabel-bobot th.bg-darker { background: #0f172a !important; letter-spacing: 1px;} 
        .tabel-bobot th.bg-primary { background: var(--primary-blue) !important; font-size: 1rem; border-right: none !important;}

        .tabel-bobot td { border-bottom: 1px solid #e5e7eb !important; border-right: 1px solid #e5e7eb !important; padding: 15px 10px !important; font-size: 0.9rem; text-align: center; vertical-align: middle; background: white; color: #1e293b;}
        .tabel-bobot td:last-child { border-right: none !important; }
        
        .col-cpl { color: var(--primary-blue) !important; font-weight: 800 !important; background: #f8fafc !important; }
        .col-mk { font-weight: 700 !important; }
        .col-cpmk { background: #f1f5f9 !important; font-weight: 700 !important; color: #334155 !important;}

        .input-bobot { width: 70px; padding: 10px 5px; border: 2px solid #cbd5e1; border-radius: 8px; text-align: center; font-size: 0.95rem; font-weight: 700; color: #1e293b; transition: all 0.2s; background: #f8fafc; outline: none;}
        .input-bobot:focus { border-color: var(--primary-blue); background: white; box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15); transform: translateY(-2px); }
        
        .col-total { font-size: 1.4rem !important; font-weight: 900 !important; transition: 0.3s; }
        .total-ok { color: #059669 !important; background: #ecfdf5 !important; } 
        .total-warn { color: #dc2626 !important; background: #fef2f2 !important; box-shadow: inset 0 0 0 2px #f87171;} 

        /* Styling Tombol Plus Inline di Tabel (Desktop) */
        .btn-add-inline { background: #10b981; color: white; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-add-inline:hover { background: #059669; }
        .select-inline { padding: 6px; font-size: 0.8rem; border-radius: 6px; border: 1px solid #cbd5e1; max-width: 130px; outline: none; font-weight: 600; background: white; }

        /* Kelas Penolong */
        .show-mobile { display: none; }
        .mobile-total-panel { display: none; }
        .mobile-add-wrapper { display: none; }

        /* =========================================
           📱 SULAP KARTU HP (ANTI SCROLL SAMPING)
           ========================================= */
        @media screen and (max-width: 768px) {
            html, body { overflow-x: hidden !important; width: 100% !important; max-width: 100% !important; margin: 0; padding: 0;}
            .main-content { overflow-x: hidden !important; width: 100% !important; padding-top: 15px !important;}
            
            .header-bobot-mhs { margin: 15px 15px 10px 15px !important; flex-direction: column !important; align-items: flex-start !important; gap: 15px; padding-bottom: 0 !important; border-bottom: none !important;}
            .section-bobot-mhs { padding: 0 15px 100px 15px !important; width: 100% !important; max-width: 100% !important; box-sizing: border-box !important;} 
            
            .control-panel { padding: 15px !important; margin: 0 0 15px 0 !important; flex-direction: column !important; align-items: stretch !important; gap: 12px !important; border: none !important; box-shadow: none !important; width: 100% !important;}
            .select-matkul { width: 100% !important; max-width: 100% !important; box-sizing: border-box !important;}
            .btn-save-bobot { width: 100% !important; justify-content: center !important; margin-top: 5px !important; padding: 16px !important; font-size: 1.1rem !important;}

            .hide-mobile { display: none !important; }
            .show-mobile { display: inline-block !important; }

            /* Panel Tambah Komponen Khusus Tampilan HP */
            .mobile-add-wrapper { display: flex !important; flex-direction: column; gap: 6px; width: 100%; margin-top: 5px; }
            .mobile-add-container { display: flex; gap: 8px; width: 100%; }
            .mobile-add-container .select-inline { max-width: none !important; flex: 1; padding: 12px; font-size: 1rem; }
            .mobile-add-container .btn-add-inline { padding: 12px 20px; font-size: 1rem; }

            .table-bobot-wrapper { border: none !important; box-shadow: none !important; background: transparent !important; margin: 0 !important; padding: 0 !important; width: 100% !important; overflow: hidden !important;}
            
            .tabel-bobot, .tabel-bobot tbody, .tabel-bobot tr { 
                display: block !important; 
                width: 100% !important; 
                min-width: 0 !important; 
                max-width: 100% !important; 
                box-sizing: border-box !important;
            }
            .tabel-bobot thead { display: none !important; }
            
            /* TR Menjadi Kotak Kartu */
            .tabel-bobot tr { background: white !important; border: 1px solid var(--border-color) !important; border-radius: 12px !important; margin-bottom: 20px !important; box-shadow: 0 4px 6px rgba(0,0,0,0.05) !important; overflow: hidden !important;}
            
            /* Header Kartu (Berisi Label CPL & CPMK) */
            .tabel-bobot td.col-cpmk { 
                display: flex !important; flex-direction: column; align-items: flex-start; 
                padding: 15px 20px !important; background: #1e293b !important; color: white !important; 
                border-bottom: 4px solid var(--primary-blue) !important; 
                text-align: left !important; width: 100% !important; box-sizing: border-box !important;
            }
            .mobile-cpl-badge { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; margin-bottom: 8px; font-weight: 800;}
            .cpmk-title { display: block !important; font-size: 1.15rem; font-weight: 800; color: #facc15;}

            /* Barisan Input Form Ke Bawah */
            .tabel-bobot td.input-cell { 
                display: flex !important; justify-content: space-between !important; align-items: center !important; 
                padding: 12px 20px !important; border-bottom: 1px dashed #e2e8f0 !important; 
                background: white !important; width: 100% !important; box-sizing: border-box !important;
            }
            .tabel-bobot td.input-cell:last-child { border-bottom: none !important; }
            .tabel-bobot td.input-cell::before { content: attr(data-label); font-weight: 800; color: #475569; font-size: 1.05rem;}
            
            .input-bobot { width: 90px !important; padding: 12px !important; font-size: 1.15rem !important; }

            /* Panel Sticky "Total Bobot" di Bawah Layar HP */
            .mobile-total-panel.active {
                display: flex !important;
                position: fixed; bottom: 0; left: 0; width: 100%;
                background: white; border-top: 1px solid var(--border-color);
                padding: 15px 25px; box-shadow: 0 -10px 25px rgba(0,0,0,0.1);
                justify-content: space-between; align-items: center; z-index: 999;
                box-sizing: border-box !important;
            }
            .mobile-total-label { font-weight: 800; color: #1e293b; font-size: 0.95rem; margin-bottom: 2px;}
            .mobile-total-value { font-size: 1.6rem; font-weight: 900; }
            .mobile-total-value.ok { color: #10b981; }
            .mobile-total-value.warn { color: #dc2626; }
        }
    </style>
</head>
<body>

    <nav class="navbar-mobile">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <img src="/gambar/LogoUnaki.png" alt="Logo Universitas AKIx" style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;" onclick="window.location.href='/index.html'">
        </div>
        <div class="profile-btn-mobile" onclick="toggleSidebar()"><img id="mobileNavbarAvatar" src="" alt="Profil Kaprodi"></div>
    </nav>

    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div id="navbar-container"></div>

        <div class="fixed-header">
            <div class="header-container header-bobot-mhs">
                <div class="header-title-area">
                    <div class="header-subtitle" style="margin-bottom: 5px;">MEKANISME ASESMEN</div>
                    <h1 class="header-title" style="font-size: 2rem;">MASTER <span>BOBOT</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>
            <div style="border-bottom: 1px solid var(--border-color); margin: 0 50px 20px 50px;" class="header-bobot-mhs"></div>
        </div>

        <div class="scrollable-content section-bobot-mhs" style="padding: 0 50px 40px 50px;">
            <!-- TEMPLATE: Filter Section -->
            <div class="filter-section">
                <label for="filterKurikulum">Tampilkan Data Kurikulum:</label>
                <select id="filterKurikulum" onchange="loadData()" class="filter-select">
                    <option value="">Memuat data...</option>
                </select>
            </div>
            <div class="control-panel">
                <!-- Tambahan Filter Kurikulum Pusat -->
                <div style="flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 200px;">
                    <label style="font-weight: 700; color: #475569; font-size: 0.95rem;">
                        <i class="fas fa-calendar-alt" style="color: var(--primary-blue); margin-right: 5px;"></i> Tampilkan Data Kurikulum:
                    </label>
                    <select id="filterKurikulum" class="select-matkul" onchange="initMatkulDropdown()" style="min-width: 100%;">
                        <option value="">Memuat data...</option>
                    </select>
                </div>

                <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
                    <label style="font-weight: 700; color: #475569; font-size: 0.95rem;">
                        <i class="fas fa-book-open" style="color: var(--primary-blue); margin-right: 5px;"></i> Pilih Mata Kuliah:
                    </label>
                    <select id="selectMk" class="select-matkul" onchange="loadDataBobot()">
                        <option value="" disabled selected>-- Pilih Kurikulum Terlebih Dahulu --</option>
                    </select>
                </div>

                <div id="mobileAddSection" class="mobile-add-wrapper">
                    <label style="font-weight: 700; color: #475569; font-size: 0.95rem;">
                        <i class="fas fa-plus-circle" style="color: #10b981; margin-right: 5px;"></i> Tambah Komponen:
                    </label>
                    <div class="mobile-add-container">
                        <select id="selectKompMobile" class="select-inline"></select>
                        <button class="btn-add-inline" onclick="tambahKomponenMobile()">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>

                <button class="btn-save-bobot" onclick="simpanBobot()">
                    <i class="fas fa-save" style="font-size: 1.2rem;"></i> Simpan Perubahan
                </button>
            </div>

            <div class="table-bobot-wrapper">
                <table id="bobotTable" class="tabel-bobot">
                    <thead id="tableHead">
                        <tr>
                            <th rowspan="2">CPL</th>
                            <th rowspan="2">KODE MK</th>
                            <th rowspan="2" style="min-width: 250px;">NAMA MK</th>
                            <th rowspan="2">CPMK</th>
                            <th colspan="1" class="bg-darker">KOMPONEN PENILAIAN (%)</th>
                            <th rowspan="2" class="bg-primary">TOTAL</th>
                        </tr>
                        <tr>
                            <th>Memuat...</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="10" style="text-align: center; padding: 40px !important; font-weight: 600; color: #64748b;"><i class="fas fa-arrow-up" style="margin-right: 8px; color: var(--primary-blue);"></i> Silakan pilih Mata Kuliah di atas terlebih dahulu.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="mobileTotalPanel" class="mobile-total-panel">
        <div>
            <div class="mobile-total-label">TOTAL BOBOT MK</div>
            <div style="font-size: 0.8rem; color: #64748b; font-weight: 600;">Pastikan nilainya pas 100%</div>
        </div>
        <div id="mobileTotalValue" class="mobile-total-value warn">0%</div>
    </div>

<script>
    const PRODI = localStorage.getItem("prodi_aktif") || "ti"; 
    
    document.addEventListener("DOMContentLoaded", () => {
        if(PRODI === "ti") {
            document.documentElement.style.setProperty('--primary-blue', '#8b0000'); 
            document.getElementById('prodiBadge').innerText = "TEKNIK INFORMATIKA";
        } else {
            document.documentElement.style.setProperty('--primary-blue', '#1e3a8a'); 
            document.getElementById('prodiBadge').innerText = "SISTEM INFORMASI";
        }

        const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
        const avatarMobile = document.getElementById("mobileNavbarAvatar");
        if(avatarMobile) {
            const avatarColor = PRODI === "ti" ? "1e3a8a" : "8b0000";
            avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=${avatarColor}&color=fff&bold=true`;
        }
    });

    function toggleSidebar() {
        document.getElementById('sidebar-container').classList.toggle('active');
        document.getElementById('mobileOverlay').classList.toggle('active');
    }
    
    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
            const sidebar = document.getElementById('sidebar-container');
            if (sidebar && !sidebar.innerHTML.includes('sidebar-profile')) {
                fetch(`/kaprodi/kaprodi_${PRODI}/sidebar.html`)
                    .then(res => res.text())
                    .then(html => {
                        sidebar.innerHTML = html;
                        if(typeof initSmartSidebar === 'function') initSmartSidebar();
                    })
                    .catch(e => console.log('Gagal memuat sidebar darurat'));
            }
        }, 600); 
    });

    const API_GET_KOMPONEN = `${API_BASE}/get-master-komponen`;
    const API_SAVE_BOBOT = `${API_BASE}/admin-save-bobot`;

    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace("/login/login.html");

    let daftarMasterKomponen = [];
    let activeKomponenIds = [];   
    let dataCpmkGrouped = [];

    // Mengunci window.onload ke satu pintu utama
    window.onload = async () => { 
        await fetchMasterKomponen();
        await loadDropdownKurikulum(); // Panggil dropdown kurikulum dulu
    };

    // --- FUNGSI BARU: LOAD KURIKULUM ---
    async function loadDropdownKurikulum() {
        try {
            const response = await fetch(`${API_BASE}/get-kurikulum-tersedia`);
            let data = [];
            try { data = await response.json(); } catch(e) {}
            
            const selectKurikulum = document.getElementById('filterKurikulum');
            if(!selectKurikulum) return;
            selectKurikulum.innerHTML = ''; 
            
            let kurikulumSet = new Set();
            if(data && data.length > 0) {
                data.forEach(item => { if (item && item.kurikulum) kurikulumSet.add(String(item.kurikulum)); });
            }
            // Paksa 20 dan 25 muncul
            kurikulumSet.add("25");
            kurikulumSet.add("20");

            let sortedKurikulum = Array.from(kurikulumSet).sort((a, b) => b - a);

            sortedKurikulum.forEach(kur => {
                let opt = document.createElement('option');
                opt.value = kur; 
                opt.text = "Kurikulum 20" + kur; 
                selectKurikulum.appendChild(opt);
            });

            await initMatkulDropdown(); 
        } catch (error) {
            console.error("Gagal memuat list kurikulum:", error);
        }
    }

    // 1. Ambil Master Komponen dari Database
    async function fetchMasterKomponen() {
        try {
            const res = await fetch(API_GET_KOMPONEN);
            daftarMasterKomponen = await res.json();
        } catch (error) {
            console.error("Gagal muat komponen");
        }
    }

    function getNamaKomponen(id) {
        const komp = daftarMasterKomponen.find(k => k.id_komponen == id);
        return komp ? komp.nama_komponen.toUpperCase() : `KOMP-${id}`;
    }

    // 2. Ambil Daftar Matkul (DIUPDATE: Baca Kurikulum)
    async function initMatkulDropdown() {
        const selectMk = document.getElementById('selectMk');
        const selectKurikulum = document.getElementById('filterKurikulum');
        let kurikulumTerpilih = selectKurikulum ? selectKurikulum.value : "25";

        // Bersihkan tabel saat kurikulum diganti
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 40px !important; font-weight: 600; color: #64748b;"><i class="fas fa-arrow-up" style="margin-right: 8px; color: var(--primary-blue);"></i> Silakan pilih Mata Kuliah di atas terlebih dahulu.</td></tr>';
        document.getElementById('mobileTotalPanel').classList.remove('active');

        try {
            const res = await fetch(`${API_GET_BOBOT}&kurikulum=${kurikulumTerpilih}`);
            const data = await res.json();
            
            let uniqueMk = [];
            let seen = new Set();
            
            data.forEach(row => {
                if (row && row.kode_mk && !seen.has(row.kode_mk)) {
                    seen.add(row.kode_mk);
                    uniqueMk.push({ kode_mk: row.kode_mk, nama_mk: row.nama_mk });
                }
            });

            // Reset Tampilan form bawah saat ganti kurikulum
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 40px !important; font-weight: 600; color: #64748b;"><i class="fas fa-arrow-up" style="margin-right: 8px; color: var(--primary-blue);"></i> Silakan pilih Mata Kuliah di atas terlebih dahulu.</td></tr>';
            document.getElementById('mobileTotalPanel').classList.remove('active');

            if(uniqueMk.length === 0) {
                selectMk.innerHTML = '<option value="" disabled selected>-- Tidak ada matkul di kurikulum ini --</option>';
                return;
            }

            selectMk.innerHTML = '<option value="" disabled selected>-- Pilih Mata Kuliah yang Tersedia --</option>';
            if(uniqueMk.length > 0) {
                uniqueMk.forEach(mk => {
                    selectMk.innerHTML += `<option value="${mk.kode_mk}">${mk.kode_mk} - ${mk.nama_mk}</option>`;
                });
            } else {
                selectMk.innerHTML = '<option value="" disabled selected>-- Belum ada pemetaan di Kurikulum ini --</option>';
            }
        } catch (error) {
            if(selectMk) selectMk.innerHTML = '<option value="">❌ Gagal memuat daftar matkul. Cek n8n!</option>';
        }
    }

    // 3. Load Data & Grouping Berdasar Matkul Terpilih (DIUPDATE: Baca Kurikulum)
    async function loadDataBobot() {
        const tbody = document.getElementById('tableBody'); 
        const kodeMkTerpilih = document.getElementById('selectMk').value;
        const mobilePanel = document.getElementById('mobileTotalPanel');
        const selectKurikulum = document.getElementById('filterKurikulum');
        let kurikulumTerpilih = selectKurikulum ? selectKurikulum.value : "25";

        const selectKurikulum = document.getElementById('filterKurikulum');
        let kurikulumTerpilih = selectKurikulum ? selectKurikulum.value : "";

        if (!kodeMkTerpilih) return;

        tbody.innerHTML = '<tr><td colspan="15" style="text-align: center; padding: 40px !important;"><i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary-blue);"></i><br><br>Memuat form bobot...</td></tr>';
        mobilePanel.classList.remove('active'); 
        activeKomponenIds = [];
        dataCpmkGrouped = [];

        let URL_DINAMIS_BOBOT = `${API_BASE}/get-master-bobot?prodi=${PRODI}`;
        if(kurikulumTerpilih !== "") {
            URL_DINAMIS_BOBOT += `&kurikulum=${kurikulumTerpilih}`;
        }

        try {
            const res = await fetch(`${API_GET_BOBOT}&kurikulum=${kurikulumTerpilih}`);
            const allData = await res.json();
            const dataMatkul = allData.filter(row => row.kode_mk === kodeMkTerpilih);
            
            if (dataMatkul.length === 0) {
                tbody.innerHTML = '<tr><td colspan="15" style="text-align: center; padding: 40px !important; color: #dc2626; font-weight:bold;">Belum ada pemetaan CPMK untuk Mata Kuliah ini di database.</td></tr>';
                return;
            }

            let grouped = {};
            let activeIdsSet = new Set();

            dataMatkul.forEach(row => {
                let key = row.kode_cpmk || row.cpmk;
                if (!grouped[key]) {
                    grouped[key] = {
                        cpl: row.cpl,
                        kode_mk: row.kode_mk,
                        nama_mk: row.nama_mk,
                        kode_cpmk: key,
                        bobot_komponen: {} 
                    };
                }
                if (row.id_komponen && parseFloat(row.bobot) > 0) {
                    grouped[key].bobot_komponen[row.id_komponen] = parseFloat(row.bobot);
                    activeIdsSet.add(row.id_komponen.toString());
                }
            });

            dataCpmkGrouped = Object.values(grouped);
            activeKomponenIds = Array.from(activeIdsSet);

            renderTabelDinamis();
            mobilePanel.classList.add('active');

        } catch (error) {
            tbody.innerHTML = '<tr><td colspan="15" style="text-align: center; padding: 40px !important; color: red; font-weight:bold;">❌ Gagal memuat data dari API.</td></tr>';
        }
    }

    function syncInputValues() {
        if (activeKomponenIds.length === 0) return;
        const rows = document.querySelectorAll('tbody tr[data-cpmk]');
        
        rows.forEach(row => {
            const cpmk = row.getAttribute('data-cpmk');
            let dataRow = dataCpmkGrouped.find(d => d.kode_cpmk === cpmk);
            
            if (dataRow) {
                activeKomponenIds.forEach(idKomp => {
                    const input = row.querySelector(`input[data-idkomp="${idKomp}"]`);
                    if (input) dataRow.bobot_komponen[idKomp] = parseFloat(input.value) || 0;
                });
            }
        });
    }

    function tambahKomponenInline() {
        const select = document.getElementById('selectKompInline');
        if(!select) return;
        eksekusiTambahKomponen(select.value);
    }

    function tambahKomponenMobile() {
        const select = document.getElementById('selectKompMobile');
        if(!select) return;
        eksekusiTambahKomponen(select.value);
    }

    function eksekusiTambahKomponen(idVal) {
        if (!idVal) {
            alert("Pilih komponen terlebih dahulu!");
            return;
        }
        if (!activeKomponenIds.includes(idVal)) {
            syncInputValues(); 
            activeKomponenIds.push(idVal); 
            renderTabelDinamis(); 
        }
    }

    function renderTabelDinamis() {
        const table = document.getElementById('bobotTable');
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        const selectMobile = document.getElementById('selectKompMobile');
        
        let hasAvailable = false;
        let optionsHtml = '<option value="" disabled selected>Pilih Komponen...</option>';
        daftarMasterKomponen.forEach(k => {
            if (!activeKomponenIds.includes(k.id_komponen.toString())) {
                optionsHtml += `<option value="${k.id_komponen}">${k.nama_komponen.toUpperCase()}</option>`;
                hasAvailable = true;
            }
        });

        if(selectMobile) selectMobile.innerHTML = optionsHtml;

        let totalKolomKomp = activeKomponenIds.length > 0 ? (activeKomponenIds.length + 1) : 1;

        let theadHtml = `
            <tr>
                <th rowspan="2" class="hide-mobile">CPL</th>
                <th rowspan="2" class="hide-mobile">KODE MK</th>
                <th rowspan="2" class="hide-mobile" style="min-width: 250px;">NAMA MK</th>
                <th rowspan="2">CPMK</th>
                <th colspan="${totalKolomKomp}" class="bg-darker">KOMPONEN PENILAIAN (%)</th>
                <th rowspan="2" class="bg-primary hide-mobile">TOTAL</th>
            </tr>
            <tr>`;
            
        activeKomponenIds.forEach(idKomp => {
            theadHtml += `<th>${getNamaKomponen(idKomp)}</th>`;
        });

        if (hasAvailable) {
            theadHtml += `
                <th style="background:#0f172a !important; min-width:140px;" class="hide-mobile">
                    <div style="display:flex; justify-content:center; align-items:center; gap:5px;">
                        <select id="selectKompInline" class="select-inline">${optionsHtml}</select>
                        <button class="btn-add-inline" onclick="tambahKomponenInline()" title="Tambah Komponen">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </th>`;
        } else {
            theadHtml += `<th style="background:#0f172a !important; color:#9ca3af; font-weight:normal;" class="hide-mobile">Maksimal</th>`;
        }
        
        theadHtml += `</tr>`;
        thead.innerHTML = theadHtml;

        let html = '';
        let cplCount = {};
        let renderedCpl = {};
        let renderedMkTotal = false;

        dataCpmkGrouped.forEach(row => {
            let cplKey = row.kode_mk + '_' + row.cpl;
            cplCount[cplKey] = (cplCount[cplKey] || 0) + 1;
        });

        dataCpmkGrouped.forEach((row, index) => {
            let cplKey = row.kode_mk + '_' + row.cpl;
            let tr = `<tr data-cpmk="${row.kode_cpmk}" data-mk="${row.kode_mk}">`;

            if (!renderedCpl[cplKey]) {
                tr += `<td class="col-cpl hide-mobile" rowspan="${cplCount[cplKey]}">${row.cpl}</td>`;
                renderedCpl[cplKey] = true;
            }

            if (index === 0) {
                tr += `<td class="col-mk hide-mobile" rowspan="${dataCpmkGrouped.length}">${row.kode_mk}</td>`;
                tr += `<td class="hide-mobile" style="text-align: left; font-weight: 600;" rowspan="${dataCpmkGrouped.length}">${row.nama_mk}</td>`;
            }

            tr += `
                <td class="col-cpmk">
                    <div class="mobile-cpl-badge show-mobile"><i class="fas fa-tag"></i> ${row.cpl}</div>
                    <span class="cpmk-title">${row.kode_cpmk}</span>
                </td>`;

            activeKomponenIds.forEach(idKomp => {
                let val = row.bobot_komponen[idKomp] || 0;
                let labelKomp = getNamaKomponen(idKomp);
                tr += `<td class="input-cell" data-label="${labelKomp}"><input type="number" class="input-bobot" data-mk="${row.kode_mk}" data-idkomp="${idKomp}" value="${val}" min="0" max="100" oninput="hitungTotalMK('${row.kode_mk}')"></td>`;
            });

            tr += `<td style="background: #f8fafc;" class="hide-mobile"></td>`;

            if (!renderedMkTotal) {
                let tempTotal = 0;
                activeKomponenIds.forEach(idKomp => { tempTotal += (dataCpmkGrouped[0].bobot_komponen[idKomp] || 0) });
                const warnaWarna = tempTotal === 100 ? 'total-ok' : 'total-warn';
                tr += `<td id="total-mk-${row.kode_mk}" class="col-total hide-mobile ${warnaWarna}" rowspan="${dataCpmkGrouped.length}">${tempTotal}%</td>`;
                renderedMkTotal = true;
            }

            tr += `</tr>`;
            html += tr;
        });

        tbody.innerHTML = html;
        
        if(dataCpmkGrouped.length > 0) {
           hitungTotalMK(dataCpmkGrouped[0].kode_mk);
        }
    }

    function hitungTotalMK(kodeMk) {
        const inputs = document.querySelectorAll(`input[data-mk="${kodeMk}"]`);
        let sum = 0;
        inputs.forEach(input => { sum += (parseFloat(input.value) || 0); });

        const totalCell = document.getElementById(`total-mk-${kodeMk}`);
        if (totalCell) {
            totalCell.innerText = sum + "%";
            if (sum === 100) {
                totalCell.classList.remove('total-warn');
                totalCell.classList.add('total-ok');
            } else {
                totalCell.classList.remove('total-ok');
                totalCell.classList.add('total-warn');
            }
        }
        
        const mobileVal = document.getElementById('mobileTotalValue');
        if (mobileVal) {
            mobileVal.innerText = sum + "%";
            if (sum === 100) {
                mobileVal.classList.remove('warn');
                mobileVal.classList.add('ok');
            } else {
                mobileVal.classList.remove('ok');
                mobileVal.classList.add('warn');
            }
        }
    }

    // 8. Simpan Perubahan Secara Relasional Vertikal ke Database MySQL via n8n (DIUPDATE: Baca Kurikulum)
    async function simpanBobot() {
        const btnSave = document.querySelector('.btn-save-bobot');
        const oriText = btnSave.innerHTML;
        
        const rows = document.querySelectorAll('tbody tr[data-cpmk]');
        if(rows.length === 0) {
            alert("Silakan pilih Mata Kuliah terlebih dahulu!");
            return;
        }

        let kodeMk = document.getElementById('selectMk').value;
        const inputs = document.querySelectorAll(`input[data-mk="${kodeMk}"]`);
        let totalMK = 0;
        inputs.forEach(input => totalMK += (parseFloat(input.value) || 0));

        if (totalMK !== 100 && totalMK > 0) {
            alert(`⚠️ GAGAL MENYIMPAN!\n\nTotal seluruh bobot CPMK harus pas 100%. (Saat ini: ${totalMK}%)`);
            return;
        }

        // --- AMBIL KURIKULUM DARI DROPDOWN BARU ---
        const selectKurikulum = document.getElementById('filterKurikulum');
        let kurikulumTerpilih = selectKurikulum ? selectKurikulum.value : "25";
        let payloadData = [];

        rows.forEach(row => {
            const kodeCpmk = row.getAttribute('data-cpmk');
            activeKomponenIds.forEach(idKomp => {
                const input = row.querySelector(`input[data-idkomp="${idKomp}"]`);
                if (input) {
                    payloadData.push({
                        kode_mk: kodeMk,
                        kode_cpmk: kodeCpmk,
                        id_komponen: parseInt(idKomp),
                        prodi: PRODI,
                        bobot: parseFloat(input.value) || 0,
                        kurikulum: kurikulumTerpilih // <--- DIBUAT DINAMIS
                    });
                }
            });
        });

        if (payloadData.length === 0) {
            alert("❌ Belum ada data komponen yang dikonfigurasi.");
            return;
        }

        btnSave.innerHTML = '<i class="fas fa-spinner fa-spin fa-lg" style="margin-right:8px;"></i> Menyimpan...';
        btnSave.disabled = true;

        try {
            for (const payload of payloadData) {
                await fetch(API_SAVE_BOBOT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }
            alert("✅ Sempurna! Master Bobot berhasil disimpan khusus untuk Kurikulum 20" + kurikulumTerpilih + "!");
            loadDataBobot(); 
        } catch (error) {
            alert("❌ Gagal terhubung ke server.");
        } finally {
            btnSave.innerHTML = oriText;
            btnSave.disabled = false;
        }
    }
</script>
