<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Nilai Dosen - Sistem OBE</title>
    
    <link rel="stylesheet" href="/css/style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .card-container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; margin-bottom: 30px; }
        .table-master { width: 100%; border-collapse: collapse; }
        .table-master th, .table-master td { padding: 15px; border-bottom: 1px solid #e5e7eb; text-align: left; vertical-align: middle; }
        .table-master th { background: #111827; color: white; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; }
        .text-center { text-align: center !important; }

        /* Progress Bar Sederhana */
        .progress-bg { background: #e5e7eb; border-radius: 10px; height: 10px; width: 100%; overflow: hidden; margin-top: 5px; }
        .progress-bar { background: #10b981; height: 100%; border-radius: 10px; transition: width 0.5s ease; }
        .progress-text { font-size: 0.8rem; font-weight: 600; color: #4b5563; }
        .status-danger { color: #dc2626; background: #fee2e2; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .status-success { color: #059669; background: #d1fae5; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        
        body { animation: transitionIn 0.3s ease-in-out; }
        @keyframes transitionIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <div id="navbar-container"></div>

        <div class="content-wrapper">
            <div class="header-container">
                <div class="header-title-area">
                    <div class="header-subtitle">EVALUASI & RPS</div>
                    <h1 class="header-title">REKAP NILAI <span>DOSEN</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;">
                <p style="color: #64748b; font-size: 0.95rem; margin: 0;">Pantau progres input nilai OBE oleh dosen pengampu pada semester aktif.</p>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="searchKelas" class="form-control" placeholder="Cari Mata Kuliah atau Nama Dosen..." style="width: 300px;">
                    <button class="btn-dark" onclick="loadRekapNilai()"><i class="fas fa-sync-alt"></i> Refresh Data</button>
                </div>
            </div>

            <div class="card-container">
                <table class="table-master">
                    <thead>
                        <tr>
                            <th width="5%" class="text-center">No</th>
                            <th width="10%">Kelas</th>
                            <th width="25%">Mata Kuliah</th>
                            <th width="25%">Dosen Pengampu</th>
                            <th width="20%">Progres Input Nilai</th>
                            <th width="15%" class="text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBodyRekap">
                        <tr><td colspan="6" class="text-center" style="color: #6b7280; padding: 20px;"><i class="fas fa-spinner fa-spin"></i> Memuat data kelas aktif...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/template.js"></script>

    <script>
        // DETEKSI PRODI DINAMIS
        const PRODI = localStorage.getItem("prodi_aktif") || "si"; 
        
        // PENTING: Ganti URL di bawah dengan link Cloudflare Tunnel n8n Anda!
        const API_BASE = "https://eco-monkey-gentleman-pipeline.trycloudflare.com/webhook"; 
        const API_REKAP = `${API_BASE}/get-rekap-nilai?prodi=${PRODI}`;

        // SATPAM HALAMAN
        const userLogin = localStorage.getItem("user_login");
        if (!userLogin) window.location.replace("/login/login.html");

        // Set Label Prodi UI
        document.addEventListener("DOMContentLoaded", () => {
            const badge = document.getElementById("prodiBadge");
            if(badge) badge.innerText = PRODI === "si" ? "Sistem Informasi" : "Teknik Informatika";
            
            if(PRODI === "si") {
                badge.style.background = "var(--primary-teal)";
                document.querySelector('.header-title span').style.color = "var(--primary-teal)";
            }
        });
        
        async function loadRekapNilai() {
            const tbody = document.getElementById('tableBodyRekap');
            tbody.innerHTML = `<tr><td colspan="6" class="text-center" style="color: #6b7280; padding: 20px;"><i class="fas fa-spinner fa-spin"></i> Menarik data rekap nilai...</td></tr>`;
            
            try {
                const res = await fetch(API_REKAP);
                if (!res.ok) throw new Error("Gagal load dari n8n");
                
                const data = await res.json();
                
                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center">Belum ada data kelas aktif untuk prodi ini.</td></tr>`;
                    return;
                }
                
                renderTable(data, tbody);

            } catch (error) {
                console.log("n8n gagal memuat, menampilkan data fallback.");
                const dummyData = [
                    { kelas: "TI-A", kode_mk: "2023W276", nama_mk: "AI Programming", dosen: "Harries Arizonia Ismail", persentase: 100 },
                    { kelas: "TI-B", kode_mk: "2023P065", nama_mk: "Cyber Security", dosen: "Dosen Pengampu TI", persentase: 45 },
                    { kelas: "SI-A", kode_mk: "2023F075", nama_mk: "Metodologi Riset", dosen: "Dosen Pengampu SI", persentase: 0 }
                ];
                // Filter dummy data agar masuk akal saat presentasi offline
                const filteredDummy = dummyData.filter(d => d.kelas.toLowerCase().includes(PRODI));
                renderTable(filteredDummy.length > 0 ? filteredDummy : dummyData, tbody);
            }
        }

        function renderTable(data, tbody) {
            tbody.innerHTML = "";
            data.forEach((item, index) => {
                let statusBadge = "";
                let barColor = "#10b981"; 
                
                if (item.persentase === 0) {
                    statusBadge = `<span class="status-danger"><i class="fas fa-times-circle"></i> Belum Input</span>`;
                    barColor = "#dc2626"; 
                } else if (item.persentase < 100) {
                    statusBadge = `<span style="color:#d97706; font-size:0.75rem; font-weight:bold;"><i class="fas fa-clock"></i> Proses Input</span>`;
                    barColor = "#f59e0b"; 
                } else {
                    statusBadge = `<span class="status-success"><i class="fas fa-check-circle"></i> Selesai</span>`;
                }

                tbody.innerHTML += `
                    <tr>
                        <td class="text-center" style="font-weight: bold; color: #475569;">${index + 1}</td>
                        <td><strong style="color: var(--text-dark);">${item.kelas}</strong></td>
                        <td>
                            <div style="font-weight: 700; color: ${PRODI === 'si' ? 'var(--primary-teal)' : 'var(--primary-red)'};">${item.kode_mk}</div>
                            <div style="font-size: 0.85rem; font-weight: 500;">${item.nama_mk}</div>
                        </td>
                        <td style="color: #4b5563; font-weight: 500;">${item.dosen}</td>
                        <td>
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span class="progress-text">${item.persentase}%</span>
                                ${statusBadge}
                            </div>
                            <div class="progress-bg">
                                <div class="progress-bar" style="width: ${item.persentase}%; background: ${barColor};"></div>
                            </div>
                        </td>
                        <td class="text-center">
                            <button class="btn-action btn-dark" style="width: 100%; justify-content: center; background: #2563eb; border: none;" onclick="window.location.href='rekap_detail.html?kode_mk=${item.kode_mk}&nama_mk=${encodeURIComponent(item.nama_mk)}&dosen=${encodeURIComponent(item.dosen)}'">
                                <i class="fas fa-search"></i> Detail
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        window.onload = () => {
            setTimeout(loadRekapNilai, 400);
        };
    </script>
</body>
</html>
