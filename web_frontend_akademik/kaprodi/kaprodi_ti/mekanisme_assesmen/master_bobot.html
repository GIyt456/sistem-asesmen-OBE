<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Bobot - Sistem OBE</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --sidebar-bg: #161923; --sidebar-text: #7b8395; --sidebar-hover: #262936; --sidebar-active-text: #ffffff;
            --primary-red: #8b0000; --bg-main: #ffffff; --text-dark: #111827; --border-dark: #161923;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { display: flex; animation: transitionIn 0.3s ease-in-out; background: #f9fafb; height: 100vh; overflow: hidden; color: var(--text-dark); }
        @keyframes transitionIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .main-content { flex: 1; overflow-y: auto; padding: 30px 40px; }
        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; border-bottom: 1px solid #e5e7eb; padding-bottom: 15px; }
        .header-subtitle { color: #9ca3af; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px; }
        .header-title span { color: var(--primary-red); }

        /* GAYA TABEL BOBOT */
        .table-container { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow-x: auto; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .select-filter { padding: 10px 15px; border-radius: 8px; border: 1px solid #d1d5db; font-size: 0.95rem; font-weight: 600; outline: none; background: #f9fafb; }
        
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th { background: var(--sidebar-bg); color: white; text-align: center; padding: 12px 10px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px; border: 1px solid #374151; position: sticky; top: 0; z-index: 10; }
        td { padding: 10px; border: 1px solid #e5e7eb; font-size: 0.85rem; text-align: center; vertical-align: middle; }
        
        /* Kolom Teks (Kiri) */
        td.text-left { text-align: left; font-weight: 500; }
        .col-cpl { color: var(--primary-red); font-weight: 700; }
        .col-mk { font-weight: 700; }
        .col-cpmk { background: #f3f4f6; font-weight: 600; }

        /* Input Angka */
        .input-bobot { width: 60px; padding: 6px; border: 1px solid #d1d5db; border-radius: 4px; text-align: center; font-size: 0.85rem; transition: 0.2s; }
        .input-bobot:focus { border-color: var(--primary-red); outline: none; box-shadow: 0 0 0 2px rgba(139, 0, 0, 0.1); }
        
        /* Highlight Total */
        .col-total { font-weight: 800; font-size: 1rem; }
        .total-ok { color: #059669; } /* Hijau 100% */
        .total-warn { color: #dc2626; } /* Merah != 100% */

        .btn-save { background: var(--primary-red); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-save:hover { background: #6b0000; }
    </style>
</head>
<body>

    <!-- CONTAINER SIDEBAR -->
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="header-container">
            <div>
                <div class="header-subtitle">MEKANISME ASSESMEN</div>
                <h1 class="header-title">MASTER <span>BOBOT</span></h1>
            </div>
        </div>

        <div class="table-container">
            <div class="toolbar">
                <select class="select-filter" id="filterTahun">
                    <option value="2024">Kurikulum 2020</option>
                    <option value="2023">Kurikulum 2025</option>
                </select>
                <button class="btn-save" onclick="simpanBobot()">
                    <i class="fas fa-save"></i> Simpan Perubahan
                </button>
            </div>

            <table id="bobotTable">
                <thead>
                    <tr>
                        <th rowspan="2">CPL</th>
                        <th rowspan="2">KODE MK</th>
                        <th rowspan="2">NAMA MK</th>
                        <th rowspan="2">CPMK</th>
                        <!-- colspan diubah jadi 4 -->
                        <th colspan="4" style="background: #2d3748; border-bottom: 1px solid #4a5568;">KOMPONEN PENILAIAN (%)</th>
                        <th rowspan="2" style="background: var(--primary-red);">TOTAL</th>
                    </tr>
                    <tr>
                        <!-- Sub-header dirampingkan -->
                        <th>Tugas</th>
                        <th>UTS</th>
                        <th>Presentasi</th>
                        <th>UAS</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data dummy dihapus, diganti pesan loading -->
                    <tr><td colspan="9" style="text-align: center; padding: 20px;">Memuat data dari database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script src="/js/template.js"></script>

<script>
    const PRODI = localStorage.getItem("prodi_aktif") || "ti";
    
    const API_BASE = "https://encounter-system-products-globe.trycloudflare.com/webhook";
    const API_GET_BOBOT = `${API_BASE}/get-master-bobot?prodi=${PRODI}`;

    const userLogin = localStorage.getItem("user_login");
        if (!userLogin) window.location.replace("/login/login.html");

    window.onload = () => {
        setTimeout(loadDataBobot, 400); 
    };

    // =========================================================
    // 1. FUNGSI MEMUAT TABEL (4 INPUT, 1 TOTAL PER MK)
    // =========================================================
    async function loadDataBobot() {
        // Sesuaikan ID dengan tbody milikmu (bisa 'tableBody' atau 'bodyMasterBobot')
        const tbody = document.querySelector('tbody'); 
        try {
            const res = await fetch(API_GET_BOBOT); // Pastikan nama API_GET_BOBOT sesuai dengan yang ada di kodemu
            const data = await res.json();
            
            tbody.innerHTML = ''; 
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">Belum ada pemetaan MK-CPMK di database.</td></tr>';
                return;
            }

            // --- HITUNG ROWSPAN & TOTAL AWAL PER MATA KULIAH ---
            let mkCount = {};
            let cplCount = {};
            let mkTotal = {};

            data.forEach((row) => {
                if (!mkCount[row.kode_mk]) mkCount[row.kode_mk] = 0;
                mkCount[row.kode_mk]++; // Hitung ada berapa baris untuk MK ini

                let cplKey = row.kode_mk + '_' + row.cpl;
                if (!cplCount[cplKey]) cplCount[cplKey] = 0;
                cplCount[cplKey]++;

                // Jumlahkan ke-4 komponen untuk total awal Mata Kuliah
                let t = parseInt(row.tugas) || 0;
                let u = parseInt(row.uts) || 0;
                let p = parseInt(row.presentasi) || 0;
                let a = parseInt(row.uas) || 0;

                if (!mkTotal[row.kode_mk]) mkTotal[row.kode_mk] = 0;
                mkTotal[row.kode_mk] += (t + u + p + a); // Akumulasikan seluruh CPMK
            });

            // --- GAMBAR TABELNYA ---
            let renderedMk = {};
            let renderedCpl = {};
            let renderedMkTotal = {};
            let html = '';

            data.forEach((row, index) => {
                let cplKey = row.kode_mk + '_' + row.cpl;

                // Sisipkan data-mk di <tr> agar bisa dilacak oleh tombol simpan
                let tr = `<tr data-rowid="${index}" data-mk="${row.kode_mk}" data-cpmk="${row.cpmk || row.kode_cpmk}">`;

                if (!renderedCpl[cplKey]) {
                    tr += `<td class="text-left col-cpl" rowspan="${cplCount[cplKey]}" style="vertical-align: middle;">${row.cpl}</td>`;
                    renderedCpl[cplKey] = true;
                }

                if (!renderedMk[row.kode_mk]) {
                    tr += `<td class="text-left col-mk" rowspan="${mkCount[row.kode_mk]}" style="vertical-align: middle;">${row.kode_mk}</td>`;
                    tr += `<td class="text-left" rowspan="${mkCount[row.kode_mk]}" style="vertical-align: middle;">${row.nama_mk}</td>`;
                    renderedMk[row.kode_mk] = true;
                }

                // 4 KOLOM INPUT (Tugas, UTS, Presentasi, UAS) MUNCUL DI SETIAP BARIS CPMK
                tr += `
                    <td class="col-cpmk"><strong>${row.cpmk || row.kode_cpmk}</strong></td>
                    <td><input type="number" class="input-bobot" data-mk="${row.kode_mk}" data-field="tugas" value="${row.tugas || 0}" min="0" max="100" oninput="hitungTotalMK('${row.kode_mk}')"></td>
                    <td><input type="number" class="input-bobot" data-mk="${row.kode_mk}" data-field="uts" value="${row.uts || 0}" min="0" max="100" oninput="hitungTotalMK('${row.kode_mk}')"></td>
                    <td><input type="number" class="input-bobot" data-mk="${row.kode_mk}" data-field="presentasi" value="${row.presentasi || 0}" min="0" max="100" oninput="hitungTotalMK('${row.kode_mk}')"></td>
                    <td><input type="number" class="input-bobot" data-mk="${row.kode_mk}" data-field="uas" value="${row.uas || 0}" min="0" max="100" oninput="hitungTotalMK('${row.kode_mk}')"></td>
                `;

                // 1 KOTAK TOTAL SPESIAL (Digabung / Rowspan sebesar jumlah CPMK di MK tersebut)
                if (!renderedMkTotal[row.kode_mk]) {
                    const total = mkTotal[row.kode_mk];
                    const warnawarna = total === 100 ? '#16a34a' : '#dc2626'; // Hijau jika 100, Merah jika belum
                    tr += `<td id="total-mk-${row.kode_mk}" rowspan="${mkCount[row.kode_mk]}" style="vertical-align: middle; text-align: center; font-weight: 800; font-size: 1.1rem; color: ${warnawarna};">${total}%</td>`;
                    renderedMkTotal[row.kode_mk] = true;
                }

                tr += `</tr>`;
                html += tr;
            });

            tbody.innerHTML = html;

        } catch (error) {
            console.error(error);
            tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: red;">Gagal memuat data dari API.</td></tr>';
        }
    }

    // =========================================================
    // 2. FUNGSI PENJUMLAH OTOMATIS SAAT DIKETIK
    // =========================================================
    function hitungTotalMK(kodeMk) {
        // Tarik semua angka dari semua kotak input (Tugas sampai UAS) yang memiliki kode MK yang sama
        const inputs = document.querySelectorAll(`input[data-mk="${kodeMk}"]`);
        let sum = 0;
        
        inputs.forEach(input => {
            sum += (parseInt(input.value) || 0);
        });

        // Lempar total penjumlahannya ke 1 kotak rowspan tadi
        const totalCell = document.getElementById(`total-mk-${kodeMk}`);
        if (totalCell) {
            totalCell.innerText = sum + "%";
            totalCell.style.color = (sum === 100) ? "#16a34a" : "#dc2626"; 
        }
    }

    // =========================================================
    // 3. FUNGSI SIMPAN KE DATABASE
    // =========================================================
    async function simpanBobot() {
        const btnSave = document.querySelector('.btn-save') || document.getElementById('btnSave');
        const oriText = btnSave.innerHTML;
        
        // Cari ada berapa Mata Kuliah di layar
        const rows = document.querySelectorAll('tbody tr[data-mk]');
        let mkList = [];
        rows.forEach(row => {
            const mk = row.getAttribute('data-mk');
            if (!mkList.includes(mk)) mkList.push(mk);
        });

        let dataBobotData = [];
        let mkError = [];

        // Cek satu per satu Mata Kuliah
        mkList.forEach(kodeMk => {
            // Hitung ulang totalnya
            const inputs = document.querySelectorAll(`input[data-mk="${kodeMk}"]`);
            let totalMK = 0;
            inputs.forEach(input => totalMK += (parseInt(input.value) || 0));

            // Jika pas 100%, ambil ke-4 komponen nilai dari tiap baris CPMK-nya
            if (totalMK === 100) {
                const mkRows = document.querySelectorAll(`tr[data-mk="${kodeMk}"]`);
                mkRows.forEach(row => {
                    const kodeCpmk = row.getAttribute('data-cpmk');
                    const t = parseInt(row.querySelector('input[data-field="tugas"]')?.value) || 0;
                    const u = parseInt(row.querySelector('input[data-field="uts"]')?.value) || 0;
                    const p = parseInt(row.querySelector('input[data-field="presentasi"]')?.value) || 0;
                    const a = parseInt(row.querySelector('input[data-field="uas"]')?.value) || 0;

                    dataBobotData.push({
                        kode_mk: kodeMk,
                        kode_cpmk: kodeCpmk,
                        prodi: PRODI,
                        tugas: t,
                        uts: u,
                        presentasi: p,
                        uas: a
                    });
                });
            } else if (totalMK > 0 && totalMK !== 100) {
                // Jika totalnya masih belum pas 100, masukkan ke daftar error
                mkError.push(kodeMk);
            }
        });

        if (mkError.length > 0) {
            alert(`⚠️ Gagal Menyimpan!\n\nMata Kuliah berikut total seluruh bobot CPMK-nya belum pas 100%:\n${mkError.join(', ')}`);
            return;
        }

        if (dataBobotData.length === 0) {
            alert("❌ Belum ada data Mata Kuliah dengan bobot valid (Total 100%) yang bisa disimpan.");
            return;
        }

        btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
        btnSave.disabled = true;

        try {
            const API_SAVE_BOBOT = `${API_BASE}/admin-save-bobot`;
            
            for (const payload of dataBobotData) {
                await fetch(API_SAVE_BOBOT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }

            alert("✅ Sempurna! Master Bobot berhasil disimpan ke Database!");
            loadDataBobot(); // Refresh tabel setelah sukses

        } catch (error) {
            console.error(error);
            alert("❌ Gagal terhubung ke server n8n.");
        } finally {
            btnSave.innerHTML = oriText;
            btnSave.disabled = false;
        }
    }
</script>
</script>
</body>
</html>
