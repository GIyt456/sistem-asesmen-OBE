<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemetaan CPL - BK - Sistem OBE</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <script src="../../../js/template.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --sidebar-bg: #161923; --sidebar-text: #7b8395; --sidebar-hover: #262936; --sidebar-active-text: #ffffff;
            --primary-red: #8b0000; --bg-main: #f9fafb; --text-dark: #111827; --border-color: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark); animation: transitionIn 0.3s ease-in-out; }
        @keyframes transitionIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        /* GAYA SIDEBAR */
        .sidebar { width: 280px; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; padding: 24px 16px; height: 100vh; flex-shrink: 0;}
        .sidebar-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; padding: 0 10px; }
        .sidebar-profile img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .sidebar-profile-info { display: flex; flex-direction: column; }
        .sidebar-profile-info .name { color: white; font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
        .sidebar-profile-info .role { color: var(--sidebar-text); font-size: 9px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
        .sidebar-divider { height: 1px; background-color: rgba(255, 255, 255, 0.08); margin: 5px 10px 10px 10px; }
        .nav-menu { flex: 1; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
        .nav-menu::-webkit-scrollbar { display: none; }
        .menu-category { font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; color: var(--sidebar-text); text-transform: uppercase; margin: 10px 0 10px 10px; }
        .nav-item { padding: 12px 16px; margin-bottom: 4px; cursor: pointer; display: flex; align-items: center; gap: 16px; transition: all 0.2s; border-radius: 8px; font-weight: 500; font-size: 0.80rem; }
        .nav-item:hover, .nav-item.active { background: var(--sidebar-hover); color: var(--sidebar-active-text); }
        .nav-item i { font-size: 1.1rem; width: 20px; text-align: center; }
        .nav-bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; }
        .nav-item.logout { color: #f87171; }
        .nav-item.logout:hover { background: rgba(248, 113, 113, 0.1); }

        /* KONTEN UTAMA */
        .main-content { flex: 1; overflow-y: auto; padding: 40px 50px; }
        .header-container { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .header-subtitle { color: #6b7280; font-size: 0.9rem; font-weight: 500; margin-top: 5px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px; }
        .header-title span { color: var(--primary-red); }

        .btn-save { background: var(--primary-red); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; box-shadow: 0 4px 6px -1px rgba(139, 0, 0, 0.2); }
        .btn-save:hover { background: #6b0000; transform: translateY(-2px); }
        .btn-save:disabled { background: #9ca3af; cursor: not-allowed; transform: none; box-shadow: none; }

        /* DESAIN TABEL MATRIKS */
        .matrix-container { background: white; border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow: auto; max-height: 70vh; }
        
        table { border-collapse: collapse; width: max-content; min-width: 100%; text-align: center; white-space: nowrap; }  

        /* Sticky Header (Atas) */
        th { background: #1e293b; color: white; font-size: 0.85rem; font-weight: 700; padding: 18px 15px; position: sticky; top: 0; z-index: 10; border-right: 1px solid #334155; border-bottom: 2px solid #0f172a; }        

        /* Sticky Column Kiri (Kode BK) */
        th:first-child { left: 0; z-index: 20; background: #0f172a; min-width: 180px; text-align: left; padding-left: 25px; }        td:first-child { position: sticky; left: 0; background: #f8fafc; font-weight: 700; color: var(--primary-red); text-align: left; padding-left: 20px; z-index: 5; border-right: 2px solid var(--border-color); cursor: help; }
        td:first-child { position: sticky; left: 0; background: #f8fafc; font-weight: 700; color: var(--primary-red); text-align: left; padding: 18px 25px; z-index: 5; border-right: 2px solid var(--border-color); cursor: help; }        
       
        /* Efek Hover Baris */
        tbody tr:hover td:not(:first-child) { background-color: #f1f5f9; } 

        /* Checkbox Custom */
        .chk-matrix { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary-red); transition: 0.2s; }
        .chk-matrix:hover { transform: scale(1.2); }

    </style>
</head>
<body>

    <!-- TEMPAT SIDEBAR -->
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="header-container">
            <div>
                <h1 class="header-title">Pemetaan <span>CPL - BK</span></h1>
                <p class="header-subtitle">Arahkan kursor ke Kode BK (baris kiri) untuk melihat nama/deskripsi Bahan Kajian.</p>
            </div>
            <button id="btnSave" class="btn-save" onclick="saveMapping()">
                <i class="fas fa-save"></i> Simpan Matriks
            </button>
        </div>

        <div class="matrix-container">
            <table id="matrixTable">
                <thead id="matrixHead">
                    <tr>
                        <th>Memuat Header...</th>
                    </tr>
                </thead>
                <tbody id="matrixBody">
                    <tr><td style="padding: 30px; text-align: center;">Memuat data dari database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
    const API_BASE = "https://fares-our-films-aquatic.trycloudflare.com/webhook";
    const API_METADATA = `${API_BASE}/get-metadata`;
    const API_GET_BK = `${API_BASE}/get-master-bk`;
    const API_GET_MAPPING = `${API_BASE}/get-mapping-cpl-bk`;
    const API_SAVE_MAPPING = `${API_BASE}/admin-map-cpl-bk`;
    
    // Asumsi default PRODI
    const PRODI = localStorage.getItem("prodi_aktif") || "ti";

    let listCPL = []; // Menyimpan daftar CPL sebagai Kolom
    let listBK = [];  // Menyimpan daftar BK sebagai Baris

    window.onload = async () => {
        if (!localStorage.getItem("user_login")) { window.location.replace("/login/login.html"); return; }
        await loadSidebar();
        await initMatriks();
    };

    async function initMatriks() {
        try {
            // 1. Tarik Data CPL, Master BK, dan Data Mapping secara bersamaan
            const [resMeta, resBk, resMap] = await Promise.all([
                fetch(`${API_METADATA}?prodi=${PRODI}`),
                fetch(API_GET_BK),
                fetch(API_GET_MAPPING)
            ]);

            // 2. TRIK ANTI-KOSONG: Baca sebagai teks dulu. 
            // Jika kosong (karena database belum ada isinya), jadikan array kosong [].
            
            let textMeta = await resMeta.text();
            // Menangani kasus jika API Metadata-mu merespons dengan tanda "=" di depannya
            if (textMeta.startsWith('=')) textMeta = textMeta.substring(1);
            const rawMeta = textMeta ? JSON.parse(textMeta) : [];

            const textBk = await resBk.text();
            listBK = textBk ? JSON.parse(textBk) : [];

            const textMap = await resMap.text();
            const existingMapping = textMap ? JSON.parse(textMap) : [];

            // 3. Filter Meta hanya mengambil tipe CPL dan diurutkan
            listCPL = rawMeta.filter(m => m.tipe === 'cpl').sort((a, b) => a.kode.localeCompare(b.kode));

            // 4. Render tampilan
            renderMatrixTable();
            applyExistingMapping(existingMapping);

        } catch (error) {
            console.error("Detail Error:", error);
            document.getElementById("matrixBody").innerHTML = '<tr><td colspan="10" style="color: red; padding: 20px; font-weight: bold;"><i class="fas fa-exclamation-triangle"></i> Gagal memuat data. Cek Console (F12) untuk detail error.</td></tr>';
        }
    }

    function renderMatrixTable() {
        const thead = document.getElementById("matrixHead");
        const tbody = document.getElementById("matrixBody");

        // --- RENDER HEADER (KOLOM CPL) ---
        let thHtml = `<tr><th>KODE BK</th>`;
        listCPL.forEach(cpl => {
            thHtml += `<th title="${cpl.label || cpl.nama}">${cpl.kode}</th>`;
        });
        thHtml += `</tr>`;
        thead.innerHTML = thHtml;

        // --- RENDER BODY (BARIS BK + CHECKBOX) ---
        let tbHtml = '';
        if(listBK.length === 0) {
            tbHtml = `<tr><td colspan="${listCPL.length + 1}" style="text-align: center; padding: 30px;">Master Data BK masih kosong di database.</td></tr>`;
        } else {
            listBK.forEach(bk => {
                // TRIK: Mengakomodasi berbagai kemungkinan nama kolom dari database
                let namaBahanKajian = bk.nama_bk || bk.BK || bk.nama_bk || bk['Nama BK'] || 'Detail tidak tersedia';
                let kodeBahanKajian = bk.kode_bk || bk['Kode BK'] || bk.kode;

                // Atribut title="..." memanggil variabel namaBahanKajian
                tbHtml += `<tr>
                    <td title="${namaBahanKajian}">
                        <i class="fas fa-info-circle" style="color:#9ca3af; font-size:0.95rem; margin-right:8px;"></i> ${kodeBahanKajian}
                    </td>`;
                
                // Looping Checkbox berdasarkan jumlah CPL
                listCPL.forEach(cpl => {
                    tbHtml += `<td>
                        <input type="checkbox" class="chk-matrix" id="${cpl.kode}_${kodeBahanKajian}" data-cpl="${cpl.kode}" data-bk="${kodeBahanKajian}">
                    </td>`;
                });
                tbHtml += `</tr>`;
            });
        }
        tbody.innerHTML = tbHtml;
    }

    function applyExistingMapping(mappingData) {
        if (!Array.isArray(mappingData)) return;

        // Centang kotak yang sudah ada relasinya di database
        mappingData.forEach(map => {
            const cbId = `${map.kode_cpl}_${map.kode_bk}`;
            const checkbox = document.getElementById(cbId);
            if (checkbox) {
                checkbox.checked = true;
            }
        });
    }

    async function saveMapping() {
        const btnSave = document.getElementById('btnSave');
        btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
        btnSave.disabled = true;

        // Karena n8n kita dirancang menerima 1 CPL beserta array BK-nya (per request),
        // Kita loop per CPL, kumpulkan BK yang dicentang, lalu tembak API.
        
        let fetchPromises = [];

        listCPL.forEach(cpl => {
            // Cari semua checkbox yang baris CPL-nya ini, dan dalam keadaan dicentang
            const checkedBoxes = document.querySelectorAll(`.chk-matrix[data-cpl="${cpl.kode}"]:checked`);
            
            // Ekstrak nilai kode_bk-nya ke dalam array
            const bkList = Array.from(checkedBoxes).map(cb => cb.getAttribute('data-bk'));

            const payload = {
                kode_cpl: cpl.kode,
                bk_list: bkList, // Bisa kosong [], webhook tetap jalan untuk DELETE old mapping
                prodi: PRODI
            };

            // Masukkan ke keranjang antrean Fetch
            const request = fetch(API_SAVE_MAPPING, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            fetchPromises.push(request);
        });

        try {
            // Jalankan semua request berbarengan! (Sangat cepat)
            await Promise.all(fetchPromises);
            alert("✅ Matriks Relasi CPL - BK berhasil disimpan!");
        } catch (error) {
            console.error(error);
            alert("❌ Gagal menyimpan beberapa data ke server. Cek koneksi.");
        } finally {
            btnSave.innerHTML = '<i class="fas fa-save"></i> Simpan Matriks';
            btnSave.disabled = false;
        }
    }

    // --- FUNGSI STANDAR SIDEBAR ---
    async function loadSidebar() {
        try {
            const response = await fetch('/kaprodi/kaprodi_ti/components/sidebar.html');
            if (!response.ok) throw new Error("Sidebar gagal dimuat");
            document.getElementById('sidebar-container').innerHTML = await response.text();
            
            const nameElem = document.getElementById("adminName");
            if (nameElem) nameElem.innerText = localStorage.getItem("user_login") || "Admin";
            
            // Tandai menu matriks aktif di sidebar
            const navMatriks = document.getElementById('nav-matriks-cpl-mk');
            if (navMatriks) navMatriks.style.background = 'var(--sidebar-hover)';
        } catch (error) {
            console.error("Gagal memuat sidebar:", error);
        }
    }

    // Fungsi Animasi Dropdown
    function toggleDropdown(menuId, chevronId) {
        const menu = document.getElementById(menuId);
        const chevron = document.getElementById(chevronId);
        
        if (menu.style.display === 'none' || menu.style.display === '') {
            menu.style.display = 'flex';
            chevron.style.transform = 'rotate(180deg)';
        } else {
            menu.style.display = 'none';
            chevron.style.transform = 'rotate(0deg)';
        }
    }

    // Fungsi Logout
    function logout() {
        if(confirm("Apakah Anda yakin ingin keluar?")) {
            localStorage.removeItem("user_login");
            localStorage.removeItem("user_role");
            window.location.replace('/login/login.html');
        }
    }
</script>
</body>
</html>
