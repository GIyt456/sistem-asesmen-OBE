<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemetaan BK - MK - Sistem OBE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --sidebar-bg: #161923; --sidebar-text: #7b8395; --sidebar-hover: #262936; --sidebar-active-text: #ffffff;
            --primary-blue: #1e3a8a; --primary-red: #8b0000; --bg-main: #f9fafb; --text-dark: #111827; --border-color: #e5e7eb;
        }

        /* GAYA SIDEBAR */
        .sidebar { width: 280px; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; padding: 24px 16px; height: 100vh; flex-shrink: 0;}
        .sidebar-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; padding: 0 10px; }
        .sidebar-profile img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .sidebar-profile-info { display: flex; flex-direction: column; }
        .sidebar-profile-info .name { color: white; font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
        .sidebar-profile-info .role { color: var(--sidebar-text); font-size: 9px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
        .sidebar-divider { height: 1px; background-color: rgba(255, 255, 255, 0.08); margin: 5px 10px 10px 10px; }
        .nav-menu { flex: 1; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
        .nav-menu::-webkit-scrollbar { display: none; }
        .menu-category { font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; color: var(--sidebar-text); text-transform: uppercase; margin: 10px 0 10px 10px; }
        .nav-item { padding: 12px 16px; margin-bottom: 4px; cursor: pointer; display: flex; align-items: center; gap: 16px; transition: all 0.2s; border-radius: 8px; font-weight: 500; font-size: 0.80rem; }
        .nav-item:hover, .nav-item.active { background: var(--sidebar-hover); color: var(--sidebar-active-text); }
        .nav-item i { font-size: 1.1rem; width: 20px; text-align: center; }
        .nav-bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; }
        .nav-item.logout { color: #f87171; }
        .nav-item.logout:hover { background: rgba(248, 113, 113, 0.1); }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark); animation: transitionIn 0.3s ease-in-out; }
        @keyframes transitionIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .main-content { flex: 1; overflow-y: auto; padding: 40px 50px; }
        .header-container { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); }
        .header-title span { color: var(--primary-red); }

        .btn-save { background: var(--primary-red); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; box-shadow: 0 4px 6px -1px rgba(139,0,0,0.2); }
        .btn-save:hover { background: #6b0000; transform: translateY(-2px); }

        /* Matriks Styling - 2 Kolom Kiri Sticky */
        .matrix-container { background: white; border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: auto; max-height: 70vh; }
        table { border-collapse: collapse; width: max-content; min-width: 100%; text-align: center; }
        
        th { background: #1e293b; color: white; font-size: 0.85rem; font-weight: 700; padding: 15px; position: sticky; top: 0; z-index: 10; border-right: 1px solid #334155; border-bottom: 2px solid #0f172a; }
        
        /* Kolom 1 (Sandi) Sticky */
        th:nth-child(1) { left: 0; z-index: 20; background: #0f172a; min-width: 100px; text-align: left; padding-left: 20px; }
        td:nth-child(1) { position: sticky; left: 0; background: #f8fafc; font-weight: 800; color: var(--primary-red); text-align: left; padding-left: 20px; z-index: 5; border-right: 1px solid var(--border-color); }
        
        /* Kolom 2 (Bahan Kajian) Sticky */
        th:nth-child(2) { left: 100px; z-index: 20; background: #0f172a; min-width: 300px; text-align: left; border-right: 2px solid #334155; }
        td:nth-child(2) { position: sticky; left: 100px; background: #f8fafc; font-weight: 600; color: #1e293b; text-align: left; z-index: 5; border-right: 2px solid var(--border-color); }

        td { padding: 12px 15px; border: 1px solid var(--border-color); transition: background 0.2s; }
        tbody tr:hover td:not(:nth-child(1)):not(:nth-child(2)) { background-color: #f1f5f9; }
        
        .chk-matrix { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary-red); transition: 0.2s; }
        .chk-matrix:hover { transform: scale(1.2); }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="header-container">
            <div>
                <h1 class="header-title">Pemetaan <span>BK - MK</span></h1>
                <p style="color: #64748b; margin-top: 5px;">Arahkan kursor ke Kode MK (kolom atas) untuk melihat nama lengkap Mata Kuliah.</p>
            </div>
            <button id="btnSave" class="btn-save" onclick="saveMapping()">
                <i class="fas fa-save"></i> Simpan Matriks
            </button>
        </div>

        <div class="matrix-container">
            <table id="matrixTable">
                <thead id="matrixHead"><tr><th>Memuat...</th></tr></thead>
                <tbody id="matrixBody">
                    <tr><td style="padding: 30px; text-align: center;">Menarik data dari database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
    const API_BASE = "https://computing-epson-profits-script.trycloudflare.com/webhook";
    const API_METADATA = `${API_BASE}/get-metadata`;
    const API_MASTER_BK = `${API_BASE}/get-master-bk`;
    const API_GET_MAPPING = `${API_BASE}/get-mapping-bk-mk`;
    const API_SAVE_MAPPING = `${API_BASE}/admin-map-bk-mk`;

    const PRODI = localStorage.getItem("prodi_aktif") || "ti";

    let listMK = [];
    let listBK = [];

    window.onload = async () => {
        await loadSidebar();
        await initMatriks();
    };

    async function initMatriks() {
        try {
            const [resMeta, resBK, resMap] = await Promise.all([
                fetch(`${API_METADATA}?prodi=${PRODI}`),
                fetch(API_MASTER_BK),
                fetch(API_GET_MAPPING)
            ]);

            // Trik Anti-Kosong
            let textMeta = await resMeta.text();
            if (textMeta.startsWith('=')) textMeta = textMeta.substring(1);
            const rawMeta = textMeta ? JSON.parse(textMeta) : [];

            let textBK = await resBK.text();
            listBK = textBK ? JSON.parse(textBK) : [];

            let textMap = await resMap.text();
            const existingMapping = textMap ? JSON.parse(textMap) : [];

            // Hanya ambil data Mata Kuliah (MK)
            listMK = rawMeta.filter(m => m.tipe === 'mk').sort((a, b) => a.kode.localeCompare(b.kode));

            renderTable();
            applyMapping(existingMapping);
        } catch (e) { 
            console.error(e); 
            document.getElementById("matrixBody").innerHTML = '<tr><td colspan="5" style="color: red; padding: 20px;">Gagal memuat data. Cek Console.</td></tr>';
        }
    }

    function renderTable() {
        const thead = document.getElementById("matrixHead");
        const tbody = document.getElementById("matrixBody");

        // Header: KODE BK, NAMA BK, lalu KODE MK...
        let thHtml = `<tr><th>Sandi</th><th>Bahan Kajian</th>`;
        listMK.forEach(mk => {
            let safeLabel = (mk.label || mk.nama || "MK").replace(/"/g, '&quot;');
            thHtml += `<th title="${safeLabel}" style="cursor: help;">${mk.kode}</th>`;
        });
        thHtml += `</tr>`;
        thead.innerHTML = thHtml;

        // Body: Baris per BK
        let tbHtml = '';
        if(listBK.length === 0) {
            tbHtml = `<tr><td colspan="${listMK.length + 2}" style="padding: 30px; text-align: center;">Data Master BK kosong.</td></tr>`;
        } else {
            listBK.forEach(bk => {
                let safeName = (bk.nama_bk || bk.nama || "Tanpa Nama").replace(/"/g, '&quot;');
                
                tbHtml += `<tr>
                    <td>${bk.kode_bk}</td>
                    <td title="${safeName}">${safeName}</td>`;
                
                // Checkbox MK
                listMK.forEach(mk => {
                    tbHtml += `<td><input type="checkbox" class="chk-matrix" id="${bk.kode_bk}_${mk.kode}" data-bk="${bk.kode_bk}" data-mk="${mk.kode}"></td>`;
                });
                tbHtml += `</tr>`;
            });
        }
        tbody.innerHTML = tbHtml;
    }

    function applyMapping(data) {
        if (!Array.isArray(data)) return;
        data.forEach(m => {
            const cb = document.getElementById(`${m.kode_bk}_${m.kode_mk}`);
            if (cb) cb.checked = true;
        });
    }

    async function saveMapping() {
        const btn = document.getElementById('btnSave');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
        btn.disabled = true;

        let promises = [];
        
        // Loop per BK, ambil semua MK yang dicentang
        listBK.forEach(bk => {
            const checked = document.querySelectorAll(`.chk-matrix[data-bk="${bk.kode_bk}"]:checked`);
            const mkList = Array.from(checked).map(c => c.getAttribute('data-mk'));

            promises.push(fetch(API_SAVE_MAPPING, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ kode_bk: bk.kode_bk, mk_list: mkList, prodi: PRODI })
            }));
        });

        try {
            await Promise.all(promises);
            alert("✅ Matriks Pemetaan BK - MK berhasil disimpan!");
        } catch (e) { alert("❌ Gagal menyimpan data ke server."); }
        finally { btn.innerHTML = '<i class="fas fa-save"></i> Simpan Matriks'; btn.disabled = false; }
    }

    //Sidebar
    async function loadSidebar() {
        try {
            const response = await fetch('/kaprodi/kaprodi_ti/components/sidebar.html');
            if (!response.ok) throw new Error("Sidebar gagal dimuat");
            document.getElementById('sidebar-container').innerHTML = await response.text();
            
            const nameElem = document.getElementById("adminName");
            if (nameElem) nameElem.innerText = localStorage.getItem("user_login") || "Admin";
            
            // Tandai menu matriks aktif di sidebar
            const navMatriks = document.getElementById('nav-matriks-cpl-mk');
            if (navMatriks) navMatriks.style.background = 'var(--sidebar-hover)';
        } catch (error) {
            console.error("Gagal memuat sidebar:", error);
        }
    }

    // Fungsi Animasi Dropdown
    function toggleDropdown(menuId, chevronId) {
        const menu = document.getElementById(menuId);
        const chevron = document.getElementById(chevronId);
        
        if (menu.style.display === 'none' || menu.style.display === '') {
            menu.style.display = 'flex';
            chevron.style.transform = 'rotate(180deg)';
        } else {
            menu.style.display = 'none';
            chevron.style.transform = 'rotate(0deg)';
        }
    }

    // Fungsi Logout
    function logout() {
        if(confirm("Apakah Anda yakin ingin keluar?")) {
            localStorage.removeItem("user_login");
            localStorage.removeItem("user_role");
            window.location.replace('/login/login.html');
        }
    }
</script>
</body>
</html>
