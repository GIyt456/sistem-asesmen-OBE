<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Mata Kuliah - Sistem OBE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { 
            --sidebar-bg: #161923; --sidebar-text: #7b8395; --sidebar-hover: #262936; --sidebar-active-text: #ffffff;
            --primary-blue: #1e3a8a; --primary-red: #8b0000; --bg-main: #f9fafb; --text-dark: #111827; --border-color: #e5e7eb;
            --success-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark); animation: transitionIn 0.3s ease-in-out; }
        @keyframes transitionIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        /* GAYA SIDEBAR */
        .sidebar { width: 280px; background: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; padding: 24px 16px; height: 100vh; flex-shrink: 0;}
        .sidebar-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; padding: 0 10px; }
        .sidebar-profile img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .sidebar-profile-info { display: flex; flex-direction: column; }
        .sidebar-profile-info .name { color: white; font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
        .sidebar-profile-info .role { color: var(--sidebar-text); font-size: 9px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
        .sidebar-divider { height: 1px; background-color: rgba(255, 255, 255, 0.08); margin: 5px 10px 10px 10px; }
        .nav-menu { flex: 1; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
        .nav-menu::-webkit-scrollbar { display: none; }
        .menu-category { font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; color: var(--sidebar-text); text-transform: uppercase; margin: 10px 0 10px 10px; }
        .nav-item { padding: 12px 16px; margin-bottom: 4px; cursor: pointer; display: flex; align-items: center; gap: 16px; transition: all 0.2s; border-radius: 8px; font-weight: 500; font-size: 0.80rem; }
        .nav-item:hover, .nav-item.active { background: var(--sidebar-hover); color: var(--sidebar-active-text); }
        .nav-item i { font-size: 1.1rem; width: 20px; text-align: center; }
        .nav-bottom { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; }
        .nav-item.logout { color: #f87171; }
        .nav-item.logout:hover { background: rgba(248, 113, 113, 0.1); }
        
        .main-content { flex: 1; min-width: 0; overflow-y: auto; padding: 40px 50px; }
        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .header-title-area { display: flex; flex-direction: column; }
        .header-subtitle { color: #64748b; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); }
        .header-title span { color: var(--primary-red); }
        .badge-prodi { background: var(--primary-red); color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; }
        
        /* Tabel Container dengan Scroll Horizontal */
        .table-container { background: white; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow-x: auto; margin-bottom: 40px; }
        table { width: 100%; min-width: 700px; border-collapse: collapse; text-align: left; }
        th { background: #f8fafc; padding: 15px 20px; font-size: 0.85rem; font-weight: 700; color: #475569; border-bottom: 2px solid var(--border-color); text-transform: uppercase; }
        td { padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; color: #1e293b; vertical-align: middle; }
        
        .action-buttons { display: flex; gap: 10px; align-items: center; }
        .btn-action { color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-dark { background: #1e293b; }
        .btn-dark:hover { background: #0f172a; transform: translateY(-2px); }
        .btn-download { background: #475569; }
        .btn-download:hover { background: #334155; transform: translateY(-2px); }
        .btn-upload { background: var(--success-green); }
        .btn-upload:hover { background: #059669; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="header-container">
            <div class="header-title-area">
                <div class="header-subtitle">KELOLA KURIKULUM</div>
                <h1 class="header-title">KELOLA MATA <span>KULIAH</span></h1>
            </div>
            <div class="badge-prodi">Teknik Informatika</div>
        </div>

        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div>
                    <h3 style="margin: 0; font-size: 1.4rem; font-weight: 800;">Susunan Mata Kuliah</h3>
                    <p style="margin: 4px 0 0 0; color: #64748b; font-size: 0.95rem; font-weight: 500;">Menampilkan Daftar Mata Kuliah Terstruktur</p>
                </div>
                
                <div class="action-buttons">
                    <button class="btn-action btn-download" onclick="exportKeExcel()">
                        <i class="fas fa-file-download"></i> Download Excel
                    </button>
                    
                    <input type="file" id="fileExcel" accept=".xlsx, .xls" style="display: none;" onchange="uploadExcel()">
                    <button class="btn-action btn-upload" onclick="document.getElementById('fileExcel').click()">
                        <i class="fas fa-file-upload"></i> Impor Excel
                    </button>

                    <button class="btn-action btn-dark" onclick="loadData()">
                        <i class="fas fa-sync-alt"></i> Refresh Data
                    </button>
                </div>
            </div>
            
            <div id="container-tabel-semester"></div>
        </div>
    </div>

<script>
    const PRODI = 'ti'; 
    const API_BASE = "https://arm-semester-inflation-vintage.trycloudflare.com/webhook"; 
    const API_MATKUL = `${API_BASE}/get-susunan-matkul?prodi=${PRODI}`;
    const API_UPDATE = `${API_BASE}/admin-update-master`;
    const API_UPLOAD = `${API_BASE}/upload-master-mk`;
    const userLogin = localStorage.getItem("user_login");

    async function loadSidebar() {
        try {
            const response = await fetch('/kaprodi/kaprodi_ti/components/sidebar.html');
            if (!response.ok) throw new Error("File sidebar tidak ditemukan");
            document.getElementById('sidebar-container').innerHTML = await response.text();
            
            const nameElem = document.getElementById("adminName");
            if (nameElem) nameElem.innerText = localStorage.getItem("user_login") || "Admin";
            
            const navMk = document.getElementById('nav-mk');
            if(navMk) navMk.style.background = 'var(--sidebar-hover)';
        } catch (error) { console.error('Gagal memuat sidebar:', error); }
    }

    async function loadData() { 
        const container = document.getElementById('container-tabel-semester');
        if (!container) return;
        
        container.innerHTML = "<p style='text-align:center; padding:20px;'><i class='fas fa-spinner fa-spin'></i> Memuat data...</p>";

        try {
            const res = await fetch(API_MATKUL); 
            const data = await res.json(); 
            container.innerHTML = "";

            const perSemester = data.reduce((acc, item) => {
                if (!acc[item.semester]) acc[item.semester] = [];
                acc[item.semester].push(item);
                return acc;
            }, {});

            Object.keys(perSemester).sort().forEach(sem => {
                let tableHTML = `
                    <h4 style="margin-bottom: 15px; margin-top: 10px; font-size: 1.1rem; color: var(--primary-red); font-weight: 700;">
                        <i class="fas fa-graduation-cap"></i> SEMESTER ${sem}
                    </h4>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th width="15%">Kode MK</th>
                                    <th>Nama Mata Kuliah</th>
                                    <th width="15%" style="text-align: center;">SKS</th>
                                    <th width="12%" style="text-align: center;">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>`;

                perSemester[sem].forEach(mk => {
                    tableHTML += `
                        <tr>
                            <td style="font-weight: 800; color: var(--primary-blue);">${mk.kode_mk}</td>
                            <td><input type="text" id="in-${mk.kode_mk}" value="${mk.nama_mk}" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; font-size: 0.95rem;"></td>
                            <td style="text-align: center;"><input type="number" id="sks-${mk.kode_mk}" value="${mk.sks}" style="width:70px; padding:10px; border:1px solid #cbd5e1; border-radius:6px; text-align:center; font-weight: 600;" min="1" max="6"></td>
                            <td style="text-align:center;">
                                <button class="btn-action btn-dark" style="padding: 8px 16px; margin: 0 auto;" onclick="simpanEdit('mk', '${mk.kode_mk}')">
                                    Simpan
                                </button>
                            </td>
                        </tr>`;
                });

                tableHTML += `</tbody></table></div>`;
                container.innerHTML += tableHTML;
            });

        } catch(e) { 
            container.innerHTML = "<p style='color:red; text-align:center; padding: 20px;'>Gagal menarik data. Pastikan n8n menyala.</p>";
        }
    }

    async function exportKeExcel() {
        const btn = document.querySelector('.btn-download');
        const oriText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyiapkan...';
        btn.disabled = true;

        try {
            const res = await fetch(API_MATKUL);
            const data = await res.json();
            if (!data || data.length === 0) return alert("Tidak ada data.");

            const dataUntukExcel = data.map(mk => ({ 'kode_mk': mk.kode_mk, 'nama_mk': mk.nama_mk, 'sks': mk.sks, 'semester': mk.semester }));
            const worksheet = XLSX.utils.json_to_sheet(dataUntukExcel);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Master_MK");
            XLSX.writeFile(workbook, `Susunan_MK_${PRODI}.xlsx`);
        } catch (e) { alert("Gagal mengekspor data."); } 
        finally { btn.innerHTML = oriText; btn.disabled = false; }
    }

    async function uploadExcel() {
        const fileInput = document.getElementById('fileExcel');
        const file = fileInput.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('data', file); 
        formData.append('prodi', PRODI);

        const btnUpload = document.querySelector('.btn-upload');
        const oriText = btnUpload.innerHTML;
        btnUpload.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengimpor...';
        btnUpload.disabled = true;

        try {
            const res = await fetch(API_UPLOAD, { method: 'POST', body: formData });
            if (res.ok) { alert("✅ Data Excel berhasil diimpor!"); await loadData(); } 
            else { alert("❌ Gagal memproses file Excel."); }
        } catch (e) { alert("❌ Terjadi kesalahan koneksi."); } 
        finally { btnUpload.innerHTML = oriText; btnUpload.disabled = false; fileInput.value = ''; }
    }

    window.onload = async () => {
        if (!userLogin) { window.location.replace("../login/login.html"); return; }
        await loadSidebar(); 
        await loadData();    
    };

    async function simpanEdit(tipe, kode) { 
        const value = document.getElementById(`in-${kode}`).value; 
        const sksBaru = document.getElementById(`sks-${kode}`).value;
        const btn = event.currentTarget;
        const oldHtml = btn.innerHTML;
        
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;

        try {
            const res = await fetch(API_UPDATE, { 
                method: "POST", headers: {"Content-Type":"application/json"}, 
                body: JSON.stringify({ tipe: tipe, kode: kode, value: value, sks: parseInt(sksBaru), prodi: PRODI }) 
            }); 
            if(res.ok) alert("✅ Data Mata Kuliah & SKS Berhasil Diperbarui!");
            else alert("❌ Gagal menyimpan data.");
        } catch (e) { alert("Terjadi kesalahan jaringan."); } 
        finally { btn.innerHTML = oldHtml; btn.disabled = false; }
    }

    function toggleDropdown(menuId, chevronId) {
        const menu = document.getElementById(menuId), chevron = document.getElementById(chevronId);
        if(menu) menu.style.display = menu.style.display === 'none' ? 'flex' : 'none';
        if(chevron) chevron.style.transform = chevron.style.transform === 'rotate(180deg)' ? 'rotate(0deg)' : 'rotate(180deg)';
    }

    function logout() {
        if(confirm("Apakah Anda yakin ingin keluar?")) {
            localStorage.removeItem("user_login"); localStorage.removeItem("user_role");
            window.location.replace('/login/login.html');
        }
    }
</script>
</body>
</html>
