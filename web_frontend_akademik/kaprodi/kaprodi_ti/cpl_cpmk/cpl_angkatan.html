<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemenuhan CPL per Angkatan - Sistem OBE</title>
    
    <link rel="stylesheet" href="/css/style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .filter-container { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e5e7eb; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; gap: 15px; align-items: center; justify-content: space-between; }
        .table-responsive { overflow-x: auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; }
        .table-cpl { width: 100%; border-collapse: collapse; min-width: 1100px; }
        .table-cpl th, .table-cpl td { padding: 12px 10px; border: 1px solid #e5e7eb; text-align: center; font-size: 0.9rem; vertical-align: middle; }
        .table-cpl th { background: #111827; color: white; font-weight: 700; text-transform: uppercase; font-size: 0.85rem; position: sticky; top: 0; z-index: 2; }
        
        /* Sticky Column untuk No dan Nama */
        .table-cpl th.sticky-col, .table-cpl td.sticky-col { position: sticky; left: 0; background-color: white; z-index: 3; border-right: 2px solid #cbd5e1; }
        .table-cpl th.sticky-col { background-color: #111827; }
        .table-cpl th.sticky-col:nth-child(2), .table-cpl td.sticky-col:nth-child(2) { left: 40px; }
        
        .badge-score { padding: 6px 12px; border-radius: 6px; font-weight: 800; font-size: 0.9rem; }
        
        body { animation: transitionIn 0.3s ease-in-out; }
        @keyframes transitionIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>
    
    <div class="main-content">
        <div id="navbar-container"></div>

        <div class="content-wrapper">
            <div class="header-container" style="margin-bottom: 20px;">
                <div class="header-title-area">
                    <div class="header-subtitle">EVALUASI & RPS</div>
                    <h1 class="header-title">PEMENUHAN NILAI <span>CPL</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <p style="margin: 0 0 20px 0; color: #64748b; font-size: 0.95rem;">Pantau persentase pencapaian Capaian Pembelajaran Lulusan (CPL) dari akumulasi seluruh mata kuliah per angkatan.</p>

            <div class="filter-container">
                <div style="display: flex; gap: 15px; align-items: center;">
                    <label style="font-weight: 700; color: #1e293b;"><i class="fas fa-users"></i> Pilih Angkatan:</label>
                    <select id="selectAngkatan" class="form-control" style="width: 250px; font-weight: 500;">
                        <option value="2023">Angkatan 2023</option>
                        <option value="2022">Angkatan 2022</option>
                        <option value="2021">Angkatan 2021</option>
                    </select>
                    <button class="btn-dark" style="padding: 12px 25px; border: none; font-size: 0.95rem;" onclick="loadDataCPL()">
                        <i class="fas fa-search"></i> Tampilkan Data
                    </button>
                </div>
                
                <button class="btn-action" style="background: #10b981; color: white; padding: 12px 20px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer;" onclick="window.print()">
                    <i class="fas fa-print"></i> Cetak Laporan
                </button>
            </div>

            <div class="table-responsive">
                <table class="table-cpl">
                    <thead id="headerTable">
                        <tr>
                            <th class="sticky-col" width="5%">NO</th>
                            <th class="sticky-col text-left" width="25%" style="text-align: left;">NIM & NAMA MAHASISWA</th>
                            <th>MENGHITUNG DATA...</th>
                        </tr>
                    </thead>
                    <tbody id="bodyTable">
                        <tr><td colspan="15" style="padding: 40px; color: #64748b; text-align: center;"><i class="fas fa-info-circle"></i> Silakan pilih angkatan dan klik "Tampilkan Data".</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/template.js"></script>

    <script>
        // DETEKSI PRODI DINAMIS
        const PRODI = localStorage.getItem("prodi_aktif") || "si"; 
        
        // PENTING: Ganti URL di bawah dengan link Cloudflare Tunnel n8n Anda!
        const API_BASE = "https://eco-monkey-gentleman-pipeline.trycloudflare.com/webhook"; 
        const API_GET_CPL = `${API_BASE}/get-cpl-angkatan`;

        // SATPAM HALAMAN
        const userLogin = localStorage.getItem("user_login");
        if (!userLogin) window.location.replace("/login/login.html");

        // Tema Dinamis
        let warnaTeksNim = '#8b0000'; // Default Merah TI

        document.addEventListener("DOMContentLoaded", () => {
            const badge = document.getElementById("prodiBadge");
            if(badge) badge.innerText = PRODI === "si" ? "Sistem Informasi" : "Teknik Informatika";
            
            if(PRODI === "si") {
                badge.style.background = "var(--primary-teal)";
                document.querySelector('.header-title span').style.color = "var(--primary-teal)";
                warnaTeksNim = 'var(--primary-teal)';
            }
        });

        // FUNGSI KALKULASI CPL
        async function loadDataCPL() {
            const angkatan = document.getElementById("selectAngkatan").value;
            const bodyTbl = document.getElementById("bodyTable");
            const headTbl = document.getElementById("headerTable");
            
            bodyTbl.innerHTML = `<tr><td colspan="15" style="text-align: center; padding: 40px; color: #64748b;"><i class="fas fa-spinner fa-spin" style="font-size: 1.5rem; display: block; margin-bottom: 10px;"></i> Menghimpun & mengkalkulasi jutaan bobot CPL dari server...</td></tr>`;

            try {
                // Menambahkan parameter angkatan & prodi agar data aman
                const res = await fetch(`${API_GET_CPL}?angkatan=${angkatan}&prodi=${PRODI}`);
                if(!res.ok) throw new Error("Gagal ambil data");
                const data = await res.json();

                if(!data || data.length === 0 || !data[0].nim) {
                    bodyTbl.innerHTML = `<tr><td colspan="15" style="text-align: center; color: red; padding: 30px;"><i class="fas fa-exclamation-circle"></i> Belum ada data pemenuhan CPL untuk Angkatan ${angkatan} di prodi ini.</td></tr>`;
                    return;
                }

                // 1. Ekstrak Header CPL
                let cplSet = new Set();
                data.forEach(item => { if(item.kode_cpl) cplSet.add(item.kode_cpl) });
                let cplList = Array.from(cplSet).sort();

                // Generate Header Table
                let headHtml = `<tr>
                                    <th class="sticky-col" width="5%">NO</th>
                                    <th class="sticky-col" width="25%" style="text-align: left;">NIM & NAMA MAHASISWA</th>`;
                cplList.forEach(cpl => { headHtml += `<th>${cpl}</th>`; });
                headHtml += `</tr>`;
                headTbl.innerHTML = headHtml;

                // 2. Kelompokkan Data per Mahasiswa
                let mhsData = {};
                data.forEach(item => {
                    if(!mhsData[item.nim]) {
                        mhsData[item.nim] = { nama: item.nama_mahasiswa, nilai_cpl: {} };
                    }
                    if(item.total_bobot_cpl > 0) {
                        let skorAsli = (item.total_nilai_tertimbang / item.total_bobot_cpl) * 100;
                        mhsData[item.nim].nilai_cpl[item.kode_cpl] = skorAsli.toFixed(2);
                    }
                });

                // 3. Cetak Baris Tabel
                bodyTbl.innerHTML = "";
                let no = 1;
                for (let nim in mhsData) {
                    let mhs = mhsData[nim];
                    let rowHtml = `<tr>
                        <td class="sticky-col" style="font-weight: bold; color: #475569;">${no++}</td>
                        <td class="sticky-col" style="text-align: left;">
                            <div style="font-weight: 800; color: ${warnaTeksNim}; font-size: 0.95rem;">${nim}</div>
                            <div style="font-size: 0.85rem; font-weight: 500; color: #1e293b; margin-top: 2px;">${mhs.nama || '-'}</div>
                        </td>`;
                    
                    cplList.forEach(cpl => {
                        let skor = mhs.nilai_cpl[cpl] || 0;
                        // Warna berdasarkan ketercapaian (Misal standar lulus CPL adalah 60)
                        let color = skor >= 60 ? 'background: #dcfce7; color: #166534;' : (skor > 0 ? 'background: #fef08a; color: #854d0e;' : 'background: #f1f5f9; color: #94a3b8;');
                        let skorTampil = skor > 0 ? skor : '-';
                        rowHtml += `<td><span class="${skor > 0 ? 'badge-score' : ''}" style="${color}">${skorTampil}</span></td>`;
                    });
                    
                    rowHtml += `</tr>`;
                    bodyTbl.innerHTML += rowHtml;
                }

            } catch (e) {
                bodyTbl.innerHTML = `<tr><td colspan="15" style="text-align: center; color: red; padding: 30px;">Error: Gagal terhubung ke N8N atau URL webhook salah.</td></tr>`;
            }
        }

        // Tampilkan data otomatis saat halaman dibuka
        window.onload = () => {
            setTimeout(loadDataCPL, 400); 
        };
    </script>
</body>
</html>
