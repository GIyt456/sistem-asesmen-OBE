<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemenuhan CPL per Angkatan - Sistem OBE</title>
    
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/js/api_config.js"></script>
    <script src="/js/template.js"></script> 
    <link rel="stylesheet" href="eval_cpl.css">
</head>
<body>

    <div id="sidebar-container"></div>
    <div id="navbar-container"></div>
    <div class="main-content">
        <div class="content-wrapper" style="padding-top: 0px !important;">
            <div class="header-container" style="margin-bottom: 20px;">
                <div class="header-title-area">
                    <div class="header-subtitle">EVALUASI & RPS</div>
                    <h1 class="header-title">EVALUASI <span>CPL ANGKATAN</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <p style="margin: 0 0 20px 0; color: #64748b; font-size: 0.95rem;">Memantau tingkat pemenuhan Capaian Pembelajaran Lulusan (CPL) dari setiap individu mahasiswa dalam satu angkatan secara detail.</p>

            <div class="filter-container">
                <div style="display: flex; gap: 15px; align-items: center;">
                    <label style="font-weight: 700; color: #1e293b;"><i class="fas fa-users"></i> Cari Angkatan:</label>
                    <input type="number" id="inputAngkatan" placeholder="Contoh: 2025" value="2025" style="padding: 10px 15px; border-radius: 6px; border: 1px solid #cbd5e1; width: 140px; font-weight: bold; outline: none;">
                    
                    <button style="background: #1e293b; color: white; padding: 10px 20px; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; font-weight: 600;" onclick="loadEvalCPL()">
                        <i class="fas fa-search"></i> Analisis Data
                    </button>
                </div>

                <button style="background: #10b981; color: white; padding: 10px 20px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer;" onclick="window.print()">
                    <i class="fas fa-print"></i> Cetak Laporan
                </button>
            </div>

            <div class="table-responsive">
                <table class="table-cpl">
                    <thead id="headTable">
                        <tr>
                            <th width="5%">NO</th>
                            <th width="25%" class="text-left">NIM & NAMA MAHASISWA</th>
                            <th>DATA CPL</th>
                        </tr>
                    </thead>
                    <tbody id="bodyTable">
                        <tr><td colspan="15" style="padding: 40px; color: #64748b; text-align: center;"><i class="fas fa-info-circle"></i> Silakan ketik tahun angkatan dan klik "Analisis Data".</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 1. TANGKAP IDENTITAS LOGIN SECARA DINAMIS
        const PRODI = localStorage.getItem("prodi_aktif") || "ti"; 
        const API_EVAL_CPL = `${API_BASE}/get-eval-cpl`;
        let warnaTeksCpl = '#8b0000'; // Default warna merah TI

        // 2. RUBAH TEMA OTOMATIS BERDASARKAN PRODI
        document.addEventListener("DOMContentLoaded", () => {
            const userLogin = localStorage.getItem("user_login");
            if (!userLogin) window.location.replace("/login/login.html");

            const badge = document.getElementById("prodiBadge");
            const titleSpan = document.querySelector('.header-title span');
            
            if(PRODI === "si") {
                badge.innerText = "Sistem Informasi";
                badge.style.background = "#0097a7"; // Tema SI
                titleSpan.style.color = "#0097a7";
                warnaTeksCpl = '#0097a7';
            } else {
                badge.innerText = "Teknik Informatika";
                badge.style.background = "#8b0000"; // Tema TI
                titleSpan.style.color = "#8b0000";
                warnaTeksCpl = '#8b0000';
            }
        });

        // 3. FUNGSI ANALISIS DATA CPL
        async function loadEvalCPL() {
            const inputThn = document.getElementById("inputAngkatan").value;
            const angkatan = inputThn ? inputThn.trim() : "2025"; 
            
            const headTbl = document.getElementById("headTable");
            const bodyTbl = document.getElementById("bodyTable");
            
            bodyTbl.innerHTML = `<tr><td colspan="15" style="text-align: center; padding: 40px; color: #64748b;"><i class="fas fa-spinner fa-spin" style="font-size: 1.5rem; display: block; margin-bottom: 10px;"></i> Mengkalkulasi data CPL Angkatan ${angkatan}...</td></tr>`;

            try {
                // Mengirim parameter pencarian & identitas prodi ke N8N
                const res = await fetch(`${API_EVAL_CPL}?angkatan=${angkatan}&prodi=${PRODI}`);
                if(!res.ok) throw new Error("Gagal mengambil data");
                
                const rawText = await res.text();
                if (!rawText || rawText.trim() === "" || rawText.includes("empty_database")) {
                    bodyTbl.innerHTML = `<tr><td colspan="15" style="text-align: center; color: #dc2626; padding: 30px;"><i class="fas fa-exclamation-circle"></i> Tidak ada rekap nilai untuk angkatan ${angkatan} di program studi ini.</td></tr>`;
                    headTbl.innerHTML = `<tr><th>NO</th><th class="text-left">NIM & NAMA MAHASISWA</th><th>DATA CPL</th></tr>`;
                    return;
                }

                const data = JSON.parse(rawText);

                if (data.length === 0 || !data[0].nim) {
                    bodyTbl.innerHTML = `<tr><td colspan="15" style="text-align: center; color: #dc2626; padding: 30px;"><i class="fas fa-exclamation-circle"></i> Tidak ada rekap nilai untuk angkatan ${angkatan} di program studi ini.</td></tr>`;
                    headTbl.innerHTML = `<tr><th>NO</th><th class="text-left">NIM & NAMA MAHASISWA</th><th>DATA CPL</th></tr>`;
                    return;
                }

                // Mengelompokkan data berdasarkan NIM
                let mhsData = {};
                let cplSet = new Set();

                data.forEach(item => {
                    if(!item.nim) return;
                    if(!mhsData[item.nim]) {
                        mhsData[item.nim] = { nama: item.nama_mahasiswa, nilai_cpl: {} };
                    }
                    if(item.kode_cpl) {
                        cplSet.add(item.kode_cpl);
                        let skor = item.total_bobot_cpl > 0 ? (item.total_nilai_tertimbang / item.total_bobot_cpl) * 100 : 0;
                        mhsData[item.nim].nilai_cpl[item.kode_cpl] = skor.toFixed(2);
                    }
                });

                let cplList = Array.from(cplSet).sort();

                // Generate Header Kolom CPL Dinamis
                let headHtml = `<tr><th width="5%">NO</th><th width="25%" class="text-left">NIM & NAMA MAHASISWA</th>`;
                cplList.forEach(cpl => { headHtml += `<th>${cpl}</th>`; });
                headHtml += `</tr>`;
                headTbl.innerHTML = headHtml;

                // Generate Body Baris Mahasiswa
                bodyTbl.innerHTML = "";
                let no = 1;
                let sortedNim = Object.keys(mhsData).sort();

                sortedNim.forEach(nim => {
                    let mhs = mhsData[nim];
                    
                    // Kita gabungkan info NO, NIM, dan NAMA ke dalam satu baris header kartu via atribut data-mhs
                    let rowHtml = `<tr>
                        <td class="col-nomor" data-label="NO">${no++}</td>
                        <td class="col-identitas" data-mhs="${nim} - ${mhs.nama || '-'}">
                            <div style="font-weight: 800; color: ${warnaTeksCpl}; font-size: 0.95rem;">${nim}</div>
                            <div style="font-size: 0.85rem; font-weight: 600; color: #1e293b; margin-top: 2px;">${mhs.nama || '-'}</div>
                        </td>`;
                    
                    cplList.forEach(cpl => {
                        let skor = mhs.nilai_cpl[cpl] || 0;
                        let color = skor >= 60 ? 'background: #dcfce7; color: #166534; border: 1px solid #bbf7d0;' : (skor > 0 ? 'background: #fee2e2; color: #991b1b; border: 1px solid #fecaca;' : 'background: #f1f5f9; color: #94a3b8;');
                        let skorTampil = skor > 0 ? skor : '-';
                        let badgeClass = skor > 0 ? 'display: inline-block; padding: 4px 12px; border-radius: 6px; font-weight: bold;' : '';
                        
                        rowHtml += `<td class="col-nilai" data-label="${cpl}"><span style="${badgeClass} ${color}">${skorTampil}</span></td>`;
                    });
                    
                    rowHtml += `</tr>`;
                    bodyTbl.innerHTML += rowHtml;
                });

            } catch (e) {
                console.error(e);
                bodyTbl.innerHTML = `<tr><td colspan="15" style="text-align: center; color: red; padding: 30px;">Error: Gagal terhubung ke N8N.</td></tr>`;
            }
        }

        // Fungsi untuk memunculkan dan menyembunyikan sidebar di mobile
        function toggleMobileSidebar() {
            const sidebar = document.getElementById("sidebar-container");
            if (sidebar) {
                // Tambahkan atau hapus class 'show-mobile' yang ada di CSS tadi
                sidebar.classList.toggle("show-mobile");
            }
        }

        // Opsional: Klik di sembarang tempat (luar sidebar) untuk menutupnya
        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById("sidebar-container");
            const toggleBtn = document.getElementById("btnToggleSidebar");
            
            // Jika sidebar sedang terbuka, dan user mengklik di luar sidebar & bukan di tombol garis tiga
            if (sidebar && sidebar.classList.contains("show-mobile")) {
                if (!sidebar.contains(event.target) && !toggleBtn.contains(event.target)) {
                    sidebar.classList.remove("show-mobile");
                }
            }
        });
        
        window.onload = () => {
            setTimeout(loadEvalCPL, 400); 
        };
    </script>
</body>
</html>
