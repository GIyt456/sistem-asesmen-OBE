<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluasi CPMK Angkatan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <style>
        .card-container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; margin-top: 20px; overflow-x: auto;}
        .table-eval { width: 100%; border-collapse: collapse; }
        .table-eval th, .table-eval td { padding: 15px; border-bottom: 1px solid #e5e7eb; text-align: center; }
        .table-eval th { background: #f8fafc; color: #334155; font-weight: 700; text-transform: uppercase; font-size: 0.85rem; border-top: 1px solid #e5e7eb; }
        .text-left { text-align: left !important; }
        
        /* Styling Progress Bar & Badge */
        .progress-bar-container { width: 100%; background-color: #e2e8f0; border-radius: 999px; height: 8px; margin-bottom: 5px; overflow: hidden; }
        .progress-bar { height: 100%; border-radius: 999px; }
        .bg-success { background-color: #10b981; }
        .bg-warning { background-color: #f59e0b; }
        .bg-danger { background-color: #ef4444; }
        
        .badge-status { padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 5px; }
        .badge-status.success { background: #dcfce7; color: #166534; }
        .badge-status.danger { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <div style="flex: 1; display: flex; flex-direction: column;">
        <div id="navbar-container"></div>

        <div class="main-content">
            <h1 style="margin: 0 0 8px 0; font-size: 2.2rem; color: #0f172a;">Evaluasi <span style="color: #8b0000;">CPMK Angkatan</span></h1>
            <p style="margin: 0; color: #64748b;">Analisis rata-rata nilai dan tingkat kelulusan tiap CPMK berdasarkan akumulasi data satu angkatan.</p>

            <div class="card-container" style="margin-bottom: 20px;">
                <div style="display: flex; gap: 15px; align-items: center;">
                    <label style="font-weight: 700;">Pilih Angkatan:</label>
                    <select id="selectAngkatan" style="padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; width: 200px;">
                        <option value="2022">Angkatan 2022</option>
                        <option value="2023">Angkatan 2023</option>
                        <option value="2024">Angkatan 2024</option>
                    </select>
                    <!-- Asumsi Standar Kelulusan CPMK adalah 60 (bisa disesuaikan Kaprodi) -->
                    <label style="font-weight: 700; margin-left: 20px;">Standar Lulus:</label>
                    <input type="number" id="standarLulus" value="60" style="padding: 10px; width: 80px; border-radius: 6px; border: 1px solid #cbd5e1;">
                    
                    <button class="btn-action" style="background: #3b82f6; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;" onclick="loadEvalCPMK()">
                        <i class="fas fa-chart-line"></i> Analisis Data
                    </button>
                </div>
            </div>

            <div class="card-container">
                <table class="table-eval">
                    <thead>
                        <tr>
                            <th width="5%">NO</th>
                            <th width="15%" class="text-left">KODE MK</th>
                            <th width="15%">KODE CPMK</th>
                            <th width="15%">JUMLAH MHS</th>
                            <th width="15%">RATA-RATA KELAS</th>
                            <th width="20%">PERSENTASE LULUS</th>
                            <th width="15%">STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="bodyTable">
                        <tr><td colspan="7" style="padding: 40px; color: #64748b;">Silakan pilih angkatan dan klik Analisis Data.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../../../js/template.js"></script>
    <script>
        const API_EVAL_CPMK = "https://computing-epson-profits-script.trycloudflare.com/webhook/get-eval-cpmk";

        async function loadEvalCPMK() {
            const angkatan = document.getElementById("selectAngkatan").value;
            const standar = parseFloat(document.getElementById("standarLulus").value) || 60;
            const bodyTbl = document.getElementById("bodyTable");
            
            bodyTbl.innerHTML = `<tr><td colspan="7"><i class="fas fa-spinner fa-spin"></i> Menghitung agregat data CPMK...</td></tr>`;

            try {
                const res = await fetch(`${API_EVAL_CPMK}?angkatan=${angkatan}`);
                const data = await res.json();

                if(!data || data.length === 0) {
                    bodyTbl.innerHTML = `<tr><td colspan="7" style="color: red;">Belum ada data nilai untuk angkatan ${angkatan}.</td></tr>`;
                    return;
                }

                // 1. Grouping data mentah mahasiswa menjadi per CPMK
                let evalData = {}; 
                data.forEach(item => {
                    let key = `${item.kode_mk}_${item.kode_cpmk}`;
                    if (!evalData[key]) {
                        evalData[key] = { kode_mk: item.kode_mk, kode_cpmk: item.kode_cpmk, list_nilai: [] };
                    }
                    // Rumus nilai mutlak CPMK per mahasiswa
                    let skorMhs = (item.total_nilai_tertimbang / item.total_bobot_cpmk) * 100;
                    evalData[key].list_nilai.push(skorMhs);
                });

                // 2. Render ke Tabel
                bodyTbl.innerHTML = "";
                let no = 1;

                // Sort agar tabel rapi berdasarkan Kode MK
                let sortedKeys = Object.keys(evalData).sort();

                sortedKeys.forEach(key => {
                    let row = evalData[key];
                    let totalMhs = row.list_nilai.length;
                    
                    // Hitung Rata-Rata
                    let totalNilai = row.list_nilai.reduce((a, b) => a + b, 0);
                    let rataRata = (totalNilai / totalMhs).toFixed(2);
                    
                    // Hitung Persentase Lulus
                    let lulusCount = row.list_nilai.filter(n => n >= standar).length;
                    let persenLulus = ((lulusCount / totalMhs) * 100).toFixed(1);

                    // Penentuan Warna Progress Bar
                    let barColor = persenLulus >= 75 ? 'bg-success' : (persenLulus >= 50 ? 'bg-warning' : 'bg-danger');
                    
                    // Penentuan Badge Status (Berdasarkan Rata-rata)
                    let statusBadge = rataRata >= standar 
                        ? `<span class="badge-status success"><i class="fas fa-check-circle"></i> Tercapai</span>`
                        : `<span class="badge-status danger"><i class="fas fa-exclamation-triangle"></i> Perlu Evaluasi</span>`;

                    bodyTbl.innerHTML += `
                        <tr>
                            <td>${no++}</td>
                            <td class="text-left" style="font-weight: 700; color: #334155;">${row.kode_mk}</td>
                            <td style="font-weight: 800; color: #8b0000;">${row.kode_cpmk}</td>
                            <td>${totalMhs} Mahasiswa</td>
                            <td style="font-size: 1.1rem; font-weight: bold; color: ${rataRata >= standar ? '#166534' : '#991b1b'};">${rataRata}</td>
                            <td>
                                <div class="progress-bar-container">
                                    <div class="progress-bar ${barColor}" style="width: ${persenLulus}%;"></div>
                                </div>
                                <span style="font-size: 0.85rem; font-weight: 600;">${persenLulus}% (≥ ${standar})</span>
                            </td>
                            <td>${statusBadge}</td>
                        </tr>
                    `;
                });

            } catch (e) {
                bodyTbl.innerHTML = `<tr><td colspan="7" style="color: red;">Error: Gagal terhubung ke server N8N.</td></tr>`;
            }
        }
    </script>
</body>
</html>
