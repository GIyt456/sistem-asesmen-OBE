<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Nilai MBKM - Panel Kaprodi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../../../js/template.js"></script>

    <style>
        :root {
            --primary-red: #8b0000;
            --text-dark: #1f2937;
            --primary-blue: #1e3a8a;
            --bg-light: #f9fafb;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Pembungkus Konten Utama */
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            color: var(--primary-blue);
            font-weight: 800;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sub-title {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 30px;
            align-items: start;
        }

        .panel-form {
            background: #fdfdfd;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-title {
            font-size: 1rem;
            font-weight: 700;
            color: #374151;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 8px;
            margin-bottom: 5px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4b5563;
        }

        input,
        select,
        textarea {
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
        }

        /* SEARCH DROPDOWN MHS MBKM */
        .dropdown-wrapper {
            position: relative;
        }

        .search-container {
            display: flex;
            align-items: center;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding-right: 40px;
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: #6b7280;
            transition: transform 0.2s;
        }

        .dropdown-wrapper.active .toggle-btn {
            transform: rotate(180deg);
        }

        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            max-height: 180px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            margin-top: 4px;
        }

        .dropdown-list.show {
            display: block;
        }

        .dropdown-item {
            padding: 10px 12px;
            cursor: pointer;
            font-size: 0.85rem;
            border-bottom: 1px solid #f3f4f6;
        }

        .dropdown-item:hover {
            background: #eff6ff;
            color: var(--primary-blue);
            font-weight: 600;
        }

        .no-result {
            padding: 10px 12px;
            color: #9ca3af;
            font-style: italic;
            text-align: center;
            font-size: 0.85rem;
        }

        .nilai-output-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .btn-submit {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 5px;
        }

        .btn-submit:hover {
            background: #152e66;
        }

        /* RIGHT PANEL: LIST REKAP TABLE */
        .table-responsive {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }

        th {
            background: #f8fafc;
            color: #374151;
            font-weight: 700;
            padding: 14px 16px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            color: #4b5563;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #fcfcfc;
        }

        /* CUSTOM STATUS DROPDOWN SELECTION */
        .custom-status-dropdown {
            position: relative;
            display: inline-block;
        }

        .status-trigger {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid transparent;
        }

        .status-belum {
            background: #fef2f2;
            color: #dc2626;
            border-color: #fca5a5;
        }

        .status-terbit {
            background: #dcfce7;
            color: #16a34a;
            border-color: #86efac;
        }

        .status-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 5;
            display: none;
            margin-top: 4px;
            overflow: hidden;
        }

        .custom-status-dropdown.active .status-menu {
            display: block;
        }

        .status-opt {
            padding: 8px 16px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .status-opt:hover {
            background: #f3f4f6;
        }

        .btn-pdf {
            background: #fff1f2;
            color: #df1c1c;
            border: 1px solid #ffe4e6;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-pdf:hover {
            background: #ffe4e6;
        }
    </style>
</head>

<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="container">
            <h2><i class="fas fa-award"></i> Rekap Penilaian & Konversi Nilai MBKM</h2>
            <div class="sub-title">Input, validasi, dan publikasi transkrip nilai program MBKM mahasiswa internal FTI
                UNAKI.</div>

            <div class="layout-grid">
                <div class="panel-form">
                    <div class="form-title">Form Input Nilai</div>

                    <div class="form-group">
                        <label>Pilih Mahasiswa MBKM</label>
                        <div class="dropdown-wrapper" id="dropdownWrapperMhs">
                            <div class="search-container">
                                <input type="text" id="searchMhsMBKM" placeholder="Cari NIM atau Nama..."
                                    autocomplete="off">
                                <i class="fas fa-chevron-down toggle-btn" id="toggleBtnMhs"></i>
                            </div>
                            <div class="dropdown-list" id="dropdownListMhs">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Program / Kegiatan</label>
                        <input type="text" id="lblProgram" style="background:#f3f4f6; font-weight:600;" readonly
                            placeholder="-">
                    </div>

                    <div class="form-group">
                        <label>Nilai Angka Instansi/Mitra (0-100)</label>
                        <input type="number" id="nilai_mitra" min="0" max="100" placeholder="Contoh: 87" required
                            oninput="hitungKonversiOtomatis()">
                    </div>

                    <div class="form-group">
                        <label>Hasil Konversi Nilai UNAKI</label>
                        <div class="nilai-output-box">
                            <span style="color:#6b7280; font-size:0.85rem;">Bobot Huruf:</span>
                            <span id="lblHuruf" style="color:var(--primary-blue); font-size:1.1rem;">-</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Unggah Transkrip Sertifikat (PDF)</label>
                        <input type="file" id="file_pdf" accept="application/pdf" required>
                    </div>

                    <button class="btn-submit" onclick="simpanRekapNilai()"><i class="fas fa-check-circle"></i> Simpan
                        Rekap Nilai</button>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 5%; text-align: center;">No</th>
                                <th style="width: 15%;">NIM</th>
                                <th style="width: 25%;">Nama Mahasiswa</th>
                                <th style="width: 20%;">Program MBKM</th>
                                <th style="width: 10%; text-align: center;">Nilai</th>
                                <th style="width: 10%; text-align: center;">Berkas</th>
                                <th style="width: 15%; text-align: center;">Status KHS</th>
                            </tr>
                        </thead>
                        <tbody id="bodyTabelNilaiMBKM">
                            <tr>
                                <td colspan="7" style="text-align: center; padding: 30px;"><i
                                        class="fas fa-spinner fa-spin"></i> Memuat database rekapitulasi nilai...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://playing-heath-pointed-instance.trycloudflare.com/webhook";
        const API_GET_PENDAPATAN = `${BASE_URL}/get-mbkm`;
        const API_SIMPAN_NILAI = `${BASE_URL}/simpan-nilai-mbkm`;
        const API_UPDATE_STATUS = `${BASE_URL}/update-status-khs-mbkm`;

        let dataPendaftarMBKM = [];
        let selectedRecord = null;
        let selectedBase64PDF = "";

        const dropdownWrapperMhs = document.getElementById("dropdownWrapperMhs");
        const searchInputMhs = document.getElementById("searchMhsMBKM");
        const dropdownListMhs = document.getElementById("dropdownListMhs");
        const toggleBtnMhs = document.getElementById("toggleBtnMhs");

        async function initData() {
            try {
                const prodi = localStorage.getItem("prodi_aktif") || "ti";
                const res = await fetch(`${API_GET_PENDAPATAN}?prodi=${prodi}`);
                if (!res.ok) throw new Error();
                const json = await res.json();
                dataPendaftarMBKM = Array.isArray(json) ? json : (json.data || []);

                renderDropdownMhs(dataPendaftarMBKM);
                renderTabelRekap(dataPendaftarMBKM);
            } catch (e) {
                console.error(e);
            }
        }

        function renderDropdownMhs(array) {
            dropdownListMhs.innerHTML = "";
            if (!array || array.length === 0) {
                dropdownListMhs.innerHTML = `<div class="no-result">Tidak ada data mahasiswa MBKM</div>`;
                return;
            }
            array.forEach(m => {
                const div = document.createElement("div");
                div.className = "dropdown-item";
                div.innerText = `${m.nim} - ${m.nama_mahasiswa.toUpperCase()}`;
                div.onclick = () => {
                    selectedRecord = m;
                    searchInputMhs.value = m.nim;
                    document.getElementById("lblProgram").value = `${m.jenis_mbkm} (${m.mitra})`;
                    tutupDropdownMhs();

                    if (m.nilai_mitra) {
                        document.getElementById("nilai_mitra").value = m.nilai_mitra;
                        hitungKonversiOtomatis();
                    } else {
                        document.getElementById("nilai_mitra").value = "";
                        document.getElementById("lblHuruf").innerText = "-";
                    }
                };
                dropdownListMhs.appendChild(div);
            });
        }

        function hitungKonversiOtomatis() {
            const num = parseFloat(document.getElementById("nilai_mitra").value);
            const lbl = document.getElementById("lblHuruf");
            if (isNaN(num) || num < 0 || num > 100) { lbl.innerText = "-"; return; }

            if (num >= 85) lbl.innerText = "A (Istimewa)";
            else if (num >= 80) lbl.innerText = "A- (Sangat Baik)";
            else if (num >= 75) lbl.innerText = "B+ (Sangat Baik)";
            else if (num >= 70) lbl.innerText = "B (Baik)";
            else if (num >= 65) lbl.innerText = "B- (Cukup Baik)";
            else if (num >= 60) lbl.innerText = "C+ (Cukup)";
            else if (num >= 55) lbl.innerText = "C (Cukup)";
            else lbl.innerText = "E (Tidak Lulus)";
        }

        function renderTabelRekap(dataArray) {
            const tbody = document.getElementById("bodyTabelNilaiMBKM");
            tbody.innerHTML = "";

            if (!dataArray || dataArray.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:20px;">Belum ada rekap data penilaian.</td></tr>`;
                return;
            }

            dataArray.forEach((m, index) => {
                const tr = document.createElement("tr");
                const score = m.nilai_mitra ? `<strong>${m.nilai_mitra}</strong> (${m.nilai_huruf || '-'})` : `<span style="color:#9ca3af; font-style:italic;">Belum Input</span>`;

                const btnFile = m.berkas_pdf ? `<button class="btn-pdf" onclick="viewPDFInline('${m.berkas_pdf}')"><i class="fas fa-file-pdf"></i> Lihat</button>` : '-';

                const statusClass = m.status_khs === "Terbit" ? "status-terbit" : "status-belum";
                const statusText = m.status_khs === "Terbit" ? "Terbit di KHS" : "Belum Validasi";

                tr.innerHTML = `
                    <td style="text-align:center; font-weight:bold;">${index + 1}</td>
                    <td><strong>${m.nim}</strong></td>
                    <td>${m.nama_mahasiswa.toUpperCase()}</td>
                    <td><small><strong>${m.jenis_mbkm}</strong><br><span style="color:#6b7280;">Mitra: ${m.mitra}</span></small></td>
                    <td style="text-align:center;">${score}</td>
                    <td style="text-align:center;">${btnFile}</td>
                    <td style="text-align:center;">
                        <div class="custom-status-dropdown" id="dropdown-status-${m.id_mbkm}">
                            <div class="status-trigger ${statusClass}" onclick="toggleStatusMenu(${m.id_mbkm})">
                                ${statusText} <i class="fas fa-caret-down"></i>
                            </div>
                            <div class="status-menu">
                                <div class="status-opt" onclick="ubahStatusKHS(${m.id_mbkm}, 'Belum')">Belum Validasi</div>
                                <div class="status-opt" onclick="ubahStatusKHS(${m.id_mbkm}, 'Terbit')">Terbit di KHS</div>
                            </div>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleStatusMenu(id) {
            event.stopPropagation();
            document.querySelectorAll('.custom-status-dropdown').forEach(d => {
                if (d.id !== `dropdown-status-${id}`) d.classList.remove('active');
            });
            document.getElementById(`dropdown-status-${id}`).classList.toggle('active');
        }

        async function ubahStatusKHS(id, statusBaru) {
            try {
                const res = await fetch(API_UPDATE_STATUS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_mbkm: id, status_khs: statusBaru })
                });
                if (res.ok) {
                    alert("Status publish nilai KHS berhasil diperbarui!");
                    initData();
                }
            } catch (e) { alert("Gagal memperbarui status publikasi."); }
        }

        function viewPDFInline(base64) {
            const win = window.open();
            win.document.write(`<iframe src="${base64}" frameborder="0" style="border:0; width:100%; height:100%;" allowfullscreen></iframe>`);
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function simpanRekapNilai() {
            if (!selectedRecord) { alert("Pilih mahasiswa MBKM terlebih dahulu!"); return; }
            const nilai = document.getElementById("nilai_mitra").value;
            if (!nilai) { alert("Masukkan nilai angka instansi!"); return; }

            const fileInput = document.getElementById("file_pdf");
            let base64String = selectedRecord.berkas_pdf || "";

            if (fileInput.files.length > 0) {
                base64String = await fileToBase64(fileInput.files[0]);
            }

            if (!base64String) { alert("Wajib mengunggah sertifikat/transkrip nilai PDF!"); return; }

            const txtHuruf = document.getElementById("lblHuruf").innerText.split(" ")[0];

            const payload = {
                id_mbkm: selectedRecord.id_mbkm,
                nilai_mitra: parseInt(nilai),
                nilai_huruf: txtHuruf,
                berkas_pdf: base64String
            };

            try {
                const res = await fetch(API_SIMPAN_NILAI, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    alert("✅ Berhasil menyimpan rekapitulasi nilai MBKM mahasiswa!");
                    document.getElementById("nilai_mitra").value = "";
                    document.getElementById("lblHuruf").innerText = "-";
                    document.getElementById("lblProgram").value = "-";
                    fileInput.value = "";
                    selectedRecord = null;
                    searchInputMhs.value = "";
                    initData();
                }
            } catch (e) { alert("Gagal menyimpan rekap."); }
        }

        // Tweak Dropdown Controller UI
        function bukaDropdownMhs() { dropdownListMhs.classList.add("show"); dropdownWrapperMhs.classList.add("active"); renderDropdownMhs(dataPendaftarMBKM); }
        function tutupDropdownMhs() { dropdownListMhs.classList.remove("show"); dropdownWrapperMhs.classList.remove("active"); }
        function toggleDropdownMhs(e) { e.stopPropagation(); if (dropdownListMhs.classList.contains("show")) tutupDropdownMhs(); else bukaDropdownMhs(); searchInputMhs.focus(); }

        searchInputMhs.addEventListener("click", toggleDropdownMhs);
        toggleBtnMhs.addEventListener("click", toggleDropdownMhs);
        searchInputMhs.addEventListener("input", function (e) {
            dropdownListMhs.classList.add("show");
            dropdownWrapperMhs.classList.add("active");
            const val = e.target.value.toLowerCase();
            const filtered = dataPendaftarMBKM.filter(m =>
                m.nim.includes(val) || (m.nama_mahasiswa || "").toLowerCase().includes(val)
            );
            renderDropdownMhs(filtered);
        });

        document.addEventListener("click", function (event) {
            if (!dropdownWrapperMhs.contains(event.target)) tutupDropdownMhs();
            document.querySelectorAll('.custom-status-dropdown').forEach(d => {
                if (!d.contains(event.target)) d.classList.remove('active');
            });
        });

        // KENDALI PENYUNTIKAN MENU AKTIF (INTEGRASI TEMPLATE.JS)
        window.onload = () => {
            initData();

            setTimeout(() => {
                const navDashboard = document.getElementById('nav-home');
                const navRekapMbkm = document.querySelector('[data-path="/mbkm/rekap_nilai_mbkm.html"]');

                if (navDashboard) navDashboard.classList.remove('active');
                if (navRekapMbkm) navRekapMbkm.classList.add('active');
            }, 300);
        };
    </script>
</body>

</html>
