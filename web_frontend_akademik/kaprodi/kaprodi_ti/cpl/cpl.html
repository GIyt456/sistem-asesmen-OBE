<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola CPL - Sistem OBE</title>
    <!-- Pastikan path CSS dan JS ini sesuai dengan foldermu -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Script untuk Export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="../../../js/api_config.js"></script>    
    
    <style>
        :root { 
            --sidebar-bg: #161923; --sidebar-text: #7b8395; --sidebar-hover: #262936; --sidebar-active-text: #ffffff;
            --primary-blue: #1e3a8a; --primary-red: #8b0000; --bg-main: #f9fafb; --text-dark: #111827; --border-color: #e5e7eb;
            --success-green: #10b981; --danger-red: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark); }
        
        #sidebar-container { width: 280px; min-width: 280px; height: 100vh; background: var(--sidebar-bg); flex-shrink: 0; z-index: 1000; }
        
        /* Layout Flexbox Bersusun */
        .main-content { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; padding: 0; background: var(--bg-main); }
        .fixed-header { padding: 40px 50px 20px 50px; flex-shrink: 0; background: var(--bg-main); z-index: 10; border-bottom: 1px solid var(--border-color); }
        .scrollable-content { flex: 1; overflow-y: auto; padding: 30px 50px 40px 50px; }

        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .header-title-area { display: flex; flex-direction: column; }
        .header-subtitle { color: #64748b; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); }
        .header-title span { color: var(--primary-blue); }
        .badge-prodi { background: var(--primary-blue); color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; }
        
        .table-container { background: white; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; min-width: 700px; border-collapse: collapse; text-align: left; }
        th { background: #f8fafc; padding: 15px 20px; font-size: 0.85rem; font-weight: 700; color: #475569; border-bottom: 2px solid var(--border-color); text-transform: uppercase; position: sticky; top: 0; z-index: 5;}
        td { padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; color: #1e293b; vertical-align: middle; }
        
        .action-buttons { display: flex; gap: 10px; align-items: center; }
        .btn-action { color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-dark { background: #1e293b; }
        .btn-dark:hover { background: #0f172a; transform: translateY(-2px); }
        .btn-download { background: #475569; }
        .btn-download:hover { background: #334155; transform: translateY(-2px); }
        .btn-upload { background: var(--success-green); }
        .btn-upload:hover { background: #059669; transform: translateY(-2px); }
        
        #pagination-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; padding-bottom: 40px; }
        #pagination-container button { padding: 8px 16px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; cursor: pointer; font-weight: 600; color: #475569; transition: 0.2s; }
        #pagination-container button:hover:not(:disabled) { background: #f1f5f9; color: var(--text-dark); }
        #pagination-container button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* =========================================
           RESPONSIVE MOBILE (KAPRODI) DENGAN NAVBAR
           ========================================= */
        .mobile-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(3px); z-index: 999; display: none; }
        .mobile-overlay.active { display: block; }
        
        .navbar-mobile { display: none; } /* Tersembunyi di Desktop */

       @media screen and (max-width: 768px) {
            /* 1. Bebaskan Body dari kunci 100vh agar scroll natural HP aktif */
            body { height: auto !important; overflow-y: auto !important; }
            
            .navbar-mobile {
                display: flex; position: fixed; top: 0; left: 0; width: 100%;
                background-color: var(--sidebar-bg);
                padding: 12px 20px; align-items: center; justify-content: space-between;
                z-index: 990; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            }
            .hamburger-btn { display: block; background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
            
            .profile-btn-mobile {
                width: 36px; height: 36px; border-radius: 50%; 
                border: 2px solid rgba(255, 255, 255, 0.2); overflow: hidden; 
                cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            }
            .profile-btn-mobile img { width: 100%; height: 100%; object-fit: cover; }
            
            /* 2. Matikan sistem Flex/Tinggi Fix pada konten utama */
            .main-content {
                margin-top: 60px !important;
                height: auto !important;
                display: block !important;
                overflow: visible !important;
            }

            /* Sidebar Slide-in tetap dipertahankan */
            #sidebar-container { 
                position: fixed; top: 0; left: -320px; height: 100vh; 
                transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 10px 0 25px rgba(0,0,0,0.5);
            }
            #sidebar-container.active { left: 0; }
            
            /* 3. Matikan inner-scroll pada scrollable-content */
            .fixed-header { padding: 20px !important; position: relative; }
            .scrollable-content { padding: 15px 20px 40px 20px; overflow: visible !important; height: auto !important; }
            .table-container { overflow-y: visible !important; margin-bottom: 5px !important;}
            
            /* Penyesuaian Ruang & Teks */
            .header-title { font-size: 1.6rem; }
            .header-subtitle { font-size: 0.75rem; margin-bottom: 4px; }
            .badge-prodi { font-size: 0.7rem; padding: 6px 12px; }
            
            .fixed-header > div:last-child { flex-direction: column !important; align-items: flex-start !important; gap: 15px; margin-top: 15px; }
            .action-buttons { width: 100%; flex-direction: column; }
            .btn-action { width: 100%; justify-content: center; padding: 12px; }
        }
        /* --- 4. SULAP TABEL MENJADI CARD (KHUSUS MOBILE) --- */
            .table-container {
                border: none !important;
                box-shadow: none !important;
                background: transparent !important;
                padding: 0 !important;
                overflow-x: hidden !important; /* Mencegah elemen dalam bocor ke samping */
            }
            
            table, thead, tbody, th, td, tr {
                display: block;
                width: 100% !important;
                min-width: 0 !important; /* INI KUNCI UTAMANYA: Mematikan min-width 700px dari desktop! */
                box-sizing: border-box !important;
            }

            /* Sembunyikan Header Tabel (Judul Kolom) agar tidak aneh */
            table thead tr {
                display: none !important;
            }

            /* Ubah Baris (TR) menjadi bentuk Card */
            table tr {
                background: white;
                margin-bottom: 16px;
                border-radius: 12px;
                border: 1px solid var(--border-color);
                box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
                padding: 15px 20px;
            }

            /* Rapikan isi sel (TD) di dalam Card */
            table td {
                padding: 8px 0 !important;
                border: none !important;
                text-align: left !important;
            }

            /* Desain Khusus: Kode CPL sebagai Header Card */
            table td:nth-child(1) {
                font-size: 1.2rem !important;
                border-bottom: 1px dashed #cbd5e1 !important;
                padding-bottom: 12px !important;
                margin-bottom: 8px !important;
            }
            
            /* Desain Khusus: Area Textarea CPL */
            table td:nth-child(2) textarea {
                font-size: 0.9rem !important;
                background-color: #f8fafc;
            }

            /* Desain Khusus: Tombol Simpan melebar 100% di HP */
            table td:nth-child(3) .btn-action {
                width: 100%;
                justify-content: center;
                padding: 12px;
                margin-top: 10px;
            }
    </style>
</head>
<body>

    <!-- 1. NAVBAR KHUSUS MOBILE (Akan muncul hanya di HP) -->
   <nav class="navbar-mobile">
        
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            
            <img src="../../../gambar/LogoUnaki.png" alt="Logo Universitas AKI" 
                 style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;" 
                 onclick="window.location.href='../../../index.html'">
        </div>
        
        <div class="profile-btn-mobile" onclick="toggleSidebar()">
            <img id="mobileNavbarAvatar" src="https://ui-avatars.com/api/?name=K&background=8b0000&color=fff&bold=true" alt="Profil Kaprodi">
        </div>
        
    </nav>

    <!-- 2. OVERLAY GELAP UNTUK LATAR SIDEBAR DI HP -->
    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

    <!-- 3. BUNGKUS SIDEBAR -->
    <div id="sidebar-container"></div>

    <!-- 4. KONTEN UTAMA -->
    <div class="main-content">
        <div class="fixed-header">
            <div class="header-container">
                <div class="header-title-area">
                    <div class="header-subtitle">KELOLA KURIKULUM</div>
                    <!-- Warna span judul disetel dinamis oleh JS di bawah -->
                    <h1 class="header-title">CAPAIAN <span id="titleSpan">PEMBELAJARAN (CPL)</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h3 style="margin: 0; font-size: 1.4rem; font-weight: 800;">Daftar CPL</h3>
                    <p style="margin: 4px 0 0 0; color: #64748b; font-size: 0.95rem; font-weight: 500;">Rumusan Capaian Pembelajaran Lulusan</p>
                </div>
                
                <div class="action-buttons">
                    <button class="btn-action btn-download" onclick="exportKeExcel()">
                        <i class="fas fa-file-download"></i> Download Excel
                    </button>
                    
                    <input type="file" id="fileExcel" accept=".xlsx, .xls" style="display: none;" onchange="uploadExcel()">
                    <button class="btn-action btn-upload" onclick="document.getElementById('fileExcel').click()">
                        <i class="fas fa-file-upload"></i> Impor Excel
                    </button>
                </div>
            </div>
        </div>
        
        <div class="scrollable-content">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th width="15%">Kode CPL</th>
                            <th>Deskripsi CPL</th>
                            <th width="15%" style="text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="3" style="text-align: center; padding: 40px;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <div id="pagination-container"></div>
        </div>
    </div>

<!-- Memanggil Template Sidebar -->
<script src="../../../js/template.js"></script>

<script>
    // --- 1. VARIABEL API & SESI ---
    const PRODI = localStorage.getItem("prodi_aktif") || "ti"; 
    
    const API_CPL = `${API_BASE}/get-master-cpl?prodi=${PRODI}`;
    const API_UPDATE = `${API_BASE}/admin-update-master`;
    const API_UPLOAD = `${API_BASE}/upload-master-cpl`;

    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace("/login/login.html");

    // --- SETUP TAMPILAN DINAMIS (WARNA & NAMA PRODI) ---
    const pAktif = localStorage.getItem("prodi_aktif") || "ti";
    const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
    const warnaProdi = pAktif === 'si' ? '#1e3a8a' : '#8b0000'; // Biru SI, Merah TI
    const warnaAvatar = pAktif === 'si' ? '1e3a8a' : '8b0000';
    
    // Ubah warna text judul dan background badge
    document.getElementById("titleSpan").style.color = warnaProdi;
    const badge = document.getElementById("prodiBadge");
    badge.style.backgroundColor = warnaProdi;
    badge.innerText = pAktif === 'si' ? "SISTEM INFORMASI" : "TEKNIK INFORMATIKA";

    // Setup Avatar Mobile
    const avatarMobile = document.getElementById("mobileNavbarAvatar");
    if(avatarMobile) {
        avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=${warnaAvatar}&color=fff&bold=true`;
    }

    // --- 2. FUNGSI AMBIL DATA TABEL ---
    let allData = [];
    let state = { page: 1, itemsPerPage: 10 };

    async function loadData() { 
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding:40px;'><i class='fas fa-spinner fa-spin'></i> Memuat data...</td></tr>";

        try {
            const res = await fetch(API_CPL); 
            allData = await res.json(); 
            
            if (!allData || allData.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding:40px; color:#64748b;'>Belum ada data CPL. Silakan impor via Excel.</td></tr>";
                document.getElementById('pagination-container').innerHTML = '';
                return;
            }

            state.page = 1;
            renderTablePaginated();
        } catch(e) { 
            tbody.innerHTML = "<tr><td colspan='3' style='color:red; text-align:center; padding:40px;'>Gagal menarik data. Pastikan n8n menyala.</td></tr>";
        }
    }

    // --- 3. RENDER TABEL & PAGINATION ---
    function renderTablePaginated() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        
        const start = (state.page - 1) * state.itemsPerPage;
        const end = start + state.itemsPerPage;
        const paginatedItems = allData.slice(start, end);
        
        paginatedItems.forEach(cpl => {
            const deskripsi = cpl.deskripsi || cpl.deskripsi_cpl || ""; 
            
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 800; color: ${warnaProdi};">${cpl.kode_cpl}</td>
                <td>
                    <textarea id="in-${cpl.kode_cpl}" rows="3" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; font-size: 0.95rem; resize: vertical;">${deskripsi}</textarea>
                </td>
                <td style="text-align:center;">
                    <div style="display: flex; gap: 8px; justify-content: center;">
                        <button class="btn-action btn-dark" style="padding: 8px 12px;" onclick="simpanEdit('cpl', '${cpl.kode_cpl}')" title="Simpan Perubahan">
                            <i class="fas fa-save"></i> Simpan
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });

        renderPaginationControls();
    }

    function renderPaginationControls() {
        const container = document.getElementById('pagination-container');
        container.innerHTML = "";
        
        const totalPages = Math.ceil(allData.length / state.itemsPerPage);
        if (totalPages <= 1) return;

        const btnPrev = document.createElement('button');
        btnPrev.innerHTML = '<i class="fas fa-chevron-left"></i> Prev';
        btnPrev.disabled = state.page === 1;
        btnPrev.onclick = () => { if (state.page > 1) { state.page--; renderTablePaginated(); } };
        container.appendChild(btnPrev);

        const info = document.createElement('span');
        info.innerHTML = `Halaman <strong>${state.page}</strong> dari <strong>${totalPages}</strong>`;
        info.style.fontSize = "0.95rem";
        info.style.color = "#4b5563";
        container.appendChild(info);

        const btnNext = document.createElement('button');
        btnNext.innerHTML = 'Next <i class="fas fa-chevron-right"></i>';
        btnNext.disabled = state.page === totalPages;
        btnNext.onclick = () => { if (state.page < totalPages) { state.page++; renderTablePaginated(); } };
        container.appendChild(btnNext);
    }

    // --- 4. FUNGSI SIMPAN & EXCEL ---
    async function simpanEdit(tipe, kode) { 
        const value = document.getElementById(`in-${kode}`).value; 
        const btn = event.currentTarget;
        const oldHtml = btn.innerHTML;
        
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;

        try {
            const res = await fetch(API_UPDATE, { 
                method: "POST", 
                headers: {"Content-Type":"application/json"}, 
                body: JSON.stringify({ tipe: tipe, kode: kode, value: value, prodi: PRODI }) 
            }); 
            if(res.ok) alert("✅ Deskripsi CPL berhasil diperbarui!");
            else alert("❌ Gagal menyimpan data ke server.");
        } catch (e) { alert("Terjadi kesalahan jaringan."); } 
        finally { btn.innerHTML = oldHtml; btn.disabled = false; }
    }

    async function exportKeExcel() {
        const btn = document.querySelector('.btn-download');
        const oriText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyiapkan...';
        btn.disabled = true;

        try {
            if (!allData || allData.length === 0) return alert("Tidak ada data untuk diekspor.");

            const dataUntukExcel = allData.map(cpl => ({ 
                'kode_cpl': cpl.kode_cpl, 
                'deskripsi': cpl.deskripsi || cpl.deskripsi_cpl || "", 
                'prodi': PRODI 
            }));
            
            const worksheet = XLSX.utils.json_to_sheet(dataUntukExcel);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Master_CPL");
            XLSX.writeFile(workbook, `Master_CPL_${PRODI}.xlsx`);
        } catch (e) { alert("Gagal mengekspor data."); } 
        finally { btn.innerHTML = oriText; btn.disabled = false; }
    }

    async function uploadExcel() {
        const fileInput = document.getElementById('fileExcel');
        const file = fileInput.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('data', file); 
        formData.append('prodi', PRODI);

        const btnUpload = document.querySelector('.btn-upload');
        const oriText = btnUpload.innerHTML;
        btnUpload.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengimpor...';
        btnUpload.disabled = true;

        try {
            const res = await fetch(API_UPLOAD, { method: 'POST', body: formData });
            if (res.ok) { alert("✅ Data Excel CPL berhasil diimpor!"); await loadData(); } 
            else { alert("❌ Gagal memproses file Excel."); }
        } catch (e) { alert("❌ Terjadi kesalahan koneksi."); } 
        finally { btnUpload.innerHTML = oriText; btnUpload.disabled = false; fileInput.value = ''; }
    }

    // --- 5. FUNGSI SIDEBAR MOBILE ---
    function toggleSidebar() {
        document.getElementById('sidebar-container').classList.toggle('active');
        document.getElementById('mobileOverlay').classList.toggle('active');
    }

    window.onload = () => {
        setTimeout(loadData, 400); 
    };
</script>
</body>
</html>
