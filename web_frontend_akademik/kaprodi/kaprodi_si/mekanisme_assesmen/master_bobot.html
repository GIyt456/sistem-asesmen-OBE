<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Bobot - Sistem OBE</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="/js/api_config.js"></script>
    <script src="/js/template.js"></script> 
    
    <style>
        :root { 
            --sidebar-bg: #161923; --sidebar-text: #7b8395; --sidebar-hover: #262936; --sidebar-active-text: #ffffff;
            --primary-red: #8b0000; --bg-main: #ffffff; --text-dark: #111827; --border-dark: #161923;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { display: flex; animation: transitionIn 0.3s ease-in-out; background: #f9fafb; height: 100vh; overflow: hidden; color: var(--text-dark); }
        @keyframes transitionIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .main-content { flex: 1; overflow-y: auto; padding: 30px 40px; }
        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; border-bottom: 1px solid #e5e7eb; padding-bottom: 15px; }
        .header-subtitle { color: #9ca3af; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px; }
        .header-title span { color: var(--primary-red); }

        .table-container { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow-x: auto; }
        .control-panel { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th { background: var(--sidebar-bg); color: white; text-align: center; padding: 12px 10px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px; border: 1px solid #374151; position: sticky; top: 0; z-index: 10; }
        td { padding: 10px; border: 1px solid #e5e7eb; font-size: 0.85rem; text-align: center; vertical-align: middle; }
        
        td.text-left { text-align: left; font-weight: 500; }
        .col-cpl { color: var(--primary-red); font-weight: 700; }
        .col-mk { font-weight: 700; }
        .col-cpmk { background: #f3f4f6; font-weight: 600; }

        .input-bobot { width: 60px; padding: 6px; border: 1px solid #d1d5db; border-radius: 4px; text-align: center; font-size: 0.85rem; transition: 0.2s; background: #f8fafc; }
        .input-bobot:focus { border-color: var(--primary-red); outline: none; box-shadow: 0 0 0 2px rgba(139, 0, 0, 0.1); background: white; }
        
        .col-total { font-weight: 800; font-size: 1rem; }
        .total-ok { color: #059669; } 
        .total-warn { color: #dc2626; } 

        .btn-save-bobot { background: var(--primary-red); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-save-bobot:hover { background: #6b0000; }
        
        /* Styling Tombol Plus Inline di Tabel */
        .btn-add-inline { background: #10b981; color: white; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer; transition: 0.2s; }
        .btn-add-inline:hover { background: #059669; }
        .select-inline { padding: 5px; font-size: 0.75rem; border-radius: 4px; border: 1px solid #ccc; max-width: 120px; outline: none; }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="header-container">
            <div>
                <div class="header-subtitle">MEKANISME ASSESMEN</div>
                <h1 class="header-title">MASTER <span>BOBOT</span></h1>
            </div>
        </div>

        <div class="table-container">
            <div class="control-panel">
                <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 8px;">
                    <label style="font-weight: 700; color: #475569; font-size: 0.95rem;">
                        <i class="fas fa-book-open" style="color: var(--primary-blue); margin-right: 5px;"></i> Pilih Mata Kuliah:
                    </label>
                    <select id="selectMk" style="padding: 10px; border-radius: 6px; border: 1px solid #d1d5db;" onchange="loadDataBobot()">
                        <option value="" disabled selected>-- Memuat Daftar Mata Kuliah... --</option>
                    </select>
                </div>

                <div style="display: flex; align-items: flex-end;">
                    <button class="btn-save-bobot" onclick="simpanBobot()">
                        <i class="fas fa-save" style="font-size: 1.2rem;"></i> Simpan Perubahan
                    </button>
                </div>
            </div>

            <table id="bobotTable">
                <thead id="tableHead">
                    <tr><th colspan="6">Silakan pilih mata kuliah terlebih dahulu.</th></tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6" style="text-align: center; padding: 20px;">Menunggu pilihan mata kuliah...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace("/login/login.html");

    const PRODI = localStorage.getItem("prodi_aktif") || "ti";
    const API_GET_BOBOT = `${API_BASE}/get-master-bobot?prodi=${PRODI}`;
    const API_GET_KOMPONEN = `${API_BASE}/get-master-komponen`;
    const API_SAVE_BOBOT = `${API_BASE}/admin-save-bobot`;

    let daftarMasterKomponen = [];
    let activeKomponenIds = [];   
    let dataCpmkGrouped = [];

    window.onload = async () => { 
        await fetchMasterKomponen();
        await initMatkulDropdown(); 
    };

    // 1. Ambil Master Komponen dari Database
    async function fetchMasterKomponen() {
        try {
            const res = await fetch(API_GET_KOMPONEN);
            daftarMasterKomponen = await res.json();
        } catch (error) {
            console.error("Gagal muat komponen");
        }
    }

    function getNamaKomponen(id) {
        const komp = daftarMasterKomponen.find(k => k.id_komponen == id);
        return komp ? komp.nama_komponen.toUpperCase() : `KOMP-${id}`;
    }

    // 2. Ambil Daftar Matkul
    async function initMatkulDropdown() {
        const selectMk = document.getElementById('selectMk');
        try {
            const res = await fetch(API_GET_BOBOT);
            const allBobotData = await res.json();
            
            let uniqueMk = [];
            let seen = new Set();
            
            allBobotData.forEach(row => {
                if (!seen.has(row.kode_mk)) {
                    seen.add(row.kode_mk);
                    uniqueMk.push({ kode_mk: row.kode_mk, nama_mk: row.nama_mk });
                }
            });

            selectMk.innerHTML = '<option value="" disabled selected>-- Pilih Mata Kuliah --</option>';
            uniqueMk.forEach(mk => {
                selectMk.innerHTML += `<option value="${mk.kode_mk}">${mk.kode_mk} - ${mk.nama_mk}</option>`;
            });
        } catch (error) {
            selectMk.innerHTML = '<option value="">Gagal memuat daftar matkul</option>';
        }
    }

    // 3. Load Data & Grouping Berdasar Matkul
    async function loadDataBobot() {
        const tbody = document.getElementById('tableBody'); 
        const thead = document.getElementById('tableHead');
        const kodeMkTerpilih = document.getElementById('selectMk').value;

        if (!kodeMkTerpilih) return;

        tbody.innerHTML = '<tr><td colspan="15" style="text-align: center; padding: 40px !important;"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Memuat form bobot...</td></tr>';
        activeKomponenIds = [];
        dataCpmkGrouped = [];

        try {
            const res = await fetch(API_GET_BOBOT);
            const allData = await res.json();
            const dataMatkul = allData.filter(row => row.kode_mk === kodeMkTerpilih);
            
            if (dataMatkul.length === 0) {
                tbody.innerHTML = '<tr><td colspan="15" style="text-align: center; padding: 40px !important; color: #dc2626; font-weight:bold;">Belum ada pemetaan CPMK.</td></tr>';
                return;
            }

            let grouped = {};
            let activeIdsSet = new Set();

            dataMatkul.forEach(row => {
                let key = row.kode_cpmk || row.cpmk;
                if (!grouped[key]) {
                    grouped[key] = {
                        cpl: row.cpl,
                        kode_mk: row.kode_mk,
                        nama_mk: row.nama_mk,
                        kode_cpmk: key,
                        bobot_komponen: {} 
                    };
                }
                if (row.id_komponen && parseFloat(row.bobot) > 0) {
                    grouped[key].bobot_komponen[row.id_komponen] = parseFloat(row.bobot);
                    activeIdsSet.add(row.id_komponen.toString());
                }
            });

            dataCpmkGrouped = Object.values(grouped);
            activeKomponenIds = Array.from(activeIdsSet);

            renderTabelDinamis();

        } catch (error) {
            tbody.innerHTML = '<tr><td colspan="15" style="text-align: center; color: red;">❌ Gagal memuat data.</td></tr>';
        }
    }

    // 4. Sinkronisasi Data Input Sementara Sebelum Tambah Komponen
    function syncInputValues() {
        if (activeKomponenIds.length === 0) return;
        const rows = document.querySelectorAll('tbody tr[data-cpmk]');
        
        rows.forEach(row => {
            const cpmk = row.getAttribute('data-cpmk');
            let dataRow = dataCpmkGrouped.find(d => d.kode_cpmk === cpmk);
            
            if (dataRow) {
                activeKomponenIds.forEach(idKomp => {
                    const input = row.querySelector(`input[data-idkomp="${idKomp}"]`);
                    if (input) dataRow.bobot_komponen[idKomp] = parseFloat(input.value) || 0;
                });
            }
        });
    }

    // 5. Logika Tambah Komponen dari dalam Tabel
    function tambahKomponenInline() {
        const select = document.getElementById('selectKompInline');
        if(!select) return;
        
        const idVal = select.value;
        if (!idVal) {
            alert("Pilih komponen dari dropdown di tabel terlebih dahulu!");
            return;
        }

        if (!activeKomponenIds.includes(idVal)) {
            syncInputValues(); 
            activeKomponenIds.push(idVal); 
            renderTabelDinamis(); 
        }
    }

    // 6. Render Ulang Tabel Dinamis (Terintegrasi dgn Tombol Tambah Inline)
    function renderTabelDinamis() {
        const table = document.getElementById('bobotTable');
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        
        // --- BAGIAN THEAD (HEADER TABEL) ---
        // Menentukan colspan. Jika ada komponen, colspan = jumlah komponen + 1 (kolom tombol tambah)
        let totalKolomKomp = activeKomponenIds.length > 0 ? (activeKomponenIds.length + 1) : 1;

        let theadHtml = `
            <tr>
                <th rowspan="2">CPL</th>
                <th rowspan="2">KODE MK</th>
                <th rowspan="2" style="min-width: 250px;">NAMA MK</th>
                <th rowspan="2">CPMK</th>
                <th colspan="${totalKolomKomp}" style="background: #2d3748; border-bottom: 1px solid #4a5568;">KOMPONEN PENILAIAN (%)</th>
                <th rowspan="2" style="background: var(--primary-red);">TOTAL</th>
            </tr>
            <tr>`;
            
        // Cetak komponen yang sudah aktif
        activeKomponenIds.forEach(idKomp => {
            theadHtml += `<th>${getNamaKomponen(idKomp)}</th>`;
        });

        // Buat Dropdown Inline untuk komponen yang belum aktif
        let hasAvailable = false;
        let optionsHtml = '<option value="" disabled selected>Pilih...</option>';
        daftarMasterKomponen.forEach(k => {
            if (!activeKomponenIds.includes(k.id_komponen.toString())) {
                optionsHtml += `<option value="${k.id_komponen}">${k.nama_komponen.toUpperCase()}</option>`;
                hasAvailable = true;
            }
        });

        // Cetak Kolom Tombol Tambah
        if (hasAvailable) {
            theadHtml += `
                <th style="background:#1f2937; min-width:130px;">
                    <div style="display:flex; justify-content:center; align-items:center; gap:5px;">
                        <select id="selectKompInline" class="select-inline">${optionsHtml}</select>
                        <button class="btn-add-inline" onclick="tambahKomponenInline()" title="Tambah Komponen">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </th>`;
        } else {
            theadHtml += `<th style="background:#1f2937; color:#9ca3af; font-weight:normal; font-size:0.75rem;">Maksimal</th>`;
        }
        
        theadHtml += `</tr>`;
        thead.innerHTML = theadHtml;

        // --- BAGIAN TBODY (ISI DATA) ---
        let html = '';
        let cplCount = {};
        let renderedCpl = {};
        let renderedMkTotal = false;
        let totalMK = 0;

        dataCpmkGrouped.forEach(row => {
            let cplKey = row.kode_mk + '_' + row.cpl;
            cplCount[cplKey] = (cplCount[cplKey] || 0) + 1;
        });

        dataCpmkGrouped.forEach((row, index) => {
            let cplKey = row.kode_mk + '_' + row.cpl;
            let tr = `<tr data-cpmk="${row.kode_cpmk}">`;

            if (!renderedCpl[cplKey]) {
                tr += `<td class="text-left col-cpl" rowspan="${cplCount[cplKey]}">${row.cpl}</td>`;
                renderedCpl[cplKey] = true;
            }

            if (index === 0) {
                tr += `<td class="text-left col-mk" rowspan="${dataCpmkGrouped.length}">${row.kode_mk}</td>`;
                tr += `<td class="text-left" style="font-weight: 600;" rowspan="${dataCpmkGrouped.length}">${row.nama_mk}</td>`;
            }

            tr += `<td class="col-cpmk">${row.kode_cpmk}</td>`;

            // Cetak Inputan Data Nilai
            activeKomponenIds.forEach(idKomp => {
                let val = row.bobot_komponen[idKomp] || 0;
                tr += `<td><input type="number" class="input-bobot" data-mk="${row.kode_mk}" data-idkomp="${idKomp}" value="${val}" min="0" max="100" oninput="hitungTotalMK('${row.kode_mk}')"></td>`;
                if(index === 0) totalMK += val; // Kalkulasi total hanya sekali utk baris pertama (sebagai referensi awal)
            });

            // Kolom kosong sejajar di bawah tombol [+]
            tr += `<td style="background: #f8fafc;"></td>`;

            // Kolom Grand Total
            if (!renderedMkTotal) {
                // Perhitungan ulang dinamis untuk Total Awal saat diload
                let tempTotal = 0;
                activeKomponenIds.forEach(idKomp => { tempTotal += (dataCpmkGrouped[0].bobot_komponen[idKomp] || 0) });
                
                const warnaWarna = tempTotal === 100 ? 'total-ok' : 'total-warn';
                tr += `<td id="total-mk-${row.kode_mk}" class="col-total ${warnaWarna}" rowspan="${dataCpmkGrouped.length}">${tempTotal}%</td>`;
                renderedMkTotal = true;
            }

            tr += `</tr>`;
            html += tr;
        });

        tbody.innerHTML = html;
        
        // Panggil hitungTotalMK untuk update kalkulasi berdasarkan semua inputan awal
        if(dataCpmkGrouped.length > 0) {
           hitungTotalMK(dataCpmkGrouped[0].kode_mk);
        }
    }

    // 7. Kalkulasi Persentase Dinamis
    function hitungTotalMK(kodeMk) {
        const inputs = document.querySelectorAll(`input[data-mk="${kodeMk}"]`);
        let sum = 0;
        // Hanya jumlahkan nilai yang satu baris (CPMK) untuk divalidasi? 
        // ATAU berdasarkan desain Anda sebelumnya, total adalah gabungan SELURUH bobot dalam matkul tersebut
        inputs.forEach(input => { sum += (parseFloat(input.value) || 0); });

        const totalCell = document.getElementById(`total-mk-${kodeMk}`);
        if (totalCell) {
            totalCell.innerText = sum + "%";
            if (sum === 100) {
                totalCell.classList.remove('total-warn');
                totalCell.classList.add('total-ok');
            } else {
                totalCell.classList.remove('total-ok');
                totalCell.classList.add('total-warn');
            }
        }
    }

    // 8. Simpan Perubahan ke Database API
    async function simpanBobot() {
        const btnSave = document.querySelector('.btn-save-bobot');
        const oriText = btnSave.innerHTML;
        
        const rows = document.querySelectorAll('tbody tr[data-cpmk]');
        if(rows.length === 0) return;

        let kodeMk = document.getElementById('selectMk').value;
        const inputs = document.querySelectorAll(`input[data-mk="${kodeMk}"]`);
        let totalMK = 0;
        inputs.forEach(input => totalMK += (parseFloat(input.value) || 0));

        if (totalMK !== 100 && totalMK > 0) {
            alert(`⚠️ GAGAL MENYIMPAN!\n\nTotal seluruh bobot CPMK harus pas 100%. (Saat ini: ${totalMK}%)`);
            return;
        }

        let payloadData = [];

        rows.forEach(row => {
            const kodeCpmk = row.getAttribute('data-cpmk');
            activeKomponenIds.forEach(idKomp => {
                const input = row.querySelector(`input[data-idkomp="${idKomp}"]`);
                if (input) {
                    payloadData.push({
                        kode_mk: kodeMk,
                        kode_cpmk: kodeCpmk,
                        id_komponen: parseInt(idKomp),
                        prodi: PRODI,
                        bobot: parseFloat(input.value) || 0
                    });
                }
            });
        });

        btnSave.innerHTML = '<i class="fas fa-spinner fa-spin fa-lg" style="margin-right:8px;"></i> Menyimpan...';
        btnSave.disabled = true;

        try {
            for (const payload of payloadData) {
                await fetch(API_SAVE_BOBOT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }
            alert("✅ Sempurna! Master Bobot dinamis berhasil disimpan!");
            loadDataBobot(); 
        } catch (error) {
            alert("❌ Gagal terhubung ke server.");
        } finally {
            btnSave.innerHTML = oriText;
            btnSave.disabled = false;
        }
    }
</script>
</body>
</html>
