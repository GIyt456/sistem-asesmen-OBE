<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemetaan CPL - Profil Lulusan - Sistem OBE</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../../../js/api_config.js"></script>
    
    <style>
        :root { 
            --sidebar-bg: #161923; --sidebar-text: #7b8395; --sidebar-hover: #262936; --sidebar-active-text: #ffffff;
            --primary-blue: #1e3a8a; --primary-red: #8b0000; --bg-main: #f9fafb; --text-dark: #111827; --border-color: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark); animation: transitionIn 0.3s ease-in-out; }
        @keyframes transitionIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .main-content { flex: 1; overflow-y: auto; padding: 40px 50px; }
        .header-container { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); }
        .header-title span { color: var(--primary-blue); }

        .btn-save { background: var(--primary-blue); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-save:hover { background: #172554; transform: translateY(-2px); }

        /* Matriks Styling */
        .matrix-container { background: white; border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: auto; max-height: 70vh; }
        table { border-collapse: collapse; width: max-content; min-width: 100%; text-align: center; }
        
        th { background: #1e293b; color: white; font-size: 0.85rem; font-weight: 700; padding: 18px 15px; position: sticky; top: 0; z-index: 10; border-right: 1px solid #334155; }
        th:first-child { left: 0; z-index: 20; background: #0f172a; min-width: 150px; text-align: left; padding-left: 25px; }
        
        td { padding: 15px; border: 1px solid var(--border-color); }
        td:first-child { position: sticky; left: 0; background: #f8fafc; font-weight: 800; color: var(--primary-blue); text-align: left; padding-left: 25px; z-index: 5; border-right: 2px solid var(--border-color); cursor: help; }
        
        .chk-matrix { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary-blue); }
    </style>
</head>
<body>

<div id="sidebar-container"></div>

    <div class="main-content">
        <div class="fixed-header">
            <div class="header-container">
                <div class="header-title-area">
                    <div class="header-subtitle">PEMETAAN (MAPPING)</div>
                    <h1 class="header-title">MATRIKS <span>CPL - PROFIL LULUSAN</span></h1>
                </div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <p style="color: #64748b; font-size: 0.95rem; margin: 0;">Centang Profil Lulusan (PL) yang berelasi dengan Capaian Pembelajaran Lulusan (CPL).</p>
                <button class="btn-save" style="width: auto; margin-top: 0; background: #475569;" onclick="loadData()"><i class="fas fa-sync-alt"></i> Refresh Data</button>
            </div>
        </div>
        <br>

        <div class="scrollable-content">
            <div style="overflow-x: auto; max-height: 550px; border: 1px solid var(--border-color); border-radius: 8px; background: white;">
                <table id="matriksTable">
                    <thead>
                        <tr id="headerRow">
                            <th style="min-width: 120px; white-space: nowrap; text-align: left; position: sticky; left: 0; background: #e2e8f0; z-index: 10;">CPL / PL</th>
                        </tr>
                    </thead>
                    <tbody id="bodyMatriks">
                        <tr><td style="text-align: center; padding: 30px;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>

            <button id="btnSave" class="btn-save" onclick="simpanMapping()" disabled><i class="fas fa-save"></i> Simpan Matriks</button>
        </div>
    </div>

    <script src="/js/template.js"></script>

<script>
    const PRODI = localStorage.getItem("prodi_aktif") || "si";
    const API_CPL = `${API_BASE}/get-master-cpl?prodi=${PRODI}`;
    const API_PL = `${API_BASE}/get-master-pl?prodi=${PRODI}`;
    const API_RELASI = `${API_BASE}/get-mapping-cpl-pl?prodi=${PRODI}`;
    const API_SAVE_MAPPING = `${API_BASE}/admin-map-cpl-pl`;

    let listCPL = [];
    let listPL = [];

    const userLogin = localStorage.getItem("user_login");
            if (!userLogin) window.location.replace("/login/login.html");

    window.onload = () => {
        setTimeout(loadData, 400); 
    };

    async function loadData() {
        const btnSave = document.getElementById("btnSave");
        const tbody = document.getElementById("bodyMatriks");
        if(btnSave) btnSave.disabled = true;

        try {
            const [resCpl, resPl, resRelasi] = await Promise.all([
                fetch(API_CPL),
                fetch(API_PL),
                fetch(API_RELASI)
            ]);

            listCPL = await resCpl.json();
            listPL = await resPl.json();

            // KEBAL BADAI: Kalau relasi kosong, anggap array []
            let relasiExisting = [];
            try {
                relasiExisting = await resRelasi.json();
                if (!Array.isArray(relasiExisting)) relasiExisting = [];
            } catch (e) {
                console.warn("Info: Data relasi saat ini masih kosong di database.");
                relasiExisting = [];
            }

            if (!listCPL || listCPL.length === 0 || !listPL || listPL.length === 0) {
                tbody.innerHTML = "<tr><td colspan='100%' style='padding: 30px; color: red; font-weight: bold;'>Data CPL atau PL masih KOSONG! Harap isi terlebih dahulu.</td></tr>";
                return;
            }

            renderMatriks(relasiExisting);
            if(btnSave) btnSave.disabled = false;

        } catch (error) {
            console.error(error);
            tbody.innerHTML = "<tr><td colspan='100%' style='padding: 30px; color: red;'>Gagal terhubung ke API. Cek n8n!</td></tr>";
        }
    }

    function renderMatriks(relasiExisting) {
        const headerRow = document.getElementById("headerRow");
        const tbody = document.getElementById("bodyMatriks");
        if(!headerRow || !tbody) return;

        // Render Judul Kolom (PL)
        headerRow.innerHTML = `<th style="min-width: 120px; white-space: nowrap; text-align: left; position: sticky; left: 0; background: #e2e8f0; z-index: 10;">CPL / PL</th>`;
        listPL.forEach(pl => {
            headerRow.innerHTML += `
                <th title="${pl.nama_profil || pl.kode_pl}">
                    <div style="font-weight: 800; font-size: 1.05rem; margin-bottom: 5px;">${pl.kode_pl}</div>
                    <div style="font-size: 0.85rem; font-weight: 500; white-space: normal; max-width: 200px; margin: 0 auto; line-height: 1.3;">
                        ${pl.nama_profil || ''}
                    </div>
                </th>`;
        });

        // Render Baris (CPL)
        tbody.innerHTML = "";
        listCPL.forEach(cpl => {
            let tr = `<tr class="cpl-row">
                <td style="position: sticky; left: 0; background: #f8fafc; z-index: 5; white-space: nowrap;" title="${cpl.deskripsi || ''}">${cpl.kode_cpl}</td>`;
            
            listPL.forEach(pl => {
                const isChecked = relasiExisting.some(r => r.kode_cpl === cpl.kode_cpl && r.kode_pl === pl.kode_pl);
                const chk = isChecked ? 'checked' : '';
                tr += `<td><input type="checkbox" class="chk-matrix" data-cpl="${cpl.kode_cpl}" data-pl="${pl.kode_pl}" ${chk}></td>`;
            });
            
            tr += `</tr>`;
            tbody.innerHTML += tr;
        });
    }

    function applyMapping(data) {
        if (!Array.isArray(data)) return;
        data.forEach(m => {
            const cb = document.getElementById(`${m.kode_pl}_${m.kode_cpl}`);
            if (cb) cb.checked = true;
        });
    }

    async function saveMapping() {
        const btn = document.getElementById('btnSave');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
        btn.disabled = true;

        let promises = [];
        listPL.forEach(pl => {
            const checked = document.querySelectorAll(`.chk-matrix[data-pl="${pl.kode_pl}"]:checked`);
            const cplList = Array.from(checked).map(c => c.getAttribute('data-cpl'));

            // Mengirim per PL agar n8n bisa melakukan Delete-then-Insert dengan aman
            promises.push(fetch(`${API_BASE}/admin-map-cpl-pl`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ kode_pl: pl.kode_pl, cpl_list: cplList, prodi: PRODI })
            }));
        });

        try {
            await Promise.all(promises);
            alert("✅ Pemetaan CPL - Profil Lulusan berhasil disimpan!");
        } catch (e) { alert("❌ Gagal menyimpan."); }
        finally { btn.innerHTML = '<i class="fas fa-save"></i> Simpan Pemetaan'; btn.disabled = false; }
    }
</script>
</body>
</html>
