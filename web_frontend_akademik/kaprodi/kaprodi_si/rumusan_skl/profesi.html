<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Profesi - Sistem OBE</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --sidebar-bg: #161923; --sidebar-text: #7b8395; --sidebar-hover: #262936; 
            --primary-blue: #1e3a8a; --bg-main: #f9fafb; --border-color: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; animation: transitionIn 0.3s ease-in-out; }
        @keyframes transitionIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); }}

        .main-content { flex: 1; overflow-y: auto; padding: 40px 50px; }
        .header-container { margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: #111827; }
        .header-title span { color: var(--primary-blue); }

        .table-container { background: white; border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f8fafc; padding: 15px 20px; font-size: 0.85rem; font-weight: 700; color: #475569; border-bottom: 2px solid var(--border-color); text-transform: uppercase; }
        td { padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; color: #1e293b; }

        .btn-edit { background: #f1f5f9; color: var(--primary-blue); border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
        .btn-edit:hover { background: var(--primary-blue); color: white; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 35px; border-radius: 16px; width: 550px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; color: #475569; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <div class="main-content">
        <div class="header-container">
            <h1 class="header-title">Daftar <span>Profesi</span></h1>
            <p style="color: #64748b; margin-top: 5px;">Peluang karir yang terhubung dengan Profil Lulusan.</p>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 60px; text-align: center;">NO</th>
                        <th>JENIS PROFESI / PEKERJAAN</th>
                        <th>PROFIL LULUSAN TERKAIT</th>
                        <th style="width: 100px; text-align: center;">OPSI</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="4" style="text-align: center; padding: 40px;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 25px; font-weight: 800;">Edit Profesi</h2>
            <input type="hidden" id="editKode">
            <input type="hidden" id="editDeskripsi"> <div class="form-group">
                <label>Nama Profil Lulusan</label>
                <input type="text" id="editNamaProfil" disabled style="background: #f8fafc;">
            </div>
            <div class="form-group">
                <label>Daftar Profesi (Pisahkan dengan koma)</label>
                <textarea id="editProfesi" rows="5" placeholder="Contoh: IT Auditor, IT Governance, Analyst"></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px;">
                <button onclick="closeModal()" style="padding: 12px 20px; border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; cursor: pointer;">Batal</button>
                <button onclick="updateProfesi()" style="padding: 12px 20px; background: var(--primary-blue); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700;">Simpan Perubahan</button>
            </div>
        </div>
    </div>

    <script src="/js/template.js"></script>

    <script>
        const API_BASE = "https://recommend-promised-nasa-robinson.trycloudflare.com/webhook";
        const PRODI = localStorage.getItem("prodi_aktif") || "si";

        const userLogin = localStorage.getItem("user_login");
            if (!userLogin) window.location.replace("/login/login.html");

        window.onload = () => {
            setTimeout(loadDataProfesi, 400); 
        };

        async function loadDataProfesi() {
            const tbody = document.getElementById('tableBody');
            try {
                const res = await fetch(`${API_BASE}/get-master-pl?prodi=${PRODI}`);
                const data = await res.json();
                tbody.innerHTML = '';
                let no = 1;

                const aman = (str) => {
                    if (!str) return '';
                    return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '');
                };

                data.forEach(pl => {
                    if (pl.profesi) {
                        const list = pl.profesi.split(',');
                        list.forEach(prof => {
                            if(prof.trim() !== "") {
                                const tr = document.createElement('tr');
                                tr.innerHTML = `
                                    <td style="text-align: center; font-weight: 600;">${no++}</td>
                                    <td style="font-weight: 700; color: var(--primary-blue);">${prof.trim()}</td>
                                    <td><span style="font-weight: 800;">${pl.kode_pl}</span> - ${pl.nama_profil || '-'}</td>
                                    <td style="text-align: center;">
                                        <button class="btn-edit" onclick="openModal('${pl.kode_pl}', '${aman(pl.nama_profil)}', '${aman(pl.deskripsi)}', '${aman(pl.profesi)}')">Edit</button>
                                    </td>
                                `;
                                tbody.appendChild(tr);
                            }
                        });
                    }
                });
            } catch (e) { tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px;">Gagal memuat data.</td></tr>'; }
        }

        function openModal(kode, nama, desk, prof) {
            document.getElementById('editKode').value = kode;
            document.getElementById('editNamaProfil').value = nama;
            document.getElementById('editDeskripsi').value = desk;
            document.getElementById('editProfesi').value = prof;
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('editModal').style.display = 'none'; }

        async function updateProfesi() {
            const payload = {
                kode_pl: document.getElementById('editKode').value,
                nama_profil: document.getElementById('editNamaProfil').value,
                deskripsi: document.getElementById('editDeskripsi').value,
                profesi: document.getElementById('editProfesi').value,
                prodi: PRODI
            };
            try {
                const res = await fetch(`${API_BASE}/update-master-pl`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) { 
                    alert("✅ Data Profesi berhasil diperbarui!"); 
                    closeModal(); 
                    loadDataProfesi(); 
                }
            } catch (e) { alert("❌ Gagal menyimpan."); }
        }
    </script>
</body>
</html>
