<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Lulusan - Sistem OBE</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../../../js/api_config.js"></script>
    
    <style>
        :root { 
            --sidebar-bg: #161923; --sidebar-text: #7b8395; --sidebar-hover: #262936; --sidebar-active-text: #ffffff;
            --primary-blue: #1e3a8a; --primary-red: #8b0000; --bg-main: #f9fafb; --text-dark: #111827; --border-color: #e5e7eb;
            --success-green: #10b981;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; animation: transitionIn 0.3s ease-in-out; }
        @keyframes transitionIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .main-content { flex: 1; overflow-y: auto; padding: 40px 50px; }    
        .header-container { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .header-title-area { display: flex; flex-direction: column; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); }
        .header-title span { color: var(--primary-blue); }

        /* Tombol Aksi */
        .action-buttons { display: flex; gap: 10px; align-items: center; }
        .btn-action { color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-download { background: #475569; }
        .btn-download:hover { background: #334155; transform: translateY(-2px); }
        .btn-upload { background: var(--success-green); }
        .btn-upload:hover { background: #059669; transform: translateY(-2px); }

        .table-container { background: white; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; min-width: 700px; border-collapse: collapse; text-align: left; }
        th { background: #f8fafc; padding: 18px 25px; font-size: 0.85rem; font-weight: 700; color: #475569; border-bottom: 2px solid var(--border-color); text-transform: uppercase; }
        td { padding: 20px 25px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; line-height: 1.6; color: #1e293b; vertical-align: top; }
        
        .btn-edit { background: #f1f5f9; color: var(--primary-blue); border: 1px solid #cbd5e1; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
        .btn-edit:hover { background: var(--primary-blue); color: white; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 35px; border-radius: 16px; width: 550px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; color: #475569; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="header-container">
            <div class="header-title-area">
                <h1 class="header-title">Profil <span>Lulusan</span></h1>
                <p style="color: #64748b; margin-top: 5px;">Rumusan standar kompetensi lulusan Program Studi.</p>
            </div>
            
            <div class="action-buttons">
                <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
                <button class="btn-action btn-download" onclick="downloadExcel()">
                    <i class="fas fa-file-download"></i> Template
                </button>
                
                <input type="file" id="fileExcel" accept=".xlsx, .xls" style="display: none;" onchange="uploadExcel()">
                <button class="btn-action btn-upload" onclick="document.getElementById('fileExcel').click()">
                    <i class="fas fa-file-import"></i> Import Excel
                </button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 100px;">KODE</th>
                        <th style="width: 250px;">PROFIL LULUSAN</th>
                        <th>RUMUSAN DESKRIPSI KOMPETENSI</th>
                        <th style="width: 120px; text-align: center;">OPSI</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="4" style="text-align: center; padding: 50px;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 25px; font-weight: 800;">Edit Profil Lulusan</h2>
            <input type="hidden" id="editKode">
            <input type="hidden" id="editProfesi"> 
            
            <div class="form-group">
                <label>KODE PL</label>
                <input type="text" id="inpKodeShow" disabled style="background: #f8fafc; font-weight: 700;">
            </div>
            <div class="form-group">
                <label>NAMA PROFIL LULUSAN</label>
                <input type="text" id="editNamaProfil">
            </div>
            <div class="form-group">
                <label>RUMUSAN DESKRIPSI</label>
                <textarea id="editDeskripsi" rows="6"></textarea>
            </div>
            
            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px;">
                <button onclick="closeModal()" style="padding: 12px 20px; border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; cursor: pointer;">Batal</button>
                <button onclick="updatePL()" style="padding: 12px 20px; background: var(--primary-blue); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700;">Simpan Perubahan</button>
            </div>
        </div>
    </div>

    <script src="/js/template.js"></script>
 
    <script>
        const PRODI = localStorage.getItem("prodi_aktif") || "si";

       const userLogin = localStorage.getItem("user_login");
            if (!userLogin) window.location.replace("/login/login.html");

        window.onload = () => {
            setTimeout(loadDataPL, 400); 
        };

        async function loadDataPL() {
            const tbody = document.getElementById('tableBody');
            try {
                const res = await fetch(`${API_BASE}/get-master-pl?prodi=${PRODI}`);
                const data = await res.json();
                tbody.innerHTML = '';
                
                const aman = (str) => {
                    if (!str) return '';
                    return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '');
                };

                data.forEach(pl => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: 800; color: var(--primary-blue);">${pl.kode_pl}</td>
                        <td style="font-weight: 700;">${pl.nama_profil || '-'}</td>
                        <td style="font-size: 0.9rem;">${pl.deskripsi || '-'}</td>
                        <td style="text-align: center;">
                            <button class="btn-edit" onclick="openModal('${pl.kode_pl}', '${aman(pl.nama_profil)}', '${aman(pl.deskripsi)}', '${aman(pl.profesi)}')">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) { 
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px;">Gagal memuat data.</td></tr>'; 
            }
        }

        // --- FUNGSI DOWNLOAD EXCEL ---
        async function downloadExcel() {
            const btn = document.querySelector('.btn-download'); // Pastikan class tombolmu sesuai
            const oriText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengekspor...';
            btn.disabled = true;

            try {
                // Tarik data dengan menyertakan PRODI
                const res = await fetch(`${API_BASE}/get-master-pl?prodi=${PRODI}`);
                const data = await res.json();

                if (!data || data.length === 0) {
                    alert("Belum ada data untuk di-export.");
                    return;
                }

                // Rapikan format untuk Excel (Sesuai kolom database)
                const dataMapping = data.map(pl => ({
                    'kode_pl': pl.kode_pl,
                    'nama_profil': pl.nama_profil,
                    'deskripsi': pl.deskripsi || '',
                    'profesi': pl.profesi || ''
                }));

                // Menggunakan SheetJS untuk Download
                const worksheet = XLSX.utils.json_to_sheet(dataMapping);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Master_PL");
                XLSX.writeFile(workbook, `Data_Master_PL_${PRODI}.xlsx`);

            } catch (e) {
                console.error(e);
                alert("Gagal mengambil data untuk export.");
            } finally {
                btn.innerHTML = oriText;
                btn.disabled = false;
            }
        }

        // --- FUNGSI UPLOAD EXCEL ---
        async function uploadExcel() {
            const fileInput = document.getElementById('fileExcel');
            const file = fileInput.files[0];
            if (!file) {
                alert("Pilih file Excel terlebih dahulu!");
                return;
            }

            const formData = new FormData();
            formData.append('data', file);
            formData.append('prodi', PRODI); // WAJIB ADA AGAR N8N TAHU INI SI/TI!

            const btnUpload = document.querySelector('.btn-upload'); // Pastikan class tombolmu sesuai
            const oriText = btnUpload.innerHTML;
            btnUpload.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengimpor...';
            btnUpload.disabled = true;

            try {
                // Pastikan URL-nya mengarah ke webhook upload PL
                const res = await fetch(`${API_BASE}/upload-master-pl`, { 
                    method: 'POST', 
                    body: formData 
                });
                
                if (res.ok) { 
                    alert("✅ Data Excel PL berhasil diimpor!"); 
                    location.reload(); // Refresh halaman agar data muncul
                } else { 
                    alert("❌ Gagal memproses file Excel. Cek format kolom."); 
                }
            } catch (e) { 
                console.error(e);
                alert("❌ Terjadi kesalahan koneksi."); 
            } finally { 
                btnUpload.innerHTML = oriText; 
                btnUpload.disabled = false; 
                fileInput.value = ''; // Reset input file
            }
        }

        function openModal(kode, nama, desk, prof) {
            document.getElementById('editKode').value = kode;
            document.getElementById('inpKodeShow').value = kode;
            document.getElementById('editNamaProfil').value = nama;
            document.getElementById('editDeskripsi').value = desk;
            document.getElementById('editProfesi').value = prof;
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('editModal').style.display = 'none'; }

        async function updatePL() {
            const payload = {
                kode_pl: document.getElementById('editKode').value,
                nama_profil: document.getElementById('editNamaProfil').value,
                deskripsi: document.getElementById('editDeskripsi').value,
                profesi: document.getElementById('editProfesi').value,
                prodi: PRODI
            };
            try {
                const res = await fetch(`${API_BASE}/update-master-pl`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) { 
                    alert("✅ Profil Lulusan berhasil diperbarui!"); 
                    closeModal(); 
                    loadDataPL(); 
                }
            } catch (e) { alert("❌ Gagal menyimpan."); }
        }
    </script>
</body>
</html>
