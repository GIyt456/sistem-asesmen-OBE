<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemetaan BK - MK - Sistem OBE</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --sidebar-bg: #161923; --sidebar-text: #7b8395; --sidebar-hover: #262936; --sidebar-active-text: #ffffff;
            --primary-blue: #1e3a8a; --primary-red: #8b0000; --bg-main: #f9fafb; --text-dark: #111827; --border-color: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark); }
        
        #sidebar-container { width: 280px; min-width: 280px; height: 100vh; background: var(--sidebar-bg); flex-shrink: 0; }
        
        .main-content { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-main); }
        .fixed-header { padding: 40px 50px 20px 50px; flex-shrink: 0; background: var(--bg-main); z-index: 10; border-bottom: 1px solid var(--border-color); }
        .scrollable-content { flex: 1; overflow-y: auto; padding: 30px 50px 40px 50px; }
        
        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
        .header-title-area { display: flex; flex-direction: column; }
        .header-subtitle { color: #64748b; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); }
        .header-title span { color: var(--primary-blue); }
        .badge-prodi { background: var(--primary-blue); color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; }
        
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { border: 1px solid var(--border-color); padding: 12px; font-size: 0.9rem; }
        th { background: #f8fafc; font-weight: 700; color: #475569; position: sticky; top: 0; z-index: 5; box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1); }
        td { color: #1e293b; }
        
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary-blue); }
        
        .btn-save { background: var(--primary-blue); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; margin-top: 25px; width: 100%; justify-content: center; font-size: 1rem;}
        .btn-save:hover { background: #1e40af; transform: translateY(-2px); }
        .btn-save:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
        
        .bk-row td { text-align: left; font-weight: 700; background: #f8fafc; color: var(--primary-blue); }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="fixed-header">
            <div class="header-container">
                <div class="header-title-area">
                    <div class="header-subtitle">PEMETAAN (MAPPING)</div>
                    <h1 class="header-title">MATRIKS <span>BK - MK</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <p style="color: #64748b; font-size: 0.95rem; margin: 0;">Centang Mata Kuliah (MK) yang berelasi dengan Bahan Kajian (BK).</p>
                <button class="btn-save" style="width: auto; margin-top: 0; background: #475569;" onclick="loadData()"><i class="fas fa-sync-alt"></i> Refresh Data</button>
            </div>
        </div>

        <div class="scrollable-content">
            <div style="overflow-x: auto; max-height: 550px; border: 1px solid var(--border-color); border-radius: 8px; background: white;">
                <table id="matriksTable">
                    <thead>
                        <tr id="headerRow">
                            <th style="min-width: 120px; white-space: nowrap; text-align: left; position: sticky; left: 0; background: #e2e8f0; z-index: 10;">BK / MK</th>
                        </tr>
                    </thead>
                    <tbody id="bodyMatriks">
                        <tr><td style="text-align: center; padding: 30px;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>

            <button id="btnSave" class="btn-save" onclick="simpanMapping()" disabled><i class="fas fa-save"></i> Simpan Matriks</button>
        </div>
    </div>

<script src="/js/template.js"></script>

<script>
    const PRODI = localStorage.getItem("prodi_aktif") || "si"; 
    
    const API_BASE = "https://toolbox-router-wyoming-definitions.trycloudflare.com/webhook"; 
    
    const API_BK = `${API_BASE}/get-master-bk?prodi=${PRODI}`;
    const API_MK = `${API_BASE}/get-susunan-matkul?prodi=${PRODI}`;
    const API_RELASI = `${API_BASE}/get-mapping-bk-mk?prodi=${PRODI}`;
    const API_SAVE_MAPPING = `${API_BASE}/admin-map-bk-mk`;

     const userLogin = localStorage.getItem("user_login");
        if (!userLogin) window.location.replace("/login/login.html");

    window.onload = () => {
        setTimeout(loadData, 400); // Langsung eksekusi analisis saat web dibuka
    };

    let listBK = [];
    let listMK = [];

    async function loadData() {
        const btnSave = document.getElementById("btnSave");
        const tbody = document.getElementById("bodyMatriks");
        if(btnSave) btnSave.disabled = true;

        try {
            const [resBk, resMk, resRelasi] = await Promise.all([
                fetch(API_BK),
                fetch(API_MK),
                fetch(API_RELASI)
            ]);

            listBK = await resBk.json();
            listMK = await resMk.json();

            // PENGAMANAN: Tangkap error jika data relasi kosong dari n8n
            let relasiExisting = [];
            try {
                relasiExisting = await resRelasi.json();
                if (!Array.isArray(relasiExisting)) relasiExisting = [];
            } catch (e) {
                console.warn("Info: Data relasi saat ini masih kosong di database.");
                relasiExisting = [];
            }

            // CEK FISIK DATA
            if (!listBK || listBK.length === 0 || !listMK || listMK.length === 0) {
                tbody.innerHTML = "<tr><td colspan='100%' style='padding: 30px; color: red; font-weight: bold;'>Data BK atau MK masih KOSONG! Harap isi terlebih dahulu.</td></tr>";
                return;
            }

            renderMatriks(relasiExisting);
            if(btnSave) btnSave.disabled = false;

        } catch (error) {
            console.error(error);
            tbody.innerHTML = "<tr><td colspan='100%' style='padding: 30px; color: red;'>Gagal terhubung ke API. Cek koneksi internet atau link Cloudflare!</td></tr>";
        }
    }

    function renderMatriks(relasiExisting) {
        const headerRow = document.getElementById("headerRow");
        const tbody = document.getElementById("bodyMatriks");
        if(!headerRow || !tbody) return;

        // Render Judul Kolom (MK)
        headerRow.innerHTML = `<th style="min-width: 120px; white-space: nowrap; text-align: left; position: sticky; left: 0; background: #e2e8f0; z-index: 10;">BK / MK</th>`;
        listMK.forEach(mk => {
            headerRow.innerHTML += `<th title="Kode: ${mk.kode_mk}">${mk.nama_mk || mk.nama_mata_kuliah || ''}</th>`;
        });

        // Render Baris (BK)
        tbody.innerHTML = "";
        listBK.forEach(bk => {
            let tr = `<tr class="bk-row">
                <td style="position: sticky; left: 0; background: #f8fafc; z-index: 5; white-space: nowrap;" title="${bk.nama_bk || ''}">${bk.kode_bk}</td>`;
            
            listMK.forEach(mk => {
                const isChecked = relasiExisting.some(r => r.kode_bk === bk.kode_bk && r.kode_mk === mk.kode_mk);
                const chk = isChecked ? 'checked' : '';
                tr += `<td><input type="checkbox" class="chk-matrix" data-bk="${bk.kode_bk}" data-mk="${mk.kode_mk}" ${chk}></td>`;
            });
            
            tr += `</tr>`;
            tbody.innerHTML += tr;
        });
    }

    async function simpanMapping() {
        const btnSave = document.getElementById('btnSave');
        btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
        btnSave.disabled = true;
        
        let fetchPromises = [];

        listBK.forEach(bk => {
            const checkedBoxes = document.querySelectorAll(`.chk-matrix[data-bk="${bk.kode_bk}"]:checked`);
            const mkList = Array.from(checkedBoxes).map(cb => cb.getAttribute('data-mk'));

            const payload = {
                kode_bk: bk.kode_bk,
                mk_list: mkList,
                prodi: PRODI
            };

            const request = fetch(API_SAVE_MAPPING, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            fetchPromises.push(request);
        });

        try {
            await Promise.all(fetchPromises);
            alert("✅ Matriks Relasi BK - MK berhasil disimpan!");
        } catch (error) {
            console.error(error);
            alert("❌ Gagal menyimpan beberapa data ke server. Cek koneksi.");
        } finally {
            btnSave.innerHTML = '<i class="fas fa-save"></i> Simpan Matriks';
            btnSave.disabled = false;
        }
    }
</script>
</body>
</html>
