<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola CPL - Sistem OBE</title>
    
    <!-- MENGGUNAKAN PATH ABSOLUT ( / ) AGAR TIDAK NYASAR -->
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- MENGGUNAKAN PATH ABSOLUT -->
    <script src="/js/api_config.js"></script>
    <script src="/js/template.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        /* =========================================
           STYLE KHUSUS ADMIN PANEL SI (EMBEDDED)
        ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root { 
            --primary-blue: #1e3a8a; 
            --bg-main: #f9fafb; 
            --text-dark: #111827; 
            --border-color: #e5e7eb;
            --success-green: #10b981; 
            --danger-red: #dc2626;
        }

        body, html { 
            display: flex; 
            background: var(--bg-main); 
            height: 100vh; 
            width: 100%;
            overflow-x: hidden; 
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
        }

        /* 1. KUNCI UTAMA: SEMBUNYIKAN ELEMEN MOBILE DI DESKTOP */
        .navbar-mobile { display: none !important; }
        .mobile-overlay { display: none !important; }

        .main-content { 
            flex: 1; 
            overflow-y: auto; 
            overflow-x: hidden;
            display: flex; 
            flex-direction: column;
            width: 100%;
        }

        #sidebar-container { width: 280px; min-width: 280px; height: 100vh; flex-shrink: 0; z-index: 1000; }

        /* HEADER DESKTOP */
        .fixed-header { padding: 40px 50px 20px 50px; flex-shrink: 0; background: var(--bg-main); z-index: 10; border-bottom: 1px solid var(--border-color); }
        .scrollable-content { flex: 1; overflow-y: auto; padding: 30px 50px 40px 50px; overflow-x: hidden; }

        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .header-title-area { display: flex; flex-direction: column; }
        .header-subtitle { color: #64748b; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); }
        .header-title span { color: var(--primary-blue); }
        .badge-prodi { background: var(--primary-blue); color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; }
        
        /* TABLE STYLING */
        .table-container { background: white; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow-x: auto; margin-bottom: 20px; width: 100%; }
        table { width: 100%; min-width: 700px; border-collapse: collapse; text-align: left; }
        th { background: #f8fafc; padding: 15px 20px; font-size: 0.85rem; font-weight: 700; color: #475569; border-bottom: 2px solid var(--border-color); text-transform: uppercase; position: sticky; top: 0; z-index: 5;}
        td { padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; color: #1e293b; vertical-align: middle; }
        
        /* BUTTONS */
        .action-buttons { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn-action { color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; white-space: nowrap; }
        .btn-dark { background: #1e293b; }
        .btn-dark:hover { background: #0f172a; transform: translateY(-2px); }
        .btn-download { background: #475569; }
        .btn-download:hover { background: #334155; transform: translateY(-2px); }
        .btn-upload { background: var(--success-green); }
        .btn-upload:hover { background: #059669; transform: translateY(-2px); }
        
        /* PAGINATION */
        #pagination-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; padding-bottom: 40px; flex-wrap: wrap;}
        #pagination-container button { padding: 8px 16px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; cursor: pointer; font-weight: 600; color: #475569; transition: 0.2s; }
        #pagination-container button:hover:not(:disabled) { background: #f1f5f9; color: var(--text-dark); }
        #pagination-container button:disabled { opacity: 0.5; cursor: not-allowed; }

        .profile-btn-mobile {
            width: 36px; height: 36px; border-radius: 50%; 
            border: 2px solid rgba(255, 255, 255, 0.2); overflow: hidden; 
            cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        }
        .profile-btn-mobile img { width: 100%; height: 100%; object-fit: cover; }

        /* =========================================
           RESPONSIVE MOBILE (AKTIF KHUSUS DI HP)
        ========================================= */
        @media screen and (max-width: 768px) {
            
            /* Munculkan Navbar Mobile */
            .navbar-mobile {
                display: flex !important; 
                position: fixed; top: 0; left: 0; width: 100%;
                background-color: #0f172a; 
                padding: 12px 20px; align-items: center; justify-content: space-between;
                z-index: 990; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            }
            
            .mobile-overlay.active { 
                display: block !important; position: fixed; top: 0; left: 0; 
                width: 100%; height: 100vh; background: rgba(15, 23, 42, 0.6); 
                backdrop-filter: blur(3px); z-index: 999; 
            }
            
            /* Basmi Navbar Bawaan Template.js agar tidak dobel */
            #navbar-container { display: none !important; height: 0 !important; overflow: hidden !important; }

            body, html { height: auto !important; overflow-y: auto !important; overflow-x: hidden !important; }
            
            .hamburger-btn { display: block; background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
            
            .main-content { margin-top: 60px !important; height: auto !important; display: block !important; padding: 0 !important; width: 100% !important; overflow-x: hidden !important;}

            #sidebar-container { 
                position: fixed; top: 0; left: -320px; height: 100vh; 
                transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 10px 0 25px rgba(0,0,0,0.5);
            }
            #sidebar-container.active { left: 0; }
            
            /* Sesuikan Header di HP */
            .fixed-header { padding: 20px !important; }
            .scrollable-content { padding: 20px !important; overflow-x: hidden !important; }

            .header-container { flex-direction: column !important; align-items: flex-start !important; gap: 15px; margin-bottom: 20px !important; }
            .header-title { font-size: 1.6rem !important; }
            
            /* Penyesuaian Flex Layout Header Actions */
            .fixed-header > div:nth-child(2) { flex-direction: column; align-items: flex-start !important; gap: 15px;}
            .action-buttons { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;}
            .btn-action { justify-content: center; width: 100%; }

            /* =========================================
               SULAP TABEL MENJADI KARTU (CARD) DI HP
            ========================================= */
            .table-container { 
                border: none !important; 
                box-shadow: none !important; 
                background: transparent !important; 
                padding: 0 !important; 
                overflow-x: hidden !important; /* PASTIKAN KONTAINER TIDAK SCROLL */
            }
            
            table, thead, tbody, th, td, tr { 
                display: block !important; 
                width: 100% !important; 
                min-width: 0 !important; /* MEMBUNUH HANTU 700PX DARI DESKTOP */
            }
            
            /* Sembunyikan Header Tabel Bawaan */
            thead { position: absolute; top: -9999px; left: -9999px; }
            
            /* Jadikan setiap baris sebagai Kotak Kartu */
            tr { 
                background: white !important; 
                border: 1px solid #cbd5e1 !important; 
                border-radius: 12px !important; 
                margin-bottom: 20px !important; 
                padding: 15px !important; 
                box-shadow: 0 4px 6px rgba(0,0,0,0.05) !important; 
            }
            
            /* Susun sel-sel tabel ke bawah */
            td { 
                display: flex !important; 
                flex-direction: column !important; 
                align-items: stretch !important; 
                text-align: left !important; 
                padding: 10px 0 !important; 
                border: none !important; 
                border-bottom: 1px dashed #e2e8f0 !important; 
            }
            td:last-child { border-bottom: none !important; padding-bottom: 0 !important; }
            
            /* Beri Label Penjelas di Atas Inputan */
            td::before { 
                font-weight: 800; 
                color: #1e3a8a; 
                text-transform: uppercase; 
                font-size: 0.75rem; 
                margin-bottom: 8px; 
            }
            
            td:nth-child(1)::before { content: "KODE CPL"; }
            td:nth-child(2)::before { content: "DESKRIPSI CPL"; }
            td:nth-child(3)::before { content: "AKSI"; }
            
            /* Styling Khusus Elemen di Dalam Kartu */
            td:nth-child(1) { font-size: 1.2rem !important; color: #0f172a !important; font-weight: 800; }
            td:nth-child(3) > div { flex-direction: column; width: 100%; }
            td:nth-child(3) .btn-action { width: 100% !important; justify-content: center !important; margin-top: 5px; }
            textarea { margin-top: 5px; width: 100% !important; max-width: 100% !important; }
        }
    </style>
</head>
<body>
    
    <!-- 1. NAVBAR KHUSUS MOBILE (DENGAN PATH GAMBAR ABSOLUTE) -->
    <nav class="navbar-mobile">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <img src="/gambar/LogoUnaki.png" alt="Logo Universitas AKI" 
                 style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;" 
                 onclick="window.location.href='/index.html'">
        </div>
        
        <div class="profile-btn-mobile" onclick="toggleSidebar()">
            <img id="mobileNavbarAvatar" src="https://ui-avatars.com/api/?name=K&background=1e3a8a&color=fff&bold=true" alt="Profil Kaprodi">
        </div>
    </nav>

    <!-- 2. OVERLAY GELAP UNTUK LATAR SIDEBAR DI HP -->
    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

    <div id="sidebar-container"></div>

    <div class="main-content">
        
        <!-- WADAH NAVBAR ASLI DARI TEMPLATE.JS -->
        <div id="navbar-container"></div>
        
        <div class="fixed-header">
            <div class="header-container">
                <div class="header-title-area">
                    <div class="header-subtitle">KELOLA KURIKULUM</div>
                    <h1 class="header-title">CAPAIAN <span>PEMBELAJARAN (CPL)</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h3 style="margin: 0; font-size: 1.4rem; font-weight: 800;">Daftar CPL</h3>
                    <p style="margin: 4px 0 0 0; color: #64748b; font-size: 0.95rem; font-weight: 500;">Rumusan Capaian Pembelajaran Lulusan</p>
                </div>
                
                <div class="action-buttons">
                    <button class="btn-action btn-download" onclick="exportKeExcel()">
                        <i class="fas fa-file-download"></i> Download Excel
                    </button>
                    
                    <input type="file" id="fileExcel" accept=".xlsx, .xls" style="display: none;" onchange="uploadExcel()">
                    <button class="btn-action btn-upload" onclick="document.getElementById('fileExcel').click()">
                        <i class="fas fa-file-upload"></i> Impor Excel
                    </button>
                </div>
            </div>
        </div>
        
        <div class="scrollable-content">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th width="15%">Kode CPL</th>
                            <th>Deskripsi CPL</th>
                            <th width="15%" style="text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="3" style="text-align: center; padding: 40px;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <div id="pagination-container"></div>
        </div>
    </div>


<script>
    // --- SETUP AVATAR MOBILE ---
    const namaLogin = localStorage.getItem("user_login") || "Kaprodi SI";
    const avatarMobile = document.getElementById("mobileNavbarAvatar");
    if(avatarMobile) {
        avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=1e3a8a&color=fff&bold=true`;
    }

    // --- FUNGSI SIDEBAR MOBILE ---
    function toggleSidebar() {
        document.getElementById('sidebar-container').classList.toggle('active');
        document.getElementById('mobileOverlay').classList.toggle('active');
    }

    // --- PENGAMAN JIKA TEMPLATE.JS SALAH MEMUAT SIDEBAR ---
    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
            const sidebar = document.getElementById('sidebar-container');
            // Jika template.js gagal memuat profil (berarti salah folder), kita paksa tembak URL absolut!
            if (sidebar && !sidebar.innerHTML.includes('sidebar-profile')) {
                fetch('/kaprodi/kaprodi_si/sidebar.html')
                    .then(res => res.text())
                    .then(html => {
                        sidebar.innerHTML = html;
                        if(typeof initSmartSidebar === 'function') initSmartSidebar();
                    })
                    .catch(e => console.log('Menggunakan sidebar default'));
            }
        }, 600); // Tunggu template.js bekerja dulu
    });

    // --- 1. VARIABEL API ---
    const PRODI = localStorage.getItem("prodi_aktif") || "si"; 
    
    document.getElementById('prodiBadge').innerText = "PRODI " + PRODI;

    const API_CPL = `${API_BASE}/get-master-cpl?prodi=${PRODI}`;
    const API_UPDATE = `${API_BASE}/admin-update-master`;
    const API_UPLOAD = `${API_BASE}/upload-master-cpl`;

    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace("/login/login.html");

    let allData = [];
    let state = { page: 1, itemsPerPage: 10 };

    // --- 2. FUNGSI AMBIL DATA TABEL ---
    async function loadData() { 
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding:40px;'><i class='fas fa-spinner fa-spin'></i> Memuat data...</td></tr>";

        try {
            const res = await fetch(API_CPL); 
            allData = await res.json(); 
            
            if (!allData || allData.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding:40px; color:#64748b;'>Belum ada data CPL. Silakan impor via Excel.</td></tr>";
                document.getElementById('pagination-container').innerHTML = '';
                return;
            }

            state.page = 1;
            renderTablePaginated();
        } catch(e) { 
            tbody.innerHTML = "<tr><td colspan='3' style='color:red; text-align:center; padding:40px;'>Gagal menarik data. Pastikan n8n menyala.</td></tr>";
        }
    }

    // --- 3. RENDER TABEL & PAGINATION ---
    function renderTablePaginated() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        
        const start = (state.page - 1) * state.itemsPerPage;
        const end = start + state.itemsPerPage;
        const paginatedItems = allData.slice(start, end);
        
        paginatedItems.forEach(cpl => {
            const deskripsi = cpl.deskripsi || cpl.deskripsi_cpl || ""; 
            
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 800; color: var(--primary-blue);">${cpl.kode_cpl}</td>
                <td>
                    <textarea id="in-${cpl.kode_cpl}" rows="3" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; font-size: 0.95rem; resize: vertical;">${deskripsi}</textarea>
                </td>
                <td style="text-align:center;">
                    <div style="display: flex; gap: 8px; justify-content: center;">
                        <button class="btn-action btn-dark" style="padding: 8px 12px;" onclick="simpanEdit('cpl', '${cpl.kode_cpl}')" title="Simpan Perubahan">
                            <i class="fas fa-save"></i> Simpan
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });

        renderPaginationControls();
    }

    function renderPaginationControls() {
        const container = document.getElementById('pagination-container');
        container.innerHTML = "";
        
        const totalPages = Math.ceil(allData.length / state.itemsPerPage);
        if (totalPages <= 1) return;

        const btnPrev = document.createElement('button');
        btnPrev.innerHTML = '<i class="fas fa-chevron-left"></i> Prev';
        btnPrev.disabled = state.page === 1;
        btnPrev.onclick = () => { if (state.page > 1) { state.page--; renderTablePaginated(); } };
        container.appendChild(btnPrev);

        const info = document.createElement('span');
        info.innerHTML = `Halaman <strong>${state.page}</strong> dari <strong>${totalPages}</strong>`;
        info.style.fontSize = "0.95rem";
        info.style.color = "#4b5563";
        container.appendChild(info);

        const btnNext = document.createElement('button');
        btnNext.innerHTML = 'Next <i class="fas fa-chevron-right"></i>';
        btnNext.disabled = state.page === totalPages;
        btnNext.onclick = () => { if (state.page < totalPages) { state.page++; renderTablePaginated(); } };
        container.appendChild(btnNext);
    }

    // --- 4. FUNGSI SIMPAN & EXCEL ---
    async function simpanEdit(tipe, kode) { 
        const value = document.getElementById(`in-${kode}`).value; 
        const btn = event.currentTarget;
        const oldHtml = btn.innerHTML;
        
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;

        try {
            const res = await fetch(API_UPDATE, { 
                method: "POST", 
                headers: {"Content-Type":"application/json"}, 
                body: JSON.stringify({ tipe: tipe, kode: kode, value: value, prodi: PRODI }) 
            }); 
            if(res.ok) alert("✅ Deskripsi CPL berhasil diperbarui!");
            else alert("❌ Gagal menyimpan data ke server.");
        } catch (e) { alert("Terjadi kesalahan jaringan."); } 
        finally { btn.innerHTML = oldHtml; btn.disabled = false; }
    }

    async function exportKeExcel() {
        const btn = document.querySelector('.btn-download');
        const oriText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyiapkan...';
        btn.disabled = true;

        try {
            if (!allData || allData.length === 0) return alert("Tidak ada data untuk diekspor.");

            const dataUntukExcel = allData.map(cpl => ({ 
                'kode_cpl': cpl.kode_cpl, 
                'deskripsi': cpl.deskripsi || cpl.deskripsi_cpl || "", 
                'prodi': PRODI 
            }));
            
            const worksheet = XLSX.utils.json_to_sheet(dataUntukExcel);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Master_CPL");
            XLSX.writeFile(workbook, `Master_CPL_${PRODI}.xlsx`);
        } catch (e) { alert("Gagal mengekspor data."); } 
        finally { btn.innerHTML = oriText; btn.disabled = false; }
    }

    async function uploadExcel() {
        const fileInput = document.getElementById('fileExcel');
        const file = fileInput.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('data', file); 
        formData.append('prodi', PRODI);

        const btnUpload = document.querySelector('.btn-upload');
        const oriText = btnUpload.innerHTML;
        btnUpload.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengimpor...';
        btnUpload.disabled = true;

        try {
            const res = await fetch(API_UPLOAD, { method: 'POST', body: formData });
            if (res.ok) { alert("✅ Data Excel CPL berhasil diimpor!"); await loadData(); } 
            else { alert("❌ Gagal memproses file Excel."); }
        } catch (e) { alert("❌ Terjadi kesalahan koneksi."); } 
        finally { btnUpload.innerHTML = oriText; btnUpload.disabled = false; fileInput.value = ''; }
    }

    window.onload = () => {
        setTimeout(loadData, 400); 
    };
</script>
</body>
</html>
