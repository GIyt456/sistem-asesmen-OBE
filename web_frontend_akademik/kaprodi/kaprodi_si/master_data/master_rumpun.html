<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Rumpun MK SI - Sistem OBE</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <script src="../../../js/template.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <script src="../../../js/api_config.js"></script>
    
    <style>
        /* --- CSS STYLING UTAMA --- */
        :root { 
            /* Background sidebar dihapus agar mengikuti theme-si dari style.css global */
            --primary-teal: #01626d; 
            --primary-teal-dark: #006064; 
            --bg-main: #ffffff; 
            --text-dark: #111827;
            --border-dark: #161923;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        /* --- ✨ EFEK SMOOTH TRANSITION ✨ --- */
        body { 
            display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark);
            animation: transitionIn 0.3s ease-in-out; 
        }
        
        @keyframes transitionIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* GAYA MAIN CONTENT & TABEL */
        .main-content { flex: 1; overflow-y: auto; padding: 40px 60px; background-color: var(--bg-main); }
        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; border-bottom: 1px solid #e5e7eb; padding-bottom: 20px; }
        .header-title-area { display: flex; flex-direction: column; }
        .header-subtitle { color: #9ca3af; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px; }
        .header-title span { color: var(--primary-teal); }
        
        /* --- UPDATE GAYA BADGE KHUSUS SI --- */
        .badge-prodi { 
            background: var(--primary-teal-dark); 
            color: white; 
            padding: 10px 20px; 
            border-radius: 30px; 
            font-size: 0.9rem; 
            font-weight: 600; 
            box-shadow: 0 4px 6px rgba(0, 96, 100, 0.2);
        }
        
        .btn-dark { background: var(--border-dark); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .btn-dark:hover { background: #000000; transform: translateY(-2px); }
        
        .table-card { background: white; border-radius: 12px; overflow: hidden; border: 1.5px solid #e5e7eb; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; color: var(--text-dark); padding: 16px 20px; text-align: left; border-bottom: 2px solid #e5e7eb; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; }
        td { padding: 16px 20px; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; }
        tbody tr:hover { background-color: #f9fafb; }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="header-container">
            <div class="header-title-area">
                <div class="header-subtitle">MASTER DATA</div>
                <h1 class="header-title">RUMPUN <span>MATA KULIAH</span></h1>
            </div>
            <div class="badge-prodi"><i class="fas fa-layer-group"></i> Sistem Informasi</div>
        </div>

        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div>
                    <h3 style="margin: 0; font-size: 1.4rem; font-weight: 800;">Daftar Rumpun MK (Bahan Kajian)</h3>
                    <p style="margin: 4px 0 0 0; color: #9ca3af; font-size: 0.95rem; font-weight: 500;">Kelola data rumpun mata kuliah prodi Sistem Informasi.</p>
                </div>
                <button class="btn-dark" onclick="fetchDataRumpunBK()"><i class="fas fa-sync-alt"></i> Refresh Data</button>
            </div>
            
            <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th width="15%">Kode BK</th>
                        <th width="30%">Nama Bahan Kajian</th>
                        <th width="45%">Deskripsi (Rumpun Mata Kuliah)</th>
                        <th width="10%">Prodi</th>
                    </tr>
                </thead>
                <tbody id="tableBodyRumpun">
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 40px; color: #64748b;">
                            <i class="fas fa-spinner fa-spin"></i> Menghubungkan ke database Bahan Kajian...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
            
            <div id="pagination-rumpun" style="display: flex; justify-content: center; align-items: center; margin-top: 24px; gap: 15px;"></div>
        </div>
    </div>

<script>
    // 1. SISTEM KEAMANAN & PENGATURAN AWAL
    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace('/login/login.html');

    // 2. PENGATURAN API N8N 
    async function fetchDataRumpunBK() {
        const tableBody = document.getElementById('tableBodyRumpun');
        tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px; color: #64748b;"><i class="fas fa-spinner fa-spin"></i> Menarik data...</td></tr>';
        
        try {
            const API_URL = `${API_BASE}/get-master-bk?prodi=si`;
            
            const response = await fetch(API_URL);
            const textData = await response.text();

            if (!textData || textData.includes('<!DOCTYPE html>')) {
                 tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px; color:#ef4444;">Gagal terhubung ke Database. Periksa URL n8n.</td></tr>';
                 return;
            }

            const data = JSON.parse(textData);

            if (!data || data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px;">Data Bahan Kajian belum tersedia untuk prodi SI.</td></tr>';
                return;
            }

            tableBody.innerHTML = ''; 
            
            data.forEach(item => {
                tableBody.innerHTML += `
                    <tr>
                        <td style="font-weight: 800; color: var(--primary-teal);">${item.kode_bk}</td>
                        <td style="font-weight: 600;">${item.nama_bk}</td>
                        <td style="font-size: 13.5px; color: #4b5563; line-height: 1.6;">${item.deskripsi || 'Tidak ada deskripsi rumpun.'}</td>
                        <td>
                            <span style="background: #e0f2f1; color: #006064; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase;">
                                ${item.prodi}
                            </span>
                        </td>
                    </tr>
                `;
            });

        } catch (error) {
            console.error("Gagal memuat data BK:", error);
            tableBody.innerHTML = `
                <tr>
                    <td colspan="4" style="text-align:center; padding:20px; color: #ef4444;">
                        <i class="fas fa-exclamation-triangle"></i> Gagal terhubung ke database. Pastikan URL n8n & Tunnel aktif.
                    </td>
                </tr>
            `;
        }
    }

    // 3. JALANKAN FUNGSI SAAT HALAMAN DIBUKA
    window.onload = function() {
        fetchDataRumpunBK();

        // Jeda agar template.js selesai menyusun sidebar sebelum kita ubah menu aktifnya
        setTimeout(() => {
            const navDashboard = document.getElementById('nav-home');
            const navRumpun = document.querySelector('[data-path="/master_data/master_rumpun.html"]');
            const menuMaster = document.getElementById('menu-master');
            const chevronMaster = document.getElementById('chevron-master');

            if(navDashboard) navDashboard.classList.remove('active');
            if(navRumpun) navRumpun.classList.add('active'); 
            
            if(menuMaster && chevronMaster) {
                menuMaster.style.display = 'flex';
                chevronMaster.style.transform = 'rotate(180deg)';
            }
        }, 300);
    };
</script>
</body>
</html>
