<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Jenis CPL SI - Sistem OBE</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <script src="../../../js/template.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --sidebar-bg: #161923; 
            --sidebar-text: #7b8395;
            --sidebar-hover: #262936;
            --sidebar-active-text: #ffffff;
            --primary-teal: #0097a7; 
            --bg-main: #ffffff; 
            --text-dark: #111827;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark); }
        .main-content { flex: 1; overflow-y: auto; padding: 40px 60px; }

        /* HEADER */
        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; border-bottom: 1px solid #e5e7eb; padding-bottom: 20px; }
        .header-subtitle { color: #9ca3af; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px;}
        .header-title span { color: var(--primary-teal); }
        .badge-prodi { background: var(--primary-teal); color: white; padding: 8px 20px; border-radius: 30px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; }

        /* BUTTONS */
        .btn-add { background: #8b0000; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        .btn-add:hover { background: #660000; }
        .btn-refresh { background: #1f2937; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; margin-left: 8px;}
        .btn-refresh:hover { background: #111827; }
        
        .btn-edit { background: #f59e0b; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
        .btn-edit:hover { background: #d97706; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: 0.2s; margin-left: 5px; }
        .btn-delete:hover { background: #b91c1c; }

        /* TABLE */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; background: white; }
        th { background: #f3f4f6; color: #374151; padding: 14px 20px; text-align: left; border-bottom: 2px solid #e5e7eb; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 14px 20px; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; color: #111827; font-weight: 500; }
        tbody tr:hover { background-color: #f9fafb; }

        /* MODAL */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        .modal-box { background: white; border-radius: 12px; width: 500px; padding: 25px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .modal-title { margin: 0 0 20px 0; font-size: 1.2rem; font-weight: 800; color: var(--text-dark); border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 8px; }
        .form-control { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--primary-teal); }
        .btn-save-modal { background: var(--primary-teal); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px;}
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        
        <div class="header-container">
            <div class="header-title-area">
                <div class="header-subtitle">KELOLA KURIKULUM</div>
                <h1 class="header-title">JENIS <span>CPL</span></h1>
            </div>
            <div class="badge-prodi">SISTEM INFORMASI</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h3 style="margin: 0; font-size: 1.2rem; font-weight: 800;">Jenis CPL SN DIKTI</h3>
                <p style="margin: 4px 0 0 0; color: #6b7280; font-size: 0.9rem;">Kelola kategori Capaian Pembelajaran Lulusan.</p>
            </div>
            <div>
                <button class="btn-add" onclick="bukaModal()"><i class="fas fa-plus"></i> Tambah</button>
                <button class="btn-refresh" onclick="loadJenisCPL()"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 5%; text-align: center;">#</th>
                    <th style="width: 70%;">JENIS</th>
                    <th style="width: 25%; text-align: center;">OPSI</th>
                </tr>
            </thead>
            <tbody id="tabelJenisCPL">
                <tr>
                    <td colspan="3" style="text-align: center; padding: 30px; color: #6b7280;">
                        <i class="fas fa-spinner fa-spin"></i> Memuat data...
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

    <!-- MODAL FORM -->
    <div id="modalJenisCPL" class="modal-overlay">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">Tambah Jenis CPL</h3>
            <input type="hidden" id="idJenis">
            <div class="form-group">
                <label class="form-label">Nama Jenis CPL</label>
                <input type="text" id="inputNamaJenis" class="form-control" placeholder="Contoh: SIKAP (S)">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-save-modal" style="background: #6b7280;" onclick="tutupModal()">Batal</button>
                <button class="btn-save-modal" id="btnSimpan" onclick="simpanJenisCPL()"><i class="fas fa-save"></i> Simpan</button>
            </div>
        </div>
    </div>

<script>
    const userLogin = localStorage.getItem("user_login");
    const BASE_N8N_URL = 'https://gilbert-mean-pursuant-chronicles.trycloudflare.com';

    async function loadSidebar() {
        try {
            const response = await fetch('/kaprodi/kaprodi_si/components/sidebar.html');
            document.getElementById('sidebar-container').outerHTML = await response.text();
            document.getElementById("adminName").innerText = userLogin || "Kaprodi SI";
            
            setTimeout(() => {
                const menuMaster = document.getElementById('menu-master');
                const chevronMaster = document.getElementById('chevron-master');
                if(menuMaster) menuMaster.style.display = 'flex';
                if(chevronMaster) chevronMaster.style.transform = 'rotate(180deg)';
            }, 100);
        } catch (error) { console.error('Sidebar error:', error); }
    }

    function toggleDropdown(menuId, chevronId) {
        const menu = document.getElementById(menuId);
        const chevron = document.getElementById(chevronId);
        if (menu.style.display === 'none' || menu.style.display === '') {
            menu.style.display = 'flex'; chevron.style.transform = 'rotate(180deg)'; 
        } else {
            menu.style.display = 'none'; chevron.style.transform = 'rotate(0deg)';   
        }
    }
    function logout() { localStorage.clear(); window.location.replace("/login/login.html"); }

    // ==========================================
    // FUNGSI CRUD JENIS CPL
    // ==========================================
    async function loadJenisCPL() {
        const tbody = document.getElementById('tabelJenisCPL');
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:30px;"><i class="fas fa-spinner fa-spin"></i> Memuat data...</td></tr>';

        try {
            const response = await fetch(`${BASE_N8N_URL}/webhook/get-jenis-cpl?prodi=si`);
            const textData = await response.text();

            if (!textData || textData.includes('<!DOCTYPE html>')) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:red;">Gagal terhubung ke Database.</td></tr>';
                return;
            }

            const data = JSON.parse(textData);

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Belum ada data Jenis CPL.</td></tr>';
                return;
            }

            tbody.innerHTML = ''; 
            data.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td style="text-align: center;">${index + 1}</td>
                        <td>${item.nama_jenis}</td>
                        <td style="text-align: center;">
                            <button class="btn-edit" onclick="bukaModalEdit('${item.id}', '${item.nama_jenis}')"><i class="fas fa-edit"></i> Ubah</button>
                            <button class="btn-delete" onclick="hapusJenisCPL('${item.id}')"><i class="fas fa-trash"></i> Hapus</button>
                        </td>
                    </tr>
                `;
            });
        } catch (error) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:red;">Error: ${error.message}</td></tr>`;
        }
    }

    function bukaModal() {
        document.getElementById('modalTitle').innerText = "Tambah Jenis CPL";
        document.getElementById('idJenis').value = '';
        document.getElementById('inputNamaJenis').value = '';
        document.getElementById('modalJenisCPL').style.display = 'flex';
    }

    function bukaModalEdit(id, nama) {
        document.getElementById('modalTitle').innerText = "Ubah Jenis CPL";
        document.getElementById('idJenis').value = id;
        document.getElementById('inputNamaJenis').value = nama;
        document.getElementById('modalJenisCPL').style.display = 'flex';
    }

    function tutupModal() {
        document.getElementById('modalJenisCPL').style.display = 'none';
    }

    async function simpanJenisCPL() {
        const id = document.getElementById('idJenis').value;
        const nama = document.getElementById('inputNamaJenis').value.trim();
        const btn = document.getElementById('btnSimpan');

        if (!nama) return alert("⚠️ Nama jenis CPL wajib diisi!");

        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
        btn.disabled = true;

        const payload = { id: id, nama_jenis: nama, prodi: 'si' };

        try {
            const response = await fetch(`${BASE_N8N_URL}/webhook/simpan-jenis-cpl`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                tutupModal();
                loadJenisCPL();
            } else {
                alert("❌ Gagal menyimpan data.");
            }
        } catch (error) {
            alert("❌ Terjadi kesalahan koneksi.");
        } finally {
            btn.innerHTML = '<i class="fas fa-save"></i> Simpan';
            btn.disabled = false;
        }
    }

    async function hapusJenisCPL(id) {
        if(!confirm("Yakin ingin menghapus jenis CPL ini?")) return;
        
        try {
            const response = await fetch(`${BASE_N8N_URL}/webhook/hapus-jenis-cpl`, {
                method: 'POST', // Gunakan POST untuk kemudahan di n8n
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id })
            });

            if (response.ok) {
                loadJenisCPL();
            } else {
                alert("❌ Gagal menghapus data.");
            }
        } catch (error) {
            alert("❌ Terjadi kesalahan koneksi.");
        }
    }

    window.onload = () => {
        loadSidebar();
        loadJenisCPL();
    };
</script>
</body>
</html>
