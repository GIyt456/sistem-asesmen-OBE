<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelola CPL - Sistem OBE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- MEMANGGIL FILE CSS EKSTERNAL & CSS YANG BARU KITA PISAHKAN -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin_si.css">
    <link rel="stylesheet" href="/css/index_mobile.css">
    <link rel="stylesheet" href="cpl.css"> <!-- INI FILE CSS YANG BARU KITA BUAT -->
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="/js/api_config.js"></script>
    <script src="/js/template.js"></script>
</head>
<body>
    
    <!-- 1. NAVBAR KHUSUS MOBILE -->
    <nav class="navbar-mobile">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <img src="/gambar/LogoUnaki.png" alt="Logo Universitas AKI" 
                 style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;" 
                 onclick="window.location.href='/index.html'">
        </div>
        
        <div class="profile-btn-mobile" onclick="toggleSidebar()">
            <img id="mobileNavbarAvatar" src="https://ui-avatars.com/api/?name=K&background=1e3a8a&color=fff&bold=true" alt="Profil Kaprodi">
        </div>
    </nav>

    <!-- 2. OVERLAY GELAP UNTUK LATAR SIDEBAR DI HP -->
    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

    <div id="sidebar-container"></div>

    <div class="main-content">
        
        <div id="navbar-container"></div>
        
        <div class="fixed-header">
            <div class="header-container header-master" style="margin: 0 0 15px 0; border-bottom: none; padding-bottom: 0;">
                <div class="header-title-area">
                    <div class="header-subtitle" style="margin-bottom: 5px;">KELOLA KURIKULUM</div>
                    <h1 class="header-title">CAPAIAN <span>PEMBELAJARAN (CPL)</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge" style="margin-top: 10px; display: inline-block; width: fit-content; background: var(--primary-blue); color: white; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 0.85rem;">PRODI</div>
            </div>
            <div style="border-bottom: 1px solid var(--border-color); margin: 0 0 20px 0;" class="header-master"></div>
        </div>
        
        <div class="scrollable-content section-master" style="padding-top: 0; padding-bottom: 40px;">
            
            <!-- FILTER KURIKULUM -->
            <div class="filter-container">
                <div>
                    <label for="filterKurikulum" style="font-weight: 800; color: #1e293b; font-size: 0.95rem; margin-right: 10px;">
                        <i class="fas fa-filter" style="color: var(--primary-blue); margin-right: 5px;"></i> Tampilkan Kurikulum:
                    </label>
                    <select id="filterKurikulum" onchange="loadData()" class="select-custom">
                        <option value="">Memuat data...</option>
                    </select>
                </div>
            </div>

            <!-- TOMBOL AKSI -->
            <div class="table-action-header">
                <div>
                    <h3 style="margin: 0; font-size: 1.3rem; font-weight: 800; color: #1e293b;">Daftar CPL</h3>
                    <p style="margin: 4px 0 0 0; color: #64748b; font-size: 0.95rem; font-weight: 500;">Kelola rumusan Capaian Pembelajaran Lulusan (Sikap, Keterampilan, Pengetahuan).</p>
                </div>
                
                <div>
                    <button class="btn-action-custom btn-download" onclick="exportKeExcel()">
                        <i class="fas fa-file-excel"></i> Unduh Format
                    </button>
                    
                    <input type="file" id="fileExcel" accept=".xlsx, .xls" style="display: none;" onchange="uploadExcel()">
                    <button class="btn-action-custom btn-upload" onclick="document.getElementById('fileExcel').click()">
                        <i class="fas fa-file-upload"></i> Impor Data Baru
                    </button>
                </div>
            </div>
            
            <!-- TABEL CPL -->
            <div class="table-container">
                <table class="tabel-cpl">
                    <thead>
                        <tr>
                            <th width="15%">Kode CPL</th>
                            <th>Deskripsi CPL</th>
                            <th width="15%" style="text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="3" style="text-align: center; padding: 50px; font-weight: 600; color: #64748b;"><i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary-blue); display: block; margin-bottom: 10px;"></i> Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <div id="pagination-container"></div>
        </div>
    </div>

<script>
    // --- 1. SETUP IDENTITAS (SIHIR BUNGLON) ---
    const PRODI = localStorage.getItem("prodi_aktif") || "si"; 
    
    document.addEventListener("DOMContentLoaded", () => {
        const badge = document.getElementById("prodiBadge");
        
        if(PRODI === "ti") {
            document.documentElement.style.setProperty('--primary-blue', '#8b0000'); 
            badge.innerText = "TEKNIK INFORMATIKA";
        } else {
            document.documentElement.style.setProperty('--primary-blue', '#1e3a8a'); 
            badge.innerText = "SISTEM INFORMASI";
        }

        const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
        const avatarMobile = document.getElementById("mobileNavbarAvatar");
        if(avatarMobile) {
            const avatarColor = PRODI === "si" ? "1e3a8a" : "8b0000";
            avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=${avatarColor}&color=fff&bold=true`;
        }
    });

    // --- 2. FUNGSI SIDEBAR MOBILE ---
    function toggleSidebar() {
        document.getElementById('sidebar-container').classList.toggle('active');
        document.getElementById('mobileOverlay').classList.toggle('active');
    }

    // ==========================================================
    // 🔮 SIHIR ANTI-MACET DROPDOWN (GLOBAL EVENT DELEGATION)
    // ==========================================================
    document.addEventListener('click', function(e) {
        const dropdownBtn = e.target.closest('.dropdown-btn') || e.target.closest('[data-toggle="dropdown"]');
        if (dropdownBtn) {
            e.preventDefault(); 
            const dropdownContent = dropdownBtn.nextElementSibling;
            const icon = dropdownBtn.querySelector('.fa-chevron-down') || dropdownBtn.querySelector('i:last-child');
            
            if (dropdownContent && (dropdownContent.classList.contains('dropdown-container') || dropdownContent.tagName === 'DIV' || dropdownContent.tagName === 'UL')) {
                const isHidden = window.getComputedStyle(dropdownContent).display === 'none';
                
                if (isHidden) {
                    dropdownContent.style.display = 'block';
                    dropdownBtn.classList.add('active');
                    if (icon) icon.style.transform = 'rotate(180deg)';
                } else {
                    dropdownContent.style.display = 'none';
                    dropdownBtn.classList.remove('active');
                    if (icon) icon.style.transform = 'rotate(0deg)';
                }
            }
        }
    });

    function setMenuAktif() {
        const navDashboard = document.getElementById('nav-home');
        let navCpl = document.querySelector('[data-path="/master_data/cpl_si.html"]') || document.querySelector('[data-path="/master_data/cpl.html"]');
        
        if (navDashboard) navDashboard.classList.remove('active');
        if (navCpl) navCpl.classList.add('active');

        const menuMaster = document.getElementById('menu-master') || (navCpl ? navCpl.closest('.dropdown-container') : null);
        
        if (menuMaster) {
            menuMaster.style.display = 'block';
            const parentBtn = menuMaster.previousElementSibling;
            if(parentBtn && parentBtn.classList.contains('dropdown-btn')) {
                parentBtn.classList.add('active');
                const icon = parentBtn.querySelector('.fa-chevron-down') || parentBtn.querySelector('i:last-child');
                if(icon) icon.style.transform = 'rotate(180deg)';
            }
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
            const sidebar = document.getElementById('sidebar-container');
            if (sidebar && !sidebar.innerHTML.includes('sidebar-profile')) {
                fetch(`/kaprodi/kaprodi_${PRODI}/sidebar.html`)
                    .then(res => res.text())
                    .then(html => {
                        sidebar.innerHTML = html;
                        if(typeof initSmartSidebar === 'function') initSmartSidebar();
                        setMenuAktif();
                    })
                    .catch(e => console.log('Gagal memuat sidebar otomatis'));
            } else {
                setMenuAktif();
            }
        }, 400); 
    });

    // --- 3. VARIABEL API & STATE ---
    const API_UPDATE = `${API_BASE}/admin-update-master`;
    const API_UPLOAD = `${API_BASE}/upload-master-cpl`;

    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace("/login/login.html");

    let allData = [];
    let state = { page: 1, itemsPerPage: 10 };

    // --- 4. FUNGSI FILTER KURIKULUM ---
    async function loadDropdownKurikulum() {
        try {
            const response = await fetch(`${API_BASE}/get-kurikulum-tersedia`);
            const data = await response.json();
            
            const selectKurikulum = document.getElementById('filterKurikulum');
            selectKurikulum.innerHTML = ''; 
            
            let kurikulumSet = new Set();
            if(data && data.length > 0) {
                data.forEach(item => {
                    if (item && item.kurikulum) kurikulumSet.add(String(item.kurikulum));
                });
            }
            
            kurikulumSet.add("25");
            kurikulumSet.add("20");

            let sortedKurikulum = Array.from(kurikulumSet).sort((a, b) => b - a);

            sortedKurikulum.forEach(kur => {
                let opt = document.createElement('option');
                opt.value = kur; 
                opt.text = "Kurikulum 20" + kur; 
                selectKurikulum.appendChild(opt);
            });

            await loadData(); 

        } catch (error) {
            console.error("Gagal memuat list kurikulum:", error);
            document.getElementById('filterKurikulum').innerHTML = '<option value="">Gagal memuat kurikulum</option>';
        }
    }

    // --- 5. FUNGSI AMBIL DATA TABEL ---
    async function loadData() { 
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding:50px; font-weight: 600; color: #64748b;'><i class='fas fa-spinner fa-spin fa-2x' style='color: var(--primary-blue); display: block; margin-bottom: 10px;'></i> Memuat data...</td></tr>";

        const selectKurikulum = document.getElementById('filterKurikulum');
        let kurikulumTerpilih = selectKurikulum ? selectKurikulum.value : "";
        
        let API_URL_DINAMIS = `${API_BASE}/get-master-cpl?prodi=${PRODI}`;
        if (kurikulumTerpilih !== "") {
            API_URL_DINAMIS += `&kurikulum=${kurikulumTerpilih}`;
        }

        try {
            const res = await fetch(API_URL_DINAMIS); 
            allData = await res.json(); 
            
            if (!allData || allData.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding:50px; color:#ef4444; font-weight: 700;'><i class='fas fa-exclamation-triangle fa-2x' style='display: block; margin-bottom: 10px;'></i> Belum ada data CPL untuk kurikulum ini.</td></tr>";
                document.getElementById('pagination-container').innerHTML = '';
                return;
            }

            state.page = 1;
            renderTablePaginated();
        } catch(e) { 
            tbody.innerHTML = "<tr><td colspan='3' style='color:#ef4444; text-align:center; padding:50px; font-weight: 700;'><i class='fas fa-wifi fa-2x' style='display: block; margin-bottom: 10px;'></i> Gagal menarik data. Pastikan N8N menyala.</td></tr>";
        }
    }

    // --- 6. RENDER TABEL & PAGINATION ---
    function renderTablePaginated() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        
        const start = (state.page - 1) * state.itemsPerPage;
        const end = start + state.itemsPerPage;
        const paginatedItems = allData.slice(start, end);
        
        paginatedItems.forEach(cpl => {
            const deskripsi = cpl.deskripsi || cpl.deskripsi_cpl || ""; 
            
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 900; font-size: 1.1rem; color: var(--primary-blue);">${cpl.kode_cpl}</td>
                <td>
                    <textarea id="in-${cpl.kode_cpl}" rows="3" style="width:100%; padding:15px; border:2px solid #cbd5e1; border-radius:8px; font-size: 0.95rem; resize: vertical; outline: none; transition: 0.2s; color: #1e293b; font-weight: 500; background: #f8fafc;" onfocus="this.style.borderColor='var(--primary-blue)'; this.style.background='white';" onblur="this.style.borderColor='#cbd5e1'; this.style.background='#f8fafc';">${deskripsi}</textarea>
                </td>
                <td style="text-align:center;">
                    <div style="display: flex; gap: 8px; justify-content: center;">
                        <button class="btn-action-custom btn-dark" style="padding: 10px 20px; height: auto;" onclick="simpanEdit('cpl', '${cpl.kode_cpl}', event)" title="Simpan Perubahan">
                            <i class="fas fa-save"></i> Simpan
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });

        renderPaginationControls();
    }

    function renderPaginationControls() {
        const container = document.getElementById('pagination-container');
        container.innerHTML = "";
        
        const totalPages = Math.ceil(allData.length / state.itemsPerPage);
        if (totalPages <= 1) return;

        const btnPrev = document.createElement('button');
        btnPrev.innerHTML = '<i class="fas fa-chevron-left"></i> Sebelumnya';
        btnPrev.disabled = state.page === 1;
        btnPrev.onclick = () => { if (state.page > 1) { state.page--; renderTablePaginated(); } };
        container.appendChild(btnPrev);

        const info = document.createElement('span');
        info.innerHTML = `Halaman <strong style="color: var(--primary-blue);">${state.page}</strong> dari <strong>${totalPages}</strong>`;
        info.style.fontSize = "0.95rem";
        info.style.color = "#475569";
        info.style.fontWeight = "600";
        container.appendChild(info);

        const btnNext = document.createElement('button');
        btnNext.innerHTML = 'Selanjutnya <i class="fas fa-chevron-right"></i>';
        btnNext.disabled = state.page === totalPages;
        btnNext.onclick = () => { if (state.page < totalPages) { state.page++; renderTablePaginated(); } };
        container.appendChild(btnNext);
    }

    // --- 7. FUNGSI SIMPAN & EXCEL ---
    async function simpanEdit(tipe, kode, event) { 
        const value = document.getElementById(`in-${kode}`).value; 
        const btn = event.currentTarget;
        const oldHtml = btn.innerHTML;
        
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;

        try {
            const res = await fetch(API_UPDATE, { 
                method: "POST", 
                headers: {"Content-Type":"application/json"}, 
                body: JSON.stringify({ tipe: tipe, kode: kode, value: value, prodi: PRODI }) 
            }); 
            if(res.ok) alert("✅ Deskripsi CPL berhasil diperbarui!");
            else alert("❌ Gagal menyimpan data ke server.");
        } catch (e) { alert("Terjadi kesalahan jaringan."); } 
        finally { btn.innerHTML = oldHtml; btn.disabled = false; }
    }

    async function exportKeExcel() {
        const btn = document.querySelector('.btn-download');
        const oriText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyiapkan...';
        btn.disabled = true;

        let kurikulumTerpilih = document.getElementById('filterKurikulum').value;

        try {
            if (!allData || allData.length === 0) return alert("Tidak ada data untuk diekspor.");

            const dataUntukExcel = allData.map(cpl => ({ 
                'kode_cpl': cpl.kode_cpl, 
                'deskripsi': cpl.deskripsi || cpl.deskripsi_cpl || "", 
                'prodi': PRODI 
            }));
            
            const worksheet = XLSX.utils.json_to_sheet(dataUntukExcel);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Master_CPL");
            
            XLSX.writeFile(workbook, `Master_CPL_${PRODI}_Kurikulum_${kurikulumTerpilih}.xlsx`);
        } catch (e) { alert("Gagal mengekspor data."); } 
        finally { btn.innerHTML = oriText; btn.disabled = false; }
    }

    async function uploadExcel() {
        const fileInput = document.getElementById('fileExcel');
        const file = fileInput.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('data', file); 
        formData.append('prodi', PRODI);

        const btnUpload = document.querySelector('.btn-upload');
        const oriText = btnUpload.innerHTML;
        btnUpload.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengimpor...';
        btnUpload.disabled = true;

        try {
            const res = await fetch(API_UPLOAD, { method: 'POST', body: formData });
            if (res.ok) { 
                alert("✅ Data Excel CPL berhasil diimpor!"); 
                await loadDropdownKurikulum(); 
            } 
            else { alert("❌ Gagal memproses file Excel."); }
        } catch (e) { alert("❌ Terjadi kesalahan koneksi."); } 
        finally { btnUpload.innerHTML = oriText; btnUpload.disabled = false; fileInput.value = ''; }
    }

    window.onload = async () => {
        await loadDropdownKurikulum(); 
    };
</script>
</body>
</html>
