<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Tahun Kurikulum SI - Sistem OBE</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <script src="../../../js/template.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABEL WARNA KHUSUS SI --- */
        :root { 
            --sidebar-bg: #161923; 
            --sidebar-text: #7b8395;
            --sidebar-hover: #262936;
            --sidebar-active-text: #ffffff;
            --primary-teal: #0097a7; /* Warna utama SI */
            --bg-main: #ffffff; 
            --text-dark: #111827;
            --border-light: #e5e7eb;
            --border-dark: #161923;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark);
            animation: transitionIn 0.3s ease-in-out; 
        }
        
        @keyframes transitionIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- GAYA KONTEN UTAMA --- */
        .main-content { flex: 1; overflow-y: auto; padding: 40px 60px; }

        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; border-bottom: 1px solid #e5e7eb; padding-bottom: 20px; }
        .header-subtitle { color: #9ca3af; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px;}
        .header-title span { color: var(--primary-teal); }
        .badge-prodi { background: var(--primary-teal); color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 4px 6px rgba(0, 151, 167, 0.2); }

        /* --- TOMBOL --- */
        .btn-dark { background: var(--border-dark); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-dark:hover { background: #000000; transform: translateY(-2px); }
        .btn-primary-si { background: var(--primary-teal); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-primary-si:hover { background: #006064; transform: translateY(-2px); }

        /* --- GAYA TABEL --- */
        .table-card { background: white; border-radius: 12px; overflow: hidden; border: 1.5px solid #e5e7eb; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; color: var(--text-dark); padding: 16px 20px; text-align: left; border-bottom: 2px solid #e5e7eb; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; }
        td { padding: 16px 20px; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; vertical-align: middle; }
        tbody tr:hover { background-color: #f9fafb; }
        
        .form-control { width: 100%; padding: 10px 14px; border: 1.5px solid #d1d5db; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        .form-control:focus { border-color: var(--primary-teal); box-shadow: 0 0 0 3px rgba(0,151,167,0.1); }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        
        <div class="header-container">
            <div class="header-title-area">
                <div class="header-subtitle">MASTER DATA</div>
                <h1 class="header-title">TAHUN <span>KURIKULUM</span></h1>
            </div>
            <div class="badge-prodi"><i class="fas fa-calendar-alt"></i> Sistem Informasi</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h3 style="margin: 0; font-size: 1.4rem; font-weight: 800;">Pengaturan Tahun & Semester (SI)</h3>
                <p style="margin: 4px 0 0 0; color: #9ca3af; font-size: 0.95rem; font-weight: 500;">Kelola tahun kurikulum dan semester aktif yang digunakan oleh prodi.</p>
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="btn-dark" onclick="loadDataTahun()"><i class="fas fa-sync-alt"></i> Refresh Data</button>
            </div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th width="5%" style="text-align: center;">No</th>
                        <th width="25%">Kode Pengaturan</th>
                        <th width="45%">Nilai / Value Aktif</th>
                        <th width="25%" style="text-align: center;">Opsi</th>
                    </tr>
                </thead>
                <tbody id="bodyTahun">
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 40px; color: #64748b;">
                            <i class="fas fa-spinner fa-spin"></i> Menghubungkan ke database...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div id="pagination-tahun" style="display: flex; justify-content: center; align-items: center; margin-top: 24px; gap: 15px;">
            </div>

    </div>

<script>
    // 1. PENGATURAN API N8N UNTUK SI
    const PRODI = 'si'; 
    const BASE_N8N_URL = 'https://gilbert-mean-pursuant-chronicles.trycloudflare.com'; 
    // Ganti tunnel URL di atas jika berubah
    const API_GET = `${BASE_N8N_URL}/webhook/get-metadata?prodi=${PRODI}`; 
    const API_UPDATE = `${BASE_N8N_URL}/webhook/update-metadata`; 

    // 2. SISTEM KEAMANAN
    const userLogin = localStorage.getItem("user_login");

    // 3. FUNGSI PEMANGGIL SIDEBAR OTOMATIS
    async function loadSidebar() {
        try {
            const response = await fetch('/kaprodi/kaprodi_si/components/sidebar.html');
            const html = await response.text();
            
            document.getElementById('sidebar-container').outerHTML = html;
            document.getElementById("adminName").innerText = userLogin || "Kaprodi SI";

            setTimeout(() => {
                const navDashboard = document.getElementById('nav-home');
                const menuMaster = document.getElementById('menu-master');
                const chevronMaster = document.getElementById('chevron-master');

                if(navDashboard) navDashboard.classList.remove('active');
                
                if(menuMaster && chevronMaster) {
                    menuMaster.style.display = 'flex';
                    chevronMaster.style.transform = 'rotate(180deg)';
                }
            }, 100);

        } catch (error) { console.error('Gagal memuat sidebar:', error); }
    }

    // 4. LOGIKA DATA TAHUN KURIKULUM
    let dataTahun = [];
    const state = { page: 1, rowsPerPage: 10 };

    async function loadDataTahun() {
        const tbody = document.getElementById("bodyTahun");
        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; padding: 40px;'><i class='fas fa-spinner fa-spin'></i> Memuat data tahun...</td></tr>";

        try {
            const res = await fetch(API_GET);
            const fullData = await res.json();
            
            // Asumsi n8n Anda mengirimkan data tahun kurikulum dengan tipe 'tahun' atau 'kurikulum'
            dataTahun = fullData.filter(i => i.tipe === 'tahun' || i.tipe === 'kurikulum' || i.tipe === 'tahun_kurikulum');
            
            // Fallback jika database masih kosong (data dummy sementara untuk UI)
            if(dataTahun.length === 0) {
                dataTahun = [
                    { tipe: 'tahun', kode: 'tahun_aktif', label: '2024/2025' },
                    { tipe: 'tahun', kode: 'semester_aktif', label: 'Ganjil' },
                    { tipe: 'kurikulum', kode: 'kurikulum_aktif', label: 'Kurikulum OBE 2024' }
                ];
            }

            state.page = 1;
            renderTablePaginated(); 
            
        } catch (error) {
            console.error("Gagal menarik data:", error);
            tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; color:red; padding: 40px;'>❌ Gagal memuat data dari server n8n.</td></tr>";
        }
    }

    function renderTablePaginated() {
        const tbody = document.getElementById("bodyTahun");
        tbody.innerHTML = ""; 

        const startIndex = (state.page - 1) * state.rowsPerPage;
        const endIndex = startIndex + state.rowsPerPage;
        const dataToShow = dataTahun.slice(startIndex, endIndex);

        dataToShow.forEach((item, index) => {
            const noUrut = startIndex + index + 1;
            
            // Format kode agar lebih rapi dibaca (contoh: tahun_aktif -> Tahun Aktif)
            const kodeFormatted = item.kode.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());

            tbody.innerHTML += `
            <tr>
                <td style="text-align: center; font-weight: 600;">${noUrut}</td>
                <td>
                    <strong style="color: var(--text-dark);">${kodeFormatted}</strong><br>
                    <small style="color: #6b7280; font-family: monospace;">(${item.kode})</small>
                </td>
                <td>
                    <input type="text" id="in-${item.kode}" class="form-control" value="${item.label}">
                </td>
                <td style="text-align: center;">
                    <button class="btn-primary-si" onclick="simpanEdit('${item.tipe}', '${item.kode}')">
                        <i class="fas fa-save"></i> Simpan
                    </button>
                </td>
            </tr>`;
        });

        renderPaginationUI();
    }

    function renderPaginationUI() {
        const totalPages = Math.ceil(dataTahun.length / state.rowsPerPage) || 1;
        const container = document.getElementById('pagination-tahun');
        container.innerHTML = '';

        const info = document.createElement('span');
        info.innerHTML = `Halaman <strong style="color:var(--primary-teal);">${state.page}</strong> dari <strong>${totalPages}</strong>`;
        info.style.fontSize = "0.95rem";
        info.style.color = "#4b5563";
        container.appendChild(info);

        const btnNext = document.createElement('button');
        btnNext.className = 'btn-dark';
        btnNext.innerHTML = 'Next <i class="fas fa-chevron-right"></i>';
        btnNext.disabled = state.page === totalPages;
        if(state.page === totalPages) btnNext.style.opacity = '0.5';
        
        btnNext.onclick = () => { 
            if (state.page < totalPages) { 
                state.page++; 
                renderTablePaginated(); 
            } 
        };
        container.appendChild(btnNext);
    }

    // 5. FUNGSI SIMPAN PERUBAHAN
    async function simpanEdit(tipe, kode) { 
        const valueInput = document.getElementById(`in-${kode}`).value; 
        
        if(!valueInput.trim()) {
            return alert("⚠️ Nilai tidak boleh kosong!");
        }

        try {
            // Memanggil API n8n khusus update
            const res = await fetch(API_UPDATE, { 
                method: "POST", 
                headers: {"Content-Type":"application/json"}, 
                body: JSON.stringify({ tipe: tipe, kode: kode, value: valueInput, prodi: PRODI }) 
            }); 
            
            if(res.ok) {
                alert(`✅ Pengaturan [${kode}] berhasil diperbarui untuk prodi SI!`);
                loadDataTahun(); // Refresh agar sinkron
            } else {
                alert("❌ Gagal menyimpan data ke server.");
            }
        } catch (e) {
            console.error(e);
            alert("❌ Terjadi kesalahan jaringan. Cek apakah workflow 'update-metadata' di n8n sudah aktif.");
        }
    }

    // 6. JALANKAN SAAT WEB DIBUKA
    window.onload = () => { 
        loadSidebar(); 
        loadDataTahun(); 
    };
</script>
</body>
</html>
