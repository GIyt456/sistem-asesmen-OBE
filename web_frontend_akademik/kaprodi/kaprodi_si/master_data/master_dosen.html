<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Dosen SI - Sistem OBE</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <script src="../../../js/template.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABEL WARNA KHUSUS SI --- */
        :root { 
            --sidebar-bg: #161923; 
            --sidebar-text: #7b8395;
            --sidebar-hover: #262936;
            --sidebar-active-text: #ffffff;
            --primary-teal: #0097a7; /* Warna utama SI */
            --bg-main: #ffffff; 
            --text-dark: #111827;
            --border-light: #e5e7eb;
            --border-dark: #161923;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            display: flex; background: var(--bg-main); height: 100vh; overflow: hidden; color: var(--text-dark);
            animation: transitionIn 0.3s ease-in-out; 
        }
        
        @keyframes transitionIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- GAYA KONTEN UTAMA --- */
        .main-content { flex: 1; overflow-y: auto; padding: 40px 60px; }

        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; border-bottom: 1px solid #e5e7eb; padding-bottom: 20px; }
        .header-subtitle { color: #9ca3af; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px;}
        .header-title span { color: var(--primary-teal); }
        .badge-prodi { background: var(--primary-teal); color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 4px 6px rgba(0, 151, 167, 0.2); }

        /* --- TOMBOL --- */
        .btn-dark { background: var(--border-dark); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .btn-dark:hover { background: #000000; transform: translateY(-2px); }
        .btn-primary-si { background: var(--primary-teal); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .btn-primary-si:hover { background: #006064; transform: translateY(-2px); }

        /* --- GAYA TABEL --- */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; border: 1.5px solid #e5e7eb; border-radius: 8px; overflow: hidden; background: white; }
        th { background: #f3f4f6; color: var(--text-dark); padding: 14px 16px; text-align: left; border-bottom: 2px solid #e5e7eb; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; }
        td { padding: 14px 16px; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; }
        tbody tr:hover { background-color: #f9fafb; }
        
        .btn-action { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: white; transition: 0.2s; }
        .btn-edit { background: #f59e0b; }
        .btn-edit:hover { background: #d97706; }
        .btn-delete { background: #ef4444; }
        .btn-delete:hover { background: #dc2626; }

        .badge-status { padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; display: inline-block; }
        .status-aktif { background: #d1fae5; color: #065f46; }

        /* --- MODAL POP-UP STYLES --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center; animation: fadeIn 0.2s ease; }
        .modal-box { background: white; padding: 32px; border-radius: 16px; width: 450px; max-width: 90%; border: 2.5px solid var(--border-dark); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; color: var(--text-dark); }
        .form-control { width: 100%; padding: 12px 16px; border: 1.5px solid #d1d5db; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        .form-control:focus { border-color: var(--primary-teal); }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        
        <div class="header-container">
            <div class="header-title-area">
                <div class="header-subtitle">KELOLA SDM</div>
                <h1 class="header-title">DATA <span>DOSEN</span></h1>
            </div>
            <div class="badge-prodi"><i class="fas fa-chalkboard-teacher"></i> Sistem Informasi</div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h3 style="margin: 0; font-size: 1.4rem; font-weight: 800;">Daftar Dosen Pengajar (SI)</h3>
                <p style="margin: 4px 0 0 0; color: #9ca3af; font-size: 0.95rem; font-weight: 500;">Kelola data induk tenaga pengajar Sistem Informasi.</p>
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="btn-primary-si" onclick="bukaModalDosen()"><i class="fas fa-plus"></i> Tambah Dosen</button>
                <button class="btn-dark" onclick="loadData()"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <div style="display: flex; align-items: center; gap: 8px; color: #4b5563; font-size: 0.9rem;">
                Show 
                <select id="showEntries" style="padding: 6px 10px; border: 1.5px solid #d1d5db; border-radius: 6px; outline: none; cursor: pointer;">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="25">25</option>
                </select> entries
            </div>
            
            <div style="display: flex; align-items: center; gap: 10px;">
                <label style="font-size: 0.9rem; font-weight: 600; color: #4b5563;">Search:</label>
                <input type="text" id="searchBox" placeholder="Cari NIDN atau Nama..." style="padding: 8px 12px; border: 1.5px solid #d1d5db; border-radius: 6px; outline: none; font-size: 0.9rem;">
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th width="5%" style="text-align: center;">No</th>
                    <th width="15%">NIDN / NIP</th>
                    <th>Nama Lengkap & Gelar</th>
                    <th width="20%" style="text-align: center;">Status Mengajar</th>
                    <th width="20%" style="text-align: center;">Opsi</th>
                </tr>
            </thead>
            <tbody id="bodyDosen">
                </tbody>
        </table>

        <div id="pagination-dosen" style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 0.85rem; color: #6b7280;">
            <div>Loading entries...</div>
        </div>
    </div>

    <div id="modalDosen" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitleDosen" style="margin-top: 0; margin-bottom: 20px; color: var(--text-dark); font-size: 1.4rem; font-weight: 800;">Tambah Dosen Baru</h3>
            
            <div class="form-group">
                <label>NIDN / NIP</label>
                <input type="text" id="inputNIDNDosen" class="form-control" placeholder="Contoh: 0610029301">
            </div>
            
            <div class="form-group">
                <label>Nama Lengkap (Beserta Gelar)</label>
                <input type="text" id="inputNamaDosen" class="form-control" placeholder="Contoh: Dr. Budi Santoso, M.Kom.">
            </div>

            <div class="form-group">
                <label>Homebase Program Studi</label>
                <select id="inputHomebaseDosen" class="form-control" style="cursor: pointer;">
                    <option value="Sistem Informasi">Sistem Informasi</option>
                    <option value="Teknik Informatika">Teknik Informatika</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 30px;">
                <label>Email Universitas (Opsional)</label>
                <input type="email" id="inputEmailDosen" class="form-control" placeholder="Contoh: budi@unaki.ac.id">
            </div>
            
            <div style="display: flex; justify-content: flex-end; gap: 12px;">
                <button onclick="tutupModalDosen()" style="padding: 12px 18px; border: none; border-radius: 8px; background: #f3f4f6; cursor: pointer; font-weight: 600; color: #4b5563;">Batal</button>
                <button onclick="simpanDosen()" class="btn-primary-si" style="padding: 12px 18px; border-radius: 8px;"><i class="fas fa-save"></i> Simpan Data</button>
            </div>
        </div>
    </div>

<script>
    // 1. PENGATURAN API N8N (Diset untuk SI)
    const PRODI = 'si'; 
    const BASE_N8N_URL = 'https://safely-romantic-distributors-replacing.trycloudflare.com';
    const API_URL = `${BASE_N8N_URL}/webhook/get-metadata?prodi=${PRODI}`; 

    const userLogin = localStorage.getItem("user_login");

    async function loadSidebar() {
        try {
            const response = await fetch('/kaprodi/kaprodi_si/components/sidebar.html');
            const html = await response.text();
            
            document.getElementById('sidebar-container').outerHTML = html;
            document.getElementById("adminName").innerText = userLogin || "Kaprodi SI";

            setTimeout(() => {
                const navDashboard = document.getElementById('nav-home');
                const menuMaster = document.getElementById('menu-master');
                const chevronMaster = document.getElementById('chevron-master');

                if(navDashboard) navDashboard.classList.remove('active');
                
                if(menuMaster && chevronMaster) {
                    menuMaster.style.display = 'flex';
                    chevronMaster.style.transform = 'rotate(180deg)';
                }
            }, 100);
        } catch (error) { console.error('Gagal memuat sidebar:', error); }
    }

    function toggleDropdown(menuId, chevronId) {
        const menu = document.getElementById(menuId);
        const chevron = document.getElementById(chevronId);
        if (menu.style.display === 'none' || menu.style.display === '') {
            menu.style.display = 'flex'; chevron.style.transform = 'rotate(180deg)'; 
        } else {
            menu.style.display = 'none'; chevron.style.transform = 'rotate(0deg)';   
        }
    }

    let allDataDosen = []; 
    let currentPage = 1;
    let rowsPerPage = 10;
    let searchQuery = "";

    async function loadData() {
        const tbody = document.getElementById("bodyDosen");
        tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; padding: 20px;'><i class='fas fa-spinner fa-spin'></i> Sedang memuat data dari database...</td></tr>";

        try {
            const res = await fetch(API_URL);
            const fullData = await res.json();
            
            // Filter hanya data yang tipenya 'dosen'
            allDataDosen = fullData.filter(i => i.tipe === 'dosen');
            currentPage = 1;
            
            renderTablePaginated(); 
            
        } catch (error) {
            console.error("Gagal menarik data:", error);
            tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; color:red; padding: 20px;'>❌ Gagal memuat data dari server n8n.</td></tr>";
        }
    }

    function renderTablePaginated() {
        const tbody = document.getElementById("bodyDosen");
        tbody.innerHTML = ""; 

        const filteredData = allDataDosen.filter(item => {
            const nidnContent = item.kode ? item.kode.toLowerCase() : "";
            const nameContent = item.label ? item.label.toLowerCase() : "";
            return nidnContent.includes(searchQuery) || nameContent.includes(searchQuery);
        });

        if(filteredData.length === 0) {
            tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; padding: 20px;'>Data dosen tidak ditemukan.</td></tr>";
            document.getElementById('pagination-dosen').innerHTML = `<div>Showing 0 entries</div>`;
            return;
        }

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const dataToShow = filteredData.slice(startIndex, endIndex);

        dataToShow.forEach((item, index) => {
            const noUrut = startIndex + index + 1;
            const namaDosen = item.label ? item.label : 'Tidak Diketahui';
            
            tbody.innerHTML += `
            <tr>
                <td style="text-align: center;">${noUrut}</td>
                <td><strong>${item.kode}</strong></td>
                <td style="font-weight: 600; color: var(--primary-teal);">${namaDosen}</td>
                <td style="text-align: center;"><span class="badge-status status-aktif">Tersedia</span></td>
                <td style="text-align: center;">
                    <button class="btn-action btn-edit" onclick="bukaModalDosen('${item.kode}', '${namaDosen}')"><i class="fas fa-edit"></i> Ubah</button>
                    <button class="btn-action btn-delete" onclick="alert('Fitur hapus segera hadir!')"><i class="fas fa-trash"></i> Hapus</button>
                </td>
            </tr>`;
        });

        renderPaginationUI(filteredData.length, startIndex, endIndex);
    }

    function renderPaginationUI(totalFilteredData, startIndex, endIndex) {
        const totalPages = Math.ceil(totalFilteredData / rowsPerPage);
        const actualEndIndex = Math.min(endIndex, totalFilteredData);
        const paginationContainer = document.getElementById('pagination-dosen');
        
        let html = `<div>Showing ${startIndex + 1} to ${actualEndIndex} of ${totalFilteredData} entries</div>`;
        html += `<div style="display: flex; gap: 5px;">`;
        
        const prevDisabled = currentPage === 1;
        html += `<button class="btn" style="background: ${prevDisabled ? '#e5e7eb' : 'var(--text-dark)'}; color: ${prevDisabled ? '#9ca3af' : 'white'}; padding: 8px 12px; border:none; border-radius:8px; cursor:${prevDisabled ? 'not-allowed' : 'pointer'};" ${prevDisabled ? 'disabled' : `onclick="changePage(-1)"`}><i class="fas fa-chevron-left"></i> Prev</button>`;
        
        const nextDisabled = currentPage === totalPages || totalPages === 0;
        html += `<button class="btn" style="background: ${nextDisabled ? '#e5e7eb' : 'var(--text-dark)'}; color: ${nextDisabled ? '#9ca3af' : 'white'}; padding: 8px 12px; border:none; border-radius:8px; cursor:${nextDisabled ? 'not-allowed' : 'pointer'};" ${nextDisabled ? 'disabled' : `onclick="changePage(1)"`}>Next <i class="fas fa-chevron-right"></i></button>`;
        
        html += `</div>`;
        paginationContainer.innerHTML = html;
    }

    function changePage(direction) {
        currentPage += direction;
        renderTablePaginated();
    }

    function bukaModalDosen(nidn = '', nama = '') {
        if(nidn) {
            document.getElementById('modalTitleDosen').innerText = "Ubah Data Dosen";
            document.getElementById('inputNIDNDosen').value = nidn;
            document.getElementById('inputNIDNDosen').readOnly = true;
            document.getElementById('inputNamaDosen').value = nama;
        } else {
            document.getElementById('modalTitleDosen').innerText = "Tambah Dosen Baru";
            document.getElementById('inputNIDNDosen').value = "";
            document.getElementById('inputNIDNDosen').readOnly = false;
            document.getElementById('inputNamaDosen').value = "";
        }
        
        document.getElementById('inputHomebaseDosen').value = "Sistem Informasi";
        document.getElementById('inputEmailDosen').value = "";
        
        document.getElementById('modalDosen').style.display = "flex";
    }

    function tutupModalDosen() {
        document.getElementById('modalDosen').style.display = "none";
    }

    function simpanDosen() {
        const nidn = document.getElementById('inputNIDNDosen').value;
        const nama = document.getElementById('inputNamaDosen').value;
        
        alert(`Sistem berhasil menangkap perubahan untuk NIDN: ${nidn}. Data siap dikirim ke n8n!`);
        tutupModalDosen();
    }

    window.onload = () => { 
        loadSidebar(); 
        loadData(); 
        
        const selectBox = document.getElementById('showEntries');
        if(selectBox) {
            selectBox.onchange = (e) => {
                rowsPerPage = parseInt(e.target.value);
                currentPage = 1; 
                renderTablePaginated();
            }
        }

        const searchBox = document.getElementById('searchBox');
        if(searchBox) {
            searchBox.oninput = (e) => {
                searchQuery = e.target.value.toLowerCase();
                currentPage = 1; 
                renderTablePaginated();
            }
        }
    };
</script>
</body>
</html>
