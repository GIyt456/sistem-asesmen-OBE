<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perumusan BK - Sistem OBE</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Script untuk Export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="../../../js/api_config.js"></script>

    <!-- Panggil CSS -->
    <link rel="stylesheet" href="bahan_kajian.css">
    <link rel="stylesheet" href="../../../css/global_si.css">
    <link rel="stylesheet" href="../../../css/admin_si.css">
</head>

<body>
    <div id="sidebar-container"></div>
    <div id="navbar-container"></div>

    <div class="main-content">
        <!-- SATUKAN SEMUA KE DALAM CONTENT-WRAPPER -->
        <div class="content-wrapper">

            <div class="header-container">
                <div class="header-left">
                    <div class="header-title-area">
                        <div class="header-subtitle">KELOLA KURIKULUM</div>
                        <h1 class="header-title">PERUMUSAN <span id="titleSpan">BAHAN KAJIAN</span></h1>
                    </div>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <!-- TEMPLATE: Filter Section -->
            <div class="filter-section">
                <label for="filterKurikulum">Tampilkan Data Kurikulum:</label>
                <select id="filterKurikulum" onchange="loadData()" class="filter-select">
                    <option value="">Memuat data...</option>
                </select>
            </div>

            <!-- TEMPLATE: Section Header -->
            <div class="section-header">
                <div class="section-title-area">
                    <h3 class="section-title">Daftar Bahan Kajian</h3>
                    <p class="section-subtitle">Kelola detail rumusan atau Impor massal melalui Excel</p>
                </div>

                <div class="action-buttons">
                    <button class="btn-action btn-add" onclick="openModalAdd()">
                        <i class="fas fa-plus"></i> <span class="btn-text">Tambah BK</span>
                    </button>
                    <button class="btn-action btn-download" onclick="exportKeExcel()">
                        <i class="fas fa-file-download"></i> <span class="btn-text">Template</span>
                    </button>

                    <input type="file" id="fileExcel" accept=".xlsx, .xls" style="display: none;"
                        onchange="uploadExcel()">
                    <button class="btn-action btn-upload" onclick="document.getElementById('fileExcel').click()">
                        <i class="fas fa-file-upload"></i> <span class="btn-text">Impor</span>
                    </button>
                </div>
            </div>

            <!-- Area Tabel (DIBIARKAN UTUH SESUAI PERMINTAAN) -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Kode</th>
                            <th>Bahan Kajian</th>
                            <th>Deskripsi</th>
                            <th>Kompetensi</th>
                            <th>Koordinator</th>
                            <th>Referensi</th>
                            <th style="text-align: center;">Opsi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 40px;">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Form (DIBIARKAN UTUH) -->
    <div class="modal" id="inputModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Tambah Bahan Kajian</div>
            <input type="hidden" id="modalMode" value="add">

            <div class="form-group">
                <label>Kode BK (Contoh: BK01)</label>
                <input type="text" id="inpKode" placeholder="Masukkan kode unik BK...">
            </div>
            <div class="form-group">
                <label>Nama Bahan Kajian</label>
                <input type="text" id="inpNama" placeholder="Contoh: Foundation of IS">
            </div>
            <div class="form-group">
                <label>Deskripsi</label>
                <textarea id="inpDeskripsi" rows="4" placeholder="Jelaskan cakupan materi BK ini..."></textarea>
            </div>
            <div class="form-group">
                <label>Kompetensi</label>
                <textarea id="inpKompetensi" rows="4" placeholder="Target kemampuan yang ingin dicapai..."></textarea>
            </div>
            <div class="form-group">
                <label>Koordinator BK</label>
                <input type="text" id="inpKoordinator" placeholder="Nama dosen pengampu utama...">
            </div>
            <div class="form-group">
                <label>Referensi</label>
                <textarea id="inpReferensi" rows="3" placeholder="Daftar buku atau sumber pustaka..."></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px;">
                <button onclick="closeModal()"
                    style="padding: 12px 20px; border: 1px solid #cbd5e1; background: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Batal</button>
                <button onclick="saveData()"
                    style="padding: 12px 20px; background: var(--primary-red); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700;">Simpan
                    Data</button>
            </div>
        </div>
    </div>

    <!-- Memanggil Template Sidebar -->
    <script src="../../../js/template.js"></script>

    <script>
        const PRODI = localStorage.getItem("prodi_aktif") || "ti";
        const userLogin = localStorage.getItem("user_login");
        if (!userLogin) window.location.replace("/login/login.html");

        // Setting Badge & Warna Prodi
        const pAktif = localStorage.getItem("prodi_aktif") || "ti";
        const warnaProdi = pAktif === 'si' ? '#1e3a8a' : '#8b0000';

        document.getElementById("titleSpan").style.color = warnaProdi;
        const badge = document.getElementById("prodiBadge");
        if (badge) {
            badge.style.backgroundColor = warnaProdi;
            badge.innerText = pAktif === 'si' ? "SISTEM INFORMASI" : "TEKNIK INFORMATIKA";
        }

        async function loadDropdownKurikulum() {
            try {
                const response = await fetch(`${API_BASE}/get-kurikulum-tersedia`);
                const data = await response.json();
                const selectKurikulum = document.getElementById('filterKurikulum');
                selectKurikulum.innerHTML = '';
                data.forEach(item => {
                    let opt = document.createElement('option');
                    opt.value = item.kurikulum;
                    opt.text = "Kurikulum 20" + item.kurikulum;
                    selectKurikulum.appendChild(opt);
                });
                await loadData();
            } catch (error) {
                console.error("Gagal memuat list kurikulum:", error);
                document.getElementById('filterKurikulum').innerHTML = '<option value="">Gagal memuat kurikulum</option>';
            }
        }

        async function loadData() {
            const tbody = document.getElementById('tableBody');
            const selectKurikulum = document.getElementById('filterKurikulum');
            let kurikulumTerpilih = selectKurikulum ? selectKurikulum.value : "";
            let API_BK_DINAMIS = `${API_BASE}/get-master-bk?prodi=${PRODI}`;
            if (kurikulumTerpilih !== "") API_BK_DINAMIS += `&kurikulum=${kurikulumTerpilih}`;

            try {
                const res = await fetch(API_BK_DINAMIS);
                const data = await res.json();
                tbody.innerHTML = '';

                const aman = (str) => {
                    if (!str) return '';
                    return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '');
                };

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #64748b; padding: 40px;">Data BK Kosong untuk kurikulum ini.</td></tr>';
                    return;
                }

                data.forEach(bk => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                    <td style="font-weight: 800; color: var(--primary-blue);">${bk.kode_bk}</td>
                    <td style="font-weight: 700; color: #1e293b;">${bk.nama_bk}</td>
                    <td style="color: #64748b; white-space: pre-wrap;">${bk.deskripsi || '-'}</td>
                    <td style="color: #64748b; white-space: pre-wrap;">${bk.kompetensi || '-'}</td>
                    <td style="font-weight: 600; color: #475569;">${bk.koordinator_bk || '-'}</td>
                    <td style="font-size: 0.8rem; font-style: italic; color: #64748b; white-space: pre-wrap;">${bk.referensi || '-'}</td>
                    <td>
                        <button class="btn-edit" onclick="openModalEdit('${bk.kode_bk}', '${aman(bk.nama_bk)}', '${aman(bk.deskripsi)}', '${aman(bk.kompetensi)}', '${aman(bk.koordinator_bk)}', '${aman(bk.referensi)}')">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                    </td>`;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: red; padding: 40px;">Gagal memuat data.</td></tr>';
            }
        }

        async function uploadExcel() {
            const fileInput = document.getElementById('fileExcel');
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('data', file);
            formData.append('prodi', PRODI);

            const btnUpload = document.querySelector('.btn-upload');
            const oriText = btnUpload.innerHTML;
            btnUpload.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengimpor...';
            btnUpload.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/upload-master-bk?prodi=${PRODI}`, { method: 'POST', body: formData });
                if (res.ok) { alert("✅ Data Excel berhasil diimpor!"); await loadDropdownKurikulum(); }
                else { alert("❌ Gagal memproses file Excel."); }
            } catch (e) { alert("❌ Terjadi kesalahan koneksi."); }
            finally { btnUpload.innerHTML = oriText; btnUpload.disabled = false; fileInput.value = ''; }
        }

        function openModalAdd() {
            document.getElementById('modalTitle').innerText = "Tambah Bahan Kajian";
            document.getElementById('modalMode').value = "add";
            document.getElementById('inpKode').disabled = false;
            resetForm();
            document.getElementById('inputModal').style.display = 'flex';
        }

        function openModalEdit(kode, nama, desk, komp, koor, ref) {
            document.getElementById('modalTitle').innerText = "Edit Perumusan BK";
            document.getElementById('modalMode').value = "edit";
            document.getElementById('inpKode').value = kode;
            document.getElementById('inpKode').disabled = true;
            document.getElementById('inpNama').value = nama;
            document.getElementById('inpDeskripsi').value = desk;
            document.getElementById('inpKompetensi').value = komp;
            document.getElementById('inpKoordinator').value = koor;
            document.getElementById('inpReferensi').value = ref;
            document.getElementById('inputModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('inputModal').style.display = 'none'; }

        function resetForm() {
            document.getElementById('inpKode').value = '';
            document.getElementById('inpNama').value = '';
            document.getElementById('inpDeskripsi').value = '';
            document.getElementById('inpKompetensi').value = '';
            document.getElementById('inpKoordinator').value = '';
            document.getElementById('inpReferensi').value = '';
        }

        async function saveData() {
            const mode = document.getElementById('modalMode').value;
            const endpoint = mode === 'add' ? 'add-master-bk' : 'update-master-bk';

            const payload = {
                kode_bk: document.getElementById('inpKode').value,
                nama_bk: document.getElementById('inpNama').value,
                deskripsi: document.getElementById('inpDeskripsi').value,
                kompetensi: document.getElementById('inpKompetensi').value,
                koordinator_bk: document.getElementById('inpKoordinator').value,
                referensi: document.getElementById('inpReferensi').value,
                prodi: PRODI
            };

            if (!payload.kode_bk || !payload.nama_bk) return alert("Kode dan Nama BK wajib diisi!");

            try {
                const res = await fetch(`${API_BASE}/${endpoint}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                if (res.ok) { alert("✅ Data berhasil disimpan!"); closeModal(); loadData(); }
            } catch (e) { alert("❌ Terjadi kesalahan koneksi."); }
        }

        async function exportKeExcel() {
            const btn = document.querySelector('.btn-download');
            const oriText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyiapkan...';

            let kurikulumTerpilih = document.getElementById('filterKurikulum').value;
            let API_BK_DINAMIS = `${API_BASE}/get-master-bk?prodi=${PRODI}&kurikulum=${kurikulumTerpilih}`;

            try {
                const res = await fetch(API_BK_DINAMIS);
                const data = await res.json();
                if (!data || data.length === 0) { alert("Belum ada data untuk di-export."); return; }

                const dataMapping = data.map(bk => ({
                    'kode_bk': bk.kode_bk, 'nama_bk': bk.nama_bk, 'deskripsi': bk.deskripsi || '', 'kompetensi': bk.kompetensi || '', 'koordinator_bk': bk.koordinator_bk || '', 'referensi': bk.referensi || ''
                }));
                const worksheet = XLSX.utils.json_to_sheet(dataMapping);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Master_BK");
                XLSX.writeFile(workbook, `Data_Master_BK_${PRODI}_Kurikulum_${kurikulumTerpilih}.xlsx`);
            } catch (e) { alert("Gagal mengambil data untuk export."); }
            finally { btn.innerHTML = oriText; }
        }

        // 1. Fungsi Buka/Tutup dari Navbar 
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar-container');
            if (sidebar) sidebar.classList.toggle('active');
        }

        // 2. Fungsi Buka/Tutup dari dalam Sidebar 
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar-container');
            if (sidebar) sidebar.classList.toggle('active');
        }

        // 3. SENSOR PENUTUP (Deteksi klik di layar gelap)
        document.addEventListener('click', function (event) {
            const sidebar = document.getElementById("sidebar-container");
            const hamburgerBtn = document.querySelector('.hamburger-btn') || document.querySelector('.mobile-menu-btn');

            if (sidebar && sidebar.classList.contains("active")) {
                if (!sidebar.contains(event.target) && (!hamburgerBtn || !hamburgerBtn.contains(event.target))) {
                    sidebar.classList.remove("active");
                }
            }
        });

        window.onload = async () => { await loadDropdownKurikulum(); };
    </script>
</body>

</html>
