<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapping MK - CPL - CPMK - Sistem OBE</title>

    <!-- MEMANGGIL FILE CSS STANDAR -->
    <link rel="stylesheet" href="../../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tambahan Library untuk Fitur Search (Select2) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script src="../../../js/api_config.js"></script>

    <!-- Panggil CSS -->
    <link rel="stylesheet" href="mk_cpmk.css">
    <link rel="stylesheet" href="../../../css/global_si.css?v=2">
    <link rel="stylesheet" href="../../../css/admin_si.css">
    
    <style>
        .filter-kurikulum-mobile select:focus {
            border-color: var(--primary-blue) !important;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1) !important;
        }

        @media screen and (max-width: 768px) {
            .filter-kurikulum-mobile {
                flex-direction: column !important;
                align-items: flex-start !important;
                margin-bottom: 20px !important;
                gap: 8px !important;
            }
            .select-kurikulum-mobile {
                width: 100% !important;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar-mobile">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <img src="/gambar/LogoUnaki.png" alt="Logo Universitas AKI"
                style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;"
                onclick="window.location.href='/index.html'">
        </div>
        <div class="profile-btn-mobile" onclick="toggleSidebar()"><img id="mobileNavbarAvatar" src=""
                alt="Profil Kaprodi"></div>
    </nav>

    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>
    <div id="sidebar-container"></div>
    <div id="navbar-container"></div>

    <div class="main-content">
        <div class="content-wrapper">

            <!-- TEMPLATE: Header -->
            <div class="header-container">
                <div class="header-left">
                    <div class="header-title-area">
                        <div class="header-subtitle">PEMETAAN (MAPPING)</div>
                        <h1 class="header-title">MAPPING <span>MK - CPMK</span></h1>
                    </div>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <!-- TEMPLATE: Filter Section -->
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px;" class="filter-kurikulum-mobile">
                <label for="filterKurikulum" style="font-size: 1.05rem; font-weight: 700; color: #0f172a; margin: 0;">Tampilkan Data Kurikulum:</label>
                <select id="filterKurikulum" onchange="initDropdownAndCheckboxes()" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-family: 'Inter', sans-serif; font-size: 1rem; color: #1e293b; background-color: #fff; cursor: pointer; outline: none; min-width: 220px; transition: 0.2s;" class="select-kurikulum-mobile">
                    <option value="">Memuat data...</option>
                </select>
            </div>

            <!-- TEMPLATE: Section Header -->
            <div class="section-header">
                <div class="section-title-area">
                    <h3 class="section-title">Relasi Pemetaan</h3>
                    <p class="section-subtitle">Pilih Mata Kuliah, lalu centang CPMK relevan yang dipelajari.</p>
                </div>
            </div>

            <!-- PANEL MAPPING KONTEN -->
            <div class="mapping-panel">
                <!-- 1. PILIH MATA KULIAH (SELECT2) -->
                <div class="form-group">
                    <label for="selectMk"><i class="fas fa-search dynamic-icon" style="margin-right: 8px;"></i> Cari / Pilih Mata
                        Kuliah</label>
                    <select id="selectMk" class="select-custom" style="width: 100%;">
                        <option value="">-- Memuat daftar Mata Kuliah... --</option>
                    </select>
                </div>

                <hr style="border: 0; border-top: 2px dashed #cbd5e1; margin: 40px 0;">

                <!-- 2. DAFTAR CHECKBOX CPMK -->
                <div class="form-group">
                    <label><i class="fas fa-tasks dynamic-icon" style="margin-right: 8px;"></i> Centang CPMK yang
                        Relevan</label>
                    <p
                        style="font-size: 0.9rem; color: #64748b; font-weight: 500; margin-bottom: 20px; line-height: 1.5;">
                        Pilih mata kuliah di atas terlebih dahulu untuk melihat dan menghubungkan CPMK.</p>

                    <div id="cpmkContainer" class="cpmk-grid">
                        <div
                            style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #9ca3af; font-weight: 600; border: 2px dashed #e2e8f0; border-radius: 12px; background: white;">
                            <i class="fas fa-spinner fa-spin fa-2x"
                                style="margin-bottom: 15px; color: var(--primary-blue);"></i><br>
                            Memuat daftar CPMK...
                        </div>
                    </div>
                </div>

                <!-- 3. TOMBOL SIMPAN -->
                <button id="btnSave" class="btn-save-mapping" onclick="saveMapping()" disabled>
                    <i class="fas fa-save" style="font-size: 1.2rem;"></i> Simpan Pemetaan
                </button>
            </div>

        </div>
    </div>

    <script src="../../../js/template.js?v=2"></script>

    <script>
        const PRODI = localStorage.getItem("prodi_aktif") || "ti";
        const API_SAVE_MAPPING = `${API_BASE}/admin-map-mk-cpmk`;
        let listCPMK = [];

        const userLogin = localStorage.getItem("user_login");
        if (!userLogin) window.location.replace("/login/login.html");

        // SET TEMA WARNA SESUAI PRODI
        document.addEventListener("DOMContentLoaded", () => {
            const dynamicIcons = document.querySelectorAll('.dynamic-icon');
            if (PRODI === "ti") {
                document.documentElement.style.setProperty('--primary-blue', '#8b0000');
                document.getElementById('prodiBadge').innerText = "TEKNIK INFORMATIKA";
                dynamicIcons.forEach(icon => icon.style.color = '#8b0000');
            } else {
                document.documentElement.style.setProperty('--primary-blue', '#1e3a8a');
                document.getElementById('prodiBadge').innerText = "SISTEM INFORMASI";
                dynamicIcons.forEach(icon => icon.style.color = '#1e3a8a');
            }
        });

        // --- INISIALISASI SELECT2 KETIKA HALAMAN DIMUAT ---
        $(document).ready(function() {
            $('#selectMk').select2({
                placeholder: "-- Ketik / Pilih Mata Kuliah --",
                allowClear: true,
                width: '100%'
            });

            // Event listener saat Matkul dipilih
            $('#selectMk').on('change', function() {
                fetchExistingMapping();
            });
        });

        // --- FUNGSI LOAD KURIKULUM ---
        async function loadDropdownKurikulum() {
            try {
                const response = await fetch(`${API_BASE}/get-kurikulum-tersedia`);
                const data = await response.json();
                const selectKurikulum = document.getElementById('filterKurikulum');
                selectKurikulum.innerHTML = '';
                
                let kurikulumSet = new Set();
                data.forEach(item => { if (item && item.kurikulum) kurikulumSet.add(String(item.kurikulum)); });
                kurikulumSet.add("25");
                kurikulumSet.add("20");

                let sortedKurikulum = Array.from(kurikulumSet).sort((a, b) => b - a);

                sortedKurikulum.forEach(kur => {
                    let opt = document.createElement('option');
                    opt.value = kur;
                    opt.text = "Kurikulum 20" + kur;
                    selectKurikulum.appendChild(opt);
                });
                await initDropdownAndCheckboxes();
            } catch (error) {
                document.getElementById('filterKurikulum').innerHTML = '<option value="25">Kurikulum 2025</option><option value="20">Kurikulum 2020</option>';
                await initDropdownAndCheckboxes();
            }
        }

        // --- LOGIKA MAPPING API ---
        async function initDropdownAndCheckboxes() {
            const selectMk = document.getElementById('selectMk');
            const cpmkContainer = document.getElementById('cpmkContainer');
            const btnSave = document.getElementById('btnSave');

            if (btnSave) btnSave.disabled = true;

            const selectKurikulum = document.getElementById('filterKurikulum');
            let kurikulum = selectKurikulum ? selectKurikulum.value : "";

            // Reset Select2 State
            if (selectMk) {
                $('#selectMk').empty();
                $('#selectMk').append('<option value="" disabled selected>-- Memuat daftar Mata Kuliah... --</option>');
                $('#selectMk').trigger('change.select2');
            }

            // Anti-Cache
            const timeStamp = new Date().getTime();
            let URL_MK = `${API_BASE}/get-susunan-matkul?prodi=${PRODI}&_t=${timeStamp}`;
            let URL_CPMK = `${API_BASE}/get-master-cpmk?prodi=${PRODI}&_t=${timeStamp}`;

            if (kurikulum) {
                URL_MK += `&kurikulum=${kurikulum}`;
                URL_CPMK += `&kurikulum=${kurikulum}`;
            }

            try {
                const [resMk, resCpmk] = await Promise.all([
                    fetch(URL_MK, { cache: "no-store" }), fetch(URL_CPMK, { cache: "no-store" })
                ]);

                const dataMk = await resMk.json();
                listCPMK = await resCpmk.json();

                if (selectMk) {
                    $('#selectMk').empty();
                    if (dataMk.length > 0) {
                        $('#selectMk').append('<option value="" disabled selected>-- Ketik / Pilih Mata Kuliah --</option>');
                        dataMk.forEach(mk => {
                            $('#selectMk').append(`<option value="${mk.kode_mk}">${mk.kode_mk} - ${mk.nama_mk}</option>`);
                        });
                    } else { 
                        $('#selectMk').append('<option value="" disabled selected>-- Data Mata Kuliah Kosong --</option>'); 
                    }
                    $('#selectMk').val('').trigger('change.select2');
                }

                if (cpmkContainer) {
                    cpmkContainer.innerHTML = '';
                    if (listCPMK.length > 0) {
                        const groupedCPMK = {};
                        listCPMK.forEach(cpmk => {
                            const cpl = cpmk.kode_cpl_ref || "Belum Terkoneksi CPL";
                            if (!groupedCPMK[cpl]) groupedCPMK[cpl] = [];
                            groupedCPMK[cpl].push(cpmk);
                        });

                        const sortedCPLs = Object.keys(groupedCPMK).sort((a, b) => {
                            const angkaA = parseInt(a.replace(/\D/g, ''), 10) || 0;
                            const angkaB = parseInt(b.replace(/\D/g, ''), 10) || 0;
                            if (angkaA === angkaB) return a.localeCompare(b);
                            return angkaA - angkaB;
                        });

                        sortedCPLs.forEach(cpl => {
                            cpmkContainer.innerHTML += `
                            <div class="cpl-divider">
                                <div class="cpl-divider-title">
                                    <i class="fas fa-link dynamic-icon"></i> CPL Induk: ${cpl}
                                </div>
                                <div class="cpl-divider-count">
                                    ${groupedCPMK[cpl].length} CPMK Terkait
                                </div>
                            </div>
                        `;

                            groupedCPMK[cpl].forEach(cpmk => {
                                cpmkContainer.innerHTML += `
                                <label class="cpmk-card">
                                    <input type="checkbox" class="cpmk-checkbox" value="${cpmk.kode_cpmk}" disabled>
                                    <div class="cpmk-info">
                                        <div class="cpmk-code">${cpmk.kode_cpmk}</div>
                                        <div class="cpmk-desc">${cpmk.deskripsi || '-'}</div>
                                    </div>
                                </label>
                            `;
                            });
                        });

                        const dynamicIcons = document.querySelectorAll('.dynamic-icon');
                        const color = PRODI === 'si' ? '#1e3a8a' : '#8b0000';
                        dynamicIcons.forEach(icon => icon.style.color = color);

                    } else {
                        cpmkContainer.innerHTML = '<div style="color: red; grid-column: 1 / -1; text-align:center; padding:20px; font-weight:bold;">Master Data CPMK Kosong.</div>';
                    }
                }

            } catch (error) {
                if (selectMk) {
                    $('#selectMk').empty();
                    $('#selectMk').append('<option value="" disabled selected>Gagal terhubung ke API</option>');
                    $('#selectMk').trigger('change.select2');
                }
                if (cpmkContainer) cpmkContainer.innerHTML = '<div style="color: red; grid-column: 1 / -1; text-align:center; padding:20px; font-weight:bold;">Gagal menarik data Master dari Server.</div>';
            }
        }

        async function fetchExistingMapping() {
            const selectMk = document.getElementById('selectMk');
            const kodeMk = selectMk ? selectMk.value : null;
            const btnSave = document.getElementById('btnSave');
            const checkboxes = document.querySelectorAll('.cpmk-checkbox');

            if (!kodeMk) return;

            checkboxes.forEach(cb => { cb.checked = false; cb.disabled = false; });
            if (btnSave) btnSave.disabled = true;
            btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memuat relasi...';

            const selectKurikulum = document.getElementById('filterKurikulum');
            let kurikulum = selectKurikulum ? selectKurikulum.value : "";
            let URL_MAPPING = `${API_BASE}/get-mapping-mk?prodi=${PRODI}&mk=${kodeMk}`;
            if (kurikulum) URL_MAPPING += `&kurikulum=${kurikulum}`;

            try {
                const res = await fetch(URL_MAPPING, { cache: "no-store" });
                const relations = await res.json();

                let listRelasi = [];
                if (Array.isArray(relations)) listRelasi = relations;
                else if (relations && typeof relations === 'object') listRelasi = [relations];

                checkboxes.forEach(cb => {
                    const apakahCocok = listRelasi.some(rel => {
                        const dbKodeCpmk = rel.kode_cpmk || rel.KODE_CPMK || rel.kodeCpmk;
                        if (!dbKodeCpmk) return false;
                        return cb.value.trim().toLowerCase() === dbKodeCpmk.toString().trim().toLowerCase();
                    });
                    if (apakahCocok) cb.checked = true;
                });

            } catch (error) {
                alert("Gagal memuat pemetaan yang sudah ada untuk MK ini.");
            } finally {
                if (btnSave) {
                    btnSave.disabled = false;
                    btnSave.innerHTML = '<i class="fas fa-save" style="font-size: 1.2rem;"></i> Simpan Pemetaan';
                }
            }
        }

        async function saveMapping() {
            const kodeMk = document.getElementById('selectMk').value;
            const btnSave = document.getElementById('btnSave');
            const textAwal = btnSave.innerHTML;

            if (!kodeMk) { alert("Silakan pilih Mata Kuliah terlebih dahulu!"); return; }

            const checkedBoxes = Array.from(document.querySelectorAll('.cpmk-checkbox:checked')).map(cb => cb.value);

            btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
            btnSave.disabled = true;

            const selectKurikulum = document.getElementById('filterKurikulum');
            let kurikulumTerpilih = selectKurikulum ? selectKurikulum.value : "25";

            try {
                const payload = {
                    kode_mk: kodeMk,
                    prodi: PRODI,
                    cpmk_list: checkedBoxes,
                    kurikulum: kurikulumTerpilih
                };

                const res = await fetch(API_SAVE_MAPPING, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert("✅ Relasi MK & CPMK berhasil disimpan!");
                } else {
                    alert("❌ Gagal menyimpan data di server.");
                }
            } catch (error) {
                alert("Terjadi kesalahan jaringan.");
            } finally {
                btnSave.innerHTML = textAwal;
                btnSave.disabled = false;
            }
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar-container');
            if (sidebar) sidebar.classList.toggle('active');
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar-container');
            if (sidebar) sidebar.classList.toggle('active');
        }

        document.addEventListener('click', function (event) {
            const sidebar = document.getElementById("sidebar-container");
            const hamburgerBtn = document.querySelector('.hamburger-btn') || document.querySelector('.mobile-menu-btn');

            if (sidebar && sidebar.classList.contains("active")) {
                if (!sidebar.contains(event.target) && (!hamburgerBtn || !hamburgerBtn.contains(event.target))) {
                    sidebar.classList.remove("active");
                }
            }
        });

        window.onload = async () => { await loadDropdownKurikulum(); };
    </script>
</body>

</html>
