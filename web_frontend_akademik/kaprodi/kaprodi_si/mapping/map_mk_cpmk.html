<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapping MK - CPMK - Sistem OBE</title>
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin_si.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="/js/api_config.js"></script>
    <script src="/js/template.js"></script>
    
    <style>
        /* =========================================
           🛡️ MANTRA ANTI-BOCOR & ANTI-MEROSOT
           ========================================= */
        *, *::before, *::after { box-sizing: border-box !important; }
        html, body { max-width: 100vw; overflow-x: hidden; }

        /* MEMBUNUH PADDING 40PX BAWAAN DARI ADMIN_SI.CSS! */
        .fixed-header { padding-top: 15px !important; }
        .main-content { padding-top: 0 !important; }

        .mapping-panel { background: white; border: 1px solid var(--border-color); border-radius: 12px; padding: 30px 40px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; font-weight: 800; margin-bottom: 15px; font-size: 1.1rem; color: #1e293b; }
        
        .select-custom { width: 100%; padding: 15px 20px; border-radius: 10px; border: 2px solid #cbd5e1; font-size: 1rem; font-weight: 600; outline: none; background: #f8fafc; cursor: pointer; color: #334155; transition: 0.2s;}
        .select-custom:focus { border-color: var(--primary-blue); background: white; box-shadow: 0 0 0 3px rgba(30,58,138, 0.1);}

        .cpmk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 15px; }
        .cpmk-card { border: 2px solid #e2e8f0; padding: 20px; border-radius: 12px; display: flex; align-items: flex-start; gap: 15px; cursor: pointer; transition: 0.2s; background: white; }
        .cpmk-card:hover { border-color: var(--primary-blue); background: #f0f9ff; transform: translateY(-3px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        
        .cpmk-card input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; margin-top: 2px; accent-color: var(--primary-blue); flex-shrink: 0;}
        .cpmk-info { display: flex; flex-direction: column; }
        .cpmk-code { font-weight: 900; font-size: 1.1rem; color: var(--primary-blue); margin-bottom: 6px;}
        .cpmk-desc { font-size: 0.85rem; color: #475569; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; font-weight: 500;}

        /* =========================================
           📱 CSS KHUSUS HP (ANTI MEPET & BOCOR)
           ========================================= */
        @media screen and (max-width: 768px) {
            html, body { overflow-x: hidden !important; width: 100% !important; max-width: 100% !important; margin: 0; padding: 0;}
            .main-content { overflow-x: hidden !important; width: 100% !important; padding-top: 15px !important;}
            
            .header-mapping-mk-cpmk { margin: 15px 15px 10px 15px !important; flex-direction: column !important; align-items: flex-start !important; gap: 15px; padding-bottom: 0 !important; border-bottom: none !important;}
            .section-mapping-mk-cpmk { padding: 0 15px 40px 15px !important; width: 100% !important; box-sizing: border-box !important;}
            .mapping-panel { padding: 25px 20px !important; width: 100% !important; box-sizing: border-box !important;}
            
            .cpmk-grid { grid-template-columns: 1fr; gap: 15px; }
            .cpmk-desc { -webkit-line-clamp: unset !important; overflow: visible !important;} 
            .btn-primary-si { width: 100% !important; box-sizing: border-box !important;}
        }
    </style>
</head>
<body>

    <nav class="navbar-mobile">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <img src="/gambar/LogoUnaki.png" alt="Logo Universitas AKI" 
                 style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;" 
                 onclick="window.location.href='/index.html'">
        </div>
        <div class="profile-btn-mobile" onclick="toggleSidebar()">
            <img id="mobileNavbarAvatar" src="" alt="Profil Kaprodi">
        </div>
    </nav>

    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div id="navbar-container"></div>

        <div class="fixed-header">
            <div class="header-container header-mapping-mk-cpmk" style="margin: 0 50px 15px 50px; border-bottom: none; padding-bottom: 0;">
                <div class="header-title-area">
                    <div class="header-subtitle">PEMETAAN (MAPPING)</div>
                    <h1 class="header-title">MAPPING <span>MK - CPMK</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge" style="margin-top: 10px; display: inline-block; width: fit-content;">PRODI</div>
            </div>
            <div style="border-bottom: 1px solid var(--border-color); margin: 0 50px 20px 50px;" class="header-mapping-mk-cpmk"></div>
        </div>

        <div class="scrollable-content section-mapping-mk-cpmk" style="padding: 0 50px 40px 50px;">
            <div class="mapping-panel">
                <div class="form-group">
                    <label for="selectMk">
                        <i class="fas fa-book dynamic-icon" style="margin-right: 10px;"></i> Pilih Mata Kuliah
                    </label>
                    <select id="selectMk" class="select-custom" onchange="fetchExistingMapping()">
                        <option value="">-- Memuat daftar Mata Kuliah... --</option>
                    </select>
                </div>

                <hr style="border: 0; border-top: 2px dashed #cbd5e1; margin: 40px 0;">

                <div class="form-group">
                    <label>
                        <i class="fas fa-list-check dynamic-icon" style="margin-right: 10px;"></i> Centang CPMK yang Relevan
                    </label>
                    <p style="font-size: 0.9rem; color: #64748b; font-weight: 500; margin-bottom: 20px; line-height: 1.5;">Pilih Mata Kuliah di atas terlebih dahulu, kemudian centang kotak-kotak CPMK di bawah ini untuk menghubungkannya.</p>
                    
                    <div id="cpmkContainer" class="cpmk-grid">
                        <div id="loadingIndicator" style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #9ca3af; font-weight: 600; border: 2px dashed #e2e8f0; border-radius: 12px;">
                            <i class="fas fa-spinner fa-spin fa-2x" style="margin-bottom: 15px; color: var(--primary-blue);"></i><br>
                            Memuat daftar CPMK...
                        </div>
                    </div>
                </div>

                <button id="btnSave" class="btn-primary-si" style="width: 100%; justify-content: center; padding: 15px; font-size: 1.1rem; margin-top: 40px;" onclick="saveMapping()" disabled>
                    <i class="fas fa-save" style="font-size: 1.2rem;"></i> Simpan Relasi Pemetaan
                </button>
            </div>
        </div>
    </div>

<script>
    // --- SETUP TEMA & WARNA DINAMIS BERDASARKAN PRODI ---
    const PRODI = localStorage.getItem("prodi_aktif") || "si"; 
    
    document.addEventListener("DOMContentLoaded", () => {
        const dynamicIcons = document.querySelectorAll('.dynamic-icon');
        
        if(PRODI === "ti") {
            document.documentElement.style.setProperty('--primary-blue', '#8b0000'); 
            document.getElementById('prodiBadge').innerText = "TEKNIK INFORMATIKA";
            dynamicIcons.forEach(icon => icon.style.color = '#8b0000');
        } else {
            document.documentElement.style.setProperty('--primary-blue', '#1e3a8a'); 
            document.getElementById('prodiBadge').innerText = "SISTEM INFORMASI";
            dynamicIcons.forEach(icon => icon.style.color = '#1e3a8a');
        }

        const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
        const avatarMobile = document.getElementById("mobileNavbarAvatar");
        if(avatarMobile) {
            const avatarColor = PRODI === "si" ? "1e3a8a" : "8b0000";
            avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=${avatarColor}&color=fff&bold=true`;
        }
    });

    // --- FUNGSI SIDEBAR MOBILE ---
    function toggleSidebar() {
        document.getElementById('sidebar-container').classList.toggle('active');
        document.getElementById('mobileOverlay').classList.toggle('active');
    }
    
    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
            const sidebar = document.getElementById('sidebar-container');
            if (sidebar && !sidebar.innerHTML.includes('sidebar-profile')) {
                fetch(`/kaprodi/kaprodi_${PRODI}/sidebar.html`)
                    .then(res => res.text())
                    .then(html => {
                        sidebar.innerHTML = html;
                        if(typeof initSmartSidebar === 'function') initSmartSidebar();
                    })
                    .catch(e => console.log('Gagal memuat sidebar darurat'));
            }
        }, 600); 
    });

    // --- LOGIKA API ---
    const API_MATKUL = `${API_BASE}/get-susunan-matkul?prodi=${PRODI}`; 
    const API_CPMK = `${API_BASE}/get-master-cpmk?prodi=${PRODI}`;
    const API_MAPPING = `${API_BASE}/get-mapping-mk?prodi=${PRODI}`;
    const API_SAVE_MAPPING = `${API_BASE}/admin-map-mk-cpmk`;

    let listCPMK = [];

    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace("/login/login.html");

    window.onload = () => { setTimeout(initDropdownAndCheckboxes, 400); };

    // --- INISIALISASI DATA ---
    async function initDropdownAndCheckboxes() {
        const selectMk = document.getElementById('selectMk');
        const cpmkContainer = document.getElementById('cpmkContainer');

        try {
            const [resMk, resCpmk] = await Promise.all([
                fetch(API_MATKUL), fetch(API_CPMK)
            ]);

            const dataMk = await resMk.json();
            listCPMK = await resCpmk.json();

            // Isi Dropdown Mata Kuliah
            if (selectMk) {
                selectMk.innerHTML = '<option value="" disabled selected>-- Pilih Mata Kuliah --</option>';
                if (dataMk.length > 0) {
                    dataMk.forEach(mk => {
                        selectMk.innerHTML += `<option value="${mk.kode_mk}">${mk.kode_mk} - ${mk.nama_mk}</option>`;
                    });
                } else {
                    selectMk.innerHTML = '<option value="">Data Mata Kuliah Kosong</option>';
                }
            }

            // Gambar Kotak Checkbox CPMK
            if (cpmkContainer) {
                cpmkContainer.innerHTML = '';
                if (listCPMK.length > 0) {
                    listCPMK.forEach(cpmk => {
                        cpmkContainer.innerHTML += `
                            <label class="cpmk-card">
                                <input type="checkbox" class="cpmk-checkbox" value="${cpmk.kode_cpmk}" disabled>
                                <div class="cpmk-info">
                                    <div class="cpmk-code">${cpmk.kode_cpmk}</div>
                                    <div class="cpmk-desc" title="${cpmk.deskripsi_cpmk || cpmk.deskripsi || ''}">${cpmk.deskripsi_cpmk || cpmk.deskripsi || 'Tidak ada deskripsi.'}</div>
                                </div>
                            </label>
                        `;
                    });
                } else {
                    cpmkContainer.innerHTML = '<div style="color: red; grid-column: 1 / -1; padding: 20px; font-weight:bold; text-align:center;">Data CPMK Kosong. Harap isi data CPMK terlebih dahulu.</div>';
                }
            }

        } catch (error) {
            console.error("Error Fetching Data:", error);
            if (selectMk) selectMk.innerHTML = '<option value="">❌ Gagal terhubung ke API (Cek n8n!)</option>';
            if (cpmkContainer) cpmkContainer.innerHTML = '<div style="color: red; grid-column: 1 / -1; padding:20px; text-align:center; font-weight:bold;">❌ Gagal menarik data dari server. Pastikan n8n menyala!</div>';
        }
    }

    // --- CEK RELASI MK - CPMK ---
    async function fetchExistingMapping() {
        const selectMk = document.getElementById('selectMk');
        const kodeMk = selectMk ? selectMk.value : null;
        const btnSave = document.getElementById('btnSave');
        const checkboxes = document.querySelectorAll('.cpmk-checkbox');

        if (!kodeMk) return;

        checkboxes.forEach(cb => {
            cb.checked = false;
            cb.disabled = false; 
        });

        if (btnSave) {
            btnSave.disabled = true;
            btnSave.innerHTML = '<i class="fas fa-spinner fa-spin fa-lg" style="margin-right: 10px;"></i> Memeriksa Relasi...';
        }

        try {
            const res = await fetch(`${API_MAPPING}&mk=${kodeMk}`);
            const relations = await res.json();

            let listRelasi = [];
            if (Array.isArray(relations)) {
                listRelasi = relations;
            } else if (relations && typeof relations === 'object') {
                listRelasi = [relations];
            }

            // Cocokkan data secara programatik
            checkboxes.forEach(cb => {
                const apakahCocok = listRelasi.some(rel => {
                    const dbKodeCpmk = rel.kode_cpmk || rel.KODE_CPMK || rel.kodeCpmk;
                    if (!dbKodeCpmk) return false;
                    return cb.value.trim().toLowerCase() === dbKodeCpmk.toString().trim().toLowerCase();
                });
                
                if (apakahCocok) cb.checked = true;
            });

        } catch (error) {
            console.error("Gagal menarik relasi:", error);
        } finally {
            if (btnSave) {
                btnSave.disabled = false;
                btnSave.innerHTML = '<i class="fas fa-save" style="font-size: 1.2rem;"></i> Simpan Relasi Pemetaan';
            }
        }
    }

    // --- SIMPAN RELASI ---
    async function saveMapping() {
        const kodeMk = document.getElementById('selectMk').value;
        const btnSave = document.getElementById('btnSave');
        
        if (!kodeMk) { alert("Silakan pilih Mata Kuliah terlebih dahulu!"); return; }

        const checkedBoxes = Array.from(document.querySelectorAll('.cpmk-checkbox:checked')).map(cb => cb.value);

        btnSave.innerHTML = '<i class="fas fa-spinner fa-spin fa-lg" style="margin-right: 10px;"></i> Menyimpan Relasi...';
        btnSave.disabled = true;

        try {
            const payload = {
                kode_mk: kodeMk,
                prodi: PRODI,
                cpmk_list: checkedBoxes
            };

            const res = await fetch(API_SAVE_MAPPING, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert("✅ Relasi MK & CPMK berhasil disimpan!");
            } else {
                alert("❌ Gagal menyimpan data di server.");
            }
        } catch (error) {
            alert("❌ Terjadi kesalahan jaringan. Gagal menyimpan.");
        } finally {
            btnSave.innerHTML = '<i class="fas fa-save" style="font-size: 1.2rem;"></i> Simpan Relasi Pemetaan';
            btnSave.disabled = false;
        }
    }
</script>
</body>
</html>
