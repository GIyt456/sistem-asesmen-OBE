<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemetaan CPL - BK - Sistem OBE</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../../../css/global_si.css?v=2">
    <link rel="stylesheet" href="../../../css/admin_si.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../../../js/api_config.js"></script>
    <link rel="stylesheet" href="pemetaan_cpl_bk.css">
</head>

<body>

    <nav class="navbar-mobile">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <img src="/gambar/LogoUnaki.png" alt="Logo Universitas AKI"
                style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;"
                onclick="window.location.href='/index.html'">
        </div>
        <div class="profile-btn-mobile" onclick="toggleSidebar()"><img id="mobileNavbarAvatar" src=""
                alt="Profil Kaprodi"></div>
    </nav>

    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>
    <div id="sidebar-container"></div>
    <div id="navbar-container"></div>
    <div class="main-content">
        <div class="fixed-header">
            <div class="header-container">
                <div class="header-title-area">
                    <div class="header-subtitle">PEMETAAN (MAPPING)</div>
                    <h1 class="header-title">MATRIKS <span>CPL - BK</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <p style="color: #64748b; font-size: 0.95rem; margin: 0;">Centang Bahan Kajian (BK) yang berelasi dengan
                    Capaian Pembelajaran Lulusan (CPL).</p>
            </div>

        </div>

        <div class="scrollable-content">
            <div style="margin-bottom: 20px;">
                <label for="filterKurikulum"><strong>Tampilkan Data Kurikulum:</strong></label>
                <select id="filterKurikulum" onchange="loadData()">
                    <option value="">Memuat data...</option>
                </select>
            </div>
            <div
                style="overflow-x: auto; max-height: 550px; border: 1px solid var(--border-color); border-radius: 8px; background: white;">
                <table id="matriksTable">
                    <thead>
                        <tr id="headerRow">
                            <th>CPL / BK</th>
                        </tr>
                    </thead>
                    <tbody id="bodyMatriks">
                        <tr>
                            <td style="text-align: center; padding: 30px;">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <button id="btnSave" class="btn-save" style="margin-top: 25px;" onclick="simpanMapping()" disabled>
                <i class="fas fa-save"></i> Simpan Matriks
            </button>
        </div>
    </div>

    <script src="../../../js/template.js?v=2"></script>

    <script>
        const PRODI = localStorage.getItem("prodi_aktif") || "si";
        const API_SAVE_MAPPING = `${API_BASE}/admin-map-cpl-bk`;
        const userLogin = localStorage.getItem("user_login");
        if (!userLogin) window.location.replace("/login/login.html");

        let listCPL = [];
        let listBK = [];

        async function loadDropdownKurikulum() {
            try {
                const response = await fetch(`${API_BASE}/get-kurikulum-tersedia`);
                const data = await response.json();
                const selectKurikulum = document.getElementById('filterKurikulum');
                selectKurikulum.innerHTML = '';
                data.forEach(item => {
                    let opt = document.createElement('option');
                    opt.value = item.kurikulum;
                    opt.text = "Kurikulum 20" + item.kurikulum;
                    selectKurikulum.appendChild(opt);
                });
                await loadData();
            } catch (error) {
                console.error("Gagal memuat list kurikulum:", error);
                document.getElementById('filterKurikulum').innerHTML = '<option value="">Gagal memuat kurikulum</option>';
            }
        }

        async function loadData() {
            const btnSave = document.getElementById("btnSave");
            const tbody = document.getElementById("bodyMatriks");
            if (btnSave) btnSave.disabled = true;

            const selectKurikulum = document.getElementById('filterKurikulum');
            let kurikulum = selectKurikulum ? selectKurikulum.value : "";
            let URL_CPL = `${API_BASE}/get-master-cpl?prodi=${PRODI}`;
            let URL_BK = `${API_BASE}/get-master-bk?prodi=${PRODI}`;
            let URL_RELASI = `${API_BASE}/get-mapping-cpl-bk?prodi=${PRODI}`;

            if (kurikulum) {
                URL_CPL += `&kurikulum=${kurikulum}`;
                URL_BK += `&kurikulum=${kurikulum}`;
                URL_RELASI += `&kurikulum=${kurikulum}`;
            }

            try {
                const [resCpl, resBk, resRelasi] = await Promise.all([
                    fetch(URL_CPL), fetch(URL_BK), fetch(URL_RELASI)
                ]);

                listCPL = await resCpl.json();
                listBK = await resBk.json();

                let relasiExisting = [];
                try {
                    relasiExisting = await resRelasi.json();
                    if (!Array.isArray(relasiExisting)) relasiExisting = [];
                } catch (e) { relasiExisting = []; }

                if (!listCPL || listCPL.length === 0 || !listBK || listBK.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='100%' style='padding: 30px; color: red; font-weight: bold;'>Data CPL atau BK masih KOSONG untuk kurikulum ini.</td></tr>";
                    return;
                }

                renderMatriks(relasiExisting);
                if (btnSave) btnSave.disabled = false;

            } catch (error) {
                tbody.innerHTML = "<tr><td colspan='100%' style='padding: 30px; color: red;'>Gagal terhubung ke API.</td></tr>";
            }
        }

        function renderMatriks(relasiExisting) {
            const headerRow = document.getElementById("headerRow");
            const tbody = document.getElementById("bodyMatriks");
            if (!headerRow || !tbody) return;

            let headerHTML = `
            <th style="position: sticky; left: 0; background: #e2e8f0; z-index: 10; width: 40px; text-align: center;">No</th>
            <th style="position: sticky; left: 40px; background: #e2e8f0; z-index: 10; white-space: nowrap; text-align: left;">Kode BK</th>
            <th style="position: sticky; left: 120px; background: #e2e8f0; z-index: 10; min-width: 250px; text-align: left;">Bahan Kajian</th>
        `;

            listCPL.forEach(cpl => {
                headerHTML += `<th title="${cpl.deskripsi || ''}" style="text-align: center;">${cpl.kode_cpl}</th>`;
            });
            headerRow.innerHTML = headerHTML;

            tbody.innerHTML = "";
            listBK.forEach((bk, index) => {
                let tr = `<tr class="bk-row">
                <td style="position: sticky; left: 0; background: #f8fafc; z-index: 5; text-align: center;">${index + 1}</td>
                <td style="position: sticky; left: 40px; background: #f8fafc; z-index: 5; font-weight: bold; white-space: nowrap;">${bk.kode_bk}</td>
                <td style="position: sticky; left: 120px; background: #f8fafc; z-index: 5; text-align: left;" title="${bk.nama_bk}">${bk.nama_bk}</td>`;

                listCPL.forEach(cpl => {
                    const isChecked = relasiExisting.some(r => r.kode_cpl === cpl.kode_cpl && r.kode_bk === bk.kode_bk);
                    const chk = isChecked ? 'checked' : '';
                    tr += `<td style="text-align: center;"><input type="checkbox" class="chk-matrix" data-cpl="${cpl.kode_cpl}" data-bk="${bk.kode_bk}" ${chk}></td>`;
                });
                tr += `</tr>`;
                tbody.innerHTML += tr;
            });
        }

        async function simpanMapping() {
            const btnSave = document.getElementById('btnSave');
            btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
            btnSave.disabled = true;

            // 1. Tangkap Kurikulum yang sedang diedit Kaprodi
            const selectKurikulum = document.getElementById('filterKurikulum');
            let kurikulumTerpilih = selectKurikulum ? selectKurikulum.value : "25"; // default 25

            let fetchPromises = [];

            listCPL.forEach(cpl => {
                const checkedBoxes = document.querySelectorAll(`.chk-matrix[data-cpl="${cpl.kode_cpl}"]:checked`);
                const bkList = Array.from(checkedBoxes).map(cb => cb.getAttribute('data-bk'));

                // 2. Tambahkan kurikulumTerpilih ke dalam payload
                const payload = {
                    kode_cpl: cpl.kode_cpl,
                    bk_list: bkList,
                    prodi: PRODI,
                    kurikulum: kurikulumTerpilih
                };

                const request = fetch(API_SAVE_MAPPING, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                fetchPromises.push(request);
            });

            try {
                await Promise.all(fetchPromises);
                alert("✅ Matriks Relasi CPL - BK berhasil disimpan!");
            } catch (error) { alert("❌ Gagal menyimpan beberapa data ke server."); }
            finally { btnSave.innerHTML = '<i class="fas fa-save"></i> Simpan Matriks'; btnSave.disabled = false; }
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById("sidebar-container");
            if (sidebar) sidebar.classList.toggle("show-mobile");
        }

        window.onload = async () => { await loadDropdownKurikulum(); };
    </script>
</body>

</html>
