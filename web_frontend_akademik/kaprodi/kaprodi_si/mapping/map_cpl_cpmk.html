<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapping CPL - CPMK - Sistem OBE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS RELATIF SESUAI FOLDER LOKAL -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin_si.css">
    <link rel="stylesheet" href="/css/index_mobile.css">
    
    <script src="/js/api_config.js"></script>
    <script src="/js/template.js"></script>
    
    <style>
        /* MANTRA ANTI-BOCOR LAYAR GLOBAL */
        *, *::before, *::after { box-sizing: border-box !important; }
        html, body { max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0; }
        body, input, select, button, textarea { font-family: 'Inter', sans-serif !important; }

        .fixed-header { padding-top: 15px !important; }
        .main-content { padding-top: 0 !important; }

        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;}
        .header-title { font-size: 2.2rem; font-weight: 800; color: #111827; margin: 0;}
        .header-subtitle { font-size: 0.85rem; font-weight: 700; color: #64748b; letter-spacing: 1px; margin-bottom: 5px;}

        /* KONTROL TABEL DESKTOP */
        .table-action-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;}
        .table-action-header > div:first-child { flex: 1; min-width: 250px;}
        
        .mapping-panel { background: white; border: 1px solid var(--border-color); border-radius: 12px; padding: 30px 40px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); margin-bottom: 40px;}
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; font-weight: 800; margin-bottom: 15px; font-size: 1.1rem; color: #1e293b; }
        
        .select-custom { width: 100%; padding: 15px 20px; border-radius: 10px; border: 2px solid #cbd5e1; font-size: 1rem; font-weight: 600; outline: none; background: #f8fafc; cursor: pointer; color: #334155; transition: 0.2s;}
        .select-custom:focus { border-color: var(--primary-blue); background: white; box-shadow: 0 0 0 3px rgba(30,58,138, 0.1);}

        .cpmk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 15px; }
        .cpmk-card { border: 2px solid #e2e8f0; padding: 20px; border-radius: 12px; display: flex; align-items: flex-start; gap: 15px; cursor: pointer; transition: 0.2s; background: white; }
        .cpmk-card:hover { border-color: var(--primary-blue); background: #f0f9ff; transform: translateY(-3px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        
        .cpmk-card input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; margin-top: 2px; accent-color: var(--primary-blue); flex-shrink: 0;}
        .cpmk-info { display: flex; flex-direction: column; }
        .cpmk-code { font-weight: 900; font-size: 1.1rem; color: var(--primary-blue); margin-bottom: 6px;}
        .cpmk-desc { font-size: 0.85rem; color: #475569; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; font-weight: 500;}

        .btn-primary-si { background: var(--primary-blue); color: white; border: none; padding: 15px 24px; border-radius: 8px; font-weight: 700; font-size: 1.05rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; white-space: nowrap; width: 100%; margin-top: 20px;}
        .btn-primary-si:hover:not(:disabled) { filter: brightness(0.85); transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-primary-si:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

        /* =========================================
           📱 CSS KHUSUS HP (ANTI MEPET & BOCOR)
           ========================================= */
        @media screen and (max-width: 768px) {
            html, body { overflow-x: hidden !important; width: 100% !important; max-width: 100% !important; margin: 0; padding: 0;}
            .main-content { overflow-x: hidden !important; width: 100% !important; padding-top: 15px !important;}
            
            .header-master { margin: 15px 0 10px 0 !important; flex-direction: column !important; align-items: flex-start !important; gap: 15px; padding-bottom: 0 !important; border-bottom: none !important;}
            .section-master { padding: 0 15px 40px 15px !important; width: 100% !important; box-sizing: border-box !important;}
            
            .mapping-panel { padding: 20px 15px !important; border: none !important; box-shadow: none !important; background: transparent !important; margin-bottom: 0 !important; }
            .select-custom { padding: 12px 15px !important; font-size: 0.95rem !important; }
            
            .cpmk-grid { grid-template-columns: 1fr; gap: 15px; }
            .cpmk-card { padding: 15px !important; align-items: center !important; }
            .cpmk-desc { -webkit-line-clamp: unset !important; overflow: visible !important;} /* Di HP biarkan teks utuh terbaca semua */
        }
    </style>
</head>
<body>

    <!-- NAVBAR KHUSUS MOBILE -->
    <nav class="navbar-mobile">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <img src="/gambar/LogoUnaki.png" alt="Logo Universitas AKI" 
                 style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;" 
                 onclick="window.location.href='/index.html'">
        </div>
        <div class="profile-btn-mobile" onclick="toggleSidebar()">
            <img id="mobileNavbarAvatar" src="" alt="Profil Kaprodi">
        </div>
    </nav>

    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <div id="navbar-container"></div>

        <div class="fixed-header">
            <div class="header-container header-master" style="margin: 0 0 15px 0; border-bottom: none; padding-bottom: 0;">
                <div class="header-title-area">
                    <div class="header-subtitle" style="margin-bottom: 5px;">PEMETAAN (MAPPING)</div>
                    <h1 class="header-title">MAPPING <span>CPL - CPMK</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge" style="margin-top: 10px; display: inline-block; width: fit-content; background: var(--primary-blue); color: white; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 0.85rem;">PRODI</div>
            </div>
            <div style="border-bottom: 1px solid var(--border-color); margin: 0 0 20px 0;" class="header-master"></div>
        </div>

        <div class="scrollable-content section-master" style="padding-top: 0; padding-bottom: 40px;">
            
            <div class="table-action-header" style="margin-bottom: 10px;">
                <div>
                    <h3 style="margin: 0; font-size: 1.2rem; font-weight: 800; color: #1e293b;">Relasi Antar Matriks</h3>
                    <p style="margin: 4px 0 0 0; color: #64748b; font-size: 0.9rem;">Centang Capaian Pembelajaran Mata Kuliah (CPMK) yang mendukung Capaian Pembelajaran Lulusan (CPL).</p>
                </div>
            </div>

            <div class="mapping-panel">
                <div class="form-group">
                    <label for="selectCpl">
                        <i class="fas fa-graduation-cap dynamic-icon" style="margin-right: 10px;"></i> Pilih CPL Tujuan
                    </label>
                    <select id="selectCpl" class="select-custom" onchange="checkExistingMapping()">
                        <option value="">-- Memuat daftar CPL... --</option>
                    </select>
                </div>

                <hr style="border: 0; border-top: 2px dashed #cbd5e1; margin: 30px 0;">

                <div class="form-group">
                    <label>
                        <i class="fas fa-list-check dynamic-icon" style="margin-right: 10px;"></i> CPMK yang Mendukung CPL Ini
                    </label>
                    <p style="font-size: 0.9rem; color: #64748b; font-weight: 500; margin-bottom: 20px; line-height: 1.5;">Pilih CPL di atas terlebih dahulu, kemudian centang kotak-kotak CPMK di bawah ini untuk menghubungkannya.</p>
                    
                    <div id="cpmkContainer" class="cpmk-grid">
                        <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #64748b; font-weight: 600; border: 2px dashed #e2e8f0; border-radius: 12px;">
                            <i class="fas fa-spinner fa-spin fa-2x" style="margin-bottom: 15px; color: var(--primary-blue);"></i><br>
                            Memuat daftar CPMK...
                        </div>
                    </div>
                </div>

                <button id="btnSave" class="btn-primary-si" onclick="saveMapping()" disabled>
                    <i class="fas fa-save" style="font-size: 1.2rem;"></i> Simpan Relasi Pemetaan
                </button>
            </div>
        </div>
    </div>

<script>
    // --- SETUP TEMA & WARNA DINAMIS BERDASARKAN PRODI ---
    const PRODI = localStorage.getItem("prodi_aktif") || "si"; 
    
    document.addEventListener("DOMContentLoaded", () => {
        const dynamicIcons = document.querySelectorAll('.dynamic-icon');
        const badge = document.getElementById("prodiBadge");
        
        if(PRODI === "ti") {
            document.documentElement.style.setProperty('--primary-blue', '#8b0000'); 
            badge.innerText = "Teknik Informatika";
            dynamicIcons.forEach(icon => icon.style.color = '#8b0000');
        } else {
            document.documentElement.style.setProperty('--primary-blue', '#1e3a8a'); 
            badge.innerText = "Sistem Informasi";
            dynamicIcons.forEach(icon => icon.style.color = '#1e3a8a');
        }

        const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
        const avatarMobile = document.getElementById("mobileNavbarAvatar");
        if(avatarMobile) {
            const avatarColor = PRODI === "si" ? "1e3a8a" : "8b0000";
            avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=${avatarColor}&color=fff&bold=true`;
        }
    });

    // --- FUNGSI SIDEBAR MOBILE ---
    function toggleSidebar() {
        document.getElementById('sidebar-container').classList.toggle('active');
        document.getElementById('mobileOverlay').classList.toggle('active');
    }

    // ==========================================================
    // 🔮 SIHIR ANTI-MACET DROPDOWN (GLOBAL EVENT DELEGATION)
    // ==========================================================
    document.addEventListener('click', function(e) {
        const dropdownBtn = e.target.closest('.dropdown-btn') || e.target.closest('[data-toggle="dropdown"]');
        if (dropdownBtn) {
            e.preventDefault(); 
            const dropdownContent = dropdownBtn.nextElementSibling;
            const icon = dropdownBtn.querySelector('.fa-chevron-down') || dropdownBtn.querySelector('i:last-child');
            
            if (dropdownContent && (dropdownContent.classList.contains('dropdown-container') || dropdownContent.tagName === 'DIV' || dropdownContent.tagName === 'UL')) {
                const isHidden = window.getComputedStyle(dropdownContent).display === 'none';
                
                if (isHidden) {
                    dropdownContent.style.display = 'block';
                    dropdownBtn.classList.add('active');
                    if (icon) icon.style.transform = 'rotate(180deg)';
                } else {
                    dropdownContent.style.display = 'none';
                    dropdownBtn.classList.remove('active');
                    if (icon) icon.style.transform = 'rotate(0deg)';
                }
            }
        }
    });

    function setMenuAktif() {
        const navDashboard = document.getElementById('nav-home');
        let navMapping = document.querySelector('[data-path="/mapping/map_cpl_cpmk_si.html"]') || document.querySelector('[data-path="/mapping/map_cpl_cpmk.html"]');
        
        if (navDashboard) navDashboard.classList.remove('active');
        if (navMapping) navMapping.classList.add('active');

        const menuMaster = document.getElementById('menu-mapping') || (navMapping ? navMapping.closest('.dropdown-container') : null);
        
        if (menuMaster) {
            menuMaster.style.display = 'block';
            const parentBtn = menuMaster.previousElementSibling;
            if(parentBtn && parentBtn.classList.contains('dropdown-btn')) {
                parentBtn.classList.add('active');
                const icon = parentBtn.querySelector('.fa-chevron-down') || parentBtn.querySelector('i:last-child');
                if(icon) icon.style.transform = 'rotate(180deg)';
            }
        }
    }
    
    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
            const sidebar = document.getElementById('sidebar-container');
            if (sidebar && !sidebar.innerHTML.includes('sidebar-profile')) {
                fetch(`/kaprodi/kaprodi_${PRODI}/sidebar.html`)
                    .then(res => res.text())
                    .then(html => {
                        sidebar.innerHTML = html;
                        if(typeof initSmartSidebar === 'function') initSmartSidebar();
                        setMenuAktif();
                    })
                    .catch(e => console.log('Gagal memuat sidebar otomatis'));
            } else {
                setMenuAktif();
            }
        }, 400); 
    });

    // --- PENGATURAN API ---
    const API_CPL = `${API_BASE}/get-master-cpl?prodi=${PRODI}`;
    const API_CPMK = `${API_BASE}/get-master-cpmk?prodi=${PRODI}`;
    const API_UPDATE = `${API_BASE}/admin-update-master`;

    let listCPMK = [];

    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace("/login/login.html");

    window.onload = () => { setTimeout(initData, 400); };

    async function initData() {
        const selectCpl = document.getElementById('selectCpl');
        const cpmkContainer = document.getElementById('cpmkContainer');

        try {
            const [resCpl, resCpmk] = await Promise.all([
                fetch(API_CPL), fetch(API_CPMK)
            ]);

            const dataCpl = await resCpl.json();
            listCPMK = await resCpmk.json();

            if (selectCpl) {
                selectCpl.innerHTML = '<option value="" disabled selected>-- Silakan Pilih CPL yang Tersedia --</option>';
                if (dataCpl.length > 0) {
                    dataCpl.forEach(cpl => {
                        const desc = cpl.deskripsi || '';
                        const shortDesc = desc.length > 80 ? desc.substring(0, 80) + '...' : desc;
                        selectCpl.innerHTML += `<option value="${cpl.kode_cpl}">${cpl.kode_cpl} - ${shortDesc}</option>`;
                    });
                } else {
                    selectCpl.innerHTML = '<option value="">Data CPL Kosong. Harap isi data CPL terlebih dahulu.</option>';
                }
            }

            if (cpmkContainer) {
                cpmkContainer.innerHTML = '';
                if (listCPMK.length > 0) {
                    listCPMK.forEach(cpmk => {
                        const parentInfo = cpmk.kode_cpl_ref || cpmk.parent || cpmk.kode_cpl || '';
                        
                        cpmkContainer.innerHTML += `
                            <label class="cpmk-card">
                                <input type="checkbox" class="cpmk-checkbox" value="${cpmk.kode_cpmk}" data-parent="${parentInfo}" disabled>
                                <div class="cpmk-info">
                                    <div class="cpmk-code">${cpmk.kode_cpmk}</div>
                                    <div class="cpmk-desc" title="${cpmk.deskripsi_cpmk || cpmk.deskripsi || ''}">${cpmk.deskripsi_cpmk || cpmk.deskripsi || 'Tidak ada deskripsi.'}</div>
                                </div>
                            </label>
                        `;
                    });
                } else {
                    cpmkContainer.innerHTML = '<div style="color: #ef4444; grid-column: 1 / -1; padding: 40px; font-weight:bold; text-align:center; border: 2px dashed #e2e8f0; border-radius: 12px;"><i class="fas fa-exclamation-triangle fa-2x" style="display: block; margin-bottom: 10px;"></i> Data CPMK Kosong. Harap isi data CPMK terlebih dahulu.</div>';
                }
            }

        } catch (error) {
            if(selectCpl) selectCpl.innerHTML = '<option value="">❌ Gagal terhubung ke API (Cek N8N!)</option>';
            if(cpmkContainer) cpmkContainer.innerHTML = '<div style="color: #ef4444; grid-column: 1 / -1; padding: 40px; text-align:center; font-weight:bold; border: 2px dashed #e2e8f0; border-radius: 12px;"><i class="fas fa-wifi fa-2x" style="display: block; margin-bottom: 10px;"></i> Gagal menarik data dari server. Pastikan N8N menyala!</div>';
        } 
    }

    function checkExistingMapping() {
        const cplId = document.getElementById('selectCpl').value;
        const btnSave = document.getElementById('btnSave');
        const checkboxes = document.querySelectorAll('.cpmk-checkbox');

        if (!cplId) return;

        checkboxes.forEach(cb => {
            cb.checked = false;
            cb.disabled = false; 
            
            const parentCpmk = cb.getAttribute('data-parent');
            if (parentCpmk && parentCpmk.trim().toLowerCase() === cplId.trim().toLowerCase()) {
                cb.checked = true;
            }
        });

        if (btnSave) btnSave.disabled = false;
    }

    async function saveMapping() {
        const cplId = document.getElementById('selectCpl').value;
        const btnSave = document.getElementById('btnSave');
        const selectedCpmk = Array.from(document.querySelectorAll('.cpmk-checkbox:checked')).map(cb => cb.value);

        if (!cplId) { alert("Silakan pilih CPL terlebih dahulu!"); return; }

        btnSave.disabled = true;
        btnSave.innerHTML = '<i class="fas fa-spinner fa-spin fa-lg" style="margin-right: 10px;"></i> Sedang Menyimpan Relasi...';

        try {
            let fetchPromises = [];
            for (const cpmkId of selectedCpmk) {
                const req = fetch(API_UPDATE, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipe: 'mapping', kode: cpmkId, value: cplId, prodi: PRODI })
                });
                fetchPromises.push(req);
            }
            
            await Promise.all(fetchPromises);
            alert("✅ Pemetaan CPL - CPMK Berhasil Disimpan!");
            initData(); 
            
        } catch (e) { alert("❌ Terjadi kesalahan jaringan. Gagal menyimpan."); } 
        finally { 
            btnSave.disabled = false; 
            btnSave.innerHTML = '<i class="fas fa-save" style="font-size: 1.2rem; margin-right: 5px;"></i> Simpan Relasi Pemetaan';
        }
    }
</script>
</body>
</html>
