<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluasi CPL Angkatan - Sistem OBE</title>
    
    <link rel="stylesheet" href="/css/style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .filter-container { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e5e7eb; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; gap: 15px; align-items: center; justify-content: space-between; }
        .table-responsive { overflow-x: auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; margin-bottom: 40px;}
        .table-eval { width: 100%; border-collapse: collapse; min-width: 1000px; }
        .table-eval th, .table-eval td { padding: 15px 12px; border-bottom: 1px solid #e5e7eb; text-align: center; vertical-align: middle; }
        .table-eval th { background: #111827; color: white; font-weight: 700; text-transform: uppercase; font-size: 0.85rem; position: sticky; top: 0; z-index: 2; }
        .text-left { text-align: left !important; }
        
        /* Styling Progress Bar & Badge */
        .progress-bar-container { width: 100%; background-color: #e2e8f0; border-radius: 999px; height: 10px; margin-bottom: 6px; overflow: hidden; }
        .progress-bar { height: 100%; border-radius: 999px; transition: width 0.5s ease; }
        .bg-success { background-color: #10b981; }
        .bg-warning { background-color: #f59e0b; }
        .bg-danger { background-color: #ef4444; }
        
        .badge-status { padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 6px; }
        .badge-status.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .badge-status.warning { background: #fef08a; color: #854d0e; border: 1px solid #fde047; }
        .badge-status.danger { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        
        body { animation: transitionIn 0.3s ease-in-out; }
        @keyframes transitionIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        @media print {
            #sidebar-container, #navbar-container, .filter-container, .header-container { display: none !important; }
            .main-content { padding: 0 !important; }
            .table-responsive { box-shadow: none; border: none; padding: 0; }
        }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>
    
    <div class="main-content">
        <div id="navbar-container"></div>

        <div class="content-wrapper">
            <div class="header-container" style="margin-bottom: 20px;">
                <div class="header-title-area">
                    <div class="header-subtitle">EVALUASI & RPS</div>
                    <h1 class="header-title">EVALUASI <span>CPL ANGKATAN</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <p style="margin: 0 0 20px 0; color: #64748b; font-size: 0.95rem;">Potret makro pencapaian profil lulusan program studi berdasarkan akumulasi seluruh mata kuliah.</p>

            <div class="filter-container">
                <div style="display: flex; gap: 15px; align-items: center;">
                    <label style="font-weight: 700; color: #1e293b;"><i class="fas fa-users"></i> Angkatan:</label>
                    <select id="selectAngkatan" class="form-control" style="width: 180px; font-weight: 500;">
                        <option value="2023">Angkatan 2023</option>
                        <option value="2022">Angkatan 2022</option>
                        <option value="2021">Angkatan 2021</option>
                    </select>
                    
                    <label style="font-weight: 700; margin-left: 10px; color: #1e293b;"><i class="fas fa-sliders-h"></i> Standar Lulus CPL:</label>
                    <input type="number" id="standarLulus" class="form-control" value="60" style="width: 90px; text-align: center; font-weight: bold;">
                    
                    <button class="btn-dark" style="padding: 12px 20px; border: none; font-size: 0.95rem;" onclick="loadEvalCPL()">
                        <i class="fas fa-search-chart"></i> Analisis CPL
                    </button>
                </div>

                <button class="btn-action" style="background: #10b981; color: white; padding: 12px 20px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer;" onclick="window.print()">
                    <i class="fas fa-print"></i> Cetak Laporan
                </button>
            </div>

            <div class="table-responsive">
                <table class="table-eval">
                    <thead>
                        <tr>
                            <th width="5%">NO</th>
                            <th width="15%" class="text-left">KODE CPL</th>
                            <th width="15%">JUMLAH MHS</th>
                            <th width="15%">RATA-RATA KETERAIHAN</th>
                            <th width="30%">PERSENTASE KELULUSAN (LULUS vs GAGAL)</th>
                            <th width="20%">STATUS CPL</th>
                        </tr>
                    </thead>
                    <tbody id="bodyTable">
                        <tr><td colspan="6" style="padding: 40px; color: #64748b; text-align: center;"><i class="fas fa-info-circle"></i> Silakan pilih angkatan dan klik "Analisis CPL".</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/template.js"></script>

    <script>
        // DETEKSI PRODI DINAMIS
        const PRODI = localStorage.getItem("prodi_aktif") || "si"; 
        
        // PENTING: Ganti URL di bawah dengan link Cloudflare Tunnel n8n Anda!
        const API_BASE = "https://principal-sorted-pharmacies-wine.trycloudflare.com/webhook"; 
        const API_EVAL_CPL = `${API_BASE}/get-eval-cpl`;

        // SATPAM HALAMAN
        const userLogin = localStorage.getItem("user_login");
        if (!userLogin) window.location.replace("/login/login.html");

        // Tema Dinamis
        let warnaTeksCpl = '#8b0000'; // Default Merah TI

        document.addEventListener("DOMContentLoaded", () => {
            const badge = document.getElementById("prodiBadge");
            if(badge) badge.innerText = PRODI === "si" ? "Sistem Informasi" : "Teknik Informatika";
            
            if(PRODI === "si") {
                badge.style.background = "var(--primary-teal)";
                document.querySelector('.header-title span').style.color = "var(--primary-teal)";
                warnaTeksCpl = 'var(--primary-teal)';
            }
        });

        // FUNGSI EVALUASI CPL
        async function loadEvalCPL() {
            const angkatan = document.getElementById("selectAngkatan").value;
            const standar = parseFloat(document.getElementById("standarLulus").value) || 60;
            const bodyTbl = document.getElementById("bodyTable");
            
            bodyTbl.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 40px; color: #64748b;"><i class="fas fa-spinner fa-spin" style="font-size: 1.5rem; display: block; margin-bottom: 10px;"></i> Mengekstrak dan menghitung data agregat CPL dari Server...</td></tr>`;

            try {
                // MENGIRIM PARAMETER PRODI AGAR DATA TIDAK BENTROK
                const res = await fetch(`${API_EVAL_CPL}?angkatan=${angkatan}&prodi=${PRODI}`);
                if(!res.ok) throw new Error("Gagal mengambil data");
                const data = await res.json();

                if(!data || data.length === 0 || !data[0].kode_cpl) {
                    bodyTbl.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red; padding: 30px;"><i class="fas fa-exclamation-circle"></i> Belum ada data nilai/CPL untuk Angkatan ${angkatan} di prodi ini.</td></tr>`;
                    return;
                }

                // 1. Grouping data mentah mhs menjadi per CPL
                let evalData = {}; 
                data.forEach(item => {
                    let key = item.kode_cpl;
                    if (!evalData[key]) {
                        evalData[key] = { kode_cpl: key, list_nilai: [] };
                    }
                    if (item.total_bobot_cpl > 0) {
                        // Hitung nilai akhir CPL per mahasiswa (skala 100)
                        let skorMhs = (item.total_nilai_tertimbang / item.total_bobot_cpl) * 100;
                        evalData[key].list_nilai.push(skorMhs);
                    }
                });

                // 2. Render ke Tabel
                bodyTbl.innerHTML = "";
                let no = 1;

                // Sortir CPL (CPL01, CPL02, dst)
                let sortedKeys = Object.keys(evalData).sort();

                sortedKeys.forEach(key => {
                    let row = evalData[key];
                    let totalMhs = row.list_nilai.length;
                    
                    if(totalMhs === 0) return; // Mencegah NaN jika kelas kosong

                    // Hitung Rata-Rata Angkatan
                    let totalNilai = row.list_nilai.reduce((a, b) => a + b, 0);
                    let rataRata = (totalNilai / totalMhs).toFixed(2);
                    
                    // Hitung Persentase Kelulusan
                    let lulusCount = row.list_nilai.filter(n => n >= standar).length;
                    let persenLulus = ((lulusCount / totalMhs) * 100).toFixed(1);

                    // Penentuan Warna & Status
                    let barColor = persenLulus >= 70 ? 'bg-success' : (persenLulus >= 50 ? 'bg-warning' : 'bg-danger');
                    let rataColor = rataRata >= standar ? '#166534' : '#991b1b';
                    
                    let statusBadge = rataRata >= standar 
                        ? `<span class="badge-status success"><i class="fas fa-check-circle"></i> Memenuhi Target</span>`
                        : `<span class="badge-status danger"><i class="fas fa-exclamation-triangle"></i> Tindakan Korektif Diperlukan</span>`;

                    bodyTbl.innerHTML += `
                        <tr>
                            <td style="font-weight: bold; color: #475569;">${no++}</td>
                            <td class="text-left" style="font-weight: 800; color: ${warnaTeksCpl}; font-size: 1.15rem;">${row.kode_cpl}</td>
                            <td style="font-weight: 500; color: #4b5563;">${totalMhs} Mhs</td>
                            <td style="font-size: 1.2rem; font-weight: 800; color: ${rataColor};">${rataRata}</td>
                            <td>
                                <div class="progress-bar-container">
                                    <div class="progress-bar ${barColor}" style="width: ${persenLulus}%;"></div>
                                </div>
                                <span style="font-size: 0.85rem; font-weight: 600; color: #475569;">${persenLulus}% Mhs Lulus (≥ ${standar})</span>
                            </td>
                            <td>${statusBadge}</td>
                        </tr>
                    `;
                });

            } catch (e) {
                bodyTbl.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red; padding: 30px;"><i class="fas fa-exclamation-triangle"></i> Error: Gagal terhubung ke N8N. Pastikan webhook aktif.</td></tr>`;
            }
        }

        window.onload = () => {
            setTimeout(loadEvalCPL, 400); // Otomatis kalkulasi saat halaman dibuka
        };
    </script>
</body>
</html>
