<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemenuhan CPL per Angkatan - Sistem OBE</title>
    
    <!-- MEMANGGIL FILE CSS EKSTERNAL & ADMIN -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin_si.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="/js/api_config.js"></script>
    <script src="/js/template.js"></script> 
    
    <style>
        /* KONTROL PENCARIAN & FILTER */
        .filter-container { background: white; padding: 15px 20px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; gap: 15px; align-items: center; justify-content: space-between; }
        
        .btn-analisis { background: #1e293b; color: white; padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.95rem; cursor: pointer; font-weight: 700; transition: 0.2s; display: flex; align-items: center; gap: 8px; white-space: nowrap;}
        .btn-analisis:hover { background: #0f172a; transform: translateY(-2px); }
        
        .btn-cetak { background: #10b981; color: white; padding: 10px 20px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; white-space: nowrap;}
        .btn-cetak:hover { background: #059669; transform: translateY(-2px); }

        /* =========================================
           ✨ BEAUTIFY MATRIKS DESKTOP (ANTI-CACHE) ✨
           ========================================= */
        @media screen and (min-width: 769px) {
            .table-responsive { 
                overflow: auto !important; 
                max-height: 55vh !important; 
                border: 1px solid var(--border-color) !important; 
                border-radius: 12px; 
                background: white; 
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); 
                margin-bottom: 0 !important;
            }
            .table-cpl { 
                width: 100%; 
                border-collapse: separate !important; 
                border-spacing: 0 !important; 
                white-space: nowrap !important; 
            }
            .table-cpl th { 
                background: #1e293b !important; 
                color: white !important; 
                font-weight: 700; 
                padding: 15px 15px !important; 
                position: sticky; 
                top: 0; 
                z-index: 10; 
                border-bottom: 2px solid #0f172a !important; 
                border-right: 1px solid #334155 !important; 
                text-align: center; 
                vertical-align: middle; 
                font-size: 0.85rem;
            }
            .table-cpl td { 
                border-bottom: 1px solid var(--border-color) !important; 
                border-right: 1px solid var(--border-color) !important; 
                padding: 12px 15px !important; 
                font-size: 0.9rem; 
                text-align: center; 
                color: #1e293b; 
                background: white; 
                vertical-align: middle;
            }

            /* STICKY KOLOM 1: NO URUT */
            .table-cpl th.sticky-col-1 { position: sticky; left: 0; z-index: 20 !important; background: #0f172a !important; min-width: 50px; max-width: 50px; box-shadow: 2px 0 5px rgba(0,0,0,0.2) !important;}
            .table-cpl td.sticky-col-1 { position: sticky; left: 0; z-index: 5 !important; background: #f8fafc !important; font-weight: 600; border-right: 1px solid #cbd5e1 !important; min-width: 50px; max-width: 50px; box-shadow: 2px 0 5px rgba(0,0,0,0.05) !important;}

            /* STICKY KOLOM 2: NIM & NAMA MAHASISWA */
            .table-cpl th.sticky-col-2 { position: sticky; left: 50px; z-index: 20 !important; background: #0f172a !important; min-width: 250px; box-shadow: 2px 0 5px rgba(0,0,0,0.2) !important;}
            .table-cpl td.sticky-col-2 { position: sticky; left: 50px; z-index: 5 !important; background: #f8fafc !important; border-right: 2px solid #cbd5e1 !important; box-shadow: 2px 0 5px rgba(0,0,0,0.05) !important; text-align: left !important;}

            .table-cpl tbody tr:hover td { background-color: #f0f9ff !important; }
            .table-cpl tbody tr:hover td.sticky-col-1,
            .table-cpl tbody tr:hover td.sticky-col-2 { background-color: #e0f2fe !important; }
        }

        /* =========================================
           📱 KARTU LIPAT UNTUK MOBILE
           ========================================= */
        @media screen and (max-width: 768px) {
            .header-eval-mhs { margin: 15px 20px 10px 20px !important; flex-direction: column !important; align-items: flex-start !important; gap: 15px; padding-bottom: 0 !important; border-bottom: none !important;}
            .section-eval-mhs { padding: 0 20px 20px 20px !important; }
            
            .filter-container { flex-direction: column; align-items: stretch; margin: 0 20px 15px 20px !important; padding: 15px !important;}
            .filter-container > div { flex-direction: column; align-items: stretch !important; width: 100% !important; gap: 10px !important; }
            .filter-container input { width: 100% !important; margin-bottom: 5px; }
            
            /* PERBAIKAN: Tombol Cetak dikembalikan dan disesuaikan lebarnya di HP */
            .btn-analisis, .btn-cetak { width: 100% !important; justify-content: center !important; }
            .btn-cetak { margin-top: 5px; }

            .table-responsive { overflow: visible !important; max-height: none !important; border: none !important; box-shadow: none !important; background: transparent !important; margin-top: 10px !important;}
            .table-cpl, .table-cpl thead, .table-cpl tbody, .table-cpl th, .table-cpl td, .table-cpl tr { display: block !important; width: 100% !important; min-width: 0 !important; max-width: 100% !important; }
            
            .table-cpl thead { display: none !important; }
            .table-cpl tr { background: white !important; border: 1px solid #cbd5e1 !important; border-radius: 12px !important; margin-bottom: 20px !important; box-shadow: 0 4px 6px rgba(0,0,0,0.05) !important; overflow: hidden !important; }
            
            .table-cpl td { position: static !important; box-shadow: none !important; }
            .table-cpl td:nth-child(1) { display: none !important; }
            
            .table-cpl td:nth-child(2) { background: #1f2937 !important; color: #f8fafc !important; padding: 15px 20px !important; text-align: left !important; border: none !important; border-bottom: 4px solid var(--primary-blue) !important;}
            .table-cpl td:nth-child(2) div:first-child { color: #facc15 !important; font-size: 1.1rem !important; } 
            .table-cpl td:nth-child(2) div:last-child { color: white !important; font-size: 1rem !important; margin-top: 5px !important; } 
            
            .table-cpl td:not(:nth-child(1)):not(:nth-child(2)) { display: flex !important; justify-content: space-between !important; align-items: center !important; padding: 12px 20px !important; border: none !important; border-bottom: 1px dashed #cbd5e1 !important; }
            .table-cpl td:last-child { border-bottom: none !important; }
            
            .table-cpl td:not(:nth-child(1)):not(:nth-child(2))::before { content: attr(data-cpl); font-weight: 800; color: #334155; font-size: 0.9rem; }
            .table-cpl td span { margin: 0 !important; width: 65px; text-align: center; }
        }

        @media print {
            #sidebar-container, #navbar-container, .navbar-mobile, .filter-container, .fixed-header { display: none !important; }
            .main-content { padding: 0 !important; margin: 0 !important;}
            .table-responsive { box-shadow: none; border: none; padding: 0; max-height: none !important; overflow: visible !important;}
        }
    </style>
</head>
<body>

    <!-- 1. NAVBAR KHUSUS MOBILE -->
    <nav class="navbar-mobile">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <img src="/gambar/LogoUnaki.png" alt="Logo Universitas AKI" 
                 style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;" 
                 onclick="window.location.href='/index.html'">
        </div>
        <div class="profile-btn-mobile" onclick="toggleSidebar()">
            <img id="mobileNavbarAvatar" src="" alt="Profil Kaprodi">
        </div>
    </nav>

    <!-- 2. OVERLAY GELAP UNTUK LATAR SIDEBAR DI HP -->
    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

    <div id="sidebar-container"></div>

    <div class="main-content" style="padding-top: 20px;">
        <div id="navbar-container"></div>

        <div class="fixed-header">
            <div class="header-container header-eval-mhs" style="margin: 0 50px 15px 50px; border-bottom: none; padding-bottom: 0;">
                <div class="header-title-area">
                    <div class="header-subtitle" style="margin-bottom: 5px;">EVALUASI & RPS</div>
                    <h1 class="header-title" style="font-size: 2rem;">EVALUASI <span>CPL ANGKATAN</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge" style="margin-top: 10px; display: inline-block; width: fit-content;">PRODI</div>
            </div>
            
            <div class="filter-container" style="margin: 0 50px 15px 50px;">
                <div style="display: flex; gap: 15px; align-items: center; width: 100%;">
                    <label style="font-weight: 700; color: #1e293b; white-space: nowrap;"><i class="fas fa-users" style="color: var(--primary-blue); margin-right: 5px;"></i> Angkatan:</label>
                    <input type="number" id="inputAngkatan" placeholder="Contoh: 2025" value="2025" style="padding: 10px 15px; border-radius: 8px; border: 2px solid #cbd5e1; font-weight: 700; outline: none; flex: 1; font-size: 1rem; color: var(--primary-blue);">
                    
                    <button class="btn-analisis" onclick="loadEvalCPL()">
                        <i class="fas fa-search"></i> Analisis Data
                    </button>
                </div>
                <!-- TOMBOL CETAK TELAH KEMBALI DI HP -->
                <button class="btn-cetak" onclick="window.print()">
                    <i class="fas fa-print"></i> Cetak Rekap
                </button>
            </div>
        </div>

        <div class="scrollable-content section-eval-mhs" style="padding: 0 50px 20px 50px;">
            <div class="table-responsive">
                <table class="table-cpl">
                    <thead id="headTable">
                        <tr>
                            <th width="5%" class="sticky-col-1">NO</th>
                            <th width="25%" class="text-left sticky-col-2">NIM & NAMA MAHASISWA</th>
                            <th>DATA CPL</th>
                        </tr>
                    </thead>
                    <tbody id="bodyTable">
                        <tr><td colspan="15" style="padding: 40px; color: #64748b; text-align: center; font-weight: 600;"><i class="fas fa-info-circle" style="color: var(--primary-blue); margin-right: 8px;"></i> Silakan ketik tahun angkatan dan klik "Analisis Data".</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const PRODI = localStorage.getItem("prodi_aktif") || "si"; 
        const API_EVAL_CPL = `${API_BASE}/get-eval-cpl`;
        
        document.addEventListener("DOMContentLoaded", () => {
            const userLogin = localStorage.getItem("user_login");
            if (!userLogin) window.location.replace("/login/login.html");

            if(PRODI === "ti") {
                document.documentElement.style.setProperty('--primary-blue', '#8b0000'); 
                document.getElementById('prodiBadge').innerText = "TEKNIK INFORMATIKA";
            } else {
                document.documentElement.style.setProperty('--primary-blue', '#1e3a8a'); 
                document.getElementById('prodiBadge').innerText = "SISTEM INFORMASI";
            }

            const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
            const avatarMobile = document.getElementById("mobileNavbarAvatar");
            if(avatarMobile) {
                const avatarColor = PRODI === "si" ? "1e3a8a" : "8b0000";
                avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=${avatarColor}&color=fff&bold=true`;
            }
        });

        function toggleSidebar() {
            document.getElementById('sidebar-container').classList.toggle('active');
            document.getElementById('mobileOverlay').classList.toggle('active');
        }
        
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const sidebar = document.getElementById('sidebar-container');
                if (sidebar && !sidebar.innerHTML.includes('sidebar-profile')) {
                    fetch(`/kaprodi/kaprodi_${PRODI}/sidebar.html`)
                        .then(res => res.text())
                        .then(html => {
                            sidebar.innerHTML = html;
                            if(typeof initSmartSidebar === 'function') initSmartSidebar();
                        })
                        .catch(e => console.log('Gagal memuat sidebar darurat'));
                }
            }, 600); 
        });

        async function loadEvalCPL() {
            const inputThn = document.getElementById("inputAngkatan").value;
            const angkatan = inputThn ? inputThn.trim() : "2025"; 
            
            const headTbl = document.getElementById("headTable");
            const bodyTbl = document.getElementById("bodyTable");
            
            bodyTbl.innerHTML = `<tr><td colspan="15" style="text-align: center; padding: 50px; color: #64748b; font-weight: 600;"><i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary-blue); display: block; margin-bottom: 15px;"></i> Mengkalkulasi data CPL Angkatan ${angkatan}...</td></tr>`;

            try {
                const res = await fetch(`${API_EVAL_CPL}?angkatan=${angkatan}&prodi=${PRODI}`);
                if(!res.ok) throw new Error("Gagal mengambil data");
                
                const rawText = await res.text();
                if (!rawText || rawText.trim() === "" || rawText.includes("empty_database")) {
                    bodyTbl.innerHTML = `<tr><td colspan="15" style="text-align: center; color: #dc2626; padding: 40px; font-weight:bold;"><i class="fas fa-exclamation-circle"></i> Tidak ada rekap nilai untuk angkatan ${angkatan} di program studi ini.</td></tr>`;
                    headTbl.innerHTML = `<tr><th class="sticky-col-1">NO</th><th class="text-left sticky-col-2">NIM & NAMA MAHASISWA</th><th>DATA CPL</th></tr>`;
                    return;
                }

                const data = JSON.parse(rawText);

                if (data.length === 0 || !data[0].nim) {
                    bodyTbl.innerHTML = `<tr><td colspan="15" style="text-align: center; color: #dc2626; padding: 40px; font-weight:bold;"><i class="fas fa-exclamation-circle"></i> Tidak ada rekap nilai untuk angkatan ${angkatan} di program studi ini.</td></tr>`;
                    headTbl.innerHTML = `<tr><th class="sticky-col-1">NO</th><th class="text-left sticky-col-2">NIM & NAMA MAHASISWA</th><th>DATA CPL</th></tr>`;
                    return;
                }

                let mhsData = {};
                let cplSet = new Set();

                data.forEach(item => {
                    if(!item.nim) return;
                    if(!mhsData[item.nim]) {
                        mhsData[item.nim] = { nama: item.nama_mahasiswa, nilai_cpl: {} };
                    }
                    if(item.kode_cpl) {
                        cplSet.add(item.kode_cpl);
                        let skor = item.total_bobot_cpl > 0 ? (item.total_nilai_tertimbang / item.total_bobot_cpl) * 100 : 0;
                        mhsData[item.nim].nilai_cpl[item.kode_cpl] = skor.toFixed(2);
                    }
                });

                let cplList = Array.from(cplSet).sort();

                let headHtml = `<tr>
                    <th width="5%" class="sticky-col-1">NO</th>
                    <th width="25%" class="text-left sticky-col-2">NIM & NAMA MAHASISWA</th>`;
                cplList.forEach(cpl => { 
                    let labelSingkat = cpl.replace('SI-CPL', '').replace('TI-CPL', '').replace('CPL', '');
                    if(labelSingkat.startsWith('-') || labelSingkat.startsWith('0')) labelSingkat = labelSingkat.substring(1);
                    if(labelSingkat === '') labelSingkat = cpl;
                    
                    headHtml += `<th title="${cpl}">${labelSingkat}</th>`; 
                });
                headHtml += `</tr>`;
                headTbl.innerHTML = headHtml;

                bodyTbl.innerHTML = "";
                let no = 1;
                let sortedNim = Object.keys(mhsData).sort();

                sortedNim.forEach(nim => {
                    let mhs = mhsData[nim];
                    let rowHtml = `<tr>
                        <td class="sticky-col-1" style="font-weight: bold; color: #475569;">${no++}</td>
                        <td class="text-left sticky-col-2" style="text-align: left;">
                            <div style="font-weight:900;">${nim}</div>
                            <div style="color: #475569; font-weight:600; font-size: 0.85rem; margin-top: 2px;">${mhs.nama || '-'}</div>
                        </td>`;
                    
                    cplList.forEach(cpl => {
                        let skor = mhs.nilai_cpl[cpl] || 0;
                        let color = skor >= 60 ? 'background: #dcfce7; color: #166534; border: 1px solid #bbf7d0;' : (skor > 0 ? 'background: #fee2e2; color: #991b1b; border: 1px solid #fecaca;' : 'background: #f1f5f9; color: #94a3b8;');
                        let skorTampil = skor > 0 ? skor : '-';
                        let badgeClass = skor > 0 ? 'display: inline-block; padding: 6px 14px; border-radius: 6px; font-weight: 800;' : '';
                        
                        rowHtml += `<td data-cpl="${cpl}"><span style="${badgeClass} ${color}">${skorTampil}</span></td>`;
                    });
                    
                    rowHtml += `</tr>`;
                    bodyTbl.innerHTML += rowHtml;
                });

            } catch (e) {
                console.error(e);
                bodyTbl.innerHTML = `<tr><td colspan="15" style="text-align: center; color: red; padding: 40px; font-weight:bold;">❌ Error: Gagal terhubung ke N8N. Periksa Tunnel Cloudflare.</td></tr>`;
            }
        }

        window.onload = () => { setTimeout(loadEvalCPL, 400); };
    </script>
</body>
</html>
