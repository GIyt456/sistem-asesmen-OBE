<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grafik Rerata CPMK - Sistem OBE</title>
    
    <!-- MEMANGGIL FILE CSS EKSTERNAL & CSS KHUSUS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin_si.css">
    <link rel="stylesheet" href="/css/global_si.css?v=2">
    <link rel="stylesheet" href="grafik_cpmk.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="/js/api_config.js"></script>
    <script src="/js/template.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- 1. NAVBAR KHUSUS MOBILE -->
    <nav class="navbar-mobile">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <img src="/gambar/LogoUnaki.png" alt="Logo Universitas AKI" 
                 style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;" 
                 onclick="window.location.href='/index.html'">
        </div>
        
        <div class="profile-btn-mobile" onclick="toggleSidebar()">
            <img id="mobileNavbarAvatar" src="" alt="Profil Kaprodi">
        </div>
    </nav>

    <!-- 2. OVERLAY GELAP UNTUK LATAR SIDEBAR DI HP -->
    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

    <div id="sidebar-container"></div>
    
    <div class="main-content">
        <!-- WADAH NAVBAR ASLI DARI TEMPLATE.JS -->
        <div id="navbar-container"></div>

        <div class="content-wrapper">
            <div class="header-container" style="margin-bottom: 20px; border-bottom: none; padding-bottom: 0;">
                <div class="header-title-area">
                    <div class="header-subtitle">EVALUASI & RPS</div>
                    <h1 class="header-title">GRAFIK RERATA <span>CPMK</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>
            
            <div style="border-bottom: 1px solid var(--border-color); margin: 0 0 20px 0;"></div>

            <p style="margin: 0 0 20px 0; color: #64748b; font-size: 0.95rem;">Visualisasi rata-rata Capaian Pembelajaran Mata Kuliah (CPMK) per kelas dalam bentuk grafik batang.</p>

            <div class="filter-container">
                <div class="filter-left">
                    <label style="font-weight: 700; color: #1e293b; min-width: 100px;"><i class="fas fa-filter"></i> Pilih Kelas:</label>
                    <select id="selectMK" class="form-control" style="width: 100%; max-width: 400px; font-weight: 500;">
                        <option value="">⏳ Memuat daftar kelas aktif...</option>
                    </select>
                    
                    <button onclick="loadGrafikCPMK()" style="background-color: var(--primary-blue); color: #ffffff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; white-space: nowrap;">
                        <i class="fas fa-chart-bar"></i> Tampilkan Grafik
                    </button>
                </div>

                <button class="btn-action" style="background: #10b981; color: white; padding: 12px 20px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer;" onclick="window.print()">
                    <i class="fas fa-print"></i> Cetak Grafik
                </button>
            </div>

            <div class="card-container">
                <div id="loadingMsg" style="text-align: center; color: #64748b; padding: 40px; display: none;">
                    <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary-blue); margin-bottom: 15px;"></i><br>
                    <span style="font-weight: 600;">Memproses visualisasi data dari database...</span>
                </div>
                <div id="errorMsg" style="text-align: center; color: #dc2626; padding: 40px; display: none; font-weight: 600;"></div>
                
                <div class="chart-wrapper">
                    <canvas id="cpmkChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 0. SIHIR BUNGLON (TEMA DINAMIS SI / TI)
        // ==========================================
        const PRODI = localStorage.getItem("prodi_aktif") || "si"; 
        
        document.addEventListener("DOMContentLoaded", () => {
            const badge = document.getElementById("prodiBadge");
            if (PRODI === "si") {
                document.documentElement.style.setProperty('--primary-blue', '#1e3a8a');
                document.documentElement.style.setProperty('--primary-red', '#1e3a8a');
                if(badge) badge.innerText = "SISTEM INFORMASI";
            } else {
                document.documentElement.style.setProperty('--primary-blue', '#8b0000');
                document.documentElement.style.setProperty('--primary-red', '#8b0000');
                if(badge) badge.innerText = "TEKNIK INFORMATIKA";
            }

            const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
            const avatarMobile = document.getElementById("mobileNavbarAvatar");
            if(avatarMobile) {
                const avatarColor = PRODI === "si" ? "1e3a8a" : "8b0000";
                avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=${avatarColor}&color=fff&bold=true`;
            }
        });

        // ==========================================
        // 1. FUNGSI SIDEBAR MOBILE
        // ==========================================
        function toggleSidebar() {
            document.getElementById('sidebar-container').classList.toggle('active');
            document.getElementById('mobileOverlay').classList.toggle('active');
        }

        function setMenuAktif() {
            const navDashboard = document.getElementById('nav-home');
            const navGrafikCpmk = document.querySelector('[data-path="/evaluasi/grafik_cpmk.html"]') || document.querySelector('[data-path="/evaluasi/grafik_cpmk_si.html"]');

            if (navDashboard) navDashboard.classList.remove('active');
            if (navGrafikCpmk) navGrafikCpmk.classList.add('active');
            
            const menuEvaluasi = document.getElementById('menu-evaluasi') || (navGrafikCpmk ? navGrafikCpmk.closest('.dropdown-container') : null);
            if (menuEvaluasi) {
                menuEvaluasi.style.display = 'block';
                const parentBtn = menuEvaluasi.previousElementSibling;
                if(parentBtn && parentBtn.classList.contains('dropdown-btn')) {
                    parentBtn.classList.add('active');
                    const icon = parentBtn.querySelector('.fa-chevron-down') || parentBtn.querySelector('i:last-child');
                    if(icon) icon.style.transform = 'rotate(180deg)';
                }
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const sidebar = document.getElementById('sidebar-container');
                if (sidebar && !sidebar.innerHTML.includes('sidebar-profile')) {
                    fetch(`/kaprodi/kaprodi_${PRODI}/sidebar.html`)
                        .then(res => res.text())
                        .then(html => {
                            sidebar.innerHTML = html;
                            if (typeof initSmartSidebar === 'function') initSmartSidebar();
                            setMenuAktif();
                        })
                        .catch(e => console.log('Gagal memuat sidebar'));
                } else {
                    setMenuAktif();
                }
            }, 600);
        });

        // ==========================================
        // 2. VARIABEL API
        // ==========================================
        const API_GET_KELAS = `${API_BASE}/get-rekap-nilai?prodi=${PRODI}`;
        const API_GRAFIK_CPMK = `${API_BASE}/get-grafik-cpmk`;
        
        let myChart = null; 

        // SATPAM HALAMAN
        const userLogin = localStorage.getItem("user_login");
        if (!userLogin) window.location.replace("/login/login.html");

        // ==========================================
        // 3. FUNGSI LOAD DROPDOWN (Anti-Duplikat)
        // ==========================================
        async function loadPilihanKelas() {
            const selectMk = document.getElementById("selectMK");
            try {
                const res = await fetch(API_GET_KELAS);
                if (!res.ok) throw new Error("Gagal load kelas");
                const data = await res.json();

                if (!data || data.length === 0) {
                    selectMk.innerHTML = `<option value="">Belum ada kelas aktif di prodi ini</option>`;
                    return;
                }

                let html = "<option value=''>-- Pilih Kelas Mata Kuliah --</option>";
                let kelasUnik = new Set();

                data.forEach(item => {
                    let kunci = `${item.kode_mk}-${item.kelas}`;
                    let namaKelas = (item.kelas || "").toLowerCase();
                    let isMilikProdi = false;
                    
                    if (PRODI === 'ti' && (namaKelas.includes('ti') || namaKelas.includes('teknik'))) {
                        isMilikProdi = true;
                    } else if (PRODI === 'si' && (namaKelas.includes('si') || namaKelas.includes('sistem'))) {
                        isMilikProdi = true;
                    }

                    if (isMilikProdi && !kelasUnik.has(kunci)) {
                        kelasUnik.add(kunci);
                        html += `<option value="${item.kode_mk}">[${item.kelas}] ${item.nama_mk} - ${item.dosen}</option>`;
                    }
                });
                
                selectMk.innerHTML = html;
                
            } catch (e) {
                selectMk.innerHTML = `<option value="">Gagal memuat kelas asli dari server</option>`;
            }
        }

        // ==========================================
        // 4. FUNGSI LOAD GRAFIK
        // ==========================================
        async function loadGrafikCPMK() {
            const kodeMK = document.getElementById("selectMK").value;
            const loadingMsg = document.getElementById("loadingMsg");
            const errorMsg = document.getElementById("errorMsg");
            const canvas = document.getElementById("cpmkChart");
            
            if(!kodeMK) {
                alert("⚠️ Silakan pilih kelas mata kuliah terlebih dahulu.");
                return;
            }

            loadingMsg.style.display = "block";
            errorMsg.style.display = "none";
            canvas.style.display = "none";

            try {
                const res = await fetch(`${API_GRAFIK_CPMK}?kode_mk=${kodeMK}`);
                const data = await res.json();

                loadingMsg.style.display = "none";

                if(!data || data.length === 0 || !data[0].kode_cpmk) {
                    errorMsg.innerHTML = `<i class="fas fa-exclamation-circle"></i> Belum ada data nilai/mapping CPMK untuk kelas ini.`;
                    errorMsg.style.display = "block";
                    return;
                }

                // 1. Olah Data Mentah -> Rata-rata per CPMK
                let cpmkData = {};
                data.forEach(item => {
                    let cpmk = item.kode_cpmk;
                    if (!cpmkData[cpmk]) {
                        cpmkData[cpmk] = { totalSkor: 0, countMhs: 0 };
                    }
                    if(item.total_bobot_cpmk > 0) {
                        let skorMhs = (item.total_nilai_tertimbang / item.total_bobot_cpmk) * 100;
                        cpmkData[cpmk].totalSkor += skorMhs;
                        cpmkData[cpmk].countMhs += 1;
                    }
                });

                // 2. Siapkan Array untuk Chart.js
                let labels = [];
                let averages = [];
                let backgroundColors = [];

                Object.keys(cpmkData).sort().forEach(cpmk => {
                    let avg = (cpmkData[cpmk].totalSkor / cpmkData[cpmk].countMhs).toFixed(2);
                    labels.push(cpmk);
                    averages.push(avg);

                    // Hijau jika >= 60, Merah jika < 60
                    if (avg >= 60) {
                        backgroundColors.push('rgba(16, 185, 129, 0.85)'); 
                    } else {
                        backgroundColors.push('rgba(239, 68, 68, 0.85)'); 
                    }
                });

                canvas.style.display = "block";
                renderChart(labels, averages, backgroundColors);

            } catch (e) {
                loadingMsg.style.display = "none";
                errorMsg.innerHTML = `<i class="fas fa-wifi"></i> Error: Gagal terhubung ke N8N.`;
                errorMsg.style.display = "block";
            }
        }

        function renderChart(labels, dataAvg, bgColors) {
            const ctx = document.getElementById('cpmkChart').getContext('2d');
            
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Rata-Rata Nilai CPMK',
                        data: dataAvg,
                        backgroundColor: bgColors,
                        borderWidth: 0,
                        borderRadius: 8, // Ujung melengkung
                        barPercentage: 0.6 // Ketebalan batang
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100, 
                            grid: { color: '#f1f5f9' },
                            title: {
                                display: true,
                                text: 'Nilai Skala 100',
                                font: { weight: 'bold', size: 12 },
                                color: '#64748b'
                            }
                        },
                        x: {
                            grid: { display: false },
                            title: {
                                display: true,
                                text: 'Kode CPMK',
                                font: { weight: 'bold', size: 12 },
                                color: '#64748b'
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false }, // Sembunyikan legend karena warna sudah menjelaskan
                        tooltip: {
                            backgroundColor: '#1e293b',
                            titleFont: { size: 14 },
                            bodyFont: { size: 14, weight: 'bold' },
                            callbacks: {
                                label: function(context) {
                                    return ' Rata-rata: ' + context.parsed.y + ' Poin';
                                }
                            }
                        }
                    }
                }
            });
        }

        window.onload = () => {
            setTimeout(loadPilihanKelas, 400); // Otomatis isi dropdown saat dibuka
        };
        
        $(document).ready(function() {
            $('#selectMK').select2({
                placeholder: "Ketik / Pilih Kelas Mata Kuliah...",
                allowClear: true,
                width: '100%' // ✨ DIUBAH KE 100% AGAR RESPONSIF DI HP ✨
            });
        });
    </script>
</body>
</html>
