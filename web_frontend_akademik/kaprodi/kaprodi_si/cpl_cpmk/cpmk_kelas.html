<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pemenuhan CPMK per Kelas - Sistem OBE</title>
    
    <!-- MEMANGGIL FILE CSS EKSTERNAL & CSS KHUSUS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin_si.css">
    <link rel="stylesheet" href="/css/global_si.css?v=2">
    <link rel="stylesheet" href="cpmk_kelas.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="/js/api_config.js"></script>
    <script src="/js/template.js"></script> 
</head>
<body>

    <!-- 1. NAVBAR KHUSUS MOBILE -->
    <nav class="navbar-mobile">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <img src="/gambar/LogoUnaki.png" alt="Logo Universitas AKI" 
                 style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;" 
                 onclick="window.location.href='/index.html'">
        </div>
        
        <div class="profile-btn-mobile" onclick="toggleSidebar()">
            <img id="mobileNavbarAvatar" src="" alt="Profil Kaprodi">
        </div>
    </nav>

    <!-- 2. OVERLAY GELAP UNTUK LATAR SIDEBAR DI HP -->
    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

    <div id="sidebar-container"></div>
    
    <div class="main-content">
        <!-- WADAH NAVBAR ASLI DARI TEMPLATE.JS -->
        <div id="navbar-container"></div>

        <div class="content-wrapper">
            <div class="header-container" style="border-bottom: none; padding-bottom: 0;">
                <div class="header-title-area">
                    <div class="header-subtitle">EVALUASI & RPS</div>
                    <h1 class="header-title">PEMENUHAN NILAI <span>CPMK</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <p style="margin: 0 0 20px 0; color: #64748b; font-size: 0.95rem; border-bottom: 1px solid var(--border-color); padding-bottom: 20px;">Pantau persentase pencapaian Capaian Pembelajaran Mata Kuliah (CPMK) mahasiswa per kelas secara spesifik.</p>

            <div class="filter-container">
                <label style="font-weight: 700; color: #1e293b; min-width: 100px;"><i class="fas fa-filter"></i> Pilih Kelas:</label>
                <select id="selectMK" class="form-control" style="width: 100%; max-width: 400px; font-weight: 500;">
                    <option value="">⏳ Memuat daftar kelas aktif...</option>
                </select>
                <button onclick="loadDataCPMK()" style="background-color: var(--primary-blue); color: #ffffff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; white-space: nowrap;">
                    <i class="fas fa-calculator"></i> Kalkulasi CPMK
                </button>
            </div>

            <div class="table-responsive">
                <table class="table-cpmk">
                    <thead id="headerTable">
                        <tr>
                            <th class="sticky-col" width="5%">NO</th>
                            <th class="sticky-col text-left" width="30%" style="text-align: left;">NIM & NAMA MAHASISWA</th>
                            <th>MENGHITUNG DATA...</th>
                        </tr>
                    </thead>
                    <tbody id="bodyTable">
                        <tr><td colspan="10" style="padding: 40px; color: #64748b; text-align: center;"><i class="fas fa-info-circle"></i> Silakan pilih kelas dan klik "Kalkulasi CPMK" untuk memproses data dari server.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 0. SIHIR BUNGLON (TEMA DINAMIS SI / TI)
        // ==========================================
        const PRODI = localStorage.getItem("prodi_aktif") || "si"; 
        let warnaTeksNim = '#8b0000'; // Default Merah TI
        
        document.addEventListener("DOMContentLoaded", () => {
            const badge = document.getElementById("prodiBadge");
            if (PRODI === "si") {
                document.documentElement.style.setProperty('--primary-blue', '#1e3a8a');
                document.documentElement.style.setProperty('--primary-red', '#1e3a8a');
                if(badge) badge.innerText = "SISTEM INFORMASI";
                warnaTeksNim = '#1e3a8a';
            } else {
                document.documentElement.style.setProperty('--primary-blue', '#8b0000');
                document.documentElement.style.setProperty('--primary-red', '#8b0000');
                if(badge) badge.innerText = "TEKNIK INFORMATIKA";
            }

            const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
            const avatarMobile = document.getElementById("mobileNavbarAvatar");
            if(avatarMobile) {
                const avatarColor = PRODI === "si" ? "1e3a8a" : "8b0000";
                avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=${avatarColor}&color=fff&bold=true`;
            }
        });

        // ==========================================
        // 1. FUNGSI SIDEBAR MOBILE
        // ==========================================
        function toggleSidebar() {
            document.getElementById('sidebar-container').classList.toggle('active');
            document.getElementById('mobileOverlay').classList.toggle('active');
        }

        function setMenuAktif() {
            const navDashboard = document.getElementById('nav-home');
            const navCpmkKelas = document.querySelector('[data-path="/evaluasi/cpmk_kelas.html"]') || document.querySelector('[data-path="/evaluasi/cpmk_kelas_si.html"]');

            if (navDashboard) navDashboard.classList.remove('active');
            if (navCpmkKelas) navCpmkKelas.classList.add('active');
            
            const menuEvaluasi = document.getElementById('menu-evaluasi') || (navCpmkKelas ? navCpmkKelas.closest('.dropdown-container') : null);
            if (menuEvaluasi) {
                menuEvaluasi.style.display = 'block';
                const parentBtn = menuEvaluasi.previousElementSibling;
                if(parentBtn && parentBtn.classList.contains('dropdown-btn')) {
                    parentBtn.classList.add('active');
                    const icon = parentBtn.querySelector('.fa-chevron-down') || parentBtn.querySelector('i:last-child');
                    if(icon) icon.style.transform = 'rotate(180deg)';
                }
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const sidebar = document.getElementById('sidebar-container');
                if (sidebar && !sidebar.innerHTML.includes('sidebar-profile')) {
                    fetch(`/kaprodi/kaprodi_${PRODI}/sidebar.html`)
                        .then(res => res.text())
                        .then(html => {
                            sidebar.innerHTML = html;
                            if (typeof initSmartSidebar === 'function') initSmartSidebar();
                            setMenuAktif();
                        })
                        .catch(e => console.log('Gagal memuat sidebar'));
                } else {
                    setMenuAktif();
                }
            }, 600);
        });

        // ==========================================
        // 2. VARIABEL API
        // ==========================================
        const API_GET_KELAS = `${API_BASE}/get-rekap-nilai?prodi=${PRODI}`;
        const API_GET_CPMK = `${API_BASE}/get-cpmk-kelas`;

        const userLogin = localStorage.getItem("user_login");
        if (!userLogin) window.location.replace("/login/login.html");

        // ==========================================
        // 3. FUNGSI MUAT KELAS
        // ==========================================
        async function loadPilihanKelas() {
            const selectMk = document.getElementById("selectMK");
            try {
                const res = await fetch(API_GET_KELAS);
                if (!res.ok) throw new Error("Gagal load kelas");
                const data = await res.json();

                if (!data || data.length === 0) {
                    selectMk.innerHTML = `<option value="">Belum ada kelas aktif di prodi ini</option>`;
                    return;
                }

                let html = "<option value=''>-- Pilih Kelas Mata Kuliah --</option>";
                let kelasUnik = new Set();

                data.forEach(item => {
                    let kunci = `${item.kode_mk}-${item.kelas}`;
                    let namaKelas = (item.kelas || "").toLowerCase();
                    let isMilikProdi = false;
                    
                    if (PRODI === 'ti' && (namaKelas.includes('ti') || namaKelas.includes('teknik'))) {
                        isMilikProdi = true;
                    } 
                    else if (PRODI === 'si' && (namaKelas.includes('si') || namaKelas.includes('sistem'))) {
                        isMilikProdi = true;
                    }

                    if (isMilikProdi && !kelasUnik.has(kunci)) {
                        kelasUnik.add(kunci);
                        html += `<option value="${item.kode_mk}">[${item.kelas}] ${item.nama_mk} - ${item.dosen}</option>`;
                    }
                });
                
                selectMk.innerHTML = html;
            } catch (e) {
                console.log("Gagal memuat kelas asli, server belum merespon.");
            }
        }

        // ==========================================
        // 4. FUNGSI KALKULASI CPMK
        // ==========================================
        async function loadDataCPMK() {
            const kodeMK = document.getElementById("selectMK").value;
            const bodyTbl = document.getElementById("bodyTable");
            const headTbl = document.getElementById("headerTable");
            
            if(!kodeMK) return alert("⚠️ Silakan pilih kelas terlebih dahulu!");

            bodyTbl.innerHTML = `<tr><td colspan="10" style="text-align: center; padding: 40px; color: #64748b;"><i class="fas fa-spinner fa-spin" style="font-size: 1.5rem; display: block; margin-bottom: 10px;"></i> Memproses kalkulasi jutaan bobot CPMK dari database...</td></tr>`;

            try {
                const res = await fetch(`${API_GET_CPMK}?kode_mk=${kodeMK}&prodi=${PRODI}`);
                if(!res.ok) throw new Error("Gagal ambil data");
                const data = await res.json();

                if(!data || data.length === 0 || !data[0].nim) {
                    bodyTbl.innerHTML = `<tr><td colspan="10" style="text-align: center; color: red; padding: 30px;"><i class="fas fa-exclamation-circle"></i> Belum ada data nilai atau mapping RPS untuk kelas ini.</td></tr>`;
                    return;
                }

                // 1. Ekstrak Header CPMK
                let cpmkSet = new Set();
                data.forEach(item => { 
                    if(item.kode_cpmk && item.kode_cpmk.toLowerCase().includes(PRODI)) {
                        cpmkSet.add(item.kode_cpmk);
                    } 
                });
                let cpmkList = Array.from(cpmkSet).sort();

                // Generate Header Table Desktop
                let headHtml = `<tr>
                                    <th class="sticky-col" width="5%">NO</th>
                                    <th class="sticky-col text-left" width="30%" style="text-align: left;">NIM & NAMA MAHASISWA</th>`;
                cpmkList.forEach(cpmk => { headHtml += `<th>${cpmk}</th>`; });
                headHtml += `</tr>`;
                headTbl.innerHTML = headHtml;

                // 2. Kelompokkan Data per Mahasiswa
                let mhsData = {};
                data.forEach(item => {
                    if(!mhsData[item.nim]) {
                        mhsData[item.nim] = { nama: item.nama_mahasiswa, nilai_cpmk: {} };
                    }
                    if(item.total_bobot_cpmk > 0) {
                        let skorAsli = (item.total_nilai_tertimbang / item.total_bobot_cpmk) * 100;
                        mhsData[item.nim].nilai_cpmk[item.kode_cpmk] = skorAsli.toFixed(2);
                    }
                });

                // 3. Cetak Baris Tabel (DENGAN PENYUNTIKAN DATA-LABEL UNTUK MOBILE)
                bodyTbl.innerHTML = "";
                let no = 1;
                for (let nim in mhsData) {
                    let mhs = mhsData[nim];
                    let rowHtml = `<tr>
                        <td class="sticky-col" style="font-weight: bold; color: #475569;">${no++}</td>
                        <td class="sticky-col" style="text-align: left;">
                            <div style="font-weight: 800; color: ${warnaTeksNim}; font-size: 0.95rem;">${nim}</div>
                            <div style="font-size: 0.85rem; font-weight: 500; color: #1e293b; margin-top: 2px;">${mhs.nama || '-'}</div>
                        </td>`;
                    
                    cpmkList.forEach(cpmk => {
                        let skor = mhs.nilai_cpmk[cpmk] || 0;
                        let color = skor >= 50 ? 'background: #dcfce7; color: #166534;' : 'background: #fee2e2; color: #991b1b;';
                        
                        // ✨ SUNTIKKAN data-label="${cpmk}" agar CSS mobile tahu judul kolomnya! ✨
                        rowHtml += `<td data-label="${cpmk}"><span class="badge-score" style="${color}">${skor}</span></td>`;
                    });
                    
                    rowHtml += `</tr>`;
                    bodyTbl.innerHTML += rowHtml;
                }

            } catch (e) {
                bodyTbl.innerHTML = `<tr><td colspan="10" style="text-align: center; color: red; padding: 30px;">Error: Gagal terhubung ke N8N atau data kosong.</td></tr>`;
            }
        }

        window.onload = () => {
            setTimeout(loadPilihanKelas, 400); 
        };

        $(document).ready(function() {
            $('#selectMK').select2({
                placeholder: "Ketik / Pilih Kelas Mata Kuliah...",
                allowClear: true,
                width: '100%' // <-- Diubah menjadi 100% agar responsif di HP
            });
        });                                    
    </script>
</body>
</html>
