<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import KRS Mahasiswa - Sistem OBE</title>

    <!-- MENGGUNAKAN PATH ABSOLUT AGAR ANTI NYASAR -->
    <link rel="stylesheet" href="/css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="/js/api_config.js"></script>
    <script src="/js/template.js"></script> 
    
    <style>
        /* =========================================
           STYLE KHUSUS (ANTI LUBER)
        ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root { 
            --sidebar-bg: #161923; 
            --primary-blue: #1e3a8a; /* Warna Biru SI */
            --primary-red: #8b0000;  /* Warna Merah TI */
            --bg-main: #f9fafb; 
            --text-dark: #111827; 
            --border-color: #e5e7eb;
        }

        body, html { 
            display: flex; 
            background: var(--bg-main); 
            height: 100vh; 
            width: 100%;
            overflow-x: hidden; /* Mengunci rapat scroll horizontal */
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
        }

        /* SEMBUNYIKAN ELEMEN MOBILE DI DESKTOP */
        .navbar-mobile { display: none !important; }
        .mobile-overlay { display: none !important; }

        .main-content { 
            flex: 1; 
            overflow-y: auto; 
            overflow-x: hidden;
            display: flex; 
            flex-direction: column;
            width: 100%;
        }

        #sidebar-container { width: 280px; min-width: 280px; height: 100vh; flex-shrink: 0; z-index: 1000; }

        .content-wrapper { padding: 40px 50px; overflow-x: hidden; }
        
        .header-container { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .header-title-area { display: flex; flex-direction: column; }
        .header-subtitle { color: #64748b; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: var(--text-dark); }
        .header-title span { color: var(--primary-blue); } 
        .badge-prodi { background: var(--primary-blue); color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; }

        .upload-card { background: #fafafa; border: 2.5px dashed #cbd5e1; border-radius: 16px; padding: 50px 40px; max-width: 600px; text-align: center; margin: 40px auto; transition: 0.3s; width: 100%; }
        .upload-card:hover { background: #f8fafc; }
        
        .file-input-wrapper { margin-bottom: 30px; background: white; padding: 15px; border-radius: 8px; border: 2px solid #e5e7eb; display: flex; align-items: center; justify-content: center; width: 100%; overflow: hidden;}
        
        .btn-upload { width: 100%; justify-content: center; padding: 16px; font-size: 1.05rem; display: inline-flex; align-items: center; gap: 10px; border: none; border-radius: 8px; font-weight: 700; color: white; cursor: pointer; transition: 0.2s;}
        .btn-upload:hover:not(:disabled) { filter: brightness(0.9); transform: translateY(-2px); }

        body { animation: transitionIn 0.3s ease-in-out; }
        @keyframes transitionIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .profile-btn-mobile {
            width: 36px; height: 36px; border-radius: 50%; 
            border: 2px solid rgba(255, 255, 255, 0.2); overflow: hidden; 
            cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        }
        .profile-btn-mobile img { width: 100%; height: 100%; object-fit: cover; }

        /* =========================================
           RESPONSIVE MOBILE (AKTIF KHUSUS DI HP)
        ========================================= */
        @media screen and (max-width: 768px) {
            
            /* Munculkan Navbar Mobile */
            .navbar-mobile {
                display: flex !important; 
                position: fixed; top: 0; left: 0; width: 100%;
                background-color: #0f172a; 
                padding: 12px 20px; align-items: center; justify-content: space-between;
                z-index: 990; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            }
            
            .mobile-overlay.active { 
                display: block !important; position: fixed; top: 0; left: 0; 
                width: 100%; height: 100vh; background: rgba(15, 23, 42, 0.6); 
                backdrop-filter: blur(3px); z-index: 999; 
            }
            
            /* Basmi Navbar Bawaan Template.js agar tidak dobel */
            #navbar-container { display: none !important; height: 0 !important; overflow: hidden !important; }

            body, html { height: auto !important; overflow-y: auto !important; overflow-x: hidden !important; }
            
            .hamburger-btn { display: block; background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
            
            .main-content { margin-top: 60px !important; height: auto !important; display: block !important; padding: 0 !important; width: 100% !important; overflow-x: hidden !important;}

            #sidebar-container { 
                position: fixed; top: 0; left: -320px; height: 100vh; 
                transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 10px 0 25px rgba(0,0,0,0.5);
            }
            #sidebar-container.active { left: 0; }
            
            /* Sesuikan Area Konten di HP */
            .content-wrapper { padding: 20px !important; overflow-x: hidden !important; }

            .header-container { flex-direction: column !important; align-items: flex-start !important; gap: 15px; margin-bottom: 20px !important; padding-bottom: 15px !important;}
            .header-title { font-size: 1.6rem !important; }
            
            /* SULAP KARTU UPLOAD AGAR PAS DI HP */
            .upload-card { 
                padding: 30px 20px !important; /* Kurangi padding dalam */
                margin: 20px auto !important; 
                width: 100% !important; 
                max-width: 100% !important; 
            }
            #uploadIcon { font-size: 3.5rem !important; margin-bottom: 15px !important; }
            
            /* Pastikan input file tidak mendorong lebar kartu */
            .file-input-wrapper input { width: 100% !important; max-width: 100% !important; }
        }
    </style>
</head>
<body>

    <!-- 1. NAVBAR KHUSUS MOBILE (DENGAN PATH GAMBAR ABSOLUTE) -->
    <nav class="navbar-mobile">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <img src="/gambar/LogoUnaki.png" alt="Logo Universitas AKI" 
                 style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;" 
                 onclick="window.location.href='/index.html'">
        </div>
        
        <div class="profile-btn-mobile" onclick="toggleSidebar()">
            <img id="mobileNavbarAvatar" src="https://ui-avatars.com/api/?name=K&background=1e3a8a&color=fff&bold=true" alt="Profil Kaprodi">
        </div>
    </nav>

    <!-- 2. OVERLAY GELAP UNTUK LATAR SIDEBAR DI HP -->
    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

    <div id="sidebar-container"></div>
    
    <div class="main-content">
        
        <!-- WADAH NAVBAR ASLI DARI TEMPLATE.JS -->
        <div id="navbar-container"></div>

        <div class="content-wrapper">
            <div class="header-container">
                <div class="header-title-area">
                    <div class="header-subtitle">KELOLA KURIKULUM</div>
                    <h1 class="header-title">IMPORT <span>KRS MAHASISWA</span></h1>
                </div>
                <div class="badge-prodi" id="prodiBadge">PRODI</div>
            </div>

            <div class="upload-card" id="dropZone">
                <i class="fas fa-cloud-upload-alt" id="uploadIcon" style="font-size: 4.5rem; margin-bottom: 20px;"></i>
                <h4 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; color: #1e293b;">Upload File KRS</h4>
                <p style="color: #64748b; font-size: 0.95rem; line-height: 1.6; margin-bottom: 30px;">
                    Sistem akan otomatis mengekstrak data dan menyinkronkan Mahasiswa, Mata Kuliah, serta Dosen ke dalam database sesuai program studi aktif. Format yang didukung: <strong>.xlsx</strong>
                </p>

                <div class="file-input-wrapper">
                    <input type="file" id="krsFileInput" accept=".xlsx" style="width: 100%; font-family: 'Inter', sans-serif; font-size: 0.95rem; color: #475569; cursor: pointer; outline: none;">
                </div>

                <button class="btn-upload" id="btnUploadAction" style="background: #10b981;" onclick="handleKRSUpload()">
                    <i class="fas fa-magic"></i> Jalankan Sinkronisasi n8n
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- SETUP AVATAR MOBILE ---
        const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
        const avatarMobile = document.getElementById("mobileNavbarAvatar");
        if(avatarMobile) {
            avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=1e3a8a&color=fff&bold=true`;
        }

        // --- FUNGSI SIDEBAR MOBILE ---
        function toggleSidebar() {
            document.getElementById('sidebar-container').classList.toggle('active');
            document.getElementById('mobileOverlay').classList.toggle('active');
        }
        
        // --- PENGAMAN JIKA TEMPLATE.JS SALAH MEMUAT SIDEBAR ---
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const sidebar = document.getElementById('sidebar-container');
                if (sidebar && !sidebar.innerHTML.includes('sidebar-profile')) {
                    // Coba tebak path berdasarkan prodi, default ke SI
                    const p = localStorage.getItem("prodi_aktif") || "si";
                    fetch(`/kaprodi/kaprodi_${p}/sidebar.html`)
                        .then(res => res.text())
                        .then(html => {
                            sidebar.innerHTML = html;
                            if(typeof initSmartSidebar === 'function') initSmartSidebar();
                        })
                        .catch(e => console.log('Gagal memuat sidebar darurat'));
                }
            }, 600); 
        });

        // DETEKSI PRODI DINAMIS
        const PRODI = localStorage.getItem("prodi_aktif") || "si";

        // SATPAM HALAMAN
        const userLoginCheck = localStorage.getItem("user_login");
        if (!userLoginCheck) window.location.replace("/login/login.html");

        // TEMA DINAMIS MENYESUAIKAN PRODI
        document.addEventListener("DOMContentLoaded", () => {
            const badge = document.getElementById("prodiBadge");
            const uploadCard = document.getElementById("dropZone");
            const uploadIcon = document.getElementById("uploadIcon");
            const titleSpan = document.querySelector('.header-title span');

            if(badge) badge.innerText = PRODI === "si" ? "Sistem Informasi" : "Teknik Informatika";

            // Menggunakan CSS Variables yang sudah kita atur di :root agar akurat
            if(PRODI === "si") {
                badge.style.background = "var(--primary-blue)";
                titleSpan.style.color = "var(--primary-blue)";
                uploadCard.style.borderColor = "var(--primary-blue)";
                uploadIcon.style.color = "var(--primary-blue)";
            } else {
                badge.style.background = "var(--primary-red)";
                titleSpan.style.color = "var(--primary-red)";
                uploadCard.style.borderColor = "var(--primary-red)";
                uploadIcon.style.color = "var(--primary-red)";
            }
        });

        // FUNGSI SINKRONISASI UPLOAD KE N8N
        async function handleKRSUpload() {
            const fileInput = document.getElementById('krsFileInput');
            const file = fileInput.files[0];
            const btnUpload = document.getElementById('btnUploadAction');

            if (!file) {
                alert("⚠️ Silakan pilih file Excel (.xlsx) terlebih dahulu!");
                return;
            }

            // Animasi Loading Tombol
            btnUpload.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengunggah & Memproses...';
            btnUpload.disabled = true;
            btnUpload.style.opacity = '0.7';

            // Bungkus data file
            const formData = new FormData();
            formData.append('file', file);
            formData.append('prodi', PRODI); // Kirim keterangan prodi ke n8n

            try {
                const response = await fetch(`${API_BASE}/upload-krs`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    alert("✅ File berhasil dikirim! Mesin n8n sedang memproses relasi Database di belakang layar.");
                    fileInput.value = ""; // Bersihkan form setelah sukses
                } else {
                    alert("❌ Gagal memproses data. Pastikan format file sesuai dan n8n Anda aktif.");
                }
            } catch (error) {
                alert("⚠️ Terjadi kesalahan jaringan saat menghubungi server n8n.");
            }

            // Kembalikan Tombol ke Semula
            btnUpload.innerHTML = '<i class="fas fa-magic"></i> Jalankan Sinkronisasi n8n';
            btnUpload.disabled = false;
            btnUpload.style.opacity = '1';
        }
    </script>
</body>
</html>
