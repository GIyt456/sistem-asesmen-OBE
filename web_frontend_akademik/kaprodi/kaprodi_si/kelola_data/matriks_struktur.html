<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struktur Kurikulum - Sistem OBE</title>
    
    <!-- MEMANGGIL FILE CSS EKSTERNAL & ADMIN -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin_si.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/js/api_config.js"></script>
    <script src="/js/template.js"></script>
    
    <style>
        /* GRID SEMESTER DESKTOP */
        .semester-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 25px; margin-top: 20px; }
        .semester-card { background: white; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .semester-header { background: #1e293b; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .semester-header h3 { font-size: 1.1rem; font-weight: 800; margin: 0; }
        .total-sks-badge { background: var(--primary-blue); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 800; border: 1px solid rgba(255,255,255,0.2);}

        .semester-card table { width: 100%; border-collapse: collapse; }
        .semester-card th { background: #f8fafc; text-align: left; padding: 12px 15px; font-size: 0.75rem; color: #475569; text-transform: uppercase; border-bottom: 2px solid var(--border-color); }
        .semester-card td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }
        .semester-card tr:last-child td { border-bottom: none; }
        .col-kode { width: 100px; font-weight: 800; color: var(--primary-blue); }
        .col-sks { width: 60px; text-align: center; font-weight: 700; color: #1e293b; }

        .summary-box { margin-top: 40px; padding: 25px; background: #1f2937; border-radius: 12px; color: white; display: flex; justify-content: space-around; text-align: center; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 40px;}
        .summary-item h2 { font-size: 2.5rem; color: #ffffff; margin: 0 0 5px 0; font-weight: 800;}
        .summary-item p { font-size: 0.9rem; opacity: 0.8; margin: 0; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;}

        /* RESPONSIF MOBILE */
        @media screen and (max-width: 768px) {
            .header-struktur-mhs { margin: 20px 20px 10px 20px !important; flex-direction: column !important; align-items: flex-start !important; gap: 15px; }
            .section-struktur-mhs { padding: 0 20px 40px 20px !important; }
            
            .header-struktur-mhs > div:last-child { align-self: flex-start; text-align: left !important; background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%;}
            
            .semester-container { grid-template-columns: 1fr; gap: 20px; }
            
            .summary-box { flex-direction: column; gap: 25px; margin-top: 30px; }
        }
    </style>
</head>
<body>

    <!-- 1. NAVBAR KHUSUS MOBILE -->
    <nav class="navbar-mobile">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <img src="/gambar/LogoUnaki.png" alt="Logo Universitas AKI" 
                 style="height: 28px; object-fit: contain; filter: brightness(0) invert(1); cursor: pointer;" 
                 onclick="window.location.href='/index.html'">
        </div>
        <div class="profile-btn-mobile" onclick="toggleSidebar()">
            <img id="mobileNavbarAvatar" src="" alt="Profil Kaprodi">
        </div>
    </nav>

    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div id="navbar-container"></div>

        <div class="fixed-header">
            <div class="header-container header-struktur-mhs">
                <div class="header-title-area">
                    <div class="header-subtitle">MATRIKS KURIKULUM</div>
                    <h1 class="header-title">STRUKTUR <span>KURIKULUM</span></h1>
                    <div class="badge-prodi" id="prodiBadge" style="margin-top: 10px; display: inline-block; width: fit-content;">PRODI</div>
                </div>
                
                <div style="text-align: right;">
                    <p style="font-size: 0.85rem; font-weight: 700; color: #64748b;">TOTAL BEBAN KURIKULUM</p>
                    <h2 id="grandTotalSks" style="color: var(--primary-blue); font-size: 2.2rem; font-weight: 800; margin: 0;">0 SKS</h2>
                </div>
            </div>
            
            <div style="border-bottom: 1px solid var(--border-color); margin: 0 50px 20px 50px;" class="header-struktur-mhs"></div>
        </div>

        <div class="scrollable-content section-struktur-mhs" style="padding: 0 50px 40px 50px;">
            <div id="loadingStatus" style="text-align: center; padding: 50px;">
                <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary-blue);"></i>
                <p style="margin-top: 15px; font-weight: 600; color: #64748b;">Menyusun struktur kurikulum...</p>
            </div>

            <div class="semester-container" id="semesterGrid">
                <!-- Data Semester akan muncul di sini -->
            </div>

            <div class="summary-box" id="summaryBox" style="display: none;">
                <div class="summary-item">
                    <h2 id="totalMatkul">0</h2>
                    <p>Mata Kuliah</p>
                </div>
                <div class="summary-item">
                    <h2 id="totalSksWajib">0</h2>
                    <p>SKS Wajib</p>
                </div>
                <div class="summary-item" style="color: #bae6fd;">
                    <h2>144</h2>
                    <p>Target Lulus</p>
                </div>
            </div>
        </div>
    </div>

<script>
    // --- SETUP TEMA & WARNA DINAMIS BERDASARKAN PRODI ---
    const PRODI = localStorage.getItem("prodi_aktif") || "si"; 
    
    document.addEventListener("DOMContentLoaded", () => {
        if(PRODI === "ti") {
            document.documentElement.style.setProperty('--primary-blue', '#8b0000'); 
            document.getElementById('prodiBadge').innerText = "TEKNIK INFORMATIKA";
        } else {
            document.getElementById('prodiBadge').innerText = "SISTEM INFORMASI";
        }

        const namaLogin = localStorage.getItem("user_login") || "Kaprodi";
        const avatarMobile = document.getElementById("mobileNavbarAvatar");
        if(avatarMobile) {
            const avatarColor = PRODI === "si" ? "1e3a8a" : "8b0000";
            avatarMobile.src = `https://ui-avatars.com/api/?name=${namaLogin}&background=${avatarColor}&color=fff&bold=true`;
        }
    });

    // --- FUNGSI SIDEBAR MOBILE ---
    function toggleSidebar() {
        document.getElementById('sidebar-container').classList.toggle('active');
        document.getElementById('mobileOverlay').classList.toggle('active');
    }
    
    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
            const sidebar = document.getElementById('sidebar-container');
            if (sidebar && !sidebar.innerHTML.includes('sidebar-profile')) {
                fetch(`/kaprodi/kaprodi_${PRODI}/sidebar.html`)
                    .then(res => res.text())
                    .then(html => {
                        sidebar.innerHTML = html;
                        if(typeof initSmartSidebar === 'function') initSmartSidebar();
                    })
                    .catch(e => console.log('Gagal memuat sidebar darurat'));
            }
        }, 600); 
    });

    // PERBAIKAN FATAL: MENGGUNAKAN VARIABEL PRODI DINAMIS!
    const API_MATKUL = `${API_BASE}/get-susunan-matkul?prodi=${PRODI}`;

    const userLogin = localStorage.getItem("user_login");
    if (!userLogin) window.location.replace("/login/login.html");

    window.onload = () => { setTimeout(renderStruktur, 400); };

    async function renderStruktur() {
        try {
            const res = await fetch(API_MATKUL);
            const data = await res.json();
            
            const container = document.getElementById('semesterGrid');
            container.innerHTML = '';

            const perSemester = {};
            let totalSks = 0;

            data.forEach(mk => {
                const smt = mk.semester || 0;
                if (!perSemester[smt]) perSemester[smt] = [];
                perSemester[smt].push(mk);
                totalSks += parseInt(mk.sks || 0);
            });

            for (let i = 1; i <= 8; i++) {
                const listMk = perSemester[i] || [];
                const totalSksSemester = listMk.reduce((sum, mk) => sum + parseInt(mk.sks || 0), 0);

                let tableRows = listMk.length > 0 
                    ? listMk.map(mk => `
                        <tr>
                            <td class="col-kode">${mk.kode_mk}</td>
                            <td style="font-weight: 600;">${mk.nama_mk}</td>
                            <td class="col-sks">${mk.sks}</td>
                        </tr>
                    `).join('')
                    : '<tr><td colspan="3" style="text-align:center; padding: 30px; color: #9ca3af; font-style: italic;">Belum ada Mata Kuliah</td></tr>';

                container.innerHTML += `
                    <div class="semester-card">
                        <div class="semester-header">
                            <h3>SEMESTER ${i}</h3>
                            <span class="total-sks-badge">${totalSksSemester} SKS</span>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>Kode</th>
                                    <th>Mata Kuliah</th>
                                    <th style="text-align:center;">SKS</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRows}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            document.getElementById('grandTotalSks').innerText = `${totalSks} SKS`;
            document.getElementById('totalMatkul').innerText = data.length;
            document.getElementById('totalSksWajib').innerText = totalSks;
            document.getElementById('loadingStatus').style.display = 'none';
            document.getElementById('summaryBox').style.display = 'flex';

        } catch (error) {
            document.getElementById('loadingStatus').innerHTML = '<p style="color:red; font-weight:bold;">❌ Gagal memuat struktur kurikulum. Pastikan n8n menyala.</p>';
        }
    }
</script>
</body>
</html>
