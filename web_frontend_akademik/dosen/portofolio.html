<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Portofolio Mata Kuliah - Sistem OBE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="../js/api_config.js"></script>
    
    <style>
        /* --- VARIABEL WARNA DINAMIS (BUNGLON) --- */
        :root { 
            --primary-color: #8b0000; 
            --primary-color-dark: #5c0000;
            --bg-main: #f8fafc; 
            --text-dark: #111827;
            --border-light: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            display: flex; 
            background-color: var(--bg-main); 
            min-height: 100vh; 
            justify-content: center; 
            padding: 40px 20px;
        }

        .main-content { 
            width: 100%; 
            max-width: 1100px; 
            background: white; 
            border-radius: 16px; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); 
            padding: 40px; 
        }

        /* --- GAYA HEADER BARU (DENGAN TOMBOL KEMBALI) --- */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-light);
        }
        
        .header-title { font-size: 2rem; font-weight: 800; color: var(--text-dark); margin-bottom: 8px; text-transform: uppercase; }
        .header-title span { color: var(--primary-color); }
        .header-subtitle { color: #6b7280; font-size: 1rem; }

        /* Gaya Tombol Kembali */
        .btn-back {
            background-color: #f1f5f9;
            color: #475569;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            border: 1.5px solid #e2e8f0;
        }
        .btn-back:hover {
            background-color: #e2e8f0;
            color: #0f172a;
        }

        .search-container { margin-bottom: 25px; position: relative; }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #9ca3af; }
        .search-box { 
            width: 100%; 
            padding: 14px 16px 14px 45px; 
            border: 1.5px solid var(--border-light); 
            border-radius: 10px; 
            font-size: 0.95rem; 
            outline: none; 
            transition: 0.2s; 
            background-color: #f9fafb;
        }
        .search-box:focus { border-color: var(--primary-color); background-color: white; box-shadow: 0 0 0 4px rgba(139, 0, 0, 0.05); }

        table { width: 100%; border-collapse: collapse; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-light); }
        th { background: #f1f5f9; color: var(--text-dark); padding: 16px; text-align: left; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; border-bottom: 2px solid var(--border-light); }
        td { padding: 16px; border-bottom: 1px solid var(--border-light); font-size: 0.95rem; vertical-align: middle; }
        tbody tr:hover { background-color: #f8fafc; }

        .btn-detail { 
            background: linear-gradient(to right, var(--primary-color), var(--primary-color-dark)); 
            color: white; 
            padding: 10px 16px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-size: 0.85rem; 
            font-weight: 600; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            transition: 0.2s; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-detail:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15); }

        .pagination-container { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; }
        .pagination-info { font-size: 0.9rem; color: #6b7280; }
        .pagination-buttons { display: flex; gap: 6px; }
        .page-btn { padding: 8px 14px; border: none; border-radius: 8px; background: #e5e7eb; cursor: pointer; font-weight: 600; color: #4b5563; transition: 0.2s; }
        .page-btn:hover:not(:disabled) { background: #d1d5db; color: black; }
        .page-btn.active { background: var(--primary-color); color: white; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
       
    </style>
    <link rel="stylesheet" href="css_dosen/index_mobile.css?v=9">
</head>
<body>

    <div class="main-content">
        <div class="header-container">
            <div>
                <div class="header-title">PORTOFOLIO <span id="teks-prodi">MATA KULIAH</span></div>
                <div class="header-subtitle">Daftar seluruh mata kuliah Program Studi yang terdaftar di pangkalan data semester ini.</div>
            </div>
            <a href="rps_dosen.html" class="btn-back">
                <i class="fas fa-arrow-left"></i> Kembali ke RPS
            </a>
        </div>

        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" class="search-box" placeholder="Cari Kode atau Nama Mata Kuliah..." oninput="jalankanPencarian()">
        </div>

        <table>
            <thead>
                <tr>
                    <th width="15%">Kode MK</th>
                    <th width="45%">Nama Mata Kuliah</th>
                    <th width="20%">Semester</th>
                    <th width="20%" style="text-align: center;">Aksi</th>
                </tr>
            </thead>
            <tbody id="tabelMatkulDosen">
                <tr><td colspan="4" style="text-align:center; padding:40px; color:#6b7280;"><i class="fas fa-spinner fa-spin"></i> Menghubungkan ke database n8n...</td></tr>
            </tbody>
        </table>

        <div class="pagination-container" id="areaPaginasi"></div>
    </div>

    <script>
      const API_GET_KELAS = `${API_BASE}/get-kelas-aktif`;
        const API_GET_MATKUL = `${API_BASE}/get-master-matkul`;

        let dataSemuaMatkul = [];
        let dataTersaring = [];
        let halamanSaatIni = 1;
        const barisPerHalaman = 5; 

        // 1. CEK IDENTITAS DOSEN SAAT INI
        const userProdi = localStorage.getItem("prodi_aktif") || 'ti';
        const userNidn = localStorage.getItem("user_nidn");
        const userRole = localStorage.getItem("user_role");

        // FUNGSI EXTRAKSI AMAN (DIAMBIL DARI JADWAL MENGAJAR)
        function safeExtractArray(jsonObj) {
            if (!jsonObj) return [];
            let data = jsonObj;
            if (jsonObj.data) data = jsonObj.data;
            if (!Array.isArray(data)) data = [data];
            data = data.flat(Infinity);
            return data.map(item => item.json ? item.json : item);
        }

        // 2. FUNGSI BUNGLON (UBAH WARNA & TEKS OTOMATIS)
       // 2. FUNGSI BUNGLON (UBAH WARNA & TEKS OTOMATIS)
        function aturTemaHalaman() {
            const p = String(userProdi).toLowerCase();
            const teksProdi = document.getElementById('teks-prodi');
            
            if (p.includes('ti') && p.includes('si')) {
                // Jika mengajar di kedua prodi
                teksProdi.innerText = "LINTAS PROGRAM STUDI (TI & SI)";
                // Gunakan warna netral (Navy elegan) agar tidak memihak satu prodi
                document.documentElement.style.setProperty('--primary-color', '#0f172a');
                document.documentElement.style.setProperty('--primary-color-dark', '#020617');
            } else if (p.includes('si')) {
                // Jika khusus SI
                document.documentElement.style.setProperty('--primary-color', '#01626d');
                document.documentElement.style.setProperty('--primary-color-dark', '#004d56');
                teksProdi.innerText = "SISTEM INFORMASI";
            } else {
                // Jika khusus TI (Default)
                teksProdi.innerText = "TEKNIK INFORMATIKA";
            }
        }

        async function loadDaftarMatkulPortofolio() {
            const tableBody = document.getElementById('tabelMatkulDosen');

            try {
                // A. TARIK DATA DARI API YANG SUDAH TERBUKTI AMAN DI JADWAL MENGAJAR
                const [resKelas, resMatkul] = await Promise.all([
                    fetch(API_GET_KELAS),
                    fetch(API_GET_MATKUL)
                ]);

                const jsonKelas = await resKelas.json();
                const jsonMatkul = await resMatkul.json();

                let dataKelasRaw = safeExtractArray(jsonKelas);
                let dataMatkulRaw = safeExtractArray(jsonMatkul);

                // B. GABUNGKAN DATA KELAS & MATKUL
                let gabunganData = dataKelasRaw.map(kelas => {
                    const matkulCocok = dataMatkulRaw.find(m => m.kode_mk === kelas.kode_mk);
                    return {
                        kode_mk: kelas.kode_mk,
                        nidn: kelas.nidn,
                        semester: matkulCocok ? matkulCocok.semester : kelas.semester,
                        nama_mk: matkulCocok ? matkulCocok.nama_mk : "MK Tidak Ditemukan",
                        prodi: matkulCocok ? matkulCocok.prodi : "-"
                    };
                });

                // C. LOGIKA PENYARINGAN SUPER AKURAT
                if (userRole === "admin") {
                    // Admin (Kaprodi) melihat semua MK di Prodinya dari Master Matkul
                    dataSemuaMatkul = dataMatkulRaw.filter(m => String(m.prodi).toLowerCase() === userProdi.toLowerCase());
                } else if (userNidn) {
                    // Dosen Biasa HANYA melihat MK dari kelas yang dia ajar (berdasarkan NIDN)
                    dataSemuaMatkul = gabunganData.filter(item => String(item.nidn).trim() === String(userNidn).trim());
                } else {
                    dataSemuaMatkul = [];
                }

                // Hapus duplikat matkul (jika dosen mengajar 2 kelas A dan B untuk MK yang sama)
                const uniqueMk = new Map();
                dataSemuaMatkul.forEach(mk => {
                    const k = String(mk.kode_mk).trim().toUpperCase();
                    if(k && k !== 'UNDEFINED' && !uniqueMk.has(k)) {
                        uniqueMk.set(k, mk);
                    }
                });
                dataSemuaMatkul = Array.from(uniqueMk.values());

                // D. RENDER KE TABEL
                if (dataSemuaMatkul.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:40px; color:#6b7280;">Tidak ada mata kuliah Portofolio yang Anda ampu saat ini.</td></tr>';
                    document.getElementById('areaPaginasi').innerHTML = '';
                    return;
                }

                dataTersaring = [...dataSemuaMatkul];
                halamanSaatIni = 1;
                renderTabelMatkul();

            } catch (error) {
                console.error("Error Fetch Portofolio:", error);
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red; padding:40px;">⚠️ Gagal memuatkan data. Pastikan Webhook Master Matkul dan Kelas Aktif menyala.</td></tr>`;
                document.getElementById('areaPaginasi').innerHTML = '';
            }
        }

        function jalankanPencarian() {
            const kataKunci = document.getElementById('searchInput').value.toLowerCase();
            dataTersaring = dataSemuaMatkul.filter(item => 
                (item.kode_mk && item.kode_mk.toLowerCase().includes(kataKunci)) || 
                (item.nama_mk && item.nama_mk.toLowerCase().includes(kataKunci))
            );
            halamanSaatIni = 1; 
            renderTabelMatkul();
        }

        function renderTabelMatkul() {
            const tableBody = document.getElementById('tabelMatkulDosen');
            tableBody.innerHTML = '';
            
            if (dataTersaring.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:40px; color:#6b7280;">Mata kuliah tidak ditemukan.</td></tr>';
                document.getElementById('areaPaginasi').innerHTML = '';
                return;
            }

            const totalHalaman = Math.ceil(dataTersaring.length / barisPerHalaman);
            const indexAwal = (halamanSaatIni - 1) * barisPerHalaman;
            const indexAkhir = indexAwal + barisPerHalaman;
            const dataHalamanIni = dataTersaring.slice(indexAwal, indexAkhir);

            dataHalamanIni.forEach(item => {
                const kodeAsli = item.kode_mk || '-';
                const namaAsli = item.nama_mk || '-';
                const semesterAsli = item.semester || 'Ganjil';
                const namaMkEncoded = encodeURIComponent(namaAsli);

                // --- TAMBAHAN: LENCANA (BADGE) PRODI ---
                let badgeProdi = '';
                let p = String(item.prodi).toLowerCase();
                if (p === 'si') {
                    badgeProdi = '<br><span style="display:inline-block; margin-top:6px; background:#ccfbf1; color:#0f766e; padding:4px 10px; border-radius:6px; font-size:0.7rem; font-weight:800; border: 1px solid #99f6e4;">SISTEM INFORMASI</span>';
                } else if (p === 'ti') {
                    badgeProdi = '<br><span style="display:inline-block; margin-top:6px; background:#fee2e2; color:#991b1b; padding:4px 10px; border-radius:6px; font-size:0.7rem; font-weight:800; border: 1px solid #fecaca;">TEKNIK INFORMATIKA</span>';
                }
                // ----------------------------------------

                tableBody.innerHTML += `
                    <tr>
                        <td data-label="Kode MK" style="font-weight: 800; color: var(--primary-color);">${kodeAsli}</td>
                        <td data-label="Nama MK" style="font-weight: 700; color: var(--text-dark);">${namaAsli} ${badgeProdi}</td>
                        <td data-label="Semester" style="color: #4b5563; font-weight: 600;">Semester ${semesterAsli}</td>
                        <td data-label="Aksi" style="text-align: center;">
                            <a href="portofolio_detail.html?kode_mk=${kodeAsli}&nama_mk=${namaMkEncoded}" class="btn-detail">
                                <i class="fas fa-folder-open"></i> Detail Portofolio
                            </a>
                        </td>
                    </tr>
                `;
            });

            renderPaginasi(totalHalaman, indexAwal, dataHalamanIni.length, dataTersaring.length);
        }
        function renderPaginasi(totalHalaman, indexAwal, jumlahSaatIni, totalData) {
            const areaPaginasi = document.getElementById('areaPaginasi');
            let htmlPaginasi = `
                <div class="pagination-info">
                    Menampilkan <strong>${indexAwal + 1} - ${indexAwal + jumlahSaatIni}</strong> dari <strong>${totalData}</strong> mata kuliah
                </div>
                <div class="pagination-buttons">
                    <button class="page-btn" ${halamanSaatIni === 1 ? 'disabled' : ''} onclick="gantiHalaman(${halamanSaatIni - 1})">Prev</button>
            `;

            for (let i = 1; i <= totalHalaman; i++) {
                htmlPaginasi += `<button class="page-btn ${i === halamanSaatIni ? 'active' : ''}" onclick="gantiHalaman(${i})">${i}</button>`;
            }

            htmlPaginasi += `
                    <button class="page-btn" ${halamanSaatIni === totalHalaman ? 'disabled' : ''} onclick="gantiHalaman(${halamanSaatIni + 1})">Next</button>
                </div>
            `;
            areaPaginasi.innerHTML = htmlPaginasi;
        }

        function gantiHalaman(halamanTujuan) {
            halamanSaatIni = halamanTujuan;
            renderTabelMatkul();
        }

        // JALANKAN SAAT HALAMAN DIBUKA
        window.onload = () => {
            aturTemaHalaman();           
            loadDaftarMatkulPortofolio(); 
        };
    </script>
</body>
</html>
