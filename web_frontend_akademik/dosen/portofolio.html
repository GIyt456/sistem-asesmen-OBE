<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Portofolio Mata Kuliah - Sistem OBE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="../js/api_config.js"></script>
    
    <style>
        :root { 
            --primary-red: #8b0000; 
            --bg-main: #f8fafc; 
            --text-dark: #111827;
            --border-light: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            display: flex; 
            background-color: var(--bg-main); 
            min-height: 100vh; 
            justify-content: center; 
        }

        .main-content { 
            width: 100%; 
            max-width: 1200px; 
            padding: 40px 20px; 
        }

        .header-container {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; border-bottom: 2px solid var(--border-light); padding-bottom: 20px;
        }
        .header-title h1 { font-size: 24px; font-weight: 800; color: var(--text-dark); }
        .header-title span { color: var(--primary-red); }

        .btn-back {
            background: #64748b; color: white; border: none; padding: 10px 20px;
            border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; 
            display: inline-flex; align-items: center; gap: 8px; font-size: 14px;
        }
        .btn-back:hover { background: #475569; }

        .table-card {
            background: white; border-radius: 12px; border: 1px solid var(--border-light);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow: hidden;
        }

        /* --- STYLING BARU UNTUK SEARCH & FILTER --- */
        .table-controls {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; border-bottom: 1px solid var(--border-light); background: #f8fafc;
        }
        .table-controls h2 { font-size: 16px; font-weight: 700; color: var(--text-dark); }
        
        .search-box { position: relative; width: 320px; }
        .search-box input {
            width: 100%; padding: 10px 15px 10px 38px; border-radius: 8px;
            border: 1px solid #cbd5e1; font-size: 13px; outline: none; transition: all 0.3s ease;
        }
        .search-box input:focus { border-color: var(--primary-red); box-shadow: 0 0 0 3px rgba(139, 0, 0, 0.1); }
        .search-box i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #94a3b8; font-size: 14px;
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: #ffffff; padding: 15px; text-align: left; font-size: 12px; font-weight: 700; color: #4b5563; text-transform: uppercase; border-bottom: 1px solid var(--border-light); }
        td { padding: 15px; border-bottom: 1px solid var(--border-light); font-size: 14px; color: #1f2937; }

        .btn-detail {
            background: #161923; color: white; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px;
            display: inline-flex; align-items: center; gap: 6px; text-decoration: none; transition: 0.2s;
        }
        .btn-detail:hover { background: #262936; }

        /* --- STYLING BARU UNTUK PAGINASI --- */
        .pagination-container {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; background: white;
        }
        .pagination-info { font-size: 13px; color: #64748b; font-weight: 500; }
        .pagination-buttons { display: flex; gap: 6px; }
        .page-btn {
            padding: 8px 14px; border: 1px solid #e2e8f0; background: white;
            border-radius: 6px; cursor: pointer; font-size: 13px; color: #475569; font-weight: 600; transition: 0.2s;
        }
        .page-btn:hover:not(:disabled) { background: #f1f5f9; color: var(--text-dark); }
        .page-btn.active { background: var(--primary-red); color: white; border-color: var(--primary-red); }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="header-container">
            <div class="header-title">
                <p style="color: #64748b; font-weight: 600; font-size: 12px; margin-bottom: 4px;">MONITORING & EVALUASI</p>
                <h1>PORTOFOLIO <span>MATA KULIAH</span></h1>
            </div>
            
            <a href="rps_dosen.html" class="btn-back">
                <i class="fas fa-arrow-left"></i> Kembali ke Halaman Dosen
            </a>
        </div>

        <div class="table-card">
            <div class="table-controls">
                <h2>Mata Kuliah Yang Diampu Semester Ini</h2>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Cari Kode atau Nama MK..." onkeyup="jalankanPencarian()">
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th width="20%">Kode MK</th>
                        <th width="50%">Nama Mata Kuliah</th>
                        <th width="15%">Semester</th>
                        <th width="15%" style="text-align: center;">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelMatkulDosen">
                    <tr><td colspan="4" style="text-align:center; padding:30px;"><i class="fas fa-spinner fa-spin"></i> Menarik data mata kuliah...</td></tr>
                </tbody>
            </table>

            <div class="pagination-container" id="areaPaginasi">
                </div>
        </div>
    </div>

    <script>
        // Variabel Global untuk menampung data
        let dataSemuaMatkul = [];
        let dataTersaring = [];
        let halamanSaatIni = 1;
        const barisPerHalaman = 5; 

        // 1. Fungsi Tarik Data dari Database Khusus Prodi TI
        async function loadDaftarMatkulPortofolio() {
            const tableBody = document.getElementById('tabelMatkulDosen');

            try {
                // Semak jika fail api_config.js berjaya dimuatkan
                if (typeof API_BASE === 'undefined') {
                    throw new Error("Variabel API_BASE tidak dijumpai. Sila semak pautan fail api_config.js!");
                }

                // Gunakan pemboleh ubah API_BASE secara dinamik
                const URL_API = `${API_BASE}/get-matkul-portofolio?prodi=ti`;
                
                const response = await fetch(URL_API);
                
                if (!response.ok) {
                    throw new Error(`Pelayan n8n menolak permintaan dengan status ${response.status}`);
                }

                dataSemuaMatkul = await response.json();

                // Jika data kosong atau terdapat ralat dari n8n
                if (!dataSemuaMatkul || dataSemuaMatkul.length === 0 || dataSemuaMatkul.message) {
                    tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:30px;">Tidak ada mata kuliah aktif untuk prodi TI di pangkalan data.</td></tr>';
                    document.getElementById('areaPaginasi').innerHTML = '';
                    return;
                }

                // Pada permulaan, data tersaring = semua data
                dataTersaring = [...dataSemuaMatkul];
                
                // Kembalikan ke halaman 1 lalu papar jadual
                halamanSaatIni = 1;
                renderTabelMatkul();

            } catch (error) {
                console.error("Error:", error);
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red; padding:30px;">⚠️ Gagal memuatkan data. ${error.message}</td></tr>`;
                document.getElementById('areaPaginasi').innerHTML = '';
            }
        }

        // 2. Fungsi Carian (Masa Nyata)
        function jalankanPencarian() {
            const kataKunci = document.getElementById('searchInput').value.toLowerCase();
            
            // Saring data berdasarkan kod MK atau nama MK
            dataTersaring = dataSemuaMatkul.filter(item => 
                (item.kode_mk && item.kode_mk.toLowerCase().includes(kataKunci)) || 
                (item.nama_mk && item.nama_mk.toLowerCase().includes(kataKunci))
            );
            
            halamanSaatIni = 1; 
            renderTabelMatkul();
        }

        // 3. Fungsi Lukis Jadual Berdasarkan Halaman & Hasil Penapisan
        function renderTabelMatkul() {
            const tableBody = document.getElementById('tabelMatkulDosen');
            tableBody.innerHTML = '';
            
            if (dataTersaring.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:30px; color:#64748b;">Carian tidak menemui hasil.</td></tr>';
                document.getElementById('areaPaginasi').innerHTML = '';
                return;
            }

            // Kira indeks mula dan akhir untuk pemotongan data
            const totalHalaman = Math.ceil(dataTersaring.length / barisPerHalaman);
            const indexAwal = (halamanSaatIni - 1) * barisPerHalaman;
            const indexAkhir = indexAwal + barisPerHalaman;
            
            // Ambil data spesifik untuk halaman ini
            const dataHalamanIni = dataTersaring.slice(indexAwal, indexAkhir);

            dataHalamanIni.forEach(item => {
                const namaMkEncoded = encodeURIComponent(item.nama_mk || '');
                tableBody.innerHTML += `
                    <tr>
                        <td style="font-weight: 700; color: var(--primary-red);">${item.kode_mk || '-'}</td>
                        <td style="font-weight: 600;">${item.nama_mk || '-'}</td>
                        <td>Semester Ganjil</td>
                        <td style="text-align: center;">
                            <a href="portofolio_detail.html?kode_mk=${item.kode_mk}&nama_mk=${namaMkEncoded}" class="btn-detail">
                                <i class="fas fa-folder-open"></i> Detail Portofolio
                            </a>
                        </td>
                    </tr>
                `;
            });

            renderPaginasi(totalHalaman, indexAwal, dataHalamanIni.length, dataTersaring.length);
        }

        // 4. Fungsi Lukis Butang Paginasi
        function renderPaginasi(totalHalaman, indexAwal, jumlahSaatIni, totalData) {
            const areaPaginasi = document.getElementById('areaPaginasi');
            
            let htmlPaginasi = `
                <div class="pagination-info">
                    Menampilkan <strong>${indexAwal + 1} - ${indexAwal + jumlahSaatIni}</strong> daripada <strong>${totalData}</strong> mata kuliah
                </div>
                <div class="pagination-buttons">
                    <button class="page-btn" ${halamanSaatIni === 1 ? 'disabled' : ''} onclick="gantiHalaman(${halamanSaatIni - 1})">Prev</button>
            `;

            for (let i = 1; i <= totalHalaman; i++) {
                htmlPaginasi += `<button class="page-btn ${i === halamanSaatIni ? 'active' : ''}" onclick="gantiHalaman(${i})">${i}</button>`;
            }

            htmlPaginasi += `
                    <button class="page-btn" ${halamanSaatIni === totalHalaman ? 'disabled' : ''} onclick="gantiHalaman(${halamanSaatIni + 1})">Next</button>
                </div>
            `;

            areaPaginasi.innerHTML = htmlPaginasi;
        }

        // 5. Fungsi Tukar Halaman
        function gantiHalaman(halamanTujuan) {
            halamanSaatIni = halamanTujuan;
            renderTabelMatkul();
        }

        // Jalankan fungsi saat web mula-mula dimuatkan
        window.onload = loadDaftarMatkulPortofolio;
    </script>
</body>
</html>
